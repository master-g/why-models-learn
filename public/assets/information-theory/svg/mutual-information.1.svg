<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <title>互信息是观察 X 后减少的 Y 不确定性</title>
  <desc>互信息把未知 X 时的 Y 熵减去已知 X 后的条件熵，得到信息减少量，也等于联合分布相对独立基线的 KL 散度。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #312f2f;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; }
    .box { fill: #faf8f5; stroke: #b8b2a8; stroke-width: 1.4; }
    .accent { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.5; }
    .axis { stroke: #8f8a83; stroke-width: 1.2; fill: none; }
    .guide { stroke: #c9c4bb; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title">互信息：观察 X 后，Y 少了多少不确定性</text>
  <text x="28" y="50" class="body">I(X;Y) = H(Y) − H(Y|X) = 与独立基线的 KL 差异</text>

  <rect x="28" y="79" width="145" height="74" rx="8" class="box"/>
  <text x="100" y="104" text-anchor="middle" class="label">未知 X</text>
  <text x="100" y="130" text-anchor="middle" class="formula">H(Y) = 1 bit</text>

  <path d="M173 116 H213" class="axis" marker-end="url(#arrow)"/>

  <rect x="213" y="79" width="145" height="74" rx="8" class="accent"/>
  <text x="285" y="104" text-anchor="middle" class="label">观察 X</text>
  <text x="285" y="130" text-anchor="middle" class="formula">H(Y|X) = .722</text>

  <path d="M358 116 H398" class="axis" marker-end="url(#arrow)"/>

  <rect x="398" y="79" width="134" height="74" rx="8" class="box"/>
  <text x="465" y="104" text-anchor="middle" class="label">减少量</text>
  <text x="465" y="130" text-anchor="middle" class="formula">I = .278 bit</text>

  <path d="M51 194 H510" class="guide"/>
  <text x="28" y="218" class="body">联合分布</text>
  <text x="91" y="218" class="formula">(.4 .1; .1 .4)</text>
  <text x="290" y="218" class="body">独立基线</text>
  <text x="360" y="218" class="formula">(.25 .25; .25 .25)</text>
</svg>
