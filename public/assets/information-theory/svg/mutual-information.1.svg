<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>互信息是观察 X 后减少的 Y 不确定性</title>
  <desc>互信息把未知 X 时的 Y 熵减去已知 X 后的条件熵，得到信息减少量，也等于联合分布相对独立基线的 KL 散度。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; }
    .box {stroke-width: 1.4; }
    .accent {stroke-width: 1.5; }
    .axis {stroke-width: 1.2; fill: none; }
    .guide {stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">互信息：观察 X 后，Y 少了多少不确定性</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">I(X;Y) = H(Y) − H(Y|X) = 与独立基线的 KL 差异</text>

  <rect x="28" y="79" width="145" height="74" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="100" y="104" text-anchor="middle" class="label svg-special-text-fill-312f2f">未知 X</text>
  <text x="100" y="130" text-anchor="middle" class="formula svg-special-text-fill-312f2f">H(Y) = 1 bit</text>

  <path d="M173 116 H213" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="213" y="79" width="145" height="74" rx="8" class="accent svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="285" y="104" text-anchor="middle" class="label svg-special-text-fill-312f2f">观察 X</text>
  <text x="285" y="130" text-anchor="middle" class="formula svg-special-text-fill-312f2f">H(Y|X) = .722</text>

  <path d="M358 116 H398" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="398" y="79" width="134" height="74" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="465" y="104" text-anchor="middle" class="label svg-special-text-fill-312f2f">减少量</text>
  <text x="465" y="130" text-anchor="middle" class="formula svg-special-text-fill-312f2f">I = .278 bit</text>

  <path d="M51 194 H510" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="28" y="218" class="body svg-special-text-fill-312f2f">联合分布</text>
  <text x="91" y="218" class="formula svg-special-text-fill-312f2f">(.4 .1; .1 .4)</text>
  <text x="290" y="218" class="body svg-special-text-fill-312f2f">独立基线</text>
  <text x="360" y="218" class="formula svg-special-text-fill-312f2f">(.25 .25; .25 .25)</text>
</svg>
