<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>交叉熵是用模型概率编码真实分布的平均代价</title>
  <desc>真实分布 p 产生结果，模型分布 q 为结果分配概率，负对数概率按 p 加权平均得到交叉熵。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; }
    .box {stroke-width: 1.4; }
    .accent {stroke-width: 1.5; }
    .bar-p {}
    .bar-q {}
    .axis {stroke-width: 1.1; }
  </style>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">交叉熵：真实分布 p，用模型分布 q 编码</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">H(p,q) = −Σ p(x) log q(x)，平均代价由真实频率加权</text>

  <rect x="28" y="72" width="148" height="91" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="102" y="94" text-anchor="middle" class="label svg-special-text-fill-312f2f">真实分布 p</text>
  <text x="102" y="113" text-anchor="middle" class="body svg-special-text-fill-312f2f">负责产生结果</text>
  <rect x="54" y="132" width="24" height="22" class="bar-p svg-special-fill-fill-312f2f"/>
  <rect x="88" y="140" width="24" height="14" class="bar-p svg-special-fill-fill-312f2f"/>
  <rect x="122" y="146" width="24" height="8" class="bar-p svg-special-fill-fill-312f2f"/>
  <text x="66" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₁</text>
  <text x="100" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₂</text>
  <text x="134" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₃</text>

  <path d="M176 117 H208" class="axis svg-special-graphic-stroke-8f8a83"/>
  <path d="M208 117 H236"  stroke-width="2" fill="none" class="svg-coral-stroke-stroke"/>
  <polygon points="236,117 228,113 228,121"  class="svg-special-fill-fill-cc785c"/>

  <rect x="236" y="72" width="148" height="91" rx="8" class="accent svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="310" y="94" text-anchor="middle" class="label svg-special-text-fill-312f2f">模型分布 q</text>
  <text x="310" y="113" text-anchor="middle" class="body svg-special-text-fill-312f2f">分配预测概率</text>
  <rect x="262" y="132" width="24" height="22" class="bar-q svg-special-fill-fill-cc785c"/>
  <rect x="296" y="140" width="24" height="14" class="bar-q svg-special-fill-fill-cc785c"/>
  <rect x="330" y="146" width="24" height="8" class="bar-q svg-special-fill-fill-cc785c"/>
  <text x="274" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">q₁</text>
  <text x="308" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">q₂</text>
  <text x="342" y="160" text-anchor="middle" class="body svg-special-text-fill-312f2f">q₃</text>

  <path d="M384 117 H416" class="axis svg-special-graphic-stroke-8f8a83"/>
  <path d="M416 117 H444"  stroke-width="2" fill="none" class="svg-coral-stroke-stroke"/>
  <polygon points="444,117 436,113 436,121"  class="svg-special-fill-fill-cc785c"/>

  <rect x="444" y="72" width="88" height="91" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="488" y="94" text-anchor="middle" class="label svg-special-text-fill-312f2f">平均损失</text>
  <text x="488" y="119" text-anchor="middle" class="formula svg-special-text-fill-312f2f">−log q(x)</text>
  <text x="488" y="143" text-anchor="middle" class="body svg-special-text-fill-312f2f">按 p 加权</text>

  <rect x="95" y="190" width="370" height="36" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="280" y="213" text-anchor="middle" class="formula svg-special-text-fill-312f2f">H(p,q) = H(p) + DKL(p ∥ q) ≥ H(p)</text>
</svg>
