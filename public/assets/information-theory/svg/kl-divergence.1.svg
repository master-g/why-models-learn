<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <title>KL 散度是平均对数概率比</title>
  <desc>真实分布 p 和模型分布 q 对同一结果分配不同概率，逐结果计算对数概率比，再按 p 加权得到 KL 散度。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #312f2f;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; }
    .box { fill: #faf8f5; stroke: #b8b2a8; stroke-width: 1.4; }
    .accent { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.5; }
    .pbar { fill: #312f2f; }
    .qbar { fill: #cc785c; }
    .line { stroke: #cc785c; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title">KL 散度：比较两个模型的对数概率</text>
  <text x="28" y="50" class="body">D(p ∥ q) = Eₚ[log p(X)/q(X)]，方向决定谁产生数据</text>

  <rect x="28" y="73" width="142" height="91" rx="8" class="box"/>
  <text x="99" y="95" text-anchor="middle" class="label">真实分布 p</text>
  <text x="99" y="113" text-anchor="middle" class="body">按 p 加权</text>
  <rect x="53" y="136" width="25" height="20" class="pbar"/>
  <rect x="87" y="143" width="25" height="13" class="pbar"/>
  <rect x="121" y="148" width="25" height="8" class="pbar"/>
  <text x="66" y="161" text-anchor="middle" class="body">p₁</text>
  <text x="100" y="161" text-anchor="middle" class="body">p₂</text>
  <text x="134" y="161" text-anchor="middle" class="body">p₃</text>

  <path d="M170 118 H202" class="line" marker-end="url(#arrow)"/>
  <rect x="202" y="73" width="156" height="91" rx="8" class="accent"/>
  <text x="280" y="95" text-anchor="middle" class="label">逐结果比较</text>
  <text x="280" y="122" text-anchor="middle" class="formula">log p(x) / q(x)</text>
  <text x="280" y="146" text-anchor="middle" class="body">正负贡献相互抵消</text>

  <path d="M358 118 H390" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="73" width="142" height="91" rx="8" class="box"/>
  <text x="461" y="95" text-anchor="middle" class="label">平均差异</text>
  <text x="461" y="122" text-anchor="middle" class="formula">D(p ∥ q) ≥ 0</text>
  <text x="461" y="146" text-anchor="middle" class="body">p=q 时为 0</text>

  <text x="28" y="202" class="body">反向 D(q ∥ p) 会改变加权方向，因此 KL 不是对称距离。</text>
  <rect x="28" y="213" width="504" height="24" rx="6" class="accent"/>
  <text x="280" y="230" text-anchor="middle" class="formula">H(p,q) − H(p) = D(p ∥ q)</text>
</svg>
