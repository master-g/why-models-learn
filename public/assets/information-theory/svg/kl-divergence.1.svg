<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>KL 散度是平均对数概率比</title>
  <desc>真实分布 p 和模型分布 q 对同一结果分配不同概率，逐结果计算对数概率比，再按 p 加权得到 KL 散度。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; }
    .box {stroke-width: 1.4; }
    .accent {stroke-width: 1.5; }
    .pbar {}
    .qbar {}
    .line {stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">KL 散度：比较两个模型的对数概率</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">D(p ∥ q) = Eₚ[log p(X)/q(X)]，方向决定谁产生数据</text>

  <rect x="28" y="73" width="142" height="91" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="99" y="95" text-anchor="middle" class="label svg-special-text-fill-312f2f">真实分布 p</text>
  <text x="99" y="113" text-anchor="middle" class="body svg-special-text-fill-312f2f">按 p 加权</text>
  <rect x="53" y="136" width="25" height="20" class="pbar svg-special-fill-fill-312f2f"/>
  <rect x="87" y="143" width="25" height="13" class="pbar svg-special-fill-fill-312f2f"/>
  <rect x="121" y="148" width="25" height="8" class="pbar svg-special-fill-fill-312f2f"/>
  <text x="66" y="161" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₁</text>
  <text x="100" y="161" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₂</text>
  <text x="134" y="161" text-anchor="middle" class="body svg-special-text-fill-312f2f">p₃</text>

  <path d="M170 118 H202" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <rect x="202" y="73" width="156" height="91" rx="8" class="accent svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="280" y="95" text-anchor="middle" class="label svg-special-text-fill-312f2f">逐结果比较</text>
  <text x="280" y="122" text-anchor="middle" class="formula svg-special-text-fill-312f2f">log p(x) / q(x)</text>
  <text x="280" y="146" text-anchor="middle" class="body svg-special-text-fill-312f2f">正负贡献相互抵消</text>

  <path d="M358 118 H390" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <rect x="390" y="73" width="142" height="91" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="461" y="95" text-anchor="middle" class="label svg-special-text-fill-312f2f">平均差异</text>
  <text x="461" y="122" text-anchor="middle" class="formula svg-special-text-fill-312f2f">D(p ∥ q) ≥ 0</text>
  <text x="461" y="146" text-anchor="middle" class="body svg-special-text-fill-312f2f">p=q 时为 0</text>

  <text x="28" y="202" class="body svg-special-text-fill-312f2f">反向 D(q ∥ p) 会改变加权方向，因此 KL 不是对称距离。</text>
  <rect x="28" y="213" width="504" height="24" rx="6" class="accent svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="280" y="230" text-anchor="middle" class="formula svg-special-text-fill-312f2f">H(p,q) − H(p) = D(p ∥ q)</text>
</svg>
