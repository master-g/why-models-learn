<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <title>条件熵是各个条件分支熵的加权平均</title>
  <desc>先按 X 的取值分成两个条件分支，分别计算 Y 的熵，再按照每个分支的概率加权得到条件熵。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #312f2f;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; }
    .box { fill: #faf8f5; stroke: #b8b2a8; stroke-width: 1.4; }
    .accent { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.5; }
    .axis { stroke: #8f8a83; stroke-width: 1.2; fill: none; }
    .guide { stroke: #c9c4bb; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title">条件熵：先按 X 分支，再对 Y 取平均</text>
  <text x="28" y="50" class="body">H(Y|X) = Σₓ p(x) H(Y|X=x)</text>

  <rect x="28" y="77" width="105" height="58" rx="8" class="box"/>
  <text x="80" y="99" text-anchor="middle" class="label">X = 0</text>
  <text x="80" y="121" text-anchor="middle" class="formula">p(x)=0.5</text>

  <rect x="28" y="155" width="105" height="58" rx="8" class="box"/>
  <text x="80" y="177" text-anchor="middle" class="label">X = 1</text>
  <text x="80" y="199" text-anchor="middle" class="formula">p(x)=0.5</text>

  <path d="M133 106 H164" class="axis" marker-end="url(#arrow)"/>
  <path d="M133 184 H164" class="axis" marker-end="url(#arrow)"/>

  <rect x="164" y="69" width="184" height="74" rx="8" class="accent"/>
  <text x="256" y="92" text-anchor="middle" class="label">条件分布</text>
  <text x="256" y="113" text-anchor="middle" class="formula">Y|X=0: (0.9, 0.1)</text>
  <text x="256" y="132" text-anchor="middle" class="formula">H = 0.469 bit</text>

  <rect x="164" y="147" width="184" height="74" rx="8" class="accent"/>
  <text x="256" y="170" text-anchor="middle" class="label">条件分布</text>
  <text x="256" y="191" text-anchor="middle" class="formula">Y|X=1: (0.2, 0.8)</text>
  <text x="256" y="210" text-anchor="middle" class="formula">H = 0.722 bit</text>

  <path d="M348 106 C369 106 370 127 389 127" class="axis" marker-end="url(#arrow)"/>
  <path d="M348 184 C369 184 370 163 389 163" class="axis" marker-end="url(#arrow)"/>
  <path d="M372 127 V163" class="guide"/>

  <rect x="389" y="101" width="143" height="88" rx="8" class="box"/>
  <text x="460" y="124" text-anchor="middle" class="label">加权平均</text>
  <text x="460" y="147" text-anchor="middle" class="formula">0.5×0.469</text>
  <text x="460" y="166" text-anchor="middle" class="formula">+ 0.5×0.722</text>
  <text x="460" y="183" text-anchor="middle" class="formula">= 0.595 bit</text>
</svg>
