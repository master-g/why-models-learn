<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>困惑度把平均 token 信息量取指数</title>
  <desc>三个 token 的概率分别为二分之一、四分之一、八分之一，信息量为 1、2、3 bit，平均为 2 bit，指数化后困惑度为 4。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; }
    .box {stroke-width: 1.4; }
    .accent {stroke-width: 1.5; }
    .axis {stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">困惑度：平均每 token 的信息量取指数</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">q = (1/2，1/4，1/8) → 损失 (1，2，3) bit → PPL = 4</text>

  <rect x="28" y="78" width="96" height="64" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="76" y="101" text-anchor="middle" class="label svg-special-text-fill-312f2f">token 1</text>
  <text x="76" y="124" text-anchor="middle" class="formula svg-special-text-fill-312f2f">q=1/2 → 1 bit</text>

  <path d="M124 110 H139" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="145" y="78" width="96" height="64" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="193" y="101" text-anchor="middle" class="label svg-special-text-fill-312f2f">token 2</text>
  <text x="193" y="124" text-anchor="middle" class="formula svg-special-text-fill-312f2f">q=1/4 → 2 bit</text>

  <path d="M241 110 H256" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="262" y="78" width="96" height="64" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="310" y="101" text-anchor="middle" class="label svg-special-text-fill-312f2f">token 3</text>
  <text x="310" y="124" text-anchor="middle" class="formula svg-special-text-fill-312f2f">q=1/8 → 3 bit</text>

  <path d="M358 110 H376" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="384" y="78" width="148" height="64" rx="8" class="accent svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="458" y="101" text-anchor="middle" class="label svg-special-text-fill-312f2f">平均信息量</text>
  <text x="458" y="124" text-anchor="middle" class="formula svg-special-text-fill-312f2f">ℓ = 2 bit/token</text>

  <path d="M458 142 V173" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>
  <rect x="384" y="180" width="148" height="42" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="458" y="207" text-anchor="middle" class="formula svg-special-text-fill-312f2f">PPL = 2² = 4</text>
</svg>
