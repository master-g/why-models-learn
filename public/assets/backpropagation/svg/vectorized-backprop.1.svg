  .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
  .svg-special-text-fill-263746 { fill: #263746; }
  .svg-special-text-fill-61717b { fill: #61717b; }

  .svg-special-background-fill-e4edf0 { fill: #e4edf0; }
  .svg-special-background-fill-e9eadb { fill: #e9eadb; }
  .svg-special-background-fill-f4e5df { fill: #f4e5df; }
  .svg-special-background-fill-f8f4eb { fill: #f8f4eb; }


@media (prefers-color-scheme: dark) {
    .svg-special-fill-fill-3b5368 { fill: #4f6577; }
    .svg-special-fill-fill-a34f42 { fill: #a34f42; }
    .svg-special-fill-fill-e4edf0 { fill: #8c9193; }
    .svg-special-fill-fill-e9eadb { fill: #919188; }
    .svg-special-fill-fill-f4e5df { fill: #988f8b; }
    .svg-special-fill-fill-f8f4eb { fill: #93908b; }
    .svg-special-graphic-stroke-3b5368 { stroke: #4f6577; }
    .svg-special-graphic-stroke-527285 { stroke: #527285; }
    .svg-special-graphic-stroke-718050 { stroke: #718050; }
    .svg-special-graphic-stroke-a34f42 { stroke: #a34f42; }
    .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
    .svg-special-text-fill-263746 { fill: #9ea6ac; }
    .svg-special-text-fill-61717b { fill: #9ba6ac; }
    .svg-special-background-fill-e4edf0 { fill: #323334; }
    .svg-special-background-fill-e9eadb { fill: #333331; }
    .svg-special-background-fill-f4e5df { fill: #343231; }
    .svg-special-background-fill-f8f4eb { fill: #353433; }



  }
</style>
  <title id="title">向量化反向传播的前向矩阵与反向矩阵</title>
  <desc id="desc">三行样本经过仿射层和激活得到前向矩阵，反向从上游梯度经过激活掩码得到 GZ，再分别计算输入、权重和偏置梯度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-3b5368"/>
    </marker>
    <marker id="back-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-a34f42"/>
    </marker>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <style>
      .paper {}
      .ink {}
      .muted {}
      .forward {}
      .reverse {}
      .result {}
      .label { font: 18px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .small { font: 14px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .formula { font: 17px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .rough { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="paper svg-special-fill-fill-f8f4eb svg-special-background-fill-f8f4eb" x="3" y="3" width="794" height="367" rx="18" filter="url(#paper)"/>
  <path d="M24 58 C180 48 350 64 510 54 S700 51 778 59" fill="none"  stroke-width="1.2" class="rough svg-special-graphic-stroke-d2c8b6"/>
  <text x="28" y="36" class="label svg-special-text-fill-263746">同一张图，不同的执行形状</text>
  <text x="28" y="82" class="small svg-special-text-fill-61717b">前向：样本轴保留　反向：共享参数处沿样本轴归约</text>

  <rect class="forward svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="35" y="116" width="112" height="66" rx="12"/>
  <text x="91" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">X</text>
  <text x="91" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">n × d</text>

  <rect class="forward svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="188" y="104" width="142" height="90" rx="12"/>
  <text x="259" y="132" text-anchor="middle" class="label svg-special-text-fill-263746">仿射层</text>
  <text x="259" y="159" text-anchor="middle" class="formula svg-special-text-fill-263746">Z = XWᵀ + 1bᵀ</text>
  <text x="259" y="180" text-anchor="middle" class="small svg-special-text-fill-61717b">W、b 共享</text>

  <rect class="forward svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="373" y="116" width="112" height="66" rx="12"/>
  <text x="429" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">A = φ(Z)</text>
  <text x="429" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">n × h</text>

  <line x1="147" y1="149" x2="185" y2="149"  stroke-width="2.5" marker-end="url(#arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="330" y1="149" x2="370" y2="149"  stroke-width="2.5" marker-end="url(#arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <text x="162" y="136" text-anchor="middle" class="small svg-special-text-fill-61717b">前向</text>
  <text x="350" y="136" text-anchor="middle" class="small svg-special-text-fill-61717b">前向</text>

  <path d="M485 149 C536 149 540 102 592 102" fill="none"  stroke-width="2.5" marker-end="url(#back-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <rect class="reverse svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42 svg-special-background-fill-f4e5df" x="592" y="70" width="150" height="65" rx="12"/>
  <text x="667" y="96" text-anchor="middle" class="label svg-special-text-fill-263746">G_A</text>
  <text x="667" y="118" text-anchor="middle" class="small svg-special-text-fill-61717b">上游梯度</text>

  <rect class="reverse svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42 svg-special-background-fill-f4e5df" x="373" y="232" width="112" height="66" rx="12"/>
  <text x="429" y="259" text-anchor="middle" class="label svg-special-text-fill-263746">G_Z</text>
  <text x="429" y="280" text-anchor="middle" class="formula svg-special-text-fill-263746">G_A ⊙ φ′(Z)</text>

  <path d="M592 117 C535 117 535 265 488 265" fill="none"  stroke-width="2.5" marker-end="url(#back-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <text x="548" y="205" text-anchor="middle" class="small svg-special-text-fill-61717b">局部导数</text>

  <rect class="result svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="35" y="302" width="112" height="48" rx="12"/>
  <text x="91" y="331" text-anchor="middle" class="formula svg-special-text-fill-263746">G_X = G_ZW</text>
  <rect class="result svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="188" y="302" width="142" height="48" rx="12"/>
  <text x="259" y="331" text-anchor="middle" class="formula svg-special-text-fill-263746">G_W = G_ZᵀX</text>
  <rect class="result svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="373" y="302" width="112" height="48" rx="12"/>
  <text x="429" y="331" text-anchor="middle" class="formula svg-special-text-fill-263746">g_b = G_Zᵀ1</text>

  <path d="M401 298 C340 298 330 326 333 326" fill="none"  stroke-width="2.2" marker-end="url(#back-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <path d="M429 298 L429 301" fill="none"  stroke-width="2.2" marker-end="url(#back-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <path d="M457 298 C520 298 535 326 488 326" fill="none"  stroke-width="2.2" marker-end="url(#back-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <text x="610" y="259" class="label svg-special-text-fill-263746">反向的核心</text>
  <text x="610" y="284" class="small svg-special-text-fill-61717b">形状先对齐，</text>
  <text x="610" y="305" class="small svg-special-text-fill-61717b">共享轴再求和。</text>
  <path d="M605 319 C658 312 717 326 770 317" fill="none"  stroke-width="1.5" class="rough svg-special-graphic-stroke-d2c8b6"/>
</svg>
