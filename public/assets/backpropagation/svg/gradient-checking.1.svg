<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-special-fill-fill-3b5368 { fill: #3b5368; }
  .svg-special-fill-fill-a34f42 { fill: #a34f42; }
  .svg-special-fill-fill-e4edf0 { fill: #8c9193; }
  .svg-special-fill-fill-e9eadb { fill: #919188; }
  .svg-special-fill-fill-f4e5df { fill: #988f8b; }
  .svg-special-fill-fill-f8f4eb { fill: #93908b; }
  .svg-special-graphic-stroke-3b5368 { stroke: #3b5368; }
  .svg-special-graphic-stroke-527285 { stroke: #527285; }
  .svg-special-graphic-stroke-718050 { stroke: #718050; }
  .svg-special-graphic-stroke-a34f42 { stroke: #a34f42; }
  .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
  .svg-special-text-fill-263746 { fill: #263746; }
  .svg-special-text-fill-61717b { fill: #61717b; }

  .svg-special-background-fill-e4edf0 { fill: #e4edf0; }
  .svg-special-background-fill-e9eadb { fill: #e9eadb; }
  .svg-special-background-fill-f4e5df { fill: #f4e5df; }
  .svg-special-background-fill-f8f4eb { fill: #f8f4eb; }


@media (prefers-color-scheme: dark) {
    .svg-special-fill-fill-3b5368 { fill: #4f6577; }
    .svg-special-fill-fill-a34f42 { fill: #a34f42; }
    .svg-special-fill-fill-e4edf0 { fill: #8c9193; }
    .svg-special-fill-fill-e9eadb { fill: #919188; }
    .svg-special-fill-fill-f4e5df { fill: #988f8b; }
    .svg-special-fill-fill-f8f4eb { fill: #93908b; }
    .svg-special-graphic-stroke-3b5368 { stroke: #4f6577; }
    .svg-special-graphic-stroke-527285 { stroke: #527285; }
    .svg-special-graphic-stroke-718050 { stroke: #718050; }
    .svg-special-graphic-stroke-a34f42 { stroke: #a34f42; }
    .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
    .svg-special-text-fill-263746 { fill: #9ea6ac; }
    .svg-special-text-fill-61717b { fill: #9ba6ac; }
    .svg-special-background-fill-e4edf0 { fill: #323334; }
    .svg-special-background-fill-e9eadb { fill: #333331; }
    .svg-special-background-fill-f4e5df { fill: #343231; }
    .svg-special-background-fill-f8f4eb { fill: #353433; }



  }
</style>
  <title id="title">梯度检查的双路径比较</title>
  <desc id="desc">同一个参数点分别经过解析反向传播和正负有限差分，两个梯度结果在比较框中对齐。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-3b5368"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-a34f42"/>
    </marker>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <style>
      .paper {}
      .ink {}
      .muted {}
      .blue {}
      .red {}
      .green {}
      .label { font: 18px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .small { font: 14px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .formula { font: 17px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .rough { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="paper svg-special-fill-fill-f8f4eb svg-special-background-fill-f8f4eb" x="3" y="3" width="794" height="367" rx="18" filter="url(#paper)"/>
  <text x="28" y="36" class="label svg-special-text-fill-263746">同一个参数点，两条证据路径</text>
  <path d="M24 57 C185 50 360 66 520 55 S700 51 778 59" fill="none"  stroke-width="1.2" class="rough svg-special-graphic-stroke-d2c8b6"/>
  <text x="28" y="82" class="small svg-special-text-fill-61717b">固定数据、状态与目标，只改变参数的一个坐标</text>

  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="36" y="127" width="140" height="64" rx="12"/>
  <text x="106" y="155" text-anchor="middle" class="label svg-special-text-fill-263746">参数点 θ</text>
  <text x="106" y="177" text-anchor="middle" class="small svg-special-text-fill-61717b">保存快照</text>

  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="224" y="100" width="156" height="72" rx="12"/>
  <text x="302" y="128" text-anchor="middle" class="label svg-special-text-fill-263746">反向传播</text>
  <text x="302" y="151" text-anchor="middle" class="formula svg-special-text-fill-263746">g = ∇L(θ)</text>

  <rect class="red svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42 svg-special-background-fill-f4e5df" x="224" y="218" width="156" height="72" rx="12"/>
  <text x="302" y="246" text-anchor="middle" class="label svg-special-text-fill-263746">有限差分</text>
  <text x="302" y="269" text-anchor="middle" class="formula svg-special-text-fill-263746">L(θ+h eᵢ), L(θ−h eᵢ)</text>

  <line x1="176" y1="150" x2="220" y2="137"  stroke-width="2.5" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <path d="M176 168 C198 199 198 237 220 253" fill="none"  stroke-width="2.5" marker-end="url(#red-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>

  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="425" y="100" width="140" height="72" rx="12"/>
  <text x="495" y="128" text-anchor="middle" class="label svg-special-text-fill-263746">解析梯度</text>
  <text x="495" y="151" text-anchor="middle" class="formula svg-special-text-fill-263746">gᵢ</text>
  <rect class="red svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42 svg-special-background-fill-f4e5df" x="425" y="218" width="140" height="72" rx="12"/>
  <text x="495" y="246" text-anchor="middle" class="label svg-special-text-fill-263746">数值梯度</text>
  <text x="495" y="269" text-anchor="middle" class="formula svg-special-text-fill-263746">ĝᵢ = ΔL / 2h</text>
  <line x1="380" y1="136" x2="421" y2="136"  stroke-width="2.5" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="380" y1="254" x2="421" y2="254"  stroke-width="2.5" marker-end="url(#red-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>

  <rect class="green svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="617" y="142" width="145" height="106" rx="14"/>
  <text x="689" y="171" text-anchor="middle" class="label svg-special-text-fill-263746">比较</text>
  <text x="689" y="196" text-anchor="middle" class="formula svg-special-text-fill-263746">abs / rel error</text>
  <text x="689" y="220" text-anchor="middle" class="small svg-special-text-fill-61717b">记录最大坐标</text>
  <line x1="565" y1="136" x2="613" y2="174"  stroke-width="2.3" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="565" y1="254" x2="613" y2="216"  stroke-width="2.3" marker-end="url(#red-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>

  <text x="36" y="335" class="label svg-special-text-fill-263746">中心差分</text>
  <text x="137" y="335" class="formula svg-special-text-fill-263746">[L(θ+h eᵢ) − L(θ−h eᵢ)] / 2h</text>
  <path d="M618 285 C667 278 723 292 767 283" fill="none"  stroke-width="1.5" class="rough svg-special-graphic-stroke-d2c8b6"/>
  <text x="618" y="315" class="small svg-special-text-fill-61717b">步长太大：截断误差</text>
  <text x="618" y="337" class="small svg-special-text-fill-61717b">步长太小：舍入误差</text>
</svg>
