<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-5d7775 { fill: #5d7775; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
  .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
  .svg-special-fill-fill-f4f0ec { fill: #93908e; }
  .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
  .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e3eeeb { fill: #e3eeeb; }
  .svg-special-background-fill-f3e1d9 { fill: #f3e1d9; }
  .svg-special-background-fill-f4f0ec { fill: #f4f0ec; }
  .svg-special-background-fill-f7f4f0 { fill: #f7f4f0; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-5d7775 { fill: #5d7775; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
    .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
    .svg-special-fill-fill-f4f0ec { fill: #93908e; }
    .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
    .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e3eeeb { fill: #323333; }
    .svg-special-background-fill-f3e1d9 { fill: #343230; }
    .svg-special-background-fill-f4f0ec { fill: #343433; }
    .svg-special-background-fill-f7f4f0 { fill: #353434; }



  }
</style>
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-5d7775"/>
    </marker>
    <style>
      .ink {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted {font-size:13px; }
      .box {stroke-width:1.2; }
      .accent {stroke-width:1.5; }
      .reverse-box {stroke-width:1.5; }
      .forward-line { fill:none;  stroke-width:2; marker-end:url(#forward-arrow); }
      .reverse-line { fill:none;  stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none;  stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f4f0ec svg-special-background-fill-f4f0ec"/>
  <text x="36" y="34" class="ink label svg-special-text-fill-312f2f">链式法则：路径内相乘，汇合处相加</text>
  <text x="36" y="57" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">u = x²，v = xy，L = 2u + v；在 x = 2，y = 3 处得到 L = 14</text>

  <rect x="34" y="92" width="132" height="68" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="100" y="120" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入</text>
  <text x="100" y="145" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">x = 2，y = 3</text>

  <rect x="236" y="62" width="136" height="68" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="304" y="90" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">平方分支</text>
  <text x="304" y="115" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">u = x² = 4</text>

  <rect x="236" y="158" width="136" height="68" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="304" y="186" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">乘积分支</text>
  <text x="304" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">v = xy = 6</text>

  <rect x="470" y="92" width="150" height="68" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="545" y="120" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">汇合输出</text>
  <text x="545" y="145" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L = 2u + v = 14</text>

  <path d="M166 126 H198 V96 H230" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M166 134 H198 V192 H230" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M372 96 H430 V126 H464" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M372 192 H430 V126 H464" class="forward-line svg-coral-stroke-stroke"/>
  <text x="414" y="78" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">前向值</text>

  <rect x="634" y="264" width="132" height="58" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="700" y="289" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输出敏感度</text>
  <text x="700" y="309" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L̄ = 1</text>

  <rect x="470" y="264" width="150" height="58" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="545" y="289" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">分支贡献</text>
  <text x="545" y="309" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">ū = 2，v̄ = 1</text>

  <rect x="236" y="264" width="136" height="58" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="304" y="289" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">路径累加</text>
  <text x="304" y="309" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">x̄ = 8 + 3 = 11</text>

  <rect x="34" y="264" width="132" height="58" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="100" y="289" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">另一输入</text>
  <text x="100" y="309" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">ȳ = 2</text>

  <path d="M634 293 H626" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M470 293 H378" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M236 293 H174" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M304 264 V238 H184 V150" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M304 238 H184 V226" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M36 342 H764" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="361" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">同一条链式法则：路径内乘局部导数，多个路径在同一节点相加</text>
</svg>
