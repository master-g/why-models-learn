<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-special-fill-fill-3b5368 { fill: #3b5368; }
  .svg-special-fill-fill-a34f42 { fill: #a34f42; }
  .svg-special-fill-fill-e4edf0 { fill: #8c9193; }
  .svg-special-fill-fill-e9eadb { fill: #919188; }
  .svg-special-fill-fill-f4e5df { fill: #988f8b; }
  .svg-special-fill-fill-f8f4eb { fill: #93908b; }
  .svg-special-graphic-stroke-3b5368 { stroke: #3b5368; }
  .svg-special-graphic-stroke-527285 { stroke: #527285; }
  .svg-special-graphic-stroke-718050 { stroke: #718050; }
  .svg-special-graphic-stroke-a34f42 { stroke: #a34f42; }
  .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
  .svg-special-text-fill-263746 { fill: #263746; }
  .svg-special-text-fill-61717b { fill: #61717b; }

  .svg-special-background-fill-e4edf0 { fill: #e4edf0; }
  .svg-special-background-fill-e9eadb { fill: #e9eadb; }
  .svg-special-background-fill-f4e5df { fill: #f4e5df; }
  .svg-special-background-fill-f8f4eb { fill: #f8f4eb; }


@media (prefers-color-scheme: dark) {
    .svg-special-fill-fill-3b5368 { fill: #4f6577; }
    .svg-special-fill-fill-a34f42 { fill: #a34f42; }
    .svg-special-fill-fill-e4edf0 { fill: #8c9193; }
    .svg-special-fill-fill-e9eadb { fill: #919188; }
    .svg-special-fill-fill-f4e5df { fill: #988f8b; }
    .svg-special-fill-fill-f8f4eb { fill: #93908b; }
    .svg-special-graphic-stroke-3b5368 { stroke: #4f6577; }
    .svg-special-graphic-stroke-527285 { stroke: #527285; }
    .svg-special-graphic-stroke-718050 { stroke: #718050; }
    .svg-special-graphic-stroke-a34f42 { stroke: #a34f42; }
    .svg-special-graphic-stroke-d2c8b6 { stroke: #979083; }
    .svg-special-text-fill-263746 { fill: #9ea6ac; }
    .svg-special-text-fill-61717b { fill: #9ba6ac; }
    .svg-special-background-fill-e4edf0 { fill: #323334; }
    .svg-special-background-fill-e9eadb { fill: #333331; }
    .svg-special-background-fill-f4e5df { fill: #343231; }
    .svg-special-background-fill-f8f4eb { fill: #353433; }



  }
</style>
  <title id="title">梯度消失与爆炸的 Jacobian 连乘</title>
  <desc id="desc">深度方向的局部 Jacobian 逐层相乘，较小的增益衰减，较大的增益放大；底部展示循环时间轴。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-3b5368"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-a34f42"/>
    </marker>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <style>
      .paper {}
      .ink {}
      .muted {}
      .blue {}
      .red {}
      .green {}
      .label { font: 18px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .small { font: 14px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .formula { font: 17px 'STKaiti', 'Kaiti SC', 'Noto Serif CJK SC', serif;  }
      .rough { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="paper svg-special-fill-fill-f8f4eb svg-special-background-fill-f8f4eb" x="3" y="3" width="794" height="367" rx="18" filter="url(#paper)"/>
  <text x="28" y="36" class="label svg-special-text-fill-263746">局部 Jacobian 的连乘</text>
  <path d="M24 57 C180 48 350 65 510 54 S700 51 778 59" fill="none"  stroke-width="1.2" class="rough svg-special-graphic-stroke-d2c8b6"/>
  <text x="28" y="82" class="small svg-special-text-fill-61717b">同一条路径上，每层的尺度都会留下痕迹</text>

  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="33" y="116" width="105" height="62" rx="12"/>
  <text x="85" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">gₗ₊₁</text>
  <text x="85" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">上游信号</text>
  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="180" y="116" width="112" height="62" rx="12"/>
  <text x="236" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">Jₗᵀ</text>
  <text x="236" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">局部回传</text>
  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="335" y="116" width="112" height="62" rx="12"/>
  <text x="391" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">Jₗ₋₁ᵀ</text>
  <text x="391" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">继续相乘</text>
  <rect class="blue svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285 svg-special-background-fill-e4edf0" x="490" y="116" width="112" height="62" rx="12"/>
  <text x="546" y="143" text-anchor="middle" class="label svg-special-text-fill-263746">⋯</text>
  <text x="546" y="164" text-anchor="middle" class="small svg-special-text-fill-61717b">深度 / 时间</text>
  <line x1="138" y1="147" x2="176" y2="147"  stroke-width="2.4" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="292" y1="147" x2="331" y2="147"  stroke-width="2.4" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="447" y1="147" x2="486" y2="147"  stroke-width="2.4" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>

  <rect class="red svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42 svg-special-background-fill-f4e5df" x="649" y="99" width="115" height="73" rx="12"/>
  <text x="706" y="127" text-anchor="middle" class="label svg-special-text-fill-263746">乘积</text>
  <text x="706" y="151" text-anchor="middle" class="formula svg-special-text-fill-263746">Jₗ:₁ᵀg</text>
  <line x1="602" y1="147" x2="645" y2="135"  stroke-width="2.4" marker-end="url(#red-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>

  <rect class="green svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="49" y="217" width="207" height="62" rx="12"/>
  <text x="152" y="245" text-anchor="middle" class="label svg-special-text-fill-263746">σₘₐₓ &lt; 1</text>
  <text x="152" y="266" text-anchor="middle" class="small svg-special-text-fill-61717b">多数方向趋向消失</text>
  <rect class="green svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="296" y="217" width="207" height="62" rx="12"/>
  <text x="399" y="245" text-anchor="middle" class="label svg-special-text-fill-263746">σₘᵢₙ ≈ 0</text>
  <text x="399" y="266" text-anchor="middle" class="small svg-special-text-fill-61717b">某些方向被压扁</text>
  <rect class="green svg-special-fill-fill-e9eadb svg-special-graphic-stroke-718050 svg-special-background-fill-e9eadb" x="543" y="217" width="207" height="62" rx="12"/>
  <text x="646" y="245" text-anchor="middle" class="label svg-special-text-fill-263746">σₘₐₓ &gt; 1</text>
  <text x="646" y="266" text-anchor="middle" class="small svg-special-text-fill-61717b">某些方向可能爆炸</text>

  <text x="30" y="315" class="label svg-special-text-fill-263746">循环时间轴</text>
  <circle cx="181" cy="311" r="18"   stroke-width="2" class="svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285"/>
  <circle cx="266" cy="311" r="18"   stroke-width="2" class="svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285"/>
  <circle cx="351" cy="311" r="18"   stroke-width="2" class="svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285"/>
  <circle cx="436" cy="311" r="18"   stroke-width="2" class="svg-special-fill-fill-e4edf0 svg-special-graphic-stroke-527285"/>
  <circle cx="521" cy="311" r="18"   stroke-width="2" class="svg-special-fill-fill-f4e5df svg-special-graphic-stroke-a34f42"/>
  <line x1="199" y1="311" x2="244" y2="311"  stroke-width="2" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="284" y1="311" x2="329" y2="311"  stroke-width="2" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="369" y1="311" x2="414" y2="311"  stroke-width="2" marker-end="url(#blue-arrow)" class="rough svg-special-graphic-stroke-3b5368"/>
  <line x1="454" y1="311" x2="499" y2="311"  stroke-width="2" marker-end="url(#red-arrow)" class="rough svg-special-graphic-stroke-a34f42"/>
  <text x="181" y="317" text-anchor="middle" class="small svg-special-text-fill-61717b">t</text>
  <text x="266" y="317" text-anchor="middle" class="small svg-special-text-fill-61717b">t+1</text>
  <text x="351" y="317" text-anchor="middle" class="small svg-special-text-fill-61717b">t+2</text>
  <text x="436" y="317" text-anchor="middle" class="small svg-special-text-fill-61717b">⋯</text>
  <text x="521" y="317" text-anchor="middle" class="small svg-special-text-fill-61717b">T</text>
  <text x="574" y="306" class="small svg-special-text-fill-61717b">长乘积</text>
  <text x="574" y="329" class="small svg-special-text-fill-61717b">也是时间距离</text>
</svg>
