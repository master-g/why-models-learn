<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5d7775"/>
    </marker>
    <style>
      .ink { fill:#312f2f; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted { fill:#6c6a64; font-size:13px; }
      .box { fill:#f7f4f0; stroke:#b8b2a8; stroke-width:1.2; }
      .accent { fill:#f3e1d9; stroke:#cc785c; stroke-width:1.5; }
      .reverse-box { fill:#e3eeeb; stroke:#5d7775; stroke-width:1.5; }
      .forward-line { fill:none; stroke:#cc785c; stroke-width:2; marker-end:url(#forward-arrow); }
      .reverse-line { fill:none; stroke:#5d7775; stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none; stroke:#c9c4bb; stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373" fill="#f4f0ec"/>
  <text x="36" y="34" class="ink label">两层网络：输出误差信号穿过 W² 和活动掩码</text>
  <text x="36" y="57" class="ink muted">x = (1，2)，z¹ = (1，−0.25)，h = (1，0)，z² = 0.7，y = 1</text>

  <rect x="28" y="88" width="132" height="76" rx="10" class="box"/>
  <text x="94" y="117" text-anchor="middle" class="ink label">输入</text>
  <text x="94" y="143" text-anchor="middle" class="ink small">x = (1，2)</text>

  <rect x="190" y="88" width="154" height="76" rx="10" class="accent"/>
  <text x="267" y="117" text-anchor="middle" class="ink label">第一层</text>
  <text x="267" y="143" text-anchor="middle" class="ink small">z¹ = (1，−0.25)</text>

  <rect x="374" y="88" width="132" height="76" rx="10" class="accent"/>
  <text x="440" y="117" text-anchor="middle" class="ink label">ReLU</text>
  <text x="440" y="143" text-anchor="middle" class="ink small">h = (1，0)</text>

  <rect x="536" y="88" width="112" height="76" rx="10" class="accent"/>
  <text x="592" y="117" text-anchor="middle" class="ink label">输出层</text>
  <text x="592" y="143" text-anchor="middle" class="ink small">z² = 0.7</text>

  <rect x="678" y="88" width="94" height="76" rx="10" class="box"/>
  <text x="725" y="117" text-anchor="middle" class="ink label">损失</text>
  <text x="725" y="143" text-anchor="middle" class="ink small">L = 0.403</text>

  <path d="M160 126 H184" class="forward-line"/>
  <path d="M344 126 H368" class="forward-line"/>
  <path d="M506 126 H530" class="forward-line"/>
  <path d="M648 126 H672" class="forward-line"/>
  <text x="400" y="78" text-anchor="middle" class="ink muted">前向：依赖方向</text>

  <rect x="678" y="238" width="94" height="70" rx="10" class="reverse-box"/>
  <text x="725" y="266" text-anchor="middle" class="ink label">输出敏感度</text>
  <text x="725" y="291" text-anchor="middle" class="ink small">δ² = −0.332</text>

  <rect x="536" y="238" width="112" height="70" rx="10" class="reverse-box"/>
  <text x="592" y="266" text-anchor="middle" class="ink label">乘 W²ᵀ</text>
  <text x="592" y="291" text-anchor="middle" class="ink small">∇h = (−.166，.332)</text>

  <rect x="374" y="238" width="132" height="70" rx="10" class="reverse-box"/>
  <text x="440" y="266" text-anchor="middle" class="ink label">活动掩码</text>
  <text x="440" y="291" text-anchor="middle" class="ink small">δ¹ = (−.166，0)</text>

  <rect x="190" y="238" width="154" height="70" rx="10" class="reverse-box"/>
  <text x="267" y="266" text-anchor="middle" class="ink label">第一层梯度</text>
  <text x="267" y="291" text-anchor="middle" class="ink small">∇W¹ = δ¹xᵀ</text>

  <rect x="28" y="238" width="132" height="70" rx="10" class="reverse-box"/>
  <text x="94" y="266" text-anchor="middle" class="ink label">输入梯度</text>
  <text x="94" y="291" text-anchor="middle" class="ink small">∇x = W¹ᵀδ¹</text>

  <path d="M725 174 V232" class="reverse-line"/>
  <path d="M678 273 H654" class="reverse-line"/>
  <path d="M536 273 H512" class="reverse-line"/>
  <path d="M374 273 H350" class="reverse-line"/>
  <path d="M190 273 H166" class="reverse-line"/>
  <text x="400" y="216" text-anchor="middle" class="ink muted">反向：先乘下一层转置权重，再乘当前层局部导数</text>

  <path d="M36 329 H764" class="guide"/>
  <text x="400" y="353" text-anchor="middle" class="ink muted">两个零梯度来源不同：h₂ = 0 影响输出权重，ReLU 掩码 0 影响第一层</text>
</svg>
