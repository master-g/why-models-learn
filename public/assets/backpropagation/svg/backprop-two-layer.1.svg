<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-5d7775 { fill: #5d7775; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
  .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
  .svg-special-fill-fill-f4f0ec { fill: #93908e; }
  .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
  .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e3eeeb { fill: #e3eeeb; }
  .svg-special-background-fill-f3e1d9 { fill: #f3e1d9; }
  .svg-special-background-fill-f4f0ec { fill: #f4f0ec; }
  .svg-special-background-fill-f7f4f0 { fill: #f7f4f0; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-5d7775 { fill: #5d7775; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
    .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
    .svg-special-fill-fill-f4f0ec { fill: #93908e; }
    .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
    .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e3eeeb { fill: #323333; }
    .svg-special-background-fill-f3e1d9 { fill: #343230; }
    .svg-special-background-fill-f4f0ec { fill: #343433; }
    .svg-special-background-fill-f7f4f0 { fill: #353434; }



  }
</style>
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-5d7775"/>
    </marker>
    <style>
      .ink {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted {font-size:13px; }
      .box {stroke-width:1.2; }
      .accent {stroke-width:1.5; }
      .reverse-box {stroke-width:1.5; }
      .forward-line { fill:none;  stroke-width:2; marker-end:url(#forward-arrow); }
      .reverse-line { fill:none;  stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none;  stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f4f0ec svg-special-background-fill-f4f0ec"/>
  <text x="36" y="34" class="ink label svg-special-text-fill-312f2f">两层网络：输出误差信号穿过 W² 和活动掩码</text>
  <text x="36" y="57" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">x = (1，2)，z¹ = (1，−0.25)，h = (1，0)，z² = 0.7，y = 1</text>

  <rect x="28" y="88" width="132" height="76" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="94" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入</text>
  <text x="94" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">x = (1，2)</text>

  <rect x="190" y="88" width="154" height="76" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="267" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">第一层</text>
  <text x="267" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">z¹ = (1，−0.25)</text>

  <rect x="374" y="88" width="132" height="76" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="440" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">ReLU</text>
  <text x="440" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">h = (1，0)</text>

  <rect x="536" y="88" width="112" height="76" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="592" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输出层</text>
  <text x="592" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">z² = 0.7</text>

  <rect x="678" y="88" width="94" height="76" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="725" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">损失</text>
  <text x="725" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L = 0.403</text>

  <path d="M160 126 H184" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M344 126 H368" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M506 126 H530" class="forward-line svg-coral-stroke-stroke"/>
  <path d="M648 126 H672" class="forward-line svg-coral-stroke-stroke"/>
  <text x="400" y="78" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">前向：依赖方向</text>

  <rect x="678" y="238" width="94" height="70" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="725" y="266" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输出敏感度</text>
  <text x="725" y="291" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">δ² = −0.332</text>

  <rect x="536" y="238" width="112" height="70" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="592" y="266" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">乘 W²ᵀ</text>
  <text x="592" y="291" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">∇h = (−.166，.332)</text>

  <rect x="374" y="238" width="132" height="70" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="440" y="266" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">活动掩码</text>
  <text x="440" y="291" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">δ¹ = (−.166，0)</text>

  <rect x="190" y="238" width="154" height="70" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="267" y="266" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">第一层梯度</text>
  <text x="267" y="291" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">∇W¹ = δ¹xᵀ</text>

  <rect x="28" y="238" width="132" height="70" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="94" y="266" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入梯度</text>
  <text x="94" y="291" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">∇x = W¹ᵀδ¹</text>

  <path d="M725 174 V232" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M678 273 H654" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M536 273 H512" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M374 273 H350" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M190 273 H166" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <text x="400" y="216" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">反向：先乘下一层转置权重，再乘当前层局部导数</text>

  <path d="M36 329 H764" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="353" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">两个零梯度来源不同：h₂ = 0 影响输出权重，ReLU 掩码 0 影响第一层</text>
</svg>
