<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5d7775"/>
    </marker>
    <style>
      .ink { fill:#312f2f; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted { fill:#6c6a64; font-size:13px; }
      .box { fill:#f7f4f0; stroke:#b8b2a8; stroke-width:1.2; }
      .accent { fill:#f3e1d9; stroke:#cc785c; stroke-width:1.5; }
      .reverse-box { fill:#e3eeeb; stroke:#5d7775; stroke-width:1.5; }
      .forward-line { fill:none; stroke:#cc785c; stroke-width:2; marker-end:url(#forward-arrow); }
      .reverse-line { fill:none; stroke:#5d7775; stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none; stroke:#c9c4bb; stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373" fill="#f4f0ec"/>
  <text x="36" y="34" class="ink label">单个神经元：先得到 δ，再把梯度分配给每条边</text>
  <text x="36" y="57" class="ink muted">x = (1，−2)，w = (0.4，−0.3)，b = 0.1，y = 1</text>

  <rect x="28" y="88" width="154" height="76" rx="10" class="box"/>
  <text x="105" y="117" text-anchor="middle" class="ink label">输入与参数</text>
  <text x="105" y="143" text-anchor="middle" class="ink small">x，w，b</text>

  <rect x="218" y="88" width="154" height="76" rx="10" class="accent"/>
  <text x="295" y="117" text-anchor="middle" class="ink label">仿射节点</text>
  <text x="295" y="143" text-anchor="middle" class="ink small">z = wᵀx + b = 1.1</text>

  <rect x="408" y="88" width="154" height="76" rx="10" class="accent"/>
  <text x="485" y="117" text-anchor="middle" class="ink label">sigmoid</text>
  <text x="485" y="143" text-anchor="middle" class="ink small">a = 0.750260</text>

  <rect x="598" y="88" width="174" height="76" rx="10" class="box"/>
  <text x="685" y="117" text-anchor="middle" class="ink label">二元交叉熵</text>
  <text x="685" y="143" text-anchor="middle" class="ink small">L = 0.287335</text>

  <path d="M182 126 H212" class="forward-line"/>
  <path d="M372 126 H402" class="forward-line"/>
  <path d="M562 126 H592" class="forward-line"/>
  <text x="390" y="78" text-anchor="middle" class="ink muted">前向：依赖方向</text>

  <rect x="598" y="238" width="174" height="70" rx="10" class="reverse-box"/>
  <text x="685" y="266" text-anchor="middle" class="ink label">输出敏感度</text>
  <text x="685" y="291" text-anchor="middle" class="ink small">L̄ = 1</text>

  <rect x="408" y="238" width="154" height="70" rx="10" class="reverse-box"/>
  <text x="485" y="266" text-anchor="middle" class="ink label">logit 误差信号</text>
  <text x="485" y="291" text-anchor="middle" class="ink small">δ = a − y = −0.249740</text>

  <rect x="218" y="238" width="154" height="70" rx="10" class="reverse-box"/>
  <text x="295" y="266" text-anchor="middle" class="ink label">仿射反向</text>
  <text x="295" y="291" text-anchor="middle" class="ink small">∇w = δx，b̄ = δ</text>

  <rect x="28" y="238" width="154" height="70" rx="10" class="reverse-box"/>
  <text x="105" y="266" text-anchor="middle" class="ink label">输入梯度</text>
  <text x="105" y="291" text-anchor="middle" class="ink small">∇x = δw</text>

  <path d="M685 174 V232" class="reverse-line"/>
  <path d="M598 273 H568" class="reverse-line"/>
  <path d="M408 273 H378" class="reverse-line"/>
  <path d="M218 273 H188" class="reverse-line"/>
  <text x="400" y="216" text-anchor="middle" class="ink muted">反向：局部导数 × 上游敏感度</text>

  <path d="M36 329 H764" class="guide"/>
  <text x="400" y="353" text-anchor="middle" class="ink muted">参数更新在全部梯度算完之后进行；学习率不属于反向传播</text>
</svg>
