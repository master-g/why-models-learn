<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch 自动微分的标量计算图</title>
  <desc id="desc">前向从 x、w、b 经过 z 和 tanh 得到损失 L，反向从损失把梯度传回各输入。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cc785c"/>
    </marker>
    <marker id="back-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5f7896"/>
    </marker>
  </defs>
  <rect width="800" height="373" fill="#f8f7f4"/>
  <text x="40" y="34" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">一次前向执行，得到一张可反向的图</text>
  <text x="40" y="60" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="13">实际经过的运算被记录；反向沿相反方向传递上游敏感度</text>

  <text x="48" y="98" fill="#cc785c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">前向值</text>
  <line x1="120" y1="135" x2="681" y2="135" stroke="#c9c4bb" stroke-width="2" stroke-dasharray="5 6"/>

  <circle cx="132" cy="135" r="35" fill="#fff" stroke="#cc785c" stroke-width="3"/>
  <text x="132" y="141" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="22" font-style="italic">x</text>
  <text x="132" y="187" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="12">输入</text>

  <circle cx="300" cy="135" r="43" fill="#fff" stroke="#cc785c" stroke-width="3"/>
  <text x="300" y="132" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="19" font-style="italic">z</text>
  <text x="300" y="153" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">wx + b</text>

  <circle cx="486" cy="135" r="43" fill="#fff" stroke="#cc785c" stroke-width="3"/>
  <text x="486" y="132" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="19" font-style="italic">a</text>
  <text x="486" y="153" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">tanh(z)</text>

  <circle cx="668" cy="135" r="43" fill="#fff" stroke="#cc785c" stroke-width="3"/>
  <text x="668" y="132" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="19" font-style="italic">L</text>
  <text x="668" y="153" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">平方损失</text>

  <line x1="169" y1="135" x2="253" y2="135" stroke="#cc785c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="343" y1="135" x2="439" y2="135" stroke="#cc785c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="529" y1="135" x2="621" y2="135" stroke="#cc785c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="211" y="119" text-anchor="middle" fill="#a45e48" font-family="system-ui, -apple-system, sans-serif" font-size="11">仿射</text>
  <text x="391" y="119" text-anchor="middle" fill="#a45e48" font-family="system-ui, -apple-system, sans-serif" font-size="11">激活</text>
  <text x="575" y="119" text-anchor="middle" fill="#a45e48" font-family="system-ui, -apple-system, sans-serif" font-size="11">损失</text>

  <text x="48" y="245" fill="#5f7896" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">反向梯度</text>
  <line x1="120" y1="286" x2="681" y2="286" stroke="#c9c4bb" stroke-width="2" stroke-dasharray="5 6"/>

  <line x1="621" y1="286" x2="529" y2="286" stroke="#5f7896" stroke-width="2.5" marker-end="url(#back-arrow)"/>
  <line x1="439" y1="286" x2="343" y2="286" stroke="#5f7896" stroke-width="2.5" marker-end="url(#back-arrow)"/>
  <line x1="253" y1="286" x2="169" y2="286" stroke="#5f7896" stroke-width="2.5" marker-end="url(#back-arrow)"/>

  <circle cx="132" cy="286" r="35" fill="#fff" stroke="#5f7896" stroke-width="3"/>
  <text x="132" y="293" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="18" font-style="italic">∂L/∂x</text>
  <circle cx="300" cy="286" r="43" fill="#fff" stroke="#5f7896" stroke-width="3"/>
  <text x="300" y="293" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="18" font-style="italic">∂L/∂z</text>
  <circle cx="486" cy="286" r="43" fill="#fff" stroke="#5f7896" stroke-width="3"/>
  <text x="486" y="293" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="18" font-style="italic">∂L/∂a</text>
  <circle cx="668" cy="286" r="43" fill="#fff" stroke="#5f7896" stroke-width="3"/>
  <text x="668" y="293" text-anchor="middle" fill="#312f2f" font-family="Georgia, serif" font-size="18" font-style="italic">1</text>

  <text x="211" y="270" text-anchor="middle" fill="#526b87" font-family="system-ui, -apple-system, sans-serif" font-size="11">乘以局部导数</text>
  <text x="391" y="270" text-anchor="middle" fill="#526b87" font-family="system-ui, -apple-system, sans-serif" font-size="11">乘以 1 − a²</text>
  <text x="575" y="270" text-anchor="middle" fill="#526b87" font-family="system-ui, -apple-system, sans-serif" font-size="11">损失根节点</text>

  <line x1="300" y1="178" x2="300" y2="241" stroke="#5f7896" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="300" y="216" text-anchor="middle" fill="#526b87" font-family="system-ui, -apple-system, sans-serif" font-size="11">δ = (a − y)(1 − a²)</text>

  <path d="M300 179 C270 215, 235 225, 196 248" fill="none" stroke="#b8b2a8" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="90" y="350" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="12">参数梯度：∂L/∂w = δx，∂L/∂b = δ</text>
  <text x="458" y="350" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="12">叶张量默认接收 .grad，中间值需 retain_grad()</text>
</svg>
