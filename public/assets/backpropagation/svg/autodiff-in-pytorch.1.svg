<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-special-fill-fill-5f7896 { fill: #5f7896; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f8f7f4 { fill: #91908f; }
  .svg-special-fill-fill-ffffff { fill: #909090; }
  .svg-special-graphic-stroke-5f7896 { stroke: #5f7896; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-526b87 { fill: #526b87; }
  .svg-special-text-fill-5f7896 { fill: #5d7592; }
  .svg-special-text-fill-6d6862 { fill: #6d6862; }
  .svg-special-text-fill-a45e48 { fill: #a45e48; }

  .svg-special-background-fill-f8f7f4 { fill: #f8f7f4; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-special-fill-fill-5f7896 { fill: #5f7896; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f8f7f4 { fill: #91908f; }
    .svg-special-fill-fill-ffffff { fill: #909090; }
    .svg-special-graphic-stroke-5f7896 { stroke: #5f7896; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-526b87 { fill: #97a6b7; }
    .svg-special-text-fill-5f7896 { fill: #96a6b8; }
    .svg-special-text-fill-6d6862 { fill: #a7a4a0; }
    .svg-special-text-fill-a45e48 { fill: #c69b8d; }
    .svg-special-background-fill-f8f7f4 { fill: #353534; }



  }
</style>
  <title id="title">PyTorch 自动微分的标量计算图</title>
  <desc id="desc">前向从 x、w、b 经过 z 和 tanh 得到损失 L，反向从损失把梯度传回各输入。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="back-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z"  class="svg-special-fill-fill-5f7896"/>
    </marker>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f8f7f4 svg-special-background-fill-f8f7f4"/>
  <text x="40" y="34"  font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" class="svg-special-text-fill-312f2f">一次前向执行，得到一张可反向的图</text>
  <text x="40" y="60"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-6d6862">实际经过的运算被记录；反向沿相反方向传递上游敏感度</text>

  <text x="48" y="98"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-coral-text-fill">前向值</text>
  <line x1="120" y1="135" x2="681" y2="135"  stroke-width="2" stroke-dasharray="5 6" class="svg-special-graphic-stroke-c9c4bb"/>

  <circle cx="132" cy="135" r="35"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-coral-stroke-stroke"/>
  <text x="132" y="141" text-anchor="middle"  font-family="Georgia, serif" font-size="22" font-style="italic" class="svg-special-text-fill-312f2f">x</text>
  <text x="132" y="187" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6d6862">输入</text>

  <circle cx="300" cy="135" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-coral-stroke-stroke"/>
  <text x="300" y="132" text-anchor="middle"  font-family="Georgia, serif" font-size="19" font-style="italic" class="svg-special-text-fill-312f2f">z</text>
  <text x="300" y="153" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">wx + b</text>

  <circle cx="486" cy="135" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-coral-stroke-stroke"/>
  <text x="486" y="132" text-anchor="middle"  font-family="Georgia, serif" font-size="19" font-style="italic" class="svg-special-text-fill-312f2f">a</text>
  <text x="486" y="153" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">tanh(z)</text>

  <circle cx="668" cy="135" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-coral-stroke-stroke"/>
  <text x="668" y="132" text-anchor="middle"  font-family="Georgia, serif" font-size="19" font-style="italic" class="svg-special-text-fill-312f2f">L</text>
  <text x="668" y="153" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">平方损失</text>

  <line x1="169" y1="135" x2="253" y2="135"  stroke-width="2.5" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="343" y1="135" x2="439" y2="135"  stroke-width="2.5" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="529" y1="135" x2="621" y2="135"  stroke-width="2.5" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <text x="211" y="119" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-a45e48">仿射</text>
  <text x="391" y="119" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-a45e48">激活</text>
  <text x="575" y="119" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-a45e48">损失</text>

  <text x="48" y="245"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-5f7896">反向梯度</text>
  <line x1="120" y1="286" x2="681" y2="286"  stroke-width="2" stroke-dasharray="5 6" class="svg-special-graphic-stroke-c9c4bb"/>

  <line x1="621" y1="286" x2="529" y2="286"  stroke-width="2.5" marker-end="url(#back-arrow)" class="svg-special-graphic-stroke-5f7896"/>
  <line x1="439" y1="286" x2="343" y2="286"  stroke-width="2.5" marker-end="url(#back-arrow)" class="svg-special-graphic-stroke-5f7896"/>
  <line x1="253" y1="286" x2="169" y2="286"  stroke-width="2.5" marker-end="url(#back-arrow)" class="svg-special-graphic-stroke-5f7896"/>

  <circle cx="132" cy="286" r="35"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-special-graphic-stroke-5f7896"/>
  <text x="132" y="293" text-anchor="middle"  font-family="Georgia, serif" font-size="18" font-style="italic" class="svg-special-text-fill-312f2f">∂L/∂x</text>
  <circle cx="300" cy="286" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-special-graphic-stroke-5f7896"/>
  <text x="300" y="293" text-anchor="middle"  font-family="Georgia, serif" font-size="18" font-style="italic" class="svg-special-text-fill-312f2f">∂L/∂z</text>
  <circle cx="486" cy="286" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-special-graphic-stroke-5f7896"/>
  <text x="486" y="293" text-anchor="middle"  font-family="Georgia, serif" font-size="18" font-style="italic" class="svg-special-text-fill-312f2f">∂L/∂a</text>
  <circle cx="668" cy="286" r="43"   stroke-width="3" class="svg-special-fill-fill-ffffff svg-special-graphic-stroke-5f7896"/>
  <text x="668" y="293" text-anchor="middle"  font-family="Georgia, serif" font-size="18" font-style="italic" class="svg-special-text-fill-312f2f">1</text>

  <text x="211" y="270" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-526b87">乘以局部导数</text>
  <text x="391" y="270" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-526b87">乘以 1 − a²</text>
  <text x="575" y="270" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-526b87">损失根节点</text>

  <line x1="300" y1="178" x2="300" y2="241"  stroke-width="1.5" stroke-dasharray="3 4" class="svg-special-graphic-stroke-5f7896"/>
  <text x="300" y="216" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-526b87">δ = (a − y)(1 − a²)</text>

  <path d="M300 179 C270 215, 235 225, 196 248" fill="none"  stroke-width="1.5" stroke-dasharray="4 5" class="svg-axis-stroke"/>
  <text x="90" y="350"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6d6862">参数梯度：∂L/∂w = δx，∂L/∂b = δ</text>
  <text x="458" y="350"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6d6862">叶张量默认接收 .grad，中间值需 retain_grad()</text>
</svg>
