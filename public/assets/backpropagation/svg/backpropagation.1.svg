<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5d7775"/>
    </marker>
    <style>
      .ink { fill:#312f2f; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted { fill:#6c6a64; font-size:13px; }
      .box { fill:#f7f4f0; stroke:#b8b2a8; stroke-width:1.2; }
      .accent { fill:#f3e1d9; stroke:#cc785c; stroke-width:1.5; }
      .reverse-box { fill:#e3eeeb; stroke:#5d7775; stroke-width:1.5; }
      .line { fill:none; stroke:#cc785c; stroke-width:2; marker-end:url(#arrow); }
      .reverse-line { fill:none; stroke:#5d7775; stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none; stroke:#c9c4bb; stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373" fill="#f4f0ec"/>
  <text x="36" y="34" class="ink label">反向传播：前向保存值，反向累加敏感度</text>
  <text x="36" y="57" class="ink muted">同一张计算图上，先算节点值，再沿相反方向应用局部导数</text>

  <rect x="36" y="88" width="130" height="76" rx="10" class="box"/>
  <text x="101" y="117" text-anchor="middle" class="ink label">输入与参数</text>
  <text x="101" y="143" text-anchor="middle" class="ink small">x，w，b</text>

  <rect x="208" y="88" width="166" height="76" rx="10" class="accent"/>
  <text x="291" y="117" text-anchor="middle" class="ink label">仿射节点</text>
  <text x="291" y="143" text-anchor="middle" class="ink small">z = wx + b</text>

  <rect x="416" y="88" width="166" height="76" rx="10" class="accent"/>
  <text x="499" y="117" text-anchor="middle" class="ink label">激活节点</text>
  <text x="499" y="143" text-anchor="middle" class="ink small">a = φ(z)</text>

  <rect x="624" y="88" width="140" height="76" rx="10" class="box"/>
  <text x="694" y="117" text-anchor="middle" class="ink label">损失</text>
  <text x="694" y="143" text-anchor="middle" class="ink small">L(a，y)</text>

  <path d="M166 126 H202" class="line"/>
  <path d="M374 126 H410" class="line"/>
  <path d="M582 126 H618" class="line"/>
  <text x="400" y="78" text-anchor="middle" class="ink muted">前向：依赖方向</text>

  <path d="M694 174 V205 H499 V174" class="reverse-line"/>
  <path d="M499 174 V205 H291 V174" class="reverse-line"/>
  <path d="M291 174 V205 H101 V174" class="reverse-line"/>
  <text x="400" y="197" text-anchor="middle" class="ink muted">反向：局部导数 × 上游敏感度，汇合处相加</text>

  <rect x="36" y="234" width="130" height="76" rx="10" class="reverse-box"/>
  <text x="101" y="263" text-anchor="middle" class="ink label">参数梯度</text>
  <text x="101" y="289" text-anchor="middle" class="ink small">w̄，b̄，x̄</text>

  <rect x="208" y="234" width="166" height="76" rx="10" class="reverse-box"/>
  <text x="291" y="263" text-anchor="middle" class="ink label">反向仿射</text>
  <text x="291" y="289" text-anchor="middle" class="ink small">z̄ → w̄，b̄，x̄</text>

  <rect x="416" y="234" width="166" height="76" rx="10" class="reverse-box"/>
  <text x="499" y="263" text-anchor="middle" class="ink label">反向激活</text>
  <text x="499" y="289" text-anchor="middle" class="ink small">ā → z̄ = āφ′(z)</text>

  <rect x="624" y="234" width="140" height="76" rx="10" class="reverse-box"/>
  <text x="694" y="263" text-anchor="middle" class="ink label">初始化</text>
  <text x="694" y="289" text-anchor="middle" class="ink small">L̄ = 1</text>

  <path d="M624 272 H588" class="reverse-line"/>
  <path d="M416 272 H380" class="reverse-line"/>
  <path d="M208 272 H172" class="reverse-line"/>
  <path d="M36 329 H764" class="guide"/>
  <text x="400" y="353" text-anchor="middle" class="ink muted">反向传播产生梯度；学习率与参数更新属于优化器</text>
</svg>
