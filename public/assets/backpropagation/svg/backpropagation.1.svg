<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-5d7775 { fill: #5d7775; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
  .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
  .svg-special-fill-fill-f4f0ec { fill: #93908e; }
  .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
  .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e3eeeb { fill: #e3eeeb; }
  .svg-special-background-fill-f3e1d9 { fill: #f3e1d9; }
  .svg-special-background-fill-f4f0ec { fill: #f4f0ec; }
  .svg-special-background-fill-f7f4f0 { fill: #f7f4f0; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-5d7775 { fill: #5d7775; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e3eeeb { fill: #8c9291; }
    .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
    .svg-special-fill-fill-f4f0ec { fill: #93908e; }
    .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
    .svg-special-graphic-stroke-5d7775 { stroke: #5d7775; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e3eeeb { fill: #323333; }
    .svg-special-background-fill-f3e1d9 { fill: #343230; }
    .svg-special-background-fill-f4f0ec { fill: #343433; }
    .svg-special-background-fill-f7f4f0 { fill: #353434; }



  }
</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="reverse-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-5d7775"/>
    </marker>
    <style>
      .ink {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted {font-size:13px; }
      .box {stroke-width:1.2; }
      .accent {stroke-width:1.5; }
      .reverse-box {stroke-width:1.5; }
      .line { fill:none;  stroke-width:2; marker-end:url(#arrow); }
      .reverse-line { fill:none;  stroke-width:2; marker-end:url(#reverse-arrow); }
      .guide { fill:none;  stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f4f0ec svg-special-background-fill-f4f0ec"/>
  <text x="36" y="34" class="ink label svg-special-text-fill-312f2f">反向传播：前向保存值，反向累加敏感度</text>
  <text x="36" y="57" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">同一张计算图上，先算节点值，再沿相反方向应用局部导数</text>

  <rect x="36" y="88" width="130" height="76" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="101" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入与参数</text>
  <text x="101" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">x，w，b</text>

  <rect x="208" y="88" width="166" height="76" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="291" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">仿射节点</text>
  <text x="291" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">z = wx + b</text>

  <rect x="416" y="88" width="166" height="76" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="499" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">激活节点</text>
  <text x="499" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">a = φ(z)</text>

  <rect x="624" y="88" width="140" height="76" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="694" y="117" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">损失</text>
  <text x="694" y="143" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L(a，y)</text>

  <path d="M166 126 H202" class="line svg-coral-stroke-stroke"/>
  <path d="M374 126 H410" class="line svg-coral-stroke-stroke"/>
  <path d="M582 126 H618" class="line svg-coral-stroke-stroke"/>
  <text x="400" y="78" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">前向：依赖方向</text>

  <path d="M694 174 V205 H499 V174" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M499 174 V205 H291 V174" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M291 174 V205 H101 V174" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <text x="400" y="197" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">反向：局部导数 × 上游敏感度，汇合处相加</text>

  <rect x="36" y="234" width="130" height="76" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="101" y="263" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">参数梯度</text>
  <text x="101" y="289" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">w̄，b̄，x̄</text>

  <rect x="208" y="234" width="166" height="76" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="291" y="263" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">反向仿射</text>
  <text x="291" y="289" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">z̄ → w̄，b̄，x̄</text>

  <rect x="416" y="234" width="166" height="76" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="499" y="263" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">反向激活</text>
  <text x="499" y="289" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">ā → z̄ = āφ′(z)</text>

  <rect x="624" y="234" width="140" height="76" rx="10" class="reverse-box svg-special-fill-fill-e3eeeb svg-special-graphic-stroke-5d7775 svg-special-background-fill-e3eeeb"/>
  <text x="694" y="263" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">初始化</text>
  <text x="694" y="289" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L̄ = 1</text>

  <path d="M624 272 H588" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M416 272 H380" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M208 272 H172" class="reverse-line svg-special-graphic-stroke-5d7775"/>
  <path d="M36 329 H764" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="353" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">反向传播产生梯度；学习率与参数更新属于优化器</text>
</svg>
