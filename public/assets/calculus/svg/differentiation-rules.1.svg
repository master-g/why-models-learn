<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="rules-title rules-desc">
  <title id="rules-title">乘积和商法则的分解</title>
  <desc id="rules-desc">左侧把乘积的变化拆成两个路径，右侧把商的变化写成上导下减上导下并除以分母平方。</desc>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8" fill="#fffdfb" stroke="#d8d0c8"/>
  <line x1="280" y1="18" x2="280" y2="232" stroke="#e2dbd3"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" fill="#312f2f">
    <text x="22" y="28" font-size="15" font-weight="600">乘积：两条变化路径</text>
    <text x="300" y="28" font-size="15" font-weight="600">商：分母变化也要算</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="23" text-anchor="middle">
    <rect x="35" y="58" width="74" height="42" rx="6" fill="#f3eee8" stroke="#d8d0c8"/>
    <rect x="165" y="58" width="74" height="42" rx="6" fill="#f3eee8" stroke="#d8d0c8"/>
    <text x="72" y="86" fill="#312f2f">f</text>
    <text x="202" y="86" fill="#312f2f">g</text>
    <text x="137" y="87" fill="#6c6a64">×</text>
  </g>
  <g stroke="#b8b2a8" stroke-width="1.5" fill="none">
    <line x1="72" y1="101" x2="72" y2="136"/>
    <line x1="202" y1="101" x2="202" y2="136"/>
    <line x1="72" y1="136" x2="202" y2="136"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle">
    <rect x="35" y="151" width="88" height="42" rx="6" fill="#f8e7df" stroke="#cc785c"/>
    <rect x="157" y="151" width="88" height="42" rx="6" fill="#f3eee8" stroke="#d8d0c8"/>
    <text x="79" y="179" fill="#a9583e">f′g</text>
    <text x="201" y="179" fill="#312f2f">fg′</text>
    <text x="137" y="179" fill="#6c6a64">+</text>
  </g>
  <text x="46" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64">每个因素各导一次，另一个保留原值</text>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <rect x="323" y="58" width="190" height="42" rx="6" fill="#f3eee8" stroke="#d8d0c8"/>
    <text x="418" y="86" font-size="23" fill="#312f2f">f / g</text>
    <line x1="418" y1="102" x2="418" y2="135" stroke="#b8b2a8" stroke-width="1.5"/>
    <rect x="313" y="150" width="210" height="60" rx="6" fill="#f8e7df" stroke="#cc785c"/>
    <text x="418" y="174" font-size="18" fill="#a9583e">(f′g − fg′)</text>
    <line x1="352" y1="182" x2="484" y2="182" stroke="#a9583e" stroke-width="1.3"/>
    <text x="418" y="203" font-size="18" fill="#a9583e">g²</text>
  </g>
  <text x="335" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64">上导下减上导下，分母平方</text>
</svg>
