<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="chain-title chain-desc">
  <title id="chain-title">两层复合，两次局部放大</title>
  <desc id="chain-desc">输入 x 经过内层函数 g 和外层函数 f，导数沿路径相乘；右侧用 x 等于 2 的数字例子展示斜率 3 和 14 相乘得到 42。</desc>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8" fill="#fffdfb" stroke="#d8d0c8"/>
  <line x1="280" y1="18" x2="280" y2="232" stroke="#e2dbd3"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" fill="#312f2f">
    <text x="22" y="28" font-size="15" font-weight="600">沿一条路径传递变化率</text>
    <text x="300" y="28" font-size="15" font-weight="600">数字：每层斜率相乘</text>
  </g>

  <g stroke="#b8b2a8" stroke-width="1.5" fill="none">
    <line x1="80" y1="111" x2="137" y2="111"/>
    <line x1="222" y1="111" x2="250" y2="111"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle">
    <rect x="25" y="83" width="55" height="56" rx="7" fill="#f3eee8" stroke="#d8d0c8"/>
    <rect x="137" y="72" width="85" height="78" rx="7" fill="#f8e7df" stroke="#cc785c"/>
    <rect x="250" y="83" width="55" height="56" rx="7" fill="#f3eee8" stroke="#d8d0c8"/>
    <text x="52" y="118" fill="#312f2f">x</text>
    <text x="179" y="106" fill="#a9583e">u=g(x)</text>
    <text x="179" y="130" font-size="15" fill="#a9583e">内层</text>
    <text x="277" y="118" fill="#312f2f">y=f(u)</text>
  </g>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">
    <text x="108" y="99" fill="#6c6a64">g′(x)</text>
    <text x="236" y="99" fill="#6c6a64">f′(u)</text>
    <text x="141" y="180" fill="#6c6a64">先变成 u，再变成 y</text>
  </g>
  <text x="42" y="217" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#a9583e">y′ = f′(u) · g′(x)</text>

  <g stroke="#b8b2a8" stroke-width="1.5" fill="none">
    <line x1="319" y1="111" x2="374" y2="111"/>
    <line x1="459" y1="111" x2="514" y2="111"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <rect x="294" y="77" width="74" height="68" rx="7" fill="#f3eee8" stroke="#d8d0c8"/>
    <rect x="374" y="66" width="85" height="90" rx="7" fill="#f8e7df" stroke="#cc785c"/>
    <rect x="514" y="77" width="28" height="68" rx="7" fill="#f3eee8" stroke="#d8d0c8"/>
    <text x="331" y="108" fill="#312f2f">x=2</text>
    <text x="331" y="130" font-size="14" fill="#6c6a64">斜率 3</text>
    <text x="416" y="99" fill="#a9583e">u=3x+1</text>
    <text x="416" y="123" fill="#a9583e">u=7</text>
    <text x="416" y="145" font-size="14" fill="#a9583e">斜率 14</text>
    <text x="528" y="117" font-size="17" fill="#312f2f">y</text>
  </g>
  <text x="304" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#312f2f">y=(3x+1)²</text>
  <text x="304" y="211" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#a9583e">y′(2)=14×3=42</text>
</svg>
