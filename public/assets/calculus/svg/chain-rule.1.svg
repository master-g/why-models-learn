<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="chain-title chain-desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-f3eee8 { fill: #94908d; }
  .svg-special-fill-fill-f8e7df { fill: #998e8a; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f3eee8 { fill: #f3eee8; }
  .svg-special-background-fill-f8e7df { fill: #f8e7df; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-f3eee8 { fill: #94908d; }
    .svg-special-fill-fill-f8e7df { fill: #998e8a; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f3eee8 { fill: #343333; }
    .svg-special-background-fill-f8e7df { fill: #353231; }
    .svg-special-background-fill-fffdfb { fill: #363535; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <title id="chain-title">两层复合，两次局部放大</title>
  <desc id="chain-desc">输入 x 经过内层函数 g 和外层函数 f，导数沿路径相乘；右侧用 x 等于 2 的数字例子展示斜率 3 和 14 相乘得到 42。</desc>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="280" y1="18" x2="280" y2="232"  class="svg-special-graphic-stroke-e2dbd3"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="22" y="28" font-size="15" font-weight="600">沿一条路径传递变化率</text>
    <text x="300" y="28" font-size="15" font-weight="600">数字：每层斜率相乘</text>
  </g>

  <g  stroke-width="1.5" fill="none" class="svg-axis-stroke">
    <line x1="80" y1="111" x2="137" y2="111"/>
    <line x1="222" y1="111" x2="250" y2="111"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle">
    <rect x="25" y="83" width="55" height="56" rx="7"   class="svg-special-fill-fill-f3eee8 svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-f3eee8"/>
    <rect x="137" y="72" width="85" height="78" rx="7"   class="svg-special-fill-fill-f8e7df svg-coral-stroke-stroke svg-special-background-fill-f8e7df"/>
    <rect x="250" y="83" width="55" height="56" rx="7"   class="svg-special-fill-fill-f3eee8 svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-f3eee8"/>
    <text x="52" y="118"  class="svg-special-text-fill-312f2f">x</text>
    <text x="179" y="106"  class="svg-coral-text-fill">u=g(x)</text>
    <text x="179" y="130" font-size="15"  class="svg-coral-text-fill">内层</text>
    <text x="277" y="118"  class="svg-special-text-fill-312f2f">y=f(u)</text>
  </g>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">
    <text x="108" y="99"  class="svg-muted-fill">g′(x)</text>
    <text x="236" y="99"  class="svg-muted-fill">f′(u)</text>
    <text x="141" y="180"  class="svg-muted-fill">先变成 u，再变成 y</text>
  </g>
  <text x="42" y="217" font-family="Georgia, 'Times New Roman', serif" font-size="17"  class="svg-coral-text-fill">y′ = f′(u) · g′(x)</text>

  <g  stroke-width="1.5" fill="none" class="svg-axis-stroke">
    <line x1="319" y1="111" x2="374" y2="111"/>
    <line x1="459" y1="111" x2="514" y2="111"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle">
    <rect x="294" y="77" width="74" height="68" rx="7"   class="svg-special-fill-fill-f3eee8 svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-f3eee8"/>
    <rect x="374" y="66" width="85" height="90" rx="7"   class="svg-special-fill-fill-f8e7df svg-coral-stroke-stroke svg-special-background-fill-f8e7df"/>
    <rect x="514" y="77" width="28" height="68" rx="7"   class="svg-special-fill-fill-f3eee8 svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-f3eee8"/>
    <text x="331" y="108"  class="svg-special-text-fill-312f2f">x=2</text>
    <text x="331" y="130" font-size="14"  class="svg-muted-fill">斜率 3</text>
    <text x="416" y="99"  class="svg-coral-text-fill">u=3x+1</text>
    <text x="416" y="123"  class="svg-coral-text-fill">u=7</text>
    <text x="416" y="145" font-size="14"  class="svg-coral-text-fill">斜率 14</text>
    <text x="528" y="117" font-size="17"  class="svg-special-text-fill-312f2f">y</text>
  </g>
  <text x="304" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="16"  class="svg-special-text-fill-312f2f">y=(3x+1)²</text>
  <text x="304" y="211" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-coral-text-fill">y′(2)=14×3=42</text>
</svg>
