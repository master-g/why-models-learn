<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="total-title total-desc">
  <title id="total-title">全导数把输入位移映射为局部输出变化</title>
  <desc id="total-desc">左侧输入空间中的位移向量经过全导数这个线性映射，变成右侧输出轴上的一阶变化。</desc>
  <defs>
    <marker id="total-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc785c"/>
    </marker>
    <marker id="total-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#312f2f"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; fill: #312f2f; font-size: 13px; }
      .small { font-size: 11px; }
      .title { font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8" fill="#fffdfb" stroke="#d8d0c8"/>
  <line x1="280" y1="34" x2="280" y2="218" stroke="#e2dbd3"/>
  <text x="24" y="29" class="label title">输入空间中的小位移</text>
  <text x="303" y="29" class="label title">输出的一阶变化</text>

  <g stroke="#b8b2a8" stroke-width="1.3" fill="none">
    <line x1="42" y1="190" x2="245" y2="190" marker-end="url(#total-arrow-ink)"/>
    <line x1="64" y1="211" x2="64" y2="55" marker-end="url(#total-arrow-ink)"/>
    <line x1="333" y1="190" x2="520" y2="190" marker-end="url(#total-arrow-ink)"/>
    <line x1="355" y1="211" x2="355" y2="55" marker-end="url(#total-arrow-ink)"/>
  </g>
  <text x="249" y="194" class="label small">x</text>
  <text x="54" y="52" class="label small">y</text>
  <text x="523" y="194" class="label small">输入位移</text>
  <text x="345" y="52" class="label small">输出</text>

  <circle cx="145" cy="145" r="5" fill="#312f2f"/>
  <text x="130" y="164" class="label">a</text>
  <circle cx="216" cy="91" r="5" fill="#cc785c"/>
  <text x="220" y="86" class="label">a+h</text>
  <line x1="149" y1="141" x2="211" y2="95" stroke="#cc785c" stroke-width="3" marker-end="url(#total-arrow-coral)"/>
  <text x="150" y="111" class="label small">h=(Δx,Δy)</text>

  <line x1="237" y1="128" x2="322" y2="128" stroke="#cc785c" stroke-width="2.5" marker-end="url(#total-arrow-coral)"/>
  <text x="242" y="116" class="label">Df(a)</text>

  <line x1="355" y1="190" x2="486" y2="190" stroke="#c9c4bb" stroke-width="2"/>
  <line x1="355" y1="190" x2="355" y2="190" stroke="#cc785c" stroke-width="3"/>
  <line x1="355" y1="190" x2="438" y2="94" stroke="#cc785c" stroke-width="3" marker-end="url(#total-arrow-coral)"/>
  <circle cx="438" cy="94" r="4.5" fill="#cc785c"/>
  <text x="397" y="84" class="label">Df(a)[h]</text>
  <text x="382" y="211" class="label small">线性预测 Δf</text>
  <path d="M355 190 C382 176 400 118 438 94" fill="none" stroke="#6c6a64" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="446" y="105" class="label small">真实变化</text>
</svg>
