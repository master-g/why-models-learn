<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="taylor-title taylor-desc">
  <title id="taylor-title">Taylor 多项式的阶数增加后逐渐贴近原函数曲线</title>
  <desc id="taylor-desc">以 e 的 x 次方为例，常数项、一次近似和二次近似逐步贴近原曲线。</desc>
  <defs>
    <marker id="taylor-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#312f2f"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; fill: #312f2f; font-size: 13px; }
      .small { font-size: 11px; }
      .title { font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8" fill="#fffdfb" stroke="#d8d0c8"/>
  <text x="22" y="28" class="label title">eˣ 在 0 附近的 Taylor 近似</text>
  <line x1="48" y1="190" x2="516" y2="190" stroke="#b8b2a8" stroke-width="1.3" marker-end="url(#taylor-arrow-ink)"/>
  <line x1="238" y1="220" x2="238" y2="38" stroke="#b8b2a8" stroke-width="1.3" marker-end="url(#taylor-arrow-ink)"/>
  <text x="520" y="194" class="label small">x</text>
  <text x="228" y="36" class="label small">y</text>
  <circle cx="238" cy="155" r="4" fill="#312f2f"/>
  <text x="246" y="170" class="label small">a=0</text>

  <path d="M78 177 C128 172 177 163 238 155 C294 145 344 127 390 103 C431 81 468 55 503 29" fill="none" stroke="#cc785c" stroke-width="3"/>
  <path d="M78 177 L503 35" fill="none" stroke="#6c6a64" stroke-width="1.8" stroke-dasharray="7 5"/>
  <path d="M78 181 C135 174 189 164 238 155 C291 146 341 132 390 112 C433 94 468 70 503 47" fill="none" stroke="#312f2f" stroke-width="2"/>

  <text x="422" y="62" class="label">f(x)=eˣ</text>
  <text x="439" y="104" class="label small">T₂</text>
  <text x="446" y="137" class="label small">T₁</text>
  <line x1="390" y1="103" x2="390" y2="112" stroke="#cc785c" stroke-width="1.5"/>
  <text x="397" y="111" class="label small">余项</text>
  <text x="80" y="214" class="label small">T₀=f(0)=1</text>
  <text x="80" y="231" class="label small">T₁=1+x，T₂=1+x+x²/2</text>
</svg>
