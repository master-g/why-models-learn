<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="matrix-calc-title matrix-calc-desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f0ebe6 { fill: #94908d; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f0ebe6 { fill: #f0ebe6; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f0ebe6 { fill: #94908d; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f0ebe6 { fill: #343332; }
    .svg-special-background-fill-fffdfb { fill: #363535; }



  }
</style>
  <title id="matrix-calc-title">矩阵微分从表达式到梯度</title>
  <desc id="matrix-calc-desc">先把标量表达式写成微分，再按迹和 Frobenius 内积整理成矩阵梯度；残差平方的梯度沿矩阵转置方向回传。</desc>
  <defs>
    <marker id="matrix-calc-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="matrix-calc-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;  font-size: 13px; }
      .small { font-size: 11px; }
      .title { font-size: 15px; font-weight: 600; }
      .box {}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="20" y1="122" x2="540" y2="122"  class="svg-special-graphic-stroke-d8d0c8"/>

  <text x="22" y="25" class="label title svg-special-text-fill-312f2f">从标量表达式整理到矩阵梯度</text>
  <rect x="28" y="48" width="126" height="42" rx="6" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="63" y="74" class="label svg-special-text-fill-312f2f">f(X)</text>
  <rect x="214" y="48" width="126" height="42" rx="6" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="249" y="74" class="label svg-special-text-fill-312f2f">df</text>
  <rect x="400" y="48" width="126" height="42" rx="6" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="423" y="74" class="label svg-special-text-fill-312f2f">∇ₓf</text>
  <line x1="158" y1="69" x2="208" y2="69"  stroke-width="2" marker-end="url(#matrix-calc-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="344" y1="69" x2="394" y2="69"  stroke-width="2" marker-end="url(#matrix-calc-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <text x="57" y="108" class="label small svg-special-text-fill-312f2f">含迹、乘积、逆矩阵</text>
  <text x="226" y="108" class="label small svg-special-text-fill-312f2f">tr(Gᵀ dX)</text>
  <text x="404" y="108" class="label small svg-special-text-fill-312f2f">读出 G</text>

  <text x="22" y="148" class="label title svg-special-text-fill-312f2f">残差平方的局部路径</text>
  <rect x="28" y="174" width="112" height="34" rx="5" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="68" y="196" class="label svg-special-text-fill-312f2f">X</text>
  <rect x="208" y="174" width="126" height="34" rx="5" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="242" y="196" class="label svg-special-text-fill-312f2f">R = AX − B</text>
  <rect x="402" y="174" width="124" height="34" rx="5" class="box svg-special-fill-fill-f0ebe6 svg-axis-stroke svg-special-background-fill-f0ebe6"/>
  <text x="420" y="196" class="label svg-special-text-fill-312f2f">½‖R‖²F</text>
  <line x1="146" y1="191" x2="202" y2="191"  stroke-width="2" marker-end="url(#matrix-calc-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="340" y1="191" x2="396" y2="191"  stroke-width="2" marker-end="url(#matrix-calc-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="396" y1="220" x2="340" y2="220"  stroke-width="2" marker-end="url(#matrix-calc-arrow-ink)" class="svg-ink-stroke"/>
  <line x1="202" y1="220" x2="146" y2="220"  stroke-width="2" marker-end="url(#matrix-calc-arrow-ink)" class="svg-ink-stroke"/>
  <text x="407" y="235" class="label small svg-special-text-fill-312f2f">G_R = R</text>
  <text x="204" y="235" class="label small svg-special-text-fill-312f2f">G_X = AᵀR</text>
</svg>
