<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">贪心解码：每一步选择当前最高分 token</title>
  <desc id="desc">logits 经过约束和 tie-breaking 后用 argmax 选择一个 token；下方对比第一步选择 A 的贪心路径与累计概率更高的 B 路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted { fill: #6f6a64; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .box { fill: #f7f4ef; stroke: #8e8880; stroke-width: 1.5; }
      .accent { fill: #f2e2d9; stroke: #cc785c; stroke-width: 1.5; }
      .line { fill: none; stroke: #cc785c; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #b8b2a8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="32" y="30" class="ink" font-size="19" font-weight="600">贪心解码：每一步选择当前最高分 token</text>

  <rect x="32" y="54" width="154" height="66" rx="8" class="box"/>
  <text x="109" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="600">logits zₜ</text>
  <text x="109" y="102" text-anchor="middle" class="muted" font-size="13">词表上的分数</text>

  <path d="M186 87 H222" class="line"/>
  <rect x="222" y="54" width="154" height="66" rx="8" class="box"/>
  <text x="299" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="600">F(·)</text>
  <text x="299" y="102" text-anchor="middle" class="muted" font-size="13">mask / penalty</text>

  <path d="M376 87 H412" class="line"/>
  <rect x="412" y="54" width="154" height="66" rx="8" class="accent"/>
  <text x="489" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="600">argmax</text>
  <text x="489" y="102" text-anchor="middle" class="muted" font-size="13">固定 tie-breaking</text>

  <path d="M566 87 H602" class="line"/>
  <rect x="602" y="54" width="166" height="66" rx="8" class="box"/>
  <text x="685" y="80" text-anchor="middle" class="ink" font-size="16" font-weight="600">token yₜ</text>
  <text x="685" y="102" text-anchor="middle" class="muted" font-size="13">追加到下一步</text>

  <line x1="32" y1="144" x2="768" y2="144" stroke="#d2cdc5" stroke-width="1"/>

  <text x="32" y="174" class="ink" font-size="16" font-weight="600">局部选择与累计概率</text>
  <text x="32" y="196" class="muted" font-size="13">第一步概率更高的分支不一定拥有更高的完整序列概率</text>

  <circle cx="82" cy="249" r="24" fill="#f7f4ef" stroke="#8e8880" stroke-width="1.5"/>
  <text x="82" y="255" text-anchor="middle" class="ink" font-size="15">开始</text>

  <path d="M106 239 C126 222 132 215 153 215" class="line"/>
  <path d="M106 259 C126 276 132 283 153 283" class="dashed"/>

  <rect x="153" y="195" width="128" height="42" rx="7" class="accent"/>
  <text x="217" y="213" text-anchor="middle" class="ink" font-size="14" font-weight="600">A：0.60</text>
  <text x="217" y="229" text-anchor="middle" class="muted" font-size="11">greedy 选择</text>

  <rect x="153" y="263" width="128" height="42" rx="7" class="box"/>
  <text x="217" y="281" text-anchor="middle" class="ink" font-size="14" font-weight="600">B：0.40</text>
  <text x="217" y="297" text-anchor="middle" class="muted" font-size="11">未保留分支</text>

  <path d="M281 216 H320" class="line"/>
  <path d="M281 284 H320" class="dashed"/>

  <rect x="320" y="195" width="150" height="42" rx="7" class="box"/>
  <text x="395" y="213" text-anchor="middle" class="ink" font-size="14">下一步：0.50</text>
  <text x="395" y="229" text-anchor="middle" class="muted" font-size="11">累计 0.60×0.50=0.30</text>

  <rect x="320" y="263" width="150" height="42" rx="7" class="accent"/>
  <text x="395" y="281" text-anchor="middle" class="ink" font-size="14">下一步：0.90</text>
  <text x="395" y="297" text-anchor="middle" class="muted" font-size="11">累计 0.40×0.90=0.36</text>

  <path d="M470 216 H504" class="dashed"/>
  <path d="M470 284 H504" class="line"/>
  <rect x="504" y="203" width="264" height="94" rx="8" fill="#eeeae4" stroke="#b8b2a8"/>
  <text x="636" y="229" text-anchor="middle" class="ink" font-size="15" font-weight="600">贪心只保留 A</text>
  <text x="636" y="253" text-anchor="middle" class="muted" font-size="13">局部 argmax ≠ 全局序列最优</text>
  <text x="636" y="278" text-anchor="middle" class="ink" font-size="14">B 路径的累计概率更高：0.36</text>

  <rect x="32" y="326" width="736" height="30" rx="7" fill="#eeeae4" stroke="#b8b2a8"/>
  <text x="400" y="346" text-anchor="middle" class="ink" font-size="14">yₜ = argmaxᵥ zₜ(v)；固定协议后不需要随机数，但仍受 logits、tie-breaking 和停止条件影响</text>
</svg>
