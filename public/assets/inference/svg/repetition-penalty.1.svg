<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">重复惩罚：用历史 token 调整下一步分数</title>
  <desc id="desc">历史中的 token 0 和 token 2 经过正负 logit 分段规则调整，最高分从 token 0 变为 token 1。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted { fill: #6f6a64; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .old0 { fill: #b8b2a8; }
      .old1 { fill: #8e8880; }
      .old2 { fill: #d9a08d; }
      .old3 { fill: #e6c7ba; }
      .new0 { fill: #d9a08d; }
      .new1 { fill: #cc785c; }
      .new2 { fill: #e6c7ba; }
      .new3 { fill: #e9ded7; }
      .axis { stroke: #b8b2a8; stroke-width: 1.2; }
      .box { fill: #f7f4ef; stroke: #8e8880; stroke-width: 1.5; }
      .accent { fill: #f2e2d9; stroke: #cc785c; stroke-width: 1.5; }
      .arrow { stroke: #cc785c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="32" y="30" class="ink" font-size="19" font-weight="600">重复惩罚：用历史 token 调整下一步分数</text>
  <text x="32" y="55" class="muted" font-size="13">历史集合 H = {token 0, token 2}，惩罚系数 r = 2</text>

  <rect x="32" y="72" width="226" height="138" rx="8" class="box"/>
  <text x="145" y="94" text-anchor="middle" class="ink" font-size="15" font-weight="600">处理前 logits</text>
  <line x1="57" y1="181" x2="231" y2="181" class="axis"/>
  <line x1="57" y1="124" x2="231" y2="124" stroke="#d2cdc5" stroke-dasharray="3 3"/>
  <text x="57" y="118" class="muted" font-size="10">0</text>
  <rect x="70" y="99" width="29" height="82" class="old0"/>
  <rect x="112" y="126" width="29" height="55" class="old1"/>
  <rect x="154" y="181" width="29" height="14" class="old2"/>
  <rect x="196" y="181" width="29" height="34" class="old3"/>
  <text x="84" y="205" text-anchor="middle" class="muted" font-size="11">0 · +3</text>
  <text x="126" y="205" text-anchor="middle" class="muted" font-size="11">1 · +2</text>
  <text x="168" y="205" text-anchor="middle" class="muted" font-size="11">2 · −0.5</text>
  <text x="210" y="205" text-anchor="middle" class="muted" font-size="11">3 · −1.5</text>

  <path d="M270 140 L304 140" class="arrow"/>
  <text x="287" y="124" text-anchor="middle" class="muted" font-size="11">按符号</text>
  <text x="287" y="174" text-anchor="middle" class="muted" font-size="11">除或乘</text>

  <rect x="332" y="72" width="214" height="138" rx="8" class="accent"/>
  <text x="439" y="94" text-anchor="middle" class="ink" font-size="15" font-weight="600">历史 token 分段处理</text>
  <text x="439" y="123" text-anchor="middle" class="ink" font-size="13">正分数 ÷ r；负分数 × r</text>
  <text x="439" y="151" text-anchor="middle" class="muted" font-size="12">token 0、2 命中 H</text>
  <text x="439" y="178" text-anchor="middle" class="muted" font-size="12">token 1、3 保持原分数</text>

  <path d="M558 140 L592 140" class="arrow"/>
  <text x="575" y="124" text-anchor="middle" class="muted" font-size="11">重新排序</text>

  <rect x="620" y="72" width="148" height="138" rx="8" class="box"/>
  <text x="694" y="94" text-anchor="middle" class="ink" font-size="15" font-weight="600">处理后 logits</text>
  <line x1="639" y1="181" x2="749" y2="181" class="axis"/>
  <line x1="639" y1="137" x2="749" y2="137" stroke="#d2cdc5" stroke-dasharray="3 3"/>
  <rect x="648" y="148" width="20" height="33" class="new0"/>
  <rect x="679" y="137" width="20" height="44" class="new1"/>
  <rect x="710" y="181" width="20" height="15" class="new2"/>
  <text x="658" y="207" text-anchor="middle" class="muted" font-size="10">0 · 1.5</text>
  <text x="689" y="207" text-anchor="middle" class="muted" font-size="10">1 · 2</text>
  <text x="720" y="207" text-anchor="middle" class="muted" font-size="10">2 · −1</text>
  <text x="694" y="226" text-anchor="middle" class="ink" font-size="12">最高分 → token 1</text>

  <line x1="32" y1="242" x2="768" y2="242" stroke="#d2cdc5" stroke-width="1"/>
  <text x="32" y="270" class="ink" font-size="16" font-weight="600">只修改历史 token，之后再进入 softmax 与候选过滤</text>
  <rect x="32" y="292" width="224" height="38" rx="6" fill="#f2e2d9" stroke="#cc785c"/>
  <text x="144" y="316" text-anchor="middle" class="ink" font-size="13">token 0：+3 → +1.5</text>
  <rect x="288" y="292" width="224" height="38" rx="6" fill="#f7f4ef" stroke="#8e8880"/>
  <text x="400" y="316" text-anchor="middle" class="ink" font-size="13">token 1：+2 → +2</text>
  <rect x="544" y="292" width="224" height="38" rx="6" fill="#f2e2d9" stroke="#cc785c"/>
  <text x="656" y="316" text-anchor="middle" class="ink" font-size="13">token 2：−0.5 → −1</text>
  <text x="400" y="357" text-anchor="middle" class="muted" font-size="13">r = 2；正历史分数除以 r，负历史分数乘以 r，未出现 token 不变</text>
</svg>
