  .svg-special-background-fill-f2e2d9 { fill: #f2e2d9; }
  .svg-special-background-fill-f7f4ef { fill: #f7f4ef; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
