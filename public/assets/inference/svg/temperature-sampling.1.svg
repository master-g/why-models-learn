  <title id="title">温度采样：用温度改变下一 token 的随机分布</title>
  <desc id="desc">同一组 logits 在低温、中温和高温下产生不同概率柱形，底部用随机数 u 落入累计分布区间选择 token。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .bar0 {}
      .bar1 {}
      .bar2 {}
      .axis {stroke-width: 1.2; }
      .box {stroke-width: 1.5; }
      .accent {stroke-width: 1.5; }
    </style>
  </defs>

  <text x="32" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">温度采样：用温度改变下一 token 的随机分布</text>
  <text x="32" y="55" class="muted svg-special-text-fill-6f6a64" font-size="13">同一组 logits：z = (2, 1, 0)</text>

  <rect x="32" y="72" width="226" height="126" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="145" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">低温 T = 0.5</text>
  <line x1="58" y1="174" x2="232" y2="174" class="axis svg-axis-stroke"/>
  <rect x="74" y="108" width="32" height="66" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="128" y="165" width="32" height="9" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="182" y="172" width="32" height="2" class="bar2 svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="90" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.867</text>
  <text x="144" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.117</text>
  <text x="198" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.016</text>

  <rect x="287" y="72" width="226" height="126" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="400" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">中温 T = 1.0</text>
  <line x1="313" y1="174" x2="487" y2="174" class="axis svg-axis-stroke"/>
  <rect x="329" y="123" width="32" height="51" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="383" y="155" width="32" height="19" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="437" y="167" width="32" height="7" class="bar2 svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="345" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.665</text>
  <text x="399" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.245</text>
  <text x="453" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.090</text>

  <rect x="542" y="72" width="226" height="126" rx="8" class="accent svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="655" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">高温 T = 2.0</text>
  <line x1="568" y1="174" x2="742" y2="174" class="axis svg-axis-stroke"/>
  <rect x="584" y="135" width="32" height="39" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="638" y="151" width="32" height="23" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="692" y="160" width="32" height="14" class="bar2 svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="600" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.506</text>
  <text x="654" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.307</text>
  <text x="708" y="190" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.186</text>

  <line x1="32" y1="216" x2="768" y2="216"  stroke-width="1" class="svg-special-graphic-stroke-d2cdc5"/>
  <text x="32" y="244" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">CDF 把随机数映射到 token</text>
  <text x="32" y="267" class="muted svg-special-text-fill-6f6a64" font-size="13">p = (0.50, 0.30, 0.20)，u = 0.73 → token 1</text>

  <rect x="32" y="282" width="544" height="36" rx="6"   class="svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <rect x="32" y="282" width="272" height="36" rx="6"  class="svg-special-fill-fill-cc785c"/>
  <rect x="304" y="282" width="163" height="36"  class="svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="467" y="282" width="109" height="36" rx="0"  class="svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="168" y="305" text-anchor="middle"  font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" class="svg-special-text-fill-fffaf6">token 0 · 0 ≤ u &lt; 0.50</text>
  <text x="385" y="305" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">token 1 · 0.50–0.80</text>
  <text x="522" y="305" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">token 2</text>
  <line x1="428" y1="272" x2="428" y2="282"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <path d="M422 272 L428 264 L434 272"  class="svg-special-fill-fill-cc785c"/>
  <text x="428" y="338" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="14">u = 0.73 落入第二个区间，选择 token 1</text>
</svg>
