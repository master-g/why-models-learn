<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-eeeae4 { fill: #93908d; }
  .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
  .svg-special-fill-fill-f7f4ef { fill: #92908e; }
  .svg-special-fill-fill-fffaf6 { fill: #93908e; }
  .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6f6a64 { fill: #6f6a64; }

  .svg-special-background-fill-eeeae4 { fill: #eeeae4; }
  .svg-special-background-fill-f2e2d9 { fill: #f2e2d9; }
  .svg-special-background-fill-f7f4ef { fill: #f7f4ef; }
  .svg-special-background-fill-fffaf6 { fill: #fffaf6; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-eeeae4 { fill: #93908d; }
    .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
    .svg-special-fill-fill-f7f4ef { fill: #92908e; }
    .svg-special-fill-fill-fffaf6 { fill: #93908e; }
    .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6f6a64 { fill: #a7a4a0; }
    .svg-special-background-fill-eeeae4 { fill: #333332; }
    .svg-special-background-fill-f2e2d9 { fill: #343230; }
    .svg-special-background-fill-f7f4ef { fill: #353434; }
    .svg-special-background-fill-fffaf6 { fill: #363535; }



  }
</style>
  <title id="title">KV cache：用历史 K/V 换取增量解码</title>
  <desc id="desc">Prefill 将 prompt 的 K/V 写入每层缓存，decode 的新 query 读取历史 K/V 并追加新位置；下方给出 cache 字节数和 GQA 关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .box {stroke-width: 1.5; }
      .cache {stroke-width: 1.5; }
      .line { fill: none;  stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none;  stroke-width: 1.2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="32" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">KV cache：用历史 K/V 换取增量解码</text>

  <rect x="32" y="58" width="160" height="72" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="112" y="83" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">Prompt</text>
  <text x="112" y="106" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">P 个 token</text>

  <path d="M192 94 H228" class="line svg-coral-stroke-stroke"/>
  <rect x="228" y="58" width="140" height="72" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="298" y="83" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">Prefill</text>
  <text x="298" y="106" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">计算 K / V</text>

  <path d="M368 94 H404" class="line svg-coral-stroke-stroke"/>
  <rect x="404" y="48" width="176" height="92" rx="8" class="cache svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="492" y="73" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">每层 KV cache</text>
  <rect x="427" y="86" width="57" height="28" rx="4"   class="svg-special-fill-fill-fffaf6 svg-coral-stroke-stroke svg-special-background-fill-fffaf6"/>
  <rect x="492" y="86" width="57" height="28" rx="4"   class="svg-special-fill-fill-fffaf6 svg-coral-stroke-stroke svg-special-background-fill-fffaf6"/>
  <text x="455" y="105" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">K₀…Kₗ₋₁</text>
  <text x="520" y="105" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">V₀…Vₗ₋₁</text>
  <text x="492" y="130" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">按位置追加</text>

  <path d="M580 94 H616" class="line svg-coral-stroke-stroke"/>
  <rect x="616" y="58" width="152" height="72" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="692" y="83" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">Decode</text>
  <text x="692" y="106" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">每步 1 个 token</text>

  <path d="M692 130 V176 H492 V202" class="line svg-coral-stroke-stroke"/>
  <rect x="32" y="202" width="160" height="72" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="112" y="227" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">新 Query</text>
  <text x="112" y="250" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">Qₜ，当前位置</text>

  <path d="M192 238 H228" class="line svg-coral-stroke-stroke"/>
  <rect x="228" y="202" width="220" height="72" rx="8" class="cache svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="338" y="227" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">读取历史 K / V</text>
  <text x="338" y="250" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">score → weight → context</text>

  <path d="M448 238 H484" class="line svg-coral-stroke-stroke"/>
  <rect x="484" y="202" width="148" height="72" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="558" y="227" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">输出 logits</text>
  <text x="558" y="250" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">选择下一个 token</text>

  <path d="M484 202 V176 H548 V140" class="dash svg-axis-stroke"/>
  <path d="M632 238 H700 V176 H548 V140" class="line svg-coral-stroke-stroke"/>
  <text x="700" y="263" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">Kₜ / Vₜ 追加到位置 L</text>

  <rect x="32" y="310" width="736" height="42" rx="8"   class="svg-special-fill-fill-eeeae4 svg-axis-stroke svg-special-background-fill-eeeae4"/>
  <text x="50" y="336" class="ink svg-special-text-fill-312f2f" font-size="14">cache bytes = 2 × layers × batch × length × hₖᵥ × dₕ × bytes；GQA/MQA 减少 hₖᵥ，保留 hq 个 query head</text>
</svg>
