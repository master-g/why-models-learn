<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-d9a08d { fill: #b58676; }
  .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
  .svg-special-fill-fill-f7f4ef { fill: #92908e; }
  .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
  .svg-special-graphic-stroke-d2cdc5 { stroke: #94908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6f6a64 { fill: #6f6a64; }
  .svg-special-text-fill-fffaf6 { fill: #757271; }

  .svg-special-background-fill-d9a08d { fill: #d9a08d; }
  .svg-special-background-fill-f2e2d9 { fill: #f2e2d9; }
  .svg-special-background-fill-f7f4ef { fill: #f7f4ef; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-d9a08d { fill: #b58676; }
    .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
    .svg-special-fill-fill-f7f4ef { fill: #92908e; }
    .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
    .svg-special-graphic-stroke-d2cdc5 { stroke: #94908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6f6a64 { fill: #a7a4a0; }
    .svg-special-text-fill-fffaf6 { fill: #a5a4a3; }
    .svg-special-background-fill-d9a08d { fill: #302826; }
    .svg-special-background-fill-f2e2d9 { fill: #343230; }
    .svg-special-background-fill-f7f4ef { fill: #353434; }



  }
</style>
  <title id="title">推理数学：prefill、decode 和 KV cache</title>
  <desc id="desc">Prefill 处理完整 token 序列，decode 处理一个新 token 并读取历史 KV cache，底部汇总长度、计算和内存项。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .prefill {}
      .decode {}
      .cache {}
      .axis {stroke-width: 1.2; }
      .box {stroke-width: 1.5; }
      .accent {stroke-width: 1.5; }
      .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="32" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">推理数学：prefill、decode 和 KV cache</text>
  <text x="32" y="55" class="muted svg-special-text-fill-6f6a64" font-size="13">同一请求：prefill 处理完整 prompt，decode 每次处理一个新 token</text>

  <rect x="32" y="76" width="330" height="128" rx="8" class="accent svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="197" y="99" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Prefill</text>
  <text x="197" y="124" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">T 个 query × T 个历史 key</text>
  <rect x="57" y="146" width="258" height="28" rx="5" class="prefill svg-special-fill-fill-cc785c"/>
  <text x="186" y="165" text-anchor="middle"  font-size="12" class="svg-special-text-fill-fffaf6">attention 交互：2 B T² D</text>
  <text x="197" y="192" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">同时生成 Q、K、V 和 prompt cache</text>

  <path d="M382 140 L414 140" class="arrow svg-coral-stroke-stroke"/>
  <text x="398" y="124" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">追加</text>

  <rect x="434" y="76" width="334" height="128" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="601" y="99" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Decode</text>
  <text x="601" y="124" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">1 个新 query × P 个历史 key</text>
  <rect x="459" y="146" width="258" height="28" rx="5" class="decode svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <text x="588" y="165" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">attention 交互：2 B P D</text>
  <text x="601" y="192" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">读取 KV cache，写入一个新位置</text>

  <line x1="32" y1="226" x2="768" y2="226"  stroke-width="1" class="svg-special-graphic-stroke-d2cdc5"/>
  <text x="32" y="253" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">推理账本的三个主轴</text>

  <rect x="32" y="276" width="220" height="42" rx="6"   class="svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="142" y="302" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">计算：MAC → FLOP</text>
  <rect x="290" y="276" width="220" height="42" rx="6"   class="svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="400" y="302" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">内存：2 L B P Dkv s</text>
  <rect x="548" y="276" width="220" height="42" rx="6"   class="svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="658" y="302" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">延迟：算力 vs 带宽</text>

  <text x="400" y="356" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">prefill 暴露 T²，decode 暴露 P，GQA 通过 Dkv 降低 K/V cache 宽度</text>
</svg>
