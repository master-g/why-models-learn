<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-d9a08d { fill: #b58676; }
  .svg-special-fill-fill-e6c7ba { fill: #a28c83; }
  .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
  .svg-special-fill-fill-f7f4ef { fill: #92908e; }
  .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
  .svg-special-graphic-stroke-d2cdc5 { stroke: #94908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6f6a64 { fill: #6f6a64; }
  .svg-special-text-fill-fffaf6 { fill: #757271; }

  .svg-special-background-fill-d9a08d { fill: #d9a08d; }
  .svg-special-background-fill-e6c7ba { fill: #e6c7ba; }
  .svg-special-background-fill-f2e2d9 { fill: #f2e2d9; }
  .svg-special-background-fill-f7f4ef { fill: #f7f4ef; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-d9a08d { fill: #b58676; }
    .svg-special-fill-fill-e6c7ba { fill: #a28c83; }
    .svg-special-fill-fill-f2e2d9 { fill: #998e89; }
    .svg-special-fill-fill-f7f4ef { fill: #92908e; }
    .svg-special-graphic-stroke-8e8880 { stroke: #8e8880; }
    .svg-special-graphic-stroke-d2cdc5 { stroke: #94908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6f6a64 { fill: #a7a4a0; }
    .svg-special-text-fill-fffaf6 { fill: #a5a4a3; }
    .svg-special-background-fill-d9a08d { fill: #302826; }
    .svg-special-background-fill-e6c7ba { fill: #322e2c; }
    .svg-special-background-fill-f2e2d9 { fill: #343230; }
    .svg-special-background-fill-f7f4ef { fill: #353434; }



  }
</style>
  <title id="title">投机解码：草稿提议与目标验证</title>
  <desc id="desc">Draft model 提出三个 token，Target model 验证其概率比，接受前缀并在首个拒绝位置使用 residual correction。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .draft {}
      .accepted {}
      .rejected {stroke-width: 1.2; }
      .corrected {stroke-width: 1.2; }
      .axis {stroke-width: 1.2; }
      .box {stroke-width: 1.5; }
      .accent {stroke-width: 1.5; }
      .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="32" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">投机解码：草稿提议与目标验证</text>
  <text x="32" y="55" class="muted svg-special-text-fill-6f6a64" font-size="13">同一前缀 s，Draft model 提出 y₁、y₂、y₃，Target model 一次验证</text>

  <rect x="32" y="76" width="220" height="126" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="142" y="99" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Draft model：proposal q</text>
  <text x="142" y="127" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">s → y₁ → y₂ → y₃</text>
  <rect x="59" y="148" width="48" height="32" rx="5" class="draft svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="116" y="148" width="48" height="32" rx="5" class="draft svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="173" y="148" width="48" height="32" rx="5" class="draft svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <text x="83" y="169" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">y₁</text>
  <text x="140" y="169" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">y₂</text>
  <text x="197" y="169" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">y₃</text>

  <path d="M266 139 L298 139" class="arrow svg-coral-stroke-stroke"/>
  <text x="282" y="123" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">一次验证</text>

  <rect x="318" y="76" width="206" height="126" rx="8" class="accent svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="421" y="99" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Target model：verify p</text>
  <text x="421" y="127" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">aᵢ = min(1, pᵢ(yᵢ) / qᵢ(yᵢ))</text>
  <text x="421" y="155" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">uᵢ &lt; aᵢ：接受</text>
  <text x="421" y="179" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">首个拒绝：residual correction</text>

  <path d="M538 139 L570 139" class="arrow svg-coral-stroke-stroke"/>
  <text x="554" y="123" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">提交</text>

  <rect x="590" y="76" width="178" height="126" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="679" y="99" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">最终序列</text>
  <rect x="608" y="122" width="42" height="30" rx="5" class="accepted svg-special-fill-fill-cc785c"/>
  <rect x="657" y="122" width="42" height="30" rx="5" class="accepted svg-special-fill-fill-cc785c"/>
  <rect x="706" y="122" width="42" height="30" rx="5" class="corrected svg-special-fill-fill-e6c7ba svg-special-graphic-stroke-8e8880 svg-special-background-fill-e6c7ba"/>
  <text x="629" y="142" text-anchor="middle"  font-size="11" class="svg-special-text-fill-fffaf6">y₁</text>
  <text x="678" y="142" text-anchor="middle"  font-size="11" class="svg-special-text-fill-fffaf6">y₂</text>
  <text x="727" y="142" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">c₃</text>
  <text x="679" y="178" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">接受前缀 + 修正 token</text>

  <line x1="32" y1="224" x2="768" y2="224"  stroke-width="1" class="svg-special-graphic-stroke-d2cdc5"/>
  <text x="32" y="252" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">拒绝位置的残差补回目标分布</text>
  <text x="32" y="276" class="muted svg-special-text-fill-6f6a64" font-size="13">accepted mass = min(p, q)，correction mass = max(p − q, 0)</text>

  <rect x="32" y="297" width="223" height="36" rx="6" class="accepted svg-special-fill-fill-cc785c"/>
  <text x="143" y="320" text-anchor="middle"  font-size="13" class="svg-special-text-fill-fffaf6">接受质量 min(p, q)</text>
  <text x="272" y="320" class="ink svg-special-text-fill-312f2f" font-size="18">+</text>
  <rect x="296" y="297" width="223" height="36" rx="6" class="corrected svg-special-fill-fill-e6c7ba svg-special-graphic-stroke-8e8880 svg-special-background-fill-e6c7ba"/>
  <text x="407" y="320" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">残差 max(p − q, 0)</text>
  <text x="536" y="320" class="ink svg-special-text-fill-312f2f" font-size="18">=</text>
  <rect x="564" y="297" width="204" height="36" rx="6" class="accent svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="666" y="320" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">目标质量 p</text>
  <text x="400" y="359" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="13">先拒绝后截断，未提交的草稿尾部不进入下一步 KV cache</text>
</svg>
