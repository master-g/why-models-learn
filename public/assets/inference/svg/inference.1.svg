<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-eee9e2 { fill: #94908c; }
  .svg-special-fill-fill-f5f1eb { fill: #93908d; }
  .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-eee9e2 { fill: #eee9e2; }
  .svg-special-background-fill-f5f1eb { fill: #f5f1eb; }
  .svg-special-background-fill-f8e6df { fill: #f8e6df; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-eee9e2 { fill: #94908c; }
    .svg-special-fill-fill-f5f1eb { fill: #93908d; }
    .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-eee9e2 { fill: #333332; }
    .svg-special-background-fill-f5f1eb { fill: #343433; }
    .svg-special-background-fill-f8e6df { fill: #353231; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title id="title">语言模型推理生命周期</title>
  <desc id="desc">输入经过 tokenizer 和 prefill，prefill 产生 KV cache，decode 逐 token 读取 cache，停止条件和后处理返回结果；下方显示延迟与显存账本。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .small { font-size: 13px; }
      .label { font-size: 16px; font-weight: 600; }
      .note { font-size: 12px; }
      .box {stroke-width: 1.5; }
      .cache {stroke-width: 1.2; }
      .coral {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="12"  class="svg-special-fill-fill-f5f1eb svg-special-background-fill-f5f1eb"/>
  <text x="38" y="33" class="ink label svg-special-text-fill-312f2f">推理：prefill 建立上下文，decode 逐 token 读取</text>
  <text x="38" y="55" class="ink small svg-special-text-fill-312f2f">冻结 checkpoint 后，tokenizer、cache、停止条件与服务调度共同决定结果</text>

  <rect x="35" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="98" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入</text>
  <text x="98" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">text · prompt</text>

  <rect x="186" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="249" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Tokenizer</text>
  <text x="249" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">input_ids · mask</text>

  <rect x="337" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="400" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Prefill</text>
  <text x="400" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">全 prompt 前向</text>

  <rect x="488" y="88" width="126" height="62" rx="8" class="cache svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="551" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">KV cache</text>
  <text x="551" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">K/V · position</text>

  <rect x="639" y="88" width="126" height="62" rx="8" class="coral svg-special-fill-fill-f8e6df svg-coral-stroke-stroke svg-special-background-fill-f8e6df"/>
  <text x="702" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Decode</text>
  <text x="702" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">one token · loop</text>

  <path d="M161 119 L186 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M312 119 L337 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M463 119 L488 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M614 119 L639 119"  stroke-width="1.5" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="95" y="190" width="190" height="53" rx="8" class="cache svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="190" y="213" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">延迟账本</text>
  <text x="190" y="231" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">TTFT · inter-token · e2e</text>

  <rect x="305" y="190" width="190" height="53" rx="8" class="cache svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="400" y="213" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">显存账本</text>
  <text x="400" y="231" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">weights · KV · workspace</text>

  <rect x="515" y="190" width="190" height="53" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="610" y="213" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">停止与后处理</text>
  <text x="610" y="231" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">EOS · stop · response</text>

  <path d="M400 150 L400 190"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M551 150 C551 171 610 169 610 190" fill="none"  stroke-width="1.4" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>
  <path d="M702 150 C702 171 221 169 190 190" fill="none"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>

  <rect x="80" y="285" width="205" height="52" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="182.5" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">batch scheduler</text>
  <text x="182.5" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">slot · padding · cache index</text>

  <rect x="298" y="285" width="205" height="52" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="400.5" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">解码配置</text>
  <text x="400.5" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">greedy · sampling · beam</text>

  <rect x="516" y="285" width="205" height="52" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="618.5" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">审计记录</text>
  <text x="618.5" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">model hash · token trace · stop reason</text>

  <path d="M190 243 C190 264 182.5 269 182.5 285" fill="none"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M610 243 C610 264 400.5 266 400.5 285" fill="none"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M610 243 C635 263 618.5 270 618.5 285" fill="none"  stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>

  <text x="38" y="359" class="ink note svg-special-text-fill-312f2f">prefill 决定 TTFT，decode 决定逐 token 延迟；KV cache 让历史投影可复用但随长度增长</text>
</svg>
