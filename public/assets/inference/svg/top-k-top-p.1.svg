  <title id="title">Top-k 与 Top-p：截断候选分布后再采样</title>
  <desc id="desc">同一组四类 token 概率经过固定数量 top-k 和累计概率 top-p 过滤后，保留不同候选集合并重新归一化。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .bar0 {}
      .bar1 {}
      .bar2 {}
      .bar3 {}
      .axis {stroke-width: 1.2; }
      .box {stroke-width: 1.5; }
      .accent {stroke-width: 1.5; }
      .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="32" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">Top-k 与 Top-p：截断候选分布后再采样</text>
  <text x="32" y="55" class="muted svg-special-text-fill-6f6a64" font-size="13">原始概率 p = (0.644, 0.237, 0.087, 0.032)</text>

  <rect x="32" y="72" width="224" height="132" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="144" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">原始分布</text>
  <line x1="57" y1="179" x2="231" y2="179" class="axis svg-axis-stroke"/>
  <rect x="70" y="103" width="28" height="76" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="112" y="151" width="28" height="28" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="154" y="169" width="28" height="10" class="bar2 svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <rect x="196" y="175" width="28" height="4" class="bar3 svg-special-fill-fill-e9ded7 svg-special-background-fill-e9ded7"/>
  <text x="84" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.644</text>
  <text x="126" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.237</text>
  <text x="168" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.087</text>
  <text x="210" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.032</text>

  <path d="M267 138 L294 138" class="arrow svg-coral-stroke-stroke"/>
  <text x="280" y="126" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">截断</text>

  <rect x="316" y="72" width="216" height="132" rx="8" class="accent svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <text x="424" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Top-k = 2</text>
  <line x1="341" y1="179" x2="507" y2="179" class="axis svg-axis-stroke"/>
  <rect x="355" y="101" width="31" height="78" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="405" y="147" width="31" height="32" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="455" y="177" width="31" height="2" class="bar3 svg-special-fill-fill-e9ded7 svg-special-background-fill-e9ded7"/>
  <text x="370" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.731</text>
  <text x="420" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">0.269</text>
  <text x="470" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">mask</text>

  <path d="M545 138 L572 138" class="arrow svg-coral-stroke-stroke"/>
  <text x="558" y="126" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="11">阈值</text>

  <rect x="594" y="72" width="174" height="132" rx="8" class="box svg-special-fill-fill-f7f4ef svg-special-graphic-stroke-8e8880 svg-special-background-fill-f7f4ef"/>
  <text x="681" y="94" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">Top-p = 0.90</text>
  <line x1="615" y1="179" x2="747" y2="179" class="axis svg-axis-stroke"/>
  <rect x="626" y="104" width="25" height="75" class="bar0 svg-special-fill-fill-cc785c"/>
  <rect x="665" y="145" width="25" height="34" class="bar1 svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="704" y="167" width="25" height="12" class="bar2 svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="638" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="10">0.665</text>
  <text x="677" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="10">0.245</text>
  <text x="716" y="196" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="10">0.090</text>

  <line x1="32" y1="224" x2="768" y2="224"  stroke-width="1" class="svg-special-graphic-stroke-d2cdc5"/>
  <text x="32" y="251" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="600">Top-p 保留 crossing token，之后重新归一化</text>
  <text x="32" y="274" class="muted svg-special-text-fill-6f6a64" font-size="13">0.644 + 0.237 + 0.087 = 0.968 ≥ 0.90，token 2 不能删除</text>

  <rect x="32" y="294" width="544" height="36" rx="6"   class="svg-special-fill-fill-f2e2d9 svg-coral-stroke-stroke svg-special-background-fill-f2e2d9"/>
  <rect x="32" y="294" width="350" height="36" rx="6"  class="svg-special-fill-fill-cc785c"/>
  <rect x="382" y="294" width="129" height="36"  class="svg-special-fill-fill-d9a08d svg-special-background-fill-d9a08d"/>
  <rect x="511" y="294" width="65" height="36" rx="0"  class="svg-special-fill-fill-e6c7ba svg-special-background-fill-e6c7ba"/>
  <text x="207" y="317" text-anchor="middle"  font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" class="svg-special-text-fill-fffaf6">token 0 · 0.665</text>
  <text x="446" y="317" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">token 1 · 0.245</text>
  <text x="544" y="317" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">token 2 · 0.090</text>
  <text x="659" y="312" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">保留 3 个</text>
  <text x="659" y="331" text-anchor="middle" class="muted svg-special-text-fill-6f6a64" font-size="12">候选质量 0.968</text>
</svg>
