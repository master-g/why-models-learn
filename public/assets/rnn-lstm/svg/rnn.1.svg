<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">一个 RNN cell 沿时间重复</title>
  <desc id="desc">左侧是单个 RNN cell 的输入、状态和输出，右侧是同一个 cell 在三个时间步展开并共享参数。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">一个 RNN cell 如何沿时间重复</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">左侧看一次更新；右侧展开后，三个时间步仍共享同一组参数</text>

  <rect x="22" y="73" width="290" height="243" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="98" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">单个 cell</text>
  <text x="42" y="117" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">当前输入 + 上一步状态</text>

  <rect x="45" y="143" width="68" height="34" rx="8" fill="#dfe9df" stroke="#b8b2a8"/>
  <text x="79" y="165" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13">xₜ</text>
  <rect x="45" y="223" width="68" height="34" rx="8" fill="#ded8ee" stroke="#b8b2a8"/>
  <text x="79" y="245" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13">hₜ₋₁</text>
  <rect x="145" y="174" width="89" height="55" rx="10" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="189" y="197" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">aₜ</text>
  <text x="189" y="214" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">线性组合</text>
  <rect x="145" y="245" width="89" height="38" rx="9" fill="#f0d3b1" stroke="#b8b2a8"/>
  <text x="189" y="269" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12">φ = tanh</text>
  <rect x="245" y="174" width="49" height="55" rx="10" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="269.5" y="206" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12">hₜ</text>

  <g stroke="#6f6a63" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="113" y1="160" x2="145" y2="186"/>
    <line x1="113" y1="240" x2="145" y2="215"/>
    <line x1="234" y1="202" x2="245" y2="202"/>
    <line x1="189" y1="229" x2="189" y2="245"/>
  </g>
  <text x="189" y="307" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">hₜ = φ(Wₓₕxₜ + Wₕₕhₜ₋₁ + bₕ)</text>

  <rect x="333" y="73" width="445" height="243" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="354" y="98" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">沿时间展开</text>
  <text x="354" y="117" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">参数 θ = {Wₓₕ, Wₕₕ, bₕ} 在每一步相同</text>

  <g fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="425" y="145">t−1</text>
    <text x="555" y="145">t</text>
    <text x="685" y="145">t+1</text>
  </g>
  <g fill="#dfe9df" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="390" y="153" width="70" height="31" rx="8"/>
    <rect x="520" y="153" width="70" height="31" rx="8"/>
    <rect x="650" y="153" width="70" height="31" rx="8"/>
  </g>
  <g fill="#e9d8c9" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="390" y="207" width="70" height="39" rx="9"/>
    <rect x="520" y="207" width="70" height="39" rx="9"/>
    <rect x="650" y="207" width="70" height="39" rx="9"/>
  </g>
  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="390" y="268" width="70" height="31" rx="8"/>
    <rect x="520" y="268" width="70" height="31" rx="8"/>
    <rect x="650" y="268" width="70" height="31" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle">
    <text x="425" y="173">xₜ₋₁</text>
    <text x="555" y="173">xₜ</text>
    <text x="685" y="173">xₜ₊₁</text>
    <text x="425" y="231">hₜ₋₁</text>
    <text x="555" y="231">hₜ</text>
    <text x="685" y="231">hₜ₊₁</text>
    <text x="425" y="289">ŷₜ₋₁</text>
    <text x="555" y="289">ŷₜ</text>
    <text x="685" y="289">ŷₜ₊₁</text>
  </g>
  <g stroke="#6f6a63" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="425" y1="184" x2="425" y2="207"/>
    <line x1="555" y1="184" x2="555" y2="207"/>
    <line x1="685" y1="184" x2="685" y2="207"/>
    <line x1="425" y1="246" x2="425" y2="268"/>
    <line x1="555" y1="246" x2="555" y2="268"/>
    <line x1="685" y1="246" x2="685" y2="268"/>
  </g>
  <g stroke="#b26e58" stroke-width="2" fill="none" marker-end="url(#coral-arrow)">
    <line x1="460" y1="226" x2="520" y2="226"/>
    <line x1="590" y1="226" x2="650" y2="226"/>
  </g>
  <g fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="490" y="217">同一 θ</text>
    <text x="620" y="217">同一 θ</text>
  </g>
  <line x1="363" y1="331" x2="748" y2="331" stroke="#c9c4bb" stroke-width="1"/>
  <text x="555" y="351" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">状态变，参数不变</text>
</svg>
