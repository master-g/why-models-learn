<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">时间反向传播沿展开图回传梯度</title>
  <desc id="desc">三个时间步共享同一组循环参数，前向计算从左到右，反向传播从右到左，时间步上的局部梯度最终累加到参数账本。</desc>
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="backward-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
    <marker id="ledger-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7d789b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">BPTT：沿时间展开图回传，并把贡献累加</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">状态和参数的计算节点随时间展开；参数 θ 仍只有一份</text>

  <rect x="22" y="74" width="756" height="230" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <g font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">
    <text x="42" y="96" fill="#6f6a63">前向：从 xₜ 到 hₜ，再到每步输出</text>
    <text x="584" y="96" fill="#b26e58">反向：从 loss 向左累加时间贡献</text>
  </g>

  <g fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="155" y="117">t=1</text>
    <text x="390" y="117">t=2</text>
    <text x="625" y="117">t=3</text>
  </g>

  <g fill="#dfe9df" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="120" y="124" width="70" height="29" rx="8"/>
    <rect x="355" y="124" width="70" height="29" rx="8"/>
    <rect x="590" y="124" width="70" height="29" rx="8"/>
  </g>
  <g fill="#e9d8c9" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="110" y="165" width="90" height="48" rx="9"/>
    <rect x="345" y="165" width="90" height="48" rx="9"/>
    <rect x="580" y="165" width="90" height="48" rx="9"/>
  </g>
  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="110" y="231" width="90" height="29" rx="8"/>
    <rect x="345" y="231" width="90" height="29" rx="8"/>
    <rect x="580" y="231" width="90" height="29" rx="8"/>
  </g>

  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle">
    <text x="155" y="144">x₁</text>
    <text x="390" y="144">x₂</text>
    <text x="625" y="144">x₃</text>
    <text x="155" y="185" font-weight="700">cell</text>
    <text x="390" y="185" font-weight="700">cell</text>
    <text x="625" y="185" font-weight="700">cell</text>
    <text x="155" y="202" fill="#6f6a63" font-size="10">hₜ = fθ(·)</text>
    <text x="390" y="202" fill="#6f6a63" font-size="10">hₜ = fθ(·)</text>
    <text x="625" y="202" fill="#6f6a63" font-size="10">hₜ = fθ(·)</text>
    <text x="155" y="250">u₁ / ℓ₁</text>
    <text x="390" y="250">u₂ / ℓ₂</text>
    <text x="625" y="250">u₃ / ℓ₃</text>
  </g>

  <g stroke="#6f6a63" stroke-width="1.3" fill="none" marker-end="url(#forward-arrow)">
    <line x1="155" y1="153" x2="155" y2="165"/>
    <line x1="390" y1="153" x2="390" y2="165"/>
    <line x1="625" y1="153" x2="625" y2="165"/>
    <line x1="155" y1="213" x2="155" y2="231"/>
    <line x1="390" y1="213" x2="390" y2="231"/>
    <line x1="625" y1="213" x2="625" y2="231"/>
  </g>
  <g stroke="#6f6a63" stroke-width="1.5" fill="none" marker-end="url(#forward-arrow)">
    <line x1="200" y1="178" x2="345" y2="178"/>
    <line x1="435" y1="178" x2="580" y2="178"/>
  </g>
  <g fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="272" y="169">h₁ → h₂</text>
    <text x="507" y="169">h₂ → h₃</text>
  </g>

  <g fill="#f1ded6" stroke="#c99b89" stroke-width="1.1">
    <rect x="110" y="270" width="90" height="25" rx="8"/>
    <rect x="345" y="270" width="90" height="25" rx="8"/>
    <rect x="580" y="270" width="90" height="25" rx="8"/>
  </g>
  <g fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="155" y="287">r₁</text>
    <text x="390" y="287">r₂</text>
    <text x="625" y="287">r₃</text>
  </g>
  <g stroke="#b26e58" stroke-width="1.7" fill="none" marker-end="url(#backward-arrow)">
    <line x1="625" y1="260" x2="625" y2="270"/>
    <line x1="390" y1="260" x2="390" y2="270"/>
    <line x1="155" y1="260" x2="155" y2="270"/>
    <line x1="580" y1="282" x2="435" y2="282"/>
    <line x1="345" y1="282" x2="200" y2="282"/>
  </g>
  <g fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="507" y="273">Wₕₕᵀ r₃</text>
    <text x="272" y="273">Wₕₕᵀ r₂</text>
  </g>

  <line x1="42" y1="326" x2="758" y2="326" stroke="#c9c4bb" stroke-width="1"/>
  <g stroke="#7d789b" stroke-width="1.4" fill="none" marker-end="url(#ledger-arrow)">
    <line x1="155" y1="295" x2="155" y2="315"/>
    <line x1="390" y1="295" x2="390" y2="315"/>
    <line x1="625" y1="295" x2="625" y2="315"/>
  </g>
  <text x="42" y="348" fill="#7d789b" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">共享参数账本：</text>
  <text x="151" y="348" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">∂L/∂θ = Σₜ ∂Lₜ/∂θ</text>
  <text x="540" y="348" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">qₜ = Wₕᵧᵀuₜ + Wₕₕᵀrₜ₊₁</text>
</svg>
