    <rect x="345" y="231" width="90" height="29" rx="8"/>
    <rect x="580" y="231" width="90" height="29" rx="8"/>
  </g>

  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="155" y="144">x₁</text>
    <text x="390" y="144">x₂</text>
    <text x="625" y="144">x₃</text>
    <text x="155" y="185" font-weight="700">cell</text>
    <text x="390" y="185" font-weight="700">cell</text>
    <text x="625" y="185" font-weight="700">cell</text>
    <text x="155" y="202"  font-size="10" class="svg-special-text-fill-6f6a63">hₜ = fθ(·)</text>
    <text x="390" y="202"  font-size="10" class="svg-special-text-fill-6f6a63">hₜ = fθ(·)</text>
    <text x="625" y="202"  font-size="10" class="svg-special-text-fill-6f6a63">hₜ = fθ(·)</text>
    <text x="155" y="250">u₁ / ℓ₁</text>
    <text x="390" y="250">u₂ / ℓ₂</text>
    <text x="625" y="250">u₃ / ℓ₃</text>
  </g>

  <g  stroke-width="1.3" fill="none" marker-end="url(#forward-arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="155" y1="153" x2="155" y2="165"/>
    <line x1="390" y1="153" x2="390" y2="165"/>
    <line x1="625" y1="153" x2="625" y2="165"/>
    <line x1="155" y1="213" x2="155" y2="231"/>
    <line x1="390" y1="213" x2="390" y2="231"/>
    <line x1="625" y1="213" x2="625" y2="231"/>
  </g>
  <g  stroke-width="1.5" fill="none" marker-end="url(#forward-arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="200" y1="178" x2="345" y2="178"/>
    <line x1="435" y1="178" x2="580" y2="178"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle" class="svg-special-fill-fill-6f6a63 svg-special-text-fill-6f6a63">
    <text x="272" y="169">h₁ → h₂</text>
    <text x="507" y="169">h₂ → h₃</text>
  </g>

  <g   stroke-width="1.1" class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-text-fill-f1ded6">
    <rect x="110" y="270" width="90" height="25" rx="8"/>
    <rect x="345" y="270" width="90" height="25" rx="8"/>
    <rect x="580" y="270" width="90" height="25" rx="8"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-fill-fill-b26e58 svg-special-text-fill-b26e58">
    <text x="155" y="287">r₁</text>
    <text x="390" y="287">r₂</text>
    <text x="625" y="287">r₃</text>
  </g>
  <g  stroke-width="1.7" fill="none" marker-end="url(#backward-arrow)" class="svg-special-graphic-stroke-b26e58">
    <line x1="625" y1="260" x2="625" y2="270"/>
    <line x1="390" y1="260" x2="390" y2="270"/>
    <line x1="155" y1="260" x2="155" y2="270"/>
    <line x1="580" y1="282" x2="435" y2="282"/>
    <line x1="345" y1="282" x2="200" y2="282"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle" class="svg-special-fill-fill-b26e58 svg-special-text-fill-b26e58">
    <text x="507" y="273">Wₕₕᵀ r₃</text>
    <text x="272" y="273">Wₕₕᵀ r₂</text>
  </g>

  <line x1="42" y1="326" x2="758" y2="326"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <g  stroke-width="1.4" fill="none" marker-end="url(#ledger-arrow)" class="svg-special-graphic-stroke-7d789b">
    <line x1="155" y1="295" x2="155" y2="315"/>
    <line x1="390" y1="295" x2="390" y2="315"/>
    <line x1="625" y1="295" x2="625" y2="315"/>
  </g>
  <text x="42" y="348"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-7d789b">共享参数账本：</text>
  <text x="151" y="348"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">∂L/∂θ = Σₜ ∂Lₜ/∂θ</text>
  <text x="540" y="348"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">qₜ = Wₕᵧᵀuₜ + Wₕₕᵀrₜ₊₁</text>
</svg>
