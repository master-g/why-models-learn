  <title id="title">时间反向传播沿展开图回传梯度</title>
  <desc id="desc">三个时间步共享同一组循环参数，前向计算从左到右，反向传播从右到左，时间步上的局部梯度最终累加到参数账本。</desc>
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="backward-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
    <marker id="ledger-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-7d789b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">BPTT：沿时间展开图回传，并把贡献累加</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">状态和参数的计算节点随时间展开；参数 θ 仍只有一份</text>

  <rect x="22" y="74" width="756" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <g font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">
    <text x="42" y="96"  class="svg-special-text-fill-6f6a63">前向：从 xₜ 到 hₜ，再到每步输出</text>
    <text x="584" y="96"  class="svg-special-text-fill-b26e58">反向：从 loss 向左累加时间贡献</text>
  </g>

  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-fill-fill-6f6a63 svg-special-text-fill-6f6a63">
    <text x="155" y="117">t=1</text>
    <text x="390" y="117">t=2</text>
    <text x="625" y="117">t=3</text>
  </g>

  <g   stroke-width="1.2" class="svg-special-fill-fill-dfe9df svg-axis-stroke svg-special-text-fill-dfe9df">
    <rect x="120" y="124" width="70" height="29" rx="8"/>
    <rect x="355" y="124" width="70" height="29" rx="8"/>
    <rect x="590" y="124" width="70" height="29" rx="8"/>
  </g>
  <g   stroke-width="1.2" class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-text-fill-e9d8c9">
    <rect x="110" y="165" width="90" height="48" rx="9"/>
    <rect x="345" y="165" width="90" height="48" rx="9"/>
    <rect x="580" y="165" width="90" height="48" rx="9"/>
  </g>
  <g   stroke-width="1.2" class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-text-fill-ded8ee">
