<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">序列经过循环状态逐步传递</title>
  <desc id="desc">四个时间步各自读取输入、上一步隐藏状态并产生当前状态和输出，隐藏状态沿时间方向传递。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="soft-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b98974"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="32" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">序列经过同一个状态更新</text>
  <text x="32" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">参数 θ 在每个时间步共享；隐藏状态把过去带到下一步</text>

  <line x1="78" y1="79" x2="722" y2="79" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="75" y="73" fill="#9a9288" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">输入序列</text>
  <text x="75" y="164" fill="#9a9288" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">状态序列</text>
  <text x="75" y="258" fill="#9a9288" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">输出序列</text>

  <g fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle">
    <text x="150" y="75">t=1</text>
    <text x="317" y="75">t=2</text>
    <text x="484" y="75">t=3</text>
    <text x="651" y="75">t=4</text>
  </g>

  <g stroke="#6f6a63" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="131" x2="150" y2="175"/>
    <line x1="317" y1="131" x2="317" y2="175"/>
    <line x1="484" y1="131" x2="484" y2="175"/>
    <line x1="651" y1="131" x2="651" y2="175"/>
    <line x1="150" y1="220" x2="150" y2="266"/>
    <line x1="317" y1="220" x2="317" y2="266"/>
    <line x1="484" y1="220" x2="484" y2="266"/>
    <line x1="651" y1="220" x2="651" y2="266"/>
  </g>

  <g stroke="#b98974" stroke-width="2" fill="none" marker-end="url(#soft-arrow)">
    <line x1="197" y1="198" x2="270" y2="198"/>
    <line x1="364" y1="198" x2="437" y2="198"/>
    <line x1="531" y1="198" x2="604" y2="198"/>
  </g>
  <g fill="#9a9288" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="234" y="190">hₜ₋₁</text>
    <text x="401" y="190">hₜ₋₁</text>
    <text x="568" y="190">hₜ₋₁</text>
  </g>

  <g stroke="#b8b2a8" stroke-width="1.2">
    <rect x="108" y="92" width="84" height="39" rx="9" fill="#dfe9df"/>
    <rect x="275" y="92" width="84" height="39" rx="9" fill="#dfe9df"/>
    <rect x="442" y="92" width="84" height="39" rx="9" fill="#dfe9df"/>
    <rect x="609" y="92" width="84" height="39" rx="9" fill="#dfe9df"/>
    <rect x="103" y="175" width="94" height="45" rx="10" fill="#e9d8c9"/>
    <rect x="270" y="175" width="94" height="45" rx="10" fill="#e9d8c9"/>
    <rect x="437" y="175" width="94" height="45" rx="10" fill="#e9d8c9"/>
    <rect x="604" y="175" width="94" height="45" rx="10" fill="#e9d8c9"/>
    <rect x="108" y="266" width="84" height="39" rx="9" fill="#ded8ee"/>
    <rect x="275" y="266" width="84" height="39" rx="9" fill="#ded8ee"/>
    <rect x="442" y="266" width="84" height="39" rx="9" fill="#ded8ee"/>
    <rect x="609" y="266" width="84" height="39" rx="9" fill="#ded8ee"/>
  </g>

  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" text-anchor="middle">
    <text x="150" y="117">x₁</text>
    <text x="317" y="117">x₂</text>
    <text x="484" y="117">x₃</text>
    <text x="651" y="117">x₄</text>
    <text x="150" y="203">h₁</text>
    <text x="317" y="203">h₂</text>
    <text x="484" y="203">h₃</text>
    <text x="651" y="203">h₄</text>
    <text x="150" y="291">ŷ₁</text>
    <text x="317" y="291">ŷ₂</text>
    <text x="484" y="291">ŷ₃</text>
    <text x="651" y="291">ŷ₄</text>
  </g>

  <text x="400" y="331" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" text-anchor="middle">hₜ = fθ(hₜ₋₁, xₜ)　　ŷₜ = gθ(hₜ)</text>
  <line x1="72" y1="346" x2="728" y2="346" stroke="#c9c4bb" stroke-width="1"/>
  <text x="400" y="363" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">同一组参数在每个时间步复用；只有状态沿横向携带历史</text>
</svg>
