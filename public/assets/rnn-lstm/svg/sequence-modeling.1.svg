    <rect x="609" y="266" width="84" height="39" rx="9"  class="svg-special-fill-fill-ded8ee svg-special-background-fill-ded8ee"/>
  </g>

  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="150" y="117">x₁</text>
    <text x="317" y="117">x₂</text>
    <text x="484" y="117">x₃</text>
    <text x="651" y="117">x₄</text>
