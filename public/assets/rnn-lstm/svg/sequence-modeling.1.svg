  <title id="title">序列经过循环状态逐步传递</title>
  <desc id="desc">四个时间步各自读取输入、上一步隐藏状态并产生当前状态和输出，隐藏状态沿时间方向传递。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="soft-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b98974"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="32" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">序列经过同一个状态更新</text>
  <text x="32" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">参数 θ 在每个时间步共享；隐藏状态把过去带到下一步</text>

  <line x1="78" y1="79" x2="722" y2="79"  stroke-width="1" stroke-dasharray="4 5" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="75" y="73"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-9a9288">输入序列</text>
  <text x="75" y="164"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-9a9288">状态序列</text>
  <text x="75" y="258"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-9a9288">输出序列</text>

  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle" class="svg-special-fill-fill-6f6a63 svg-special-text-fill-6f6a63">
