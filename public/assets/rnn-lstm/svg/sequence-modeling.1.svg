  <text x="400" y="331"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" text-anchor="middle" class="svg-special-text-fill-312f2f">hₜ = fθ(hₜ₋₁, xₜ)　　ŷₜ = gθ(hₜ)</text>
  <line x1="72" y1="346" x2="728" y2="346"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="363"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-text-fill-6f6a63">同一组参数在每个时间步复用；只有状态沿横向携带历史</text>
