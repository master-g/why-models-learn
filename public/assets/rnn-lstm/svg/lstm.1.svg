  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">cell state 沿上方通路传递；四个门决定每一步如何读写这条通路</text>

