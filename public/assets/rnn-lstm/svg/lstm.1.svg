<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">LSTM 四门与细胞状态通路</title>
  <desc id="desc">左侧展示输入和上一隐藏状态产生四个门，遗忘门控制旧细胞状态，输入门控制候选内容，输出门控制 hidden；右侧展示细胞状态沿多个时间步的 carry 路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7d789b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">LSTM：门控写入、擦除与暴露</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">cell state 沿上方通路传递；四个门决定每一步如何读写这条通路</text>

  <rect x="22" y="74" width="355" height="230" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="101" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">一次 LSTM 更新</text>

  <rect x="42" y="122" width="66" height="30" rx="8" fill="#ded8ee" stroke="#b8b2a8"/>
  <text x="75" y="142" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">cₜ₋₁</text>
  <circle cx="146" cy="137" r="15" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="146" y="142" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14">×</text>
  <circle cx="249" cy="137" r="15" fill="#f1ded6" stroke="#c99b89"/>
  <text x="249" y="142" text-anchor="middle" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="700">+</text>
  <rect x="285" y="122" width="58" height="30" rx="8" fill="#ded8ee" stroke="#b8b2a8"/>
  <text x="314" y="142" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">cₜ</text>
  <g stroke="#6f6a63" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="108" y1="137" x2="131" y2="137"/>
    <line x1="161" y1="137" x2="234" y2="137"/>
    <line x1="264" y1="137" x2="285" y2="137"/>
  </g>
  <text x="146" y="112" text-anchor="middle" fill="#7d789b" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">fₜ</text>
  <text x="249" y="112" text-anchor="middle" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">iₜ ⊙ c̃ₜ</text>

  <rect x="42" y="190" width="63" height="28" rx="8" fill="#dfe9df" stroke="#b8b2a8"/>
  <rect x="42" y="232" width="63" height="28" rx="8" fill="#dfe9df" stroke="#b8b2a8"/>
  <text x="73" y="208" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">xₜ</text>
  <text x="73" y="250" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">hₜ₋₁</text>
  <rect x="128" y="181" width="123" height="82" rx="10" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="189" y="201" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">四个门</text>
  <text x="189" y="220" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">iₜ · fₜ · oₜ · c̃ₜ</text>
  <text x="189" y="239" text-anchor="middle" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9">σ、σ、σ、tanh</text>
  <g stroke="#6f6a63" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="105" y1="204" x2="128" y2="204"/>
    <line x1="105" y1="246" x2="128" y2="246"/>
  </g>
  <path d="M251,204 C270,190 272,155 249,153" fill="none" stroke="#b26e58" stroke-width="1.5" marker-end="url(#coral-arrow)"/>
  <path d="M251,220 C270,220 275,220 285,220" fill="none" stroke="#7d789b" stroke-width="1.5" marker-end="url(#purple-arrow)"/>
  <rect x="285" y="205" width="38" height="26" rx="7" fill="#fbf8f2" stroke="#b8b2a8"/>
  <text x="304" y="222" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">tanh</text>
  <circle cx="337" cy="218" r="13" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="337" y="223" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13">×</text>
  <path d="M251,246 C282,246 299,236 327,222" fill="none" stroke="#b26e58" stroke-width="1.4" marker-end="url(#coral-arrow)"/>
  <rect x="285" y="249" width="58" height="28" rx="8" fill="#ded8ee" stroke="#b8b2a8"/>
  <text x="314" y="268" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">hₜ</text>
  <line x1="337" y1="231" x2="337" y2="249" stroke="#6f6a63" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="42" y="290" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">旧 cell 走 carry；新内容和可见性走门控分支</text>

  <rect x="395" y="74" width="383" height="230" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="416" y="101" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">长期路径</text>
  <text x="416" y="120" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">直接 carry 的增益 = ∏ₜ fₜ</text>

  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="420" y="153" width="55" height="31" rx="8"/>
    <rect x="515" y="153" width="55" height="31" rx="8"/>
    <rect x="610" y="153" width="55" height="31" rx="8"/>
    <rect x="705" y="153" width="55" height="31" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="447" y="173">c₀</text>
    <text x="542" y="173">c₁</text>
    <text x="637" y="173">c₂</text>
    <text x="732" y="173">c₃</text>
  </g>
  <g stroke="#7d789b" stroke-width="2" fill="none" marker-end="url(#purple-arrow)">
    <line x1="475" y1="169" x2="515" y2="169"/>
    <line x1="570" y1="169" x2="610" y2="169"/>
    <line x1="665" y1="169" x2="705" y2="169"/>
  </g>
  <g fill="#7d789b" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="495" y="158">f₁</text>
    <text x="590" y="158">f₂</text>
    <text x="685" y="158">f₃</text>
  </g>
  <path d="M447,205 C515,224 662,224 732,205" fill="none" stroke="#b26e58" stroke-width="1.7" stroke-dasharray="5 4"/>
  <text x="590" y="225" text-anchor="middle" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">梯度沿 cell path 回传</text>
  <rect x="435" y="244" width="300" height="34" rx="9" fill="#f1ded6" stroke="#c99b89"/>
  <text x="585" y="266" text-anchor="middle" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="700">f≈1 → 接近恒等；f≈0 → 擦除历史</text>
  <line x1="416" y1="319" x2="757" y2="319" stroke="#c9c4bb" stroke-width="1"/>
  <text x="587" y="343" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">门控让保留与写入成为可学习的选择</text>
</svg>
