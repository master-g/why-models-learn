  <text x="189" y="220" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">iₜ · fₜ · oₜ · c̃ₜ</text>
