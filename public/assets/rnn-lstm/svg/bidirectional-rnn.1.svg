    <line x1="431" y1="244" x2="431" y2="267"/>
    <line x1="591" y1="244" x2="591" y2="267"/>
  </g>

  <rect x="650" y="263" width="108" height="38" rx="8"   class="svg-special-fill-fill-f7f2e9 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-f7f2e9"/>
  <text x="704" y="279" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" class="svg-special-text-fill-6f6a63">merge</text>
  <text x="704" y="293" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-312f2f">concat / add</text>

  <text x="30" y="343"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">完整序列可用：每个位置同时获得左侧与右侧上下文</text>
  <text x="492" y="343"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-b26e58">严格在线：反向路径会读取未来</text>
