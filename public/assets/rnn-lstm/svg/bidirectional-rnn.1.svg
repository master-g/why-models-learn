  <title id="title">BiRNN：同一序列的正向与反向状态</title>
  <desc id="desc">同一条输入序列同时进入正向和反向循环路径，在每个原始时间位置合并两个方向的状态；反向状态使用右侧未来输入，因此完整双向输出适合离线任务而不是严格在线预测。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f8e72"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">BiRNN：同一序列，两个时间方向</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">正向累积过去；反向累积未来；在原始位置对齐后再合并</text>

  <rect x="22" y="72" width="756" height="239" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="42" y="96"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">同一条输入序列 x₁ … x₄</text>

  <g   stroke-width="1.2" class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-text-fill-e9d8c9">
    <rect x="74" y="108" width="74" height="31" rx="8"/>
    <rect x="234" y="108" width="74" height="31" rx="8"/>
