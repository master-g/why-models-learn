    <text x="111" y="128">x₁</text>
    <text x="271" y="128">x₂</text>
    <text x="431" y="128">x₃</text>
    <text x="591" y="128">x₄</text>
  </g>

  <text x="43" y="165"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" font-weight="700" class="svg-special-text-fill-6f8e72">正向 h⃗</text>
  <g   stroke-width="1.2" class="svg-special-fill-fill-dfe9df svg-special-graphic-stroke-9db29f svg-special-text-fill-dfe9df">
