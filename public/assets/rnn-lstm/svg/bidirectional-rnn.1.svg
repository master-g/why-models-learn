<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">BiRNN：同一序列的正向与反向状态</title>
  <desc id="desc">同一条输入序列同时进入正向和反向循环路径，在每个原始时间位置合并两个方向的状态；反向状态使用右侧未来输入，因此完整双向输出适合离线任务而不是严格在线预测。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f8e72"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">BiRNN：同一序列，两个时间方向</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">正向累积过去；反向累积未来；在原始位置对齐后再合并</text>

  <rect x="22" y="72" width="756" height="239" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="96" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">同一条输入序列 x₁ … x₄</text>

  <g fill="#e9d8c9" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="74" y="108" width="74" height="31" rx="8"/>
    <rect x="234" y="108" width="74" height="31" rx="8"/>
    <rect x="394" y="108" width="74" height="31" rx="8"/>
    <rect x="554" y="108" width="74" height="31" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle">
    <text x="111" y="128">x₁</text>
    <text x="271" y="128">x₂</text>
    <text x="431" y="128">x₃</text>
    <text x="591" y="128">x₄</text>
  </g>

  <text x="43" y="165" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" font-weight="700">正向 h⃗</text>
  <g fill="#dfe9df" stroke="#9db29f" stroke-width="1.2">
    <rect x="74" y="151" width="74" height="33" rx="8"/>
    <rect x="234" y="151" width="74" height="33" rx="8"/>
    <rect x="394" y="151" width="74" height="33" rx="8"/>
    <rect x="554" y="151" width="74" height="33" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="111" y="172">h⃗₁</text>
    <text x="271" y="172">h⃗₂</text>
    <text x="431" y="172">h⃗₃</text>
    <text x="591" y="172">h⃗₄</text>
  </g>
  <g stroke="#6f8e72" stroke-width="1.5" fill="none" marker-end="url(#green-arrow)">
    <line x1="111" y1="139" x2="111" y2="151"/>
    <line x1="271" y1="139" x2="271" y2="151"/>
    <line x1="431" y1="139" x2="431" y2="151"/>
    <line x1="591" y1="139" x2="591" y2="151"/>
    <line x1="148" y1="168" x2="234" y2="168"/>
    <line x1="308" y1="168" x2="394" y2="168"/>
    <line x1="468" y1="168" x2="554" y2="168"/>
  </g>
  <text x="702" y="171" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">过去 → 当前</text>

  <text x="43" y="225" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" font-weight="700">反向 h⃖</text>
  <g fill="#f1ded6" stroke="#c99b89" stroke-width="1.2">
    <rect x="74" y="211" width="74" height="33" rx="8"/>
    <rect x="234" y="211" width="74" height="33" rx="8"/>
    <rect x="394" y="211" width="74" height="33" rx="8"/>
    <rect x="554" y="211" width="74" height="33" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="111" y="232">h⃖₁</text>
    <text x="271" y="232">h⃖₂</text>
    <text x="431" y="232">h⃖₃</text>
    <text x="591" y="232">h⃖₄</text>
  </g>
  <g stroke="#b26e58" stroke-width="1.5" fill="none" marker-end="url(#coral-arrow)">
    <line x1="111" y1="139" x2="111" y2="211"/>
    <line x1="271" y1="139" x2="271" y2="211"/>
    <line x1="431" y1="139" x2="431" y2="211"/>
    <line x1="591" y1="139" x2="591" y2="211"/>
    <line x1="554" y1="228" x2="468" y2="228"/>
    <line x1="394" y1="228" x2="308" y2="228"/>
    <line x1="234" y1="228" x2="148" y2="228"/>
  </g>
  <text x="674" y="231" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">未来 → 当前</text>

  <g fill="#ded8ee" stroke="#aaa1c2" stroke-width="1.2">
    <rect x="74" y="267" width="74" height="29" rx="8"/>
    <rect x="234" y="267" width="74" height="29" rx="8"/>
    <rect x="394" y="267" width="74" height="29" rx="8"/>
    <rect x="554" y="267" width="74" height="29" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="111" y="285">[h⃗₁;h⃖₁]</text>
    <text x="271" y="285">[h⃗₂;h⃖₂]</text>
    <text x="431" y="285">[h⃗₃;h⃖₃]</text>
    <text x="591" y="285">[h⃗₄;h⃖₄]</text>
  </g>
  <g stroke="#6f6a63" stroke-width="1.1" fill="none" marker-end="url(#gray-arrow)">
    <line x1="111" y1="184" x2="111" y2="267"/>
    <line x1="271" y1="184" x2="271" y2="267"/>
    <line x1="431" y1="184" x2="431" y2="267"/>
    <line x1="591" y1="184" x2="591" y2="267"/>
    <line x1="111" y1="244" x2="111" y2="267"/>
    <line x1="271" y1="244" x2="271" y2="267"/>
    <line x1="431" y1="244" x2="431" y2="267"/>
    <line x1="591" y1="244" x2="591" y2="267"/>
  </g>

  <rect x="650" y="263" width="108" height="38" rx="8" fill="#f7f2e9" stroke="#d2ccc2"/>
  <text x="704" y="279" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9">merge</text>
  <text x="704" y="293" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">concat / add</text>

  <text x="30" y="343" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">完整序列可用：每个位置同时获得左侧与右侧上下文</text>
  <text x="492" y="343" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">严格在线：反向路径会读取未来</text>
</svg>
