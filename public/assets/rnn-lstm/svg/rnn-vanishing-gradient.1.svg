  <title id="title">RNN 梯度消失与方向性增益</title>
  <desc id="desc">左侧展示标量梯度沿时间反复乘以 c，右侧展示二维状态的两个方向分别衰减和增长，时间 Jacobian 由 recurrent 权重与激活导数共同决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">RNN 梯度消失：时间 Jacobian 的连乘</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">矩阵方向与激活工作点共同决定一条长路径最后还剩多少信号</text>

  <rect x="22" y="74" width="250" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="42" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">标量：反复乘 c</text>
  <text x="42" y="121"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">g₀ = cᵀ gₜ</text>

  <g   stroke-width="1.1" class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-text-fill-ded8ee">
    <rect x="40" y="151" width="52" height="34" rx="8"/>
    <rect x="105" y="151" width="52" height="34" rx="8"/>
    <rect x="170" y="151" width="52" height="34" rx="8"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="66" y="173">gₜ</text>
    <text x="131" y="173">c·g</text>
    <text x="196" y="173">c²·g</text>
  </g>
  <g  stroke-width="1.3" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="92" y1="168" x2="105" y2="168"/>
    <line x1="157" y1="168" x2="170" y2="168"/>
  </g>
  <text x="226" y="173"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" class="svg-special-text-fill-8d867e">…</text>
  <rect x="67" y="206" width="160" height="35" rx="9"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
  <text x="147" y="228" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="700" class="svg-special-text-fill-b26e58">c=0.8：0.8²⁰≈0.0115</text>
  <text x="147" y="263" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">距离越长，偏离 1 越明显</text>
  <line x1="42" y1="280" x2="252" y2="280"  stroke-width="1" class="svg-special-graphic-stroke-d2ccc2"/>
  <text x="147" y="297" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">小于 1 → 消失；大于 1 → 爆炸</text>

  <rect x="290" y="74" width="488" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="311" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">向量：不同方向不同增益</text>
  <text x="311" y="121"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">Jₜ = Dₜ Wₕₕ；Dₜ 还会随激活工作点变化</text>

  <g  stroke-width="1" class="svg-special-graphic-stroke-e1dbd2">
    <line x1="350" y1="151" x2="748" y2="151"/>
    <line x1="350" y1="191" x2="748" y2="191"/>
    <line x1="350" y1="231" x2="748" y2="231"/>
  </g>
  <g  stroke-width="1.2" fill="none" class="svg-special-graphic-stroke-8d867e">
    <line x1="350" y1="137" x2="350" y2="268"/>
    <line x1="350" y1="268" x2="748" y2="268"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" class="svg-special-fill-fill-8d867e svg-special-text-fill-8d867e">
    <text x="314" y="143">log gain</text>
    <text x="711" y="286">时间距离 k</text>
    <text x="340" y="273">0</text>
  </g>
  <path d="M370,158 C460,178 565,221 730,253" fill="none"  stroke-width="2.3" class="svg-special-graphic-stroke-7d789b"/>
  <path d="M370,246 C470,232 580,185 730,143" fill="none"  stroke-width="2.3" class="svg-special-graphic-stroke-b26e58"/>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-fill-fill-7d789b svg-special-text-fill-7d789b">
    <text x="380" y="151">0.8ᵏ：收缩方向</text>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-fill-fill-b26e58 svg-special-text-fill-b26e58">
    <text x="601" y="137">1.2ᵏ：膨胀方向</text>
  </g>
  <line x1="311" y1="319" x2="757" y2="319"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="534" y="343" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">同一 RNN 可以在不同方向同时消失与爆炸</text>
</svg>
