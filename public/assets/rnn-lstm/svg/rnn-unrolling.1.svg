  </g>
  <g   stroke-width="1.2" class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-text-fill-e9d8c9">
    <rect x="325" y="205" width="80" height="42" rx="9"/>
    <rect x="480" y="205" width="80" height="42" rx="9"/>
    <rect x="635" y="205" width="80" height="42" rx="9"/>
  </g>
  <g   stroke-width="1.2" class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-text-fill-ded8ee">
    <rect x="330" y="266" width="70" height="31" rx="8"/>
    <rect x="485" y="266" width="70" height="31" rx="8"/>
    <rect x="640" y="266" width="70" height="31" rx="8"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="365" y="173">x₁</text>
    <text x="520" y="173">x₂</text>
    <text x="675" y="173">x₃</text>
    <text x="365" y="230">h₁</text>
    <text x="520" y="230">h₂</text>
    <text x="675" y="230">h₃</text>
    <text x="365" y="287">ŷ₁</text>
    <text x="520" y="287">ŷ₂</text>
    <text x="675" y="287">ŷ₃</text>
  </g>
  <g  stroke-width="1.3" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="365" y1="184" x2="365" y2="205"/>
    <line x1="520" y1="184" x2="520" y2="205"/>
    <line x1="675" y1="184" x2="675" y2="205"/>
    <line x1="365" y1="247" x2="365" y2="266"/>
    <line x1="520" y1="247" x2="520" y2="266"/>
    <line x1="675" y1="247" x2="675" y2="266"/>
  </g>
  <g  stroke-width="2" fill="none" marker-end="url(#coral-arrow)" class="svg-special-graphic-stroke-b26e58">
    <line x1="405" y1="226" x2="480" y2="226"/>
    <line x1="560" y1="226" x2="635" y2="226"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle" class="svg-special-fill-fill-b26e58 svg-special-text-fill-b26e58">
    <text x="442" y="216">同一 θ</text>
    <text x="597" y="216">同一 θ</text>
  </g>

  <line x1="55" y1="328" x2="745" y2="328"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="350" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">展开复制的是计算节点；参数只保留一份</text>
</svg>
