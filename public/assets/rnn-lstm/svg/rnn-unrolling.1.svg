<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">RNN 时间展开与共享参数</title>
  <desc id="desc">左侧是循环 cell，右侧将同一个 cell 展开为三个时间节点，输入和状态沿时间传递，参数 theta 在三步间共享。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">RNN 时间展开：状态变，参数不变</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">左侧是一次状态转移；右侧把同一个 cell 沿时间写成三份节点</text>

  <rect x="22" y="75" width="220" height="226" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="101" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">循环写法</text>
  <text x="42" y="120" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">hₜ = fθ(hₜ₋₁, xₜ)</text>
  <rect x="53" y="151" width="72" height="34" rx="8" fill="#dfe9df" stroke="#b8b2a8"/>
  <text x="89" y="173" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12">xₜ</text>
  <rect x="53" y="229" width="72" height="34" rx="8" fill="#ded8ee" stroke="#b8b2a8"/>
  <text x="89" y="251" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12">hₜ₋₁</text>
  <rect x="150" y="181" width="70" height="53" rx="10" fill="#e9d8c9" stroke="#b8b2a8"/>
  <text x="185" y="204" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">cell</text>
  <text x="185" y="220" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">共享 θ</text>
  <g stroke="#6f6a63" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="125" y1="168" x2="150" y2="193"/>
    <line x1="125" y1="246" x2="150" y2="222"/>
  </g>
  <path d="M220,208 C231,208 231,276 185,276 C158,276 158,254 174,234" fill="none" stroke="#b26e58" stroke-width="1.8" marker-end="url(#coral-arrow)"/>
  <text x="132" y="288" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">下一步继续使用同一 cell</text>

  <rect x="267" y="75" width="511" height="226" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="288" y="101" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700">时间展开图</text>
  <text x="288" y="120" fill="#8d867e" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">三个节点共享 Wₓₕ、Wₕₕ、bₕ；hₜ 沿状态边传递</text>

  <g fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="365" y="145">t=1</text>
    <text x="520" y="145">t=2</text>
    <text x="675" y="145">t=3</text>
  </g>
  <g fill="#dfe9df" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="330" y="153" width="70" height="31" rx="8"/>
    <rect x="485" y="153" width="70" height="31" rx="8"/>
    <rect x="640" y="153" width="70" height="31" rx="8"/>
  </g>
  <g fill="#e9d8c9" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="325" y="205" width="80" height="42" rx="9"/>
    <rect x="480" y="205" width="80" height="42" rx="9"/>
    <rect x="635" y="205" width="80" height="42" rx="9"/>
  </g>
  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="330" y="266" width="70" height="31" rx="8"/>
    <rect x="485" y="266" width="70" height="31" rx="8"/>
    <rect x="640" y="266" width="70" height="31" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle">
    <text x="365" y="173">x₁</text>
    <text x="520" y="173">x₂</text>
    <text x="675" y="173">x₃</text>
    <text x="365" y="230">h₁</text>
    <text x="520" y="230">h₂</text>
    <text x="675" y="230">h₃</text>
    <text x="365" y="287">ŷ₁</text>
    <text x="520" y="287">ŷ₂</text>
    <text x="675" y="287">ŷ₃</text>
  </g>
  <g stroke="#6f6a63" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="365" y1="184" x2="365" y2="205"/>
    <line x1="520" y1="184" x2="520" y2="205"/>
    <line x1="675" y1="184" x2="675" y2="205"/>
    <line x1="365" y1="247" x2="365" y2="266"/>
    <line x1="520" y1="247" x2="520" y2="266"/>
    <line x1="675" y1="247" x2="675" y2="266"/>
  </g>
  <g stroke="#b26e58" stroke-width="2" fill="none" marker-end="url(#coral-arrow)">
    <line x1="405" y1="226" x2="480" y2="226"/>
    <line x1="560" y1="226" x2="635" y2="226"/>
  </g>
  <g fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="442" y="216">同一 θ</text>
    <text x="597" y="216">同一 θ</text>
  </g>

  <line x1="55" y1="328" x2="745" y2="328" stroke="#c9c4bb" stroke-width="1"/>
  <text x="400" y="350" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">展开复制的是计算节点；参数只保留一份</text>
</svg>
