  <title id="title">RNN 时间展开与共享参数</title>
  <desc id="desc">左侧是循环 cell，右侧将同一个 cell 展开为三个时间节点，输入和状态沿时间传递，参数 theta 在三步间共享。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">RNN 时间展开：状态变，参数不变</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">左侧是一次状态转移；右侧把同一个 cell 沿时间写成三份节点</text>

  <rect x="22" y="75" width="220" height="226" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="42" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">循环写法</text>
  <text x="42" y="120"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-8d867e">hₜ = fθ(hₜ₋₁, xₜ)</text>
  <rect x="53" y="151" width="72" height="34" rx="8"   class="svg-special-fill-fill-dfe9df svg-axis-stroke svg-special-background-fill-dfe9df"/>
  <text x="89" y="173" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" class="svg-special-text-fill-312f2f">xₜ</text>
  <rect x="53" y="229" width="72" height="34" rx="8"   class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-background-fill-ded8ee"/>
  <text x="89" y="251" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" class="svg-special-text-fill-312f2f">hₜ₋₁</text>
  <rect x="150" y="181" width="70" height="53" rx="10"   class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-background-fill-e9d8c9"/>
  <text x="185" y="204" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">cell</text>
  <text x="185" y="220" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">共享 θ</text>
  <g  stroke-width="1.4" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="125" y1="168" x2="150" y2="193"/>
    <line x1="125" y1="246" x2="150" y2="222"/>
  </g>
  <path d="M220,208 C231,208 231,276 185,276 C158,276 158,254 174,234" fill="none"  stroke-width="1.8" marker-end="url(#coral-arrow)" class="svg-special-graphic-stroke-b26e58"/>
  <text x="132" y="288"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-8d867e">下一步继续使用同一 cell</text>

  <rect x="267" y="75" width="511" height="226" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="288" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">时间展开图</text>
  <text x="288" y="120"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-8d867e">三个节点共享 Wₓₕ、Wₕₕ、bₕ；hₜ 沿状态边传递</text>

  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-fill-fill-6f6a63 svg-special-text-fill-6f6a63">
    <text x="365" y="145">t=1</text>
    <text x="520" y="145">t=2</text>
    <text x="675" y="145">t=3</text>
  </g>
  <g   stroke-width="1.2" class="svg-special-fill-fill-dfe9df svg-axis-stroke svg-special-text-fill-dfe9df">
