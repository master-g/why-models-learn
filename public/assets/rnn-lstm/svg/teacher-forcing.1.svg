  <title id="title">Teacher forcing 与自由运行</title>
  <desc id="desc">编码器 context 连接三个 decoder 步骤，绿色箭头把真实前缀喂给训练，珊瑚色虚线把模型自己的输出带回下一步推理，错误可能沿后续前缀累积。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f8e72"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">Teacher forcing：同一 decoder，两种前缀分布</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">训练喂真实 token；推理把自己的 token 送回下一步</text>

  <rect x="22" y="74" width="756" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <rect x="42" y="110" width="120" height="57" rx="10"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
