  <text x="177" y="197"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">推理：ŷ 前缀</text>

  <rect x="42" y="285" width="306" height="27" rx="8"   class="svg-special-fill-fill-edf4ed svg-special-graphic-stroke-b8cbb9 svg-special-background-fill-edf4ed"/>
  <text x="195" y="303" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f8e72">真实前缀：错误不会自动传到下一步</text>
  <rect x="450" y="285" width="306" height="27" rx="8"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
