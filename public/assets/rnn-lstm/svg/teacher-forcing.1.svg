  <line x1="42" y1="326" x2="758" y2="326"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="348" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">teacher-forced loss 不等于 free-running 序列质量</text>
