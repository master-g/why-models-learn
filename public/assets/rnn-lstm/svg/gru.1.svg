  <title id="title">GRU 更新门和重置门</title>
  <desc id="desc">左侧展示输入与上一隐藏状态产生更新门、重置门和候选状态，右侧展示更新门在旧 hidden 与候选 hidden 之间做插值。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-b26e58"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-7d789b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">GRU：用两个门混合旧状态与候选状态</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">本文 convention：zₜ 是候选写入比例，1−zₜ 是旧 hidden 的直接 carry 比例</text>

  <rect x="22" y="74" width="350" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="42" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">一次 GRU 更新</text>

  <rect x="42" y="133" width="61" height="29" rx="8"   class="svg-special-fill-fill-dfe9df svg-axis-stroke svg-special-background-fill-dfe9df"/>
  <rect x="42" y="181" width="61" height="29" rx="8"   class="svg-special-fill-fill-dfe9df svg-axis-stroke svg-special-background-fill-dfe9df"/>
  <text x="72" y="152" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">xₜ</text>
  <text x="72" y="200" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">hₜ₋₁</text>

  <rect x="130" y="126" width="116" height="89" rx="10"   class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-background-fill-e9d8c9"/>
  <text x="188" y="147" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">两个门</text>
  <text x="188" y="166" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-7d789b">zₜ：写入比例</text>
  <text x="188" y="184" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">rₜ：候选读取</text>
  <text x="188" y="202" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" class="svg-special-text-fill-8d867e">两者都用 sigmoid</text>
  <g  stroke-width="1.2" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-6f6a63">
    <line x1="103" y1="147" x2="130" y2="147"/>
    <line x1="103" y1="195" x2="130" y2="195"/>
  </g>

  <rect x="267" y="126" width="81" height="38" rx="9"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
  <text x="307" y="143" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">候选 h̃ₜ</text>
  <text x="307" y="156" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" class="svg-special-text-fill-6f6a63">tanh</text>
  <path d="M246,185 C260,185 260,151 267,151" fill="none"  stroke-width="1.5" marker-end="url(#coral-arrow)" class="svg-special-graphic-stroke-b26e58"/>
  <text x="260" y="180"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="9" class="svg-special-text-fill-b26e58">rₜ⊙hₜ₋₁</text>

  <rect x="267" y="201" width="81" height="35" rx="9"   class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-background-fill-ded8ee"/>
  <text x="307" y="223" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">blend</text>
  <path d="M246,160 C260,160 260,216 267,216" fill="none"  stroke-width="1.5" marker-end="url(#purple-arrow)" class="svg-special-graphic-stroke-7d789b"/>
  <rect x="267" y="252" width="81" height="29" rx="8"   class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-background-fill-ded8ee"/>
  <text x="307" y="271" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">hₜ</text>
  <line x1="307" y1="236" x2="307" y2="252"  stroke-width="1.3" marker-end="url(#arrow)" class="svg-special-graphic-stroke-6f6a63"/>
  <text x="42" y="291"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">zₜ 控制 blend；rₜ 只先影响候选路径</text>

  <rect x="390" y="74" width="388" height="230" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="411" y="101"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">更新门的插值路径</text>
  <text x="411" y="120"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">hₜ = (1−zₜ)⊙hₜ₋₁ + zₜ⊙h̃ₜ</text>

  <g   stroke-width="1.2" class="svg-special-fill-fill-ded8ee svg-axis-stroke svg-special-text-fill-ded8ee">
    <rect x="415" y="151" width="55" height="31" rx="8"/>
    <rect x="510" y="151" width="55" height="31" rx="8"/>
    <rect x="605" y="151" width="55" height="31" rx="8"/>
    <rect x="700" y="151" width="55" height="31" rx="8"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="442" y="171">h₀</text>
    <text x="537" y="171">h₁</text>
    <text x="632" y="171">h₂</text>
    <text x="727" y="171">h₃</text>
  </g>
  <g  stroke-width="2" fill="none" marker-end="url(#purple-arrow)" class="svg-special-graphic-stroke-7d789b">
    <line x1="470" y1="167" x2="510" y2="167"/>
    <line x1="565" y1="167" x2="605" y2="167"/>
    <line x1="660" y1="167" x2="700" y2="167"/>
  </g>
  <g  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle" class="svg-special-fill-fill-7d789b svg-special-text-fill-7d789b">
    <text x="490" y="156">1−z₁</text>
    <text x="585" y="156">1−z₂</text>
    <text x="680" y="156">1−z₃</text>
  </g>
  <path d="M442,204 C517,228 655,228 727,204" fill="none"  stroke-width="1.7" stroke-dasharray="5 4" class="svg-special-graphic-stroke-b26e58"/>
  <text x="585" y="229" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">候选写入路径由 zₜ 打开</text>
  <rect x="423" y="247" width="322" height="32" rx="9"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
  <text x="584" y="267" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" font-weight="700" class="svg-special-text-fill-b26e58">z≈0：保留旧状态；z≈1：重写 hidden</text>
  <line x1="411" y1="319" x2="757" y2="319"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="584" y="343" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">GRU 把记忆与输出合并为一条 hidden 路径</text>
</svg>
