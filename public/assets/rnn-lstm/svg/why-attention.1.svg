  <title id="title">为什么需要注意力：固定摘要与可寻址读取</title>
  <desc id="desc">左侧所有 encoder state 汇聚到一个固定 context 再进入 decoder；右侧保留源状态，decoder query 对每个位置产生权重并形成当步 context。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-6f8e72"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8176a4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16"  class="svg-special-fill-fill-f7f2e9 svg-special-background-fill-f7f2e9"/>
  <text x="30" y="31"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">为什么需要注意力：固定摘要 vs 可寻址读取</text>
  <text x="30" y="52"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">从一个跨时间轴的窄接口，变成每个目标步都能选择源位置的软路由</text>

  <rect x="22" y="72" width="356" height="239" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="42" y="95"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-b26e58">fixed context</text>
  <text x="42" y="111"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">所有源状态先汇聚，再交给 decoder</text>

  <g   stroke-width="1.2" class="svg-special-fill-fill-dfe9df svg-special-graphic-stroke-9db29f svg-special-text-fill-dfe9df">
    <rect x="43" y="128" width="63" height="29" rx="7"/>
