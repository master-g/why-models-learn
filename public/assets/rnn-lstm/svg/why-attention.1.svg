<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">为什么需要注意力：固定摘要与可寻址读取</title>
  <desc id="desc">左侧所有 encoder state 汇聚到一个固定 context 再进入 decoder；右侧保留源状态，decoder query 对每个位置产生权重并形成当步 context。</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f8e72"/>
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8176a4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">为什么需要注意力：固定摘要 vs 可寻址读取</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">从一个跨时间轴的窄接口，变成每个目标步都能选择源位置的软路由</text>

  <rect x="22" y="72" width="356" height="239" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="95" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">fixed context</text>
  <text x="42" y="111" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">所有源状态先汇聚，再交给 decoder</text>

  <g fill="#dfe9df" stroke="#9db29f" stroke-width="1.2">
    <rect x="43" y="128" width="63" height="29" rx="7"/>
    <rect x="116" y="128" width="63" height="29" rx="7"/>
    <rect x="189" y="128" width="63" height="29" rx="7"/>
    <rect x="262" y="128" width="63" height="29" rx="7"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="74.5" y="147">h₁</text>
    <text x="147.5" y="147">h₂</text>
    <text x="220.5" y="147">h₃</text>
    <text x="293.5" y="147">h₄</text>
  </g>
  <g stroke="#6f8e72" stroke-width="1.2" fill="none" marker-end="url(#green-arrow)">
    <line x1="74.5" y1="157" x2="151" y2="187"/>
    <line x1="147.5" y1="157" x2="163" y2="187"/>
    <line x1="220.5" y1="157" x2="175" y2="187"/>
    <line x1="293.5" y1="157" x2="187" y2="187"/>
  </g>
  <rect x="133" y="187" width="78" height="31" rx="8" fill="#f1ded6" stroke="#c99b89"/>
  <text x="172" y="206" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">c = h₄</text>
  <line x1="211" y1="202" x2="249" y2="202" stroke="#6f6a63" stroke-width="1.3" marker-end="url(#gray-arrow)"/>
  <rect x="249" y="187" width="91" height="31" rx="8" fill="#ded8ee" stroke="#aaa1c2"/>
  <text x="294.5" y="206" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">decoder dⱼ</text>
  <text x="42" y="252" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">源位置在末端混合</text>
  <text x="42" y="270" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">同一个摘要供所有目标步使用</text>
  <text x="42" y="294" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">长距离路径：hᵢ → … → h₄ → c → dⱼ</text>

  <rect x="398" y="72" width="380" height="239" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="418" y="95" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">step-wise attention</text>
  <text x="418" y="111" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">每个 query 重新选择源位置</text>

  <g fill="#dfe9df" stroke="#9db29f" stroke-width="1.2">
    <rect x="419" y="128" width="63" height="29" rx="7"/>
    <rect x="492" y="128" width="63" height="29" rx="7"/>
    <rect x="565" y="128" width="63" height="29" rx="7"/>
    <rect x="638" y="128" width="63" height="29" rx="7"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="450.5" y="147">h₁</text>
    <text x="523.5" y="147">h₂</text>
    <text x="596.5" y="147">h₃</text>
    <text x="669.5" y="147">h₄</text>
  </g>
  <g fill="#ded8ee" stroke="#aaa1c2" stroke-width="1.1">
    <rect x="419" y="174" width="63" height="27" rx="7"/>
    <rect x="492" y="174" width="63" height="27" rx="7"/>
    <rect x="565" y="174" width="63" height="27" rx="7"/>
    <rect x="638" y="174" width="63" height="27" rx="7"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="450.5" y="191">αⱼ,₁=.55</text>
    <text x="523.5" y="191">αⱼ,₂=.25</text>
    <text x="596.5" y="191">αⱼ,₃=.15</text>
    <text x="669.5" y="191">αⱼ,₄=.05</text>
  </g>
  <g stroke="#8176a4" stroke-width="1.2" fill="none" marker-end="url(#purple-arrow)">
    <line x1="450.5" y1="157" x2="450.5" y2="174"/>
    <line x1="523.5" y1="157" x2="523.5" y2="174"/>
    <line x1="596.5" y1="157" x2="596.5" y2="174"/>
    <line x1="669.5" y1="157" x2="669.5" y2="174"/>
  </g>
  <rect x="484" y="227" width="111" height="32" rx="8" fill="#f1ded6" stroke="#c99b89"/>
  <text x="539.5" y="247" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">cⱼ = Σ αⱼ,ᵢ hᵢ</text>
  <rect x="631" y="227" width="115" height="32" rx="8" fill="#ded8ee" stroke="#aaa1c2"/>
  <text x="688.5" y="247" text-anchor="middle" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">decoder dⱼ</text>
  <g stroke="#6f6a63" stroke-width="1.1" fill="none" marker-end="url(#gray-arrow)">
    <line x1="450.5" y1="201" x2="508" y2="227"/>
    <line x1="523.5" y1="201" x2="526" y2="227"/>
    <line x1="596.5" y1="201" x2="556" y2="227"/>
    <line x1="669.5" y1="201" x2="574" y2="227"/>
    <line x1="595" y1="243" x2="631" y2="243"/>
  </g>
  <rect x="417" y="273" width="123" height="25" rx="7" fill="#f7f2e9" stroke="#d2ccc2"/>
  <text x="478.5" y="290" text-anchor="middle" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">query 随 j 改变</text>
  <text x="562" y="290" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">源时间轴保留</text>

  <text x="30" y="343" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">固定摘要：窄接口</text>
  <text x="455" y="343" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">attention：可寻址软读取</text>
</svg>
