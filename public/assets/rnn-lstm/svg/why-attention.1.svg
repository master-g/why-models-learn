  <text x="172" y="206" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">c = h₄</text>
  <line x1="211" y1="202" x2="249" y2="202"  stroke-width="1.3" marker-end="url(#gray-arrow)" class="svg-special-graphic-stroke-6f6a63"/>
