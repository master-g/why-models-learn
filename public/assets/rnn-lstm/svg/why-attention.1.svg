  <text x="42" y="252"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">源位置在末端混合</text>
  <text x="42" y="270"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-b26e58">同一个摘要供所有目标步使用</text>
  <text x="42" y="294"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">长距离路径：hᵢ → … → h₄ → c → dⱼ</text>

  <rect x="398" y="72" width="380" height="239" rx="13"   class="svg-special-fill-fill-fbf8f2 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-fbf8f2"/>
  <text x="418" y="95"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-6f8e72">step-wise attention</text>
  <text x="418" y="111"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">每个 query 重新选择源位置</text>

