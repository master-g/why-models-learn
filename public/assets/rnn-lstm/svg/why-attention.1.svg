  </g>
  <rect x="484" y="227" width="111" height="32" rx="8"   class="svg-special-fill-fill-f1ded6 svg-special-graphic-stroke-c99b89 svg-special-background-fill-f1ded6"/>
  <text x="539.5" y="247" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">cⱼ = Σ αⱼ,ᵢ hᵢ</text>
  <rect x="631" y="227" width="115" height="32" rx="8"   class="svg-special-fill-fill-ded8ee svg-special-graphic-stroke-aaa1c2 svg-special-background-fill-ded8ee"/>
  <text x="688.5" y="247" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">decoder dⱼ</text>
  <g  stroke-width="1.1" fill="none" marker-end="url(#gray-arrow)" class="svg-special-graphic-stroke-6f6a63">
