  <rect x="417" y="273" width="123" height="25" rx="7"   class="svg-special-fill-fill-f7f2e9 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-f7f2e9"/>
  <text x="478.5" y="290" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f8e72">query 随 j 改变</text>
  <text x="562" y="290"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">源时间轴保留</text>

  <text x="30" y="343"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-b26e58">固定摘要：窄接口</text>
  <text x="455" y="343"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f8e72">attention：可寻址软读取</text>
