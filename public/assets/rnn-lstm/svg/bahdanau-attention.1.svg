    <line x1="275" y1="236" x2="360" y2="263"/>
    <line x1="435" y1="236" x2="396" y2="263"/>
    <line x1="595" y1="236" x2="414" y2="263"/>
    <line x1="209" y1="280" x2="315" y2="280"/>
    <line x1="441" y1="280" x2="548" y2="280"/>
  </g>
  <path d="M209,272 C270,247 315,238 360,205" fill="none"  stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#coral-arrow)" class="svg-special-graphic-stroke-b26e58"/>
  <text x="32" y="343"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-6f6a63">每个目标步重新计算权重，源时间轴仍被保留</text>
