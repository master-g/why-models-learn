  <rect x="83" y="263" width="126" height="35" rx="8"   class="svg-special-fill-fill-f7f2e9 svg-special-graphic-stroke-d2ccc2 svg-special-background-fill-f7f2e9"/>
  <text x="146" y="278" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">decoder query</text>
  <text x="146" y="292" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">qⱼ = dⱼ₋₁</text>

  <rect x="315" y="263" width="126" height="35" rx="8"   class="svg-special-fill-fill-e9d8c9 svg-axis-stroke svg-special-background-fill-e9d8c9"/>
  <text x="378" y="278" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">weighted read</text>
  <text x="378" y="292" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">cⱼ = Σ αⱼ,ᵢ hᵢ</text>

  <rect x="548" y="263" width="154" height="35" rx="8"   class="svg-special-fill-fill-dfe9df svg-special-graphic-stroke-9db29f svg-special-background-fill-dfe9df"/>
  <text x="625" y="278" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" class="svg-special-text-fill-6f6a63">decoder update</text>
  <text x="625" y="292" text-anchor="middle"  font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" class="svg-special-text-fill-312f2f">dⱼ = f(dⱼ₋₁,[uⱼ;cⱼ])</text>

