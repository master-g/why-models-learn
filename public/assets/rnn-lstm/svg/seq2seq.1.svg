<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">Seq2Seq 编码器、context 与解码器</title>
  <desc id="desc">左侧编码器读取源序列并把末状态压缩为 context，右侧解码器逐步生成目标；绿色实线表示 teacher forcing，珊瑚色虚线表示推理时使用自己的输出。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f6a63"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f8e72"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b26e58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="16" fill="#f7f2e9"/>
  <text x="30" y="31" fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700">Seq2Seq：编码器压缩，解码器生成</text>
  <text x="30" y="52" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">训练时喂真实前缀；推理时只能喂自己的输出</text>

  <rect x="22" y="74" width="756" height="230" rx="13" fill="#fbf8f2" stroke="#d2ccc2"/>
  <text x="42" y="99" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">encoder time</text>
  <text x="401" y="99" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">decoder time</text>

  <g fill="#dfe9df" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="43" y="110" width="53" height="28" rx="8"/>
    <rect x="122" y="110" width="53" height="28" rx="8"/>
    <rect x="201" y="110" width="53" height="28" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="69" y="129">x₁</text>
    <text x="148" y="129">x₂</text>
    <text x="227" y="129">x₃</text>
  </g>
  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="43" y="158" width="53" height="32" rx="8"/>
    <rect x="122" y="158" width="53" height="32" rx="8"/>
    <rect x="201" y="158" width="53" height="32" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="69" y="179">s₁</text>
    <text x="148" y="179">s₂</text>
    <text x="227" y="179">s₃</text>
  </g>
  <g stroke="#6f6a63" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="69" y1="138" x2="69" y2="158"/>
    <line x1="148" y1="138" x2="148" y2="158"/>
    <line x1="227" y1="138" x2="227" y2="158"/>
    <line x1="96" y1="174" x2="122" y2="174"/>
    <line x1="175" y1="174" x2="201" y2="174"/>
  </g>
  <text x="148" y="211" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">sᵢ = fₑₙc(sᵢ₋₁,xᵢ)</text>

  <rect x="292" y="151" width="73" height="46" rx="10" fill="#f1ded6" stroke="#c99b89"/>
  <text x="328" y="171" text-anchor="middle" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" font-weight="700">context</text>
  <text x="328" y="187" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">c = s₃</text>
  <line x1="254" y1="174" x2="292" y2="174" stroke="#b26e58" stroke-width="1.8" marker-end="url(#coral-arrow)"/>

  <g fill="#e9d8c9" stroke="#b8b2a8" stroke-width="1.2">
    <rect x="405" y="145" width="70" height="46" rx="9"/>
    <rect x="515" y="145" width="70" height="46" rx="9"/>
    <rect x="625" y="145" width="70" height="46" rx="9"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="440" y="165" font-weight="700">decoder</text>
    <text x="550" y="165" font-weight="700">decoder</text>
    <text x="660" y="165" font-weight="700">decoder</text>
    <text x="440" y="181" fill="#6f6a63" font-size="9">d₁</text>
    <text x="550" y="181" fill="#6f6a63" font-size="9">d₂</text>
    <text x="660" y="181" fill="#6f6a63" font-size="9">d₃</text>
  </g>
  <line x1="365" y1="174" x2="405" y2="174" stroke="#b26e58" stroke-width="1.8" marker-end="url(#coral-arrow)"/>
  <g stroke="#6f6a63" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="475" y1="168" x2="515" y2="168"/>
    <line x1="585" y1="168" x2="625" y2="168"/>
  </g>

  <g fill="#ded8ee" stroke="#b8b2a8" stroke-width="1.1">
    <rect x="414" y="215" width="52" height="28" rx="8"/>
    <rect x="524" y="215" width="52" height="28" rx="8"/>
    <rect x="634" y="215" width="52" height="28" rx="8"/>
  </g>
  <g fill="#312f2f" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11" text-anchor="middle">
    <text x="440" y="234">ŷ₁</text>
    <text x="550" y="234">ŷ₂</text>
    <text x="660" y="234">ŷ₃</text>
  </g>
  <g stroke="#6f6a63" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="440" y1="191" x2="440" y2="215"/>
    <line x1="550" y1="191" x2="550" y2="215"/>
    <line x1="660" y1="191" x2="660" y2="215"/>
  </g>

  <g fill="#dfe9df" stroke="#9db29f" stroke-width="1.1">
    <rect x="405" y="263" width="70" height="25" rx="7"/>
    <rect x="515" y="263" width="70" height="25" rx="7"/>
    <rect x="625" y="263" width="70" height="25" rx="7"/>
  </g>
  <g fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10" text-anchor="middle">
    <text x="440" y="280">BOS / y₀</text>
    <text x="550" y="280">y₁</text>
    <text x="660" y="280">y₂</text>
  </g>
  <g stroke="#6f8e72" stroke-width="1.4" fill="none" marker-end="url(#green-arrow)">
    <line x1="440" y1="263" x2="440" y2="191"/>
    <line x1="550" y1="263" x2="550" y2="191"/>
    <line x1="660" y1="263" x2="660" y2="191"/>
  </g>
  <path d="M466,229 C490,250 508,250 524,229" fill="none" stroke="#b26e58" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#coral-arrow)"/>
  <path d="M576,229 C600,250 618,250 634,229" fill="none" stroke="#b26e58" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#coral-arrow)"/>
  <text x="42" y="276" fill="#6f8e72" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">训练：真实前缀</text>
  <text x="42" y="292" fill="#b26e58" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="10">推理：自己的输出</text>

  <line x1="42" y1="326" x2="758" y2="326" stroke="#c9c4bb" stroke-width="1"/>
  <text x="400" y="348" text-anchor="middle" fill="#6f6a63" font-family="'Avenir Next','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="11">固定 context 连接两条时间轴；teacher forcing 改变 decoder 的输入前缀</text>
</svg>
