<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fffaf8 { fill: #93908f; }
  .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706a67 { fill: #706a67; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fffaf8 { fill: #fffaf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fffaf8 { fill: #93908f; }
    .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706a67 { fill: #a7a4a2; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fffaf8 { fill: #363535; }



  }
</style>
  <title id="title">随机变量把样本点映射为数值并形成分布函数</title>
  <desc id="desc">左图把四个两次投掷硬币的结果映射为正面数，右图显示这个离散随机变量的阶梯分布函数。</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="arrow-coral" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px;  }
      .axis {stroke-width: 1.2; }
      .guide {stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>

  <text x="140" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">样本点 → 随机变量值</text>
  <rect x="24" y="42" width="112" height="154" rx="8" fill="none"  stroke-width="1.2" class="svg-axis-stroke"/>
  <text x="80" y="59" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Ω</text>
  <rect x="43" y="70" width="74" height="24" rx="4"   stroke-width="1" class="svg-special-fill-fill-fffaf8 svg-ink-stroke svg-special-background-fill-fffaf8"/>
  <rect x="43" y="104" width="74" height="24" rx="4"   stroke-width="1" class="svg-special-fill-fill-fffaf8 svg-ink-stroke svg-special-background-fill-fffaf8"/>
  <rect x="43" y="138" width="74" height="24" rx="4"   stroke-width="1" class="svg-special-fill-fill-fffaf8 svg-ink-stroke svg-special-background-fill-fffaf8"/>
  <rect x="43" y="172" width="74" height="24" rx="4"   stroke-width="1" class="svg-special-fill-fill-fffaf8 svg-ink-stroke svg-special-background-fill-fffaf8"/>
  <text x="80" y="87" text-anchor="middle" class="label math svg-special-text-fill-312f2f">HH</text>
  <text x="80" y="121" text-anchor="middle" class="label math svg-special-text-fill-312f2f">HT</text>
  <text x="80" y="155" text-anchor="middle" class="label math svg-special-text-fill-312f2f">TH</text>
  <text x="80" y="189" text-anchor="middle" class="label math svg-special-text-fill-312f2f">TT</text>

  <text x="178" y="59" text-anchor="middle" class="small math svg-special-text-fill-312f2f">X(ω)</text>
  <line x1="118" y1="82" x2="171" y2="82"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="118" y1="116" x2="171" y2="116"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="118" y1="150" x2="171" y2="116"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="118" y1="184" x2="171" y2="184"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <rect x="171" y="70" width="50" height="24" rx="4"  fill-opacity="0.18"  stroke-width="1.2" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <rect x="171" y="104" width="50" height="24" rx="4"  fill-opacity="0.18"  stroke-width="1.2" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <rect x="171" y="172" width="50" height="24" rx="4"  fill-opacity="0.18"  stroke-width="1.2" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <text x="196" y="87" text-anchor="middle" class="label math svg-special-text-fill-312f2f">2</text>
  <text x="196" y="121" text-anchor="middle" class="label math svg-special-text-fill-312f2f">1</text>
  <text x="196" y="189" text-anchor="middle" class="label math svg-special-text-fill-312f2f">0</text>
  <text x="140" y="220" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">HT 与 TH 都映射到 1</text>

  <text x="420" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">CDF：Fₓ(t) = P(X ≤ t)</text>
  <line x1="314" y1="204" x2="527" y2="204" class="axis svg-axis-stroke" marker-end="url(#arrow-ink)"/>
  <line x1="334" y1="220" x2="334" y2="42" class="axis svg-axis-stroke" marker-end="url(#arrow-ink)"/>
  <text x="530" y="220" class="small math svg-special-text-fill-312f2f">t</text>
  <text x="319" y="45" class="small math svg-special-text-fill-312f2f">Fₓ</text>
  <line x1="334" y1="204" x2="382" y2="204"  stroke-width="2.5" class="svg-ink-stroke"/>
  <line x1="382" y1="204" x2="382" y2="159"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <line x1="382" y1="159" x2="430" y2="159"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <line x1="430" y1="159" x2="430" y2="91"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <line x1="430" y1="91" x2="478" y2="91"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <line x1="478" y1="91" x2="478" y2="55"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <line x1="478" y1="55" x2="516" y2="55"  stroke-width="2.5" class="svg-coral-stroke-stroke"/>
  <circle cx="382" cy="159" r="4"   stroke-width="1.5" class="svg-special-fill-fill-fffaf8 svg-coral-stroke-stroke"/>
  <circle cx="430" cy="91" r="4"   stroke-width="1.5" class="svg-special-fill-fill-fffaf8 svg-coral-stroke-stroke"/>
  <circle cx="478" cy="55" r="4"   stroke-width="1.5" class="svg-special-fill-fill-fffaf8 svg-coral-stroke-stroke"/>
  <text x="382" y="222" text-anchor="middle" class="small math svg-special-text-fill-312f2f">0</text>
  <text x="430" y="222" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1</text>
  <text x="478" y="222" text-anchor="middle" class="small math svg-special-text-fill-312f2f">2</text>
  <text x="346" y="208" class="small math svg-special-text-fill-312f2f">0</text>
  <text x="346" y="163" class="small math svg-special-text-fill-312f2f">1/4</text>
  <text x="346" y="95" class="small math svg-special-text-fill-312f2f">3/4</text>
  <text x="346" y="59" class="small math svg-special-text-fill-312f2f">1</text>
</svg>
