<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">贝叶斯定理中的先验、似然与后验</title>
  <desc id="desc">左图把证据按两个假设分解并求总概率，右图把先验乘以似然后归一化为后验。</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#312f2f"/>
    </marker>
    <marker id="arrow-coral" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#cc785c"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        fill: #312f2f;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px; fill: #706a67; }
      .guide { stroke: #c9c4bb; stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="250" fill="#f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234" stroke="#e5dedb" stroke-width="1"/>

  <text x="140" y="22" text-anchor="middle" class="label">证据概率：按假设分层</text>
  <circle cx="57" cy="122" r="23" fill="#fffaf8" stroke="#312f2f" stroke-width="1.3"/>
  <text x="57" y="126" text-anchor="middle" class="small">证据 B</text>
  <line x1="80" y1="112" x2="125" y2="78" stroke="#cc785c" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
  <line x1="80" y1="132" x2="125" y2="166" stroke="#cc785c" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
  <rect x="126" y="53" width="86" height="48" rx="6" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <rect x="126" y="142" width="86" height="48" rx="6" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="169" y="72" text-anchor="middle" class="small math">A</text>
  <text x="169" y="90" text-anchor="middle" class="small math">P(B|A)P(A)</text>
  <text x="169" y="161" text-anchor="middle" class="small math">Aᶜ</text>
  <text x="169" y="179" text-anchor="middle" class="small math">P(B|Aᶜ)P(Aᶜ)</text>
  <line x1="213" y1="77" x2="249" y2="77" stroke="#312f2f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
  <line x1="213" y1="166" x2="249" y2="166" stroke="#312f2f" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
  <text x="140" y="220" text-anchor="middle" class="caption math">P(B) = 两层联合概率之和</text>

  <text x="420" y="22" text-anchor="middle" class="label">更新：先验 × 似然 → 后验</text>
  <rect x="302" y="73" width="64" height="42" rx="6" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <rect x="391" y="73" width="64" height="42" rx="6" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <rect x="480" y="73" width="64" height="42" rx="6" fill="#cc785c" fill-opacity="0.18" stroke="#cc785c" stroke-width="1.5"/>
  <text x="334" y="91" text-anchor="middle" class="small">先验</text>
  <text x="334" y="106" text-anchor="middle" class="small math">P(A)</text>
  <text x="423" y="91" text-anchor="middle" class="small">似然</text>
  <text x="423" y="106" text-anchor="middle" class="small math">P(B|A)</text>
  <text x="512" y="91" text-anchor="middle" class="small">后验</text>
  <text x="512" y="106" text-anchor="middle" class="small math">P(A|B)</text>
  <text x="377" y="99" class="small math">×</text>
  <text x="466" y="99" class="small math">÷ P(B)</text>
  <path d="M318,163 C345,145 365,145 390,163 C413,180 438,180 462,163 C485,145 507,145 532,163"
        fill="none" stroke="#cc785c" stroke-width="2"/>
  <line x1="318" y1="201" x2="532" y2="201" class="guide"/>
  <text x="425" y="190" text-anchor="middle" class="caption">证据越支持 A，后验质量越向 A 移动</text>
  <text x="425" y="224" text-anchor="middle" class="caption math">P(A|B) = P(B|A)P(A) / P(B)</text>
</svg>
