<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fffaf8 { fill: #93908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706a67 { fill: #706a67; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fffaf8 { fill: #fffaf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fffaf8 { fill: #93908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706a67 { fill: #a7a4a2; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fffaf8 { fill: #363535; }



  }
</style>
  <title id="title">贝叶斯定理中的先验、似然与后验</title>
  <desc id="desc">左图把证据按两个假设分解并求总概率，右图把先验乘以似然后归一化为后验。</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="arrow-coral" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px;  }
      .guide {stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>

  <text x="140" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">证据概率：按假设分层</text>
  <circle cx="57" cy="122" r="23"   stroke-width="1.3" class="svg-special-fill-fill-fffaf8 svg-ink-stroke"/>
  <text x="57" y="126" text-anchor="middle" class="small svg-special-text-fill-312f2f">证据 B</text>
  <line x1="80" y1="112" x2="125" y2="78"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="80" y1="132" x2="125" y2="166"  stroke-width="1.5" marker-end="url(#arrow-coral)" class="svg-coral-stroke-stroke"/>
  <rect x="126" y="53" width="86" height="48" rx="6"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <rect x="126" y="142" width="86" height="48" rx="6"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <text x="169" y="72" text-anchor="middle" class="small math svg-special-text-fill-312f2f">A</text>
  <text x="169" y="90" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P(B|A)P(A)</text>
  <text x="169" y="161" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Aᶜ</text>
  <text x="169" y="179" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P(B|Aᶜ)P(Aᶜ)</text>
  <line x1="213" y1="77" x2="249" y2="77"  stroke-width="1.2" marker-end="url(#arrow-ink)" class="svg-ink-stroke"/>
  <line x1="213" y1="166" x2="249" y2="166"  stroke-width="1.2" marker-end="url(#arrow-ink)" class="svg-ink-stroke"/>
  <text x="140" y="220" text-anchor="middle" class="caption math svg-special-text-fill-312f2f svg-special-text-fill-706a67">P(B) = 两层联合概率之和</text>

  <text x="420" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">更新：先验 × 似然 → 后验</text>
  <rect x="302" y="73" width="64" height="42" rx="6"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <rect x="391" y="73" width="64" height="42" rx="6"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <rect x="480" y="73" width="64" height="42" rx="6"  fill-opacity="0.18"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <text x="334" y="91" text-anchor="middle" class="small svg-special-text-fill-312f2f">先验</text>
  <text x="334" y="106" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P(A)</text>
  <text x="423" y="91" text-anchor="middle" class="small svg-special-text-fill-312f2f">似然</text>
  <text x="423" y="106" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P(B|A)</text>
  <text x="512" y="91" text-anchor="middle" class="small svg-special-text-fill-312f2f">后验</text>
  <text x="512" y="106" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P(A|B)</text>
  <text x="377" y="99" class="small math svg-special-text-fill-312f2f">×</text>
  <text x="466" y="99" class="small math svg-special-text-fill-312f2f">÷ P(B)</text>
  <path d="M318,163 C345,145 365,145 390,163 C413,180 438,180 462,163 C485,145 507,145 532,163"
        fill="none"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <line x1="318" y1="201" x2="532" y2="201" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="425" y="190" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">证据越支持 A，后验质量越向 A 移动</text>
  <text x="425" y="224" text-anchor="middle" class="caption math svg-special-text-fill-312f2f svg-special-text-fill-706a67">P(A|B) = P(B|A)P(A) / P(B)</text>
</svg>
