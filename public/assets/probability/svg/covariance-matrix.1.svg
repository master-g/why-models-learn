<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706a67 { fill: #706a67; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706a67 { fill: #a7a4a2; }
    .svg-special-background-fill-f4efee { fill: #343433; }



  }
</style>
  <title id="title">协方差椭圆与白化单位圆</title>
  <desc id="desc">左图展示具有相关性的二维数据云和协方差椭圆及主方向，右图展示旋转缩放后白化坐标中的单位圆。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px;  }
      .axis {stroke-width: 1.2; }
      .guide {stroke-width: 1.1; stroke-dasharray: 4 4; }
      .accent {stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>

  <text x="140" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">协方差：相关坐标的椭圆</text>
  <text x="140" y="43" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Σ = QΛQᵀ</text>
  <line x1="42" y1="150" x2="236" y2="150" class="axis svg-axis-stroke"/>
  <line x1="140" y1="57" x2="140" y2="220" class="axis svg-axis-stroke"/>
  <ellipse cx="140" cy="138" rx="76" ry="43" transform="rotate(-45 140 138)"  fill-opacity="0.12"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <line x1="82" y1="196" x2="198" y2="80" class="accent svg-coral-stroke-stroke"/>
  <line x1="111" y1="109" x2="169" y2="167" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="140" cy="138" r="4.5"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="91" cy="187" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <circle cx="111" cy="168" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <circle cx="125" cy="151" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <circle cx="156" cy="120" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <circle cx="176" cy="99" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <circle cx="194" cy="82" r="3.5"  fill-opacity="0.65" class="svg-special-fill-fill-cc785c"/>
  <text x="224" y="150" class="small math svg-special-text-fill-312f2f">X₁</text>
  <text x="145" y="69" class="small math svg-special-text-fill-312f2f">X₂</text>
  <text x="199" y="80" class="small math svg-special-text-fill-312f2f">q₁, λ₁=4</text>
  <text x="174" y="174" class="small math svg-special-text-fill-312f2f">q₂, λ₂=2</text>
  <text x="140" y="231" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">特征向量给方向，特征值给方向方差</text>

  <text x="420" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">白化：协方差变成单位矩阵</text>
  <text x="420" y="43" text-anchor="middle" class="small math svg-special-text-fill-312f2f">z = Λ⁻¹ᐟ²Qᵀ(x−μ)</text>
  <line x1="326" y1="150" x2="514" y2="150" class="axis svg-axis-stroke"/>
  <line x1="420" y1="62" x2="420" y2="220" class="axis svg-axis-stroke"/>
  <circle cx="420" cy="150" r="58"  fill-opacity="0.12"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <line x1="362" y1="150" x2="478" y2="150" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <line x1="420" y1="92" x2="420" y2="208" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="420" cy="150" r="4.5"  class="svg-special-fill-fill-312f2f"/>
  <text x="481" y="150" class="small math svg-special-text-fill-312f2f">z₁</text>
  <text x="425" y="81" class="small math svg-special-text-fill-312f2f">z₂</text>
  <text x="420" y="231" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">旋转并按 √λ 缩放后，Cov(z)=I</text>
</svg>
