<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">协方差椭圆与白化单位圆</title>
  <desc id="desc">左图展示具有相关性的二维数据云和协方差椭圆及主方向，右图展示旋转缩放后白化坐标中的单位圆。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        fill: #312f2f;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px; fill: #706a67; }
      .axis { stroke: #b8b2a8; stroke-width: 1.2; }
      .guide { stroke: #c9c4bb; stroke-width: 1.1; stroke-dasharray: 4 4; }
      .accent { stroke: #cc785c; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="250" fill="#f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234" stroke="#e5dedb" stroke-width="1"/>

  <text x="140" y="22" text-anchor="middle" class="label">协方差：相关坐标的椭圆</text>
  <text x="140" y="43" text-anchor="middle" class="small math">Σ = QΛQᵀ</text>
  <line x1="42" y1="150" x2="236" y2="150" class="axis"/>
  <line x1="140" y1="57" x2="140" y2="220" class="axis"/>
  <ellipse cx="140" cy="138" rx="76" ry="43" transform="rotate(-45 140 138)" fill="#cc785c" fill-opacity="0.12" stroke="#cc785c" stroke-width="1.5"/>
  <line x1="82" y1="196" x2="198" y2="80" class="accent"/>
  <line x1="111" y1="109" x2="169" y2="167" class="guide"/>
  <circle cx="140" cy="138" r="4.5" fill="#312f2f"/>
  <circle cx="91" cy="187" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <circle cx="111" cy="168" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <circle cx="125" cy="151" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <circle cx="156" cy="120" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <circle cx="176" cy="99" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <circle cx="194" cy="82" r="3.5" fill="#cc785c" fill-opacity="0.65"/>
  <text x="224" y="150" class="small math">X₁</text>
  <text x="145" y="69" class="small math">X₂</text>
  <text x="199" y="80" class="small math">q₁, λ₁=4</text>
  <text x="174" y="174" class="small math">q₂, λ₂=2</text>
  <text x="140" y="231" text-anchor="middle" class="caption">特征向量给方向，特征值给方向方差</text>

  <text x="420" y="22" text-anchor="middle" class="label">白化：协方差变成单位矩阵</text>
  <text x="420" y="43" text-anchor="middle" class="small math">z = Λ⁻¹ᐟ²Qᵀ(x−μ)</text>
  <line x1="326" y1="150" x2="514" y2="150" class="axis"/>
  <line x1="420" y1="62" x2="420" y2="220" class="axis"/>
  <circle cx="420" cy="150" r="58" fill="#cc785c" fill-opacity="0.12" stroke="#cc785c" stroke-width="1.5"/>
  <line x1="362" y1="150" x2="478" y2="150" class="guide"/>
  <line x1="420" y1="92" x2="420" y2="208" class="guide"/>
  <circle cx="420" cy="150" r="4.5" fill="#312f2f"/>
  <text x="481" y="150" class="small math">z₁</text>
  <text x="425" y="81" class="small math">z₂</text>
  <text x="420" y="231" text-anchor="middle" class="caption">旋转并按 √λ 缩放后，Cov(z)=I</text>
</svg>
