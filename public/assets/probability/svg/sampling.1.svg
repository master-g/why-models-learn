<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706a67 { fill: #706a67; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706a67 { fill: #a7a4a2; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">从总体到估计量的抽样流程</title>
  <desc id="desc">左侧展示总体经过抽样设计得到样本并计算估计量，右侧展示重复抽样时估计量围绕目标参数形成抽样分布。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px;  }
      .axis {stroke-width: 1.2; }
      .guide {stroke-width: 1.1; stroke-dasharray: 4 4; }
      .box {stroke-width: 1.2; }
      .accent-box {fill-opacity: 0.12;  stroke-width: 1.4; }
      .arrow {stroke-width: 1.6; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <line x1="370" y1="16" x2="370" y2="234"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>

  <text x="185" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">抽样过程：从总体取得可计算的观测</text>
  <rect x="16" y="40" width="338" height="181" rx="5" fill="none"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>
  <rect x="29" y="64" width="82" height="50" rx="4" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <rect x="139" y="64" width="92" height="50" rx="4" class="accent-box svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <rect x="259" y="64" width="82" height="50" rx="4" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <path d="M111 89 L135 89" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrowhead)"/>
  <path d="M231 89 L255 89" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrowhead)"/>
  <text x="70" y="83" text-anchor="middle" class="label svg-special-text-fill-312f2f">总体</text>
  <text x="70" y="101" text-anchor="middle" class="small math svg-special-text-fill-312f2f">P 或 U</text>
  <text x="185" y="83" text-anchor="middle" class="label svg-special-text-fill-312f2f">抽样设计</text>
  <text x="185" y="101" text-anchor="middle" class="small math svg-special-text-fill-312f2f">πᵢ &gt; 0</text>
  <text x="300" y="83" text-anchor="middle" class="label svg-special-text-fill-312f2f">样本</text>
  <text x="300" y="101" text-anchor="middle" class="small math svg-special-text-fill-312f2f">x₁,…,xₙ</text>

  <text x="70" y="132" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">目标参数 θ</text>
  <text x="185" y="132" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">谁有机会被选</text>
  <text x="300" y="132" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">一次观测结果</text>
  <path d="M300 114 L300 159 L184 159" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrowhead)"/>
  <rect x="94" y="148" width="92" height="42" rx="4" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="140" y="166" text-anchor="middle" class="label svg-special-text-fill-312f2f">计算估计量</text>
  <text x="140" y="182" text-anchor="middle" class="small math svg-special-text-fill-312f2f">θ̂ = T(x)</text>
  <text x="185" y="211" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">改变抽样结果，重复观察 θ̂</text>

  <text x="465" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">重复抽样的估计量散布</text>
  <line x1="398" y1="190" x2="535" y2="190" class="axis svg-axis-stroke"/>
  <line x1="467" y1="60" x2="467" y2="190" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <path d="M405 187 C417 183 427 172 437 151 C448 127 458 93 467 82 C476 93 486 127 497 151 C507 172 517 183 529 187"  fill-opacity="0.14"  stroke-width="1.8" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <line x1="467" y1="82" x2="467" y2="190" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="467" y="74" text-anchor="middle" class="small math svg-special-text-fill-312f2f">E[θ̂]≈θ</text>
  <text x="467" y="207" text-anchor="middle" class="small math svg-special-text-fill-312f2f">θ</text>
  <text x="467" y="231" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">偏差、方差和抽样误差</text>
</svg>
