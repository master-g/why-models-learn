<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fffaf8 { fill: #93908f; }
  .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706a67 { fill: #706a67; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fffaf8 { fill: #fffaf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fffaf8 { fill: #93908f; }
    .svg-special-graphic-stroke-e5dedb { stroke: #94908e; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706a67 { fill: #a7a4a2; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fffaf8 { fill: #363535; }



  }
</style>
  <title id="title">联合分布的概率表与平面区域</title>
  <desc id="desc">左图展示二元离散变量的联合概率表和边缘求和，右图展示单位正方形中矩形事件与三角区域事件的面积。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px;  }
      .axis {stroke-width: 1.2; }
      .guide {stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234"  stroke-width="1" class="svg-special-graphic-stroke-e5dedb"/>

  <text x="140" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">离散联合 PMF 与边缘和</text>
  <text x="170" y="49" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Y</text>
  <text x="48" y="82" text-anchor="middle" class="small math svg-special-text-fill-312f2f">X</text>
  <rect x="70" y="53" width="140" height="96"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <line x1="70" y1="85" x2="210" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="70" y1="117" x2="210" y2="117"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="116" y1="53" x2="116" y2="149"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="163" y1="53" x2="163" y2="149"  stroke-width="1" class="svg-axis-stroke"/>
  <text x="93" y="75" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Y=0</text>
  <text x="140" y="75" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Y=1</text>
  <text x="186" y="75" text-anchor="middle" class="small math svg-special-text-fill-312f2f">Σ</text>
  <text x="93" y="107" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/4</text>
  <text x="140" y="107" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/4</text>
  <text x="186" y="107" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/2</text>
  <text x="93" y="139" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/4</text>
  <text x="140" y="139" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/4</text>
  <text x="186" y="139" text-anchor="middle" class="small math svg-special-text-fill-312f2f">1/2</text>
  <text x="48" y="107" text-anchor="middle" class="small math svg-special-text-fill-312f2f">X=0</text>
  <text x="48" y="139" text-anchor="middle" class="small math svg-special-text-fill-312f2f">X=1</text>
  <line x1="214" y1="101" x2="242" y2="101"  stroke-width="1.5" marker-end="url(#arrow-ink)" class="svg-coral-stroke-stroke"/>
  <line x1="214" y1="133" x2="242" y2="133"  stroke-width="1.5" marker-end="url(#arrow-ink)" class="svg-coral-stroke-stroke"/>
  <text x="226" y="89" text-anchor="middle" class="small svg-special-text-fill-312f2f">求和</text>
  <text x="140" y="180" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">行和得到 X 的边缘分布</text>
  <text x="140" y="202" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">列和得到 Y 的边缘分布</text>
  <text x="140" y="230" text-anchor="middle" class="caption math svg-special-text-fill-312f2f svg-special-text-fill-706a67">联合 = 同时取值的概率</text>

  <text x="420" y="22" text-anchor="middle" class="label svg-special-text-fill-312f2f">连续联合密度：面积是概率</text>
  <rect x="330" y="53" width="164" height="164"   stroke-width="1.2" class="svg-special-fill-fill-fffaf8 svg-axis-stroke svg-special-background-fill-fffaf8"/>
  <polygon points="330,217 494,53 494,217"  fill-opacity="0.16" class="svg-special-fill-fill-cc785c"/>
  <rect x="330" y="135" width="49" height="82"  fill-opacity="0.35" class="svg-special-fill-fill-cc785c"/>
  <line x1="330" y1="217" x2="494" y2="53"  stroke-width="1.3" class="svg-ink-stroke"/>
  <text x="412" y="235" text-anchor="middle" class="small math svg-special-text-fill-312f2f">x</text>
  <text x="318" y="62" class="small math svg-special-text-fill-312f2f">y</text>
  <text x="354" y="178" text-anchor="middle" class="small math svg-special-text-fill-312f2f">B</text>
  <text x="430" y="185" text-anchor="middle" class="small svg-special-text-fill-312f2f">y ≥ x</text>
  <text x="354" y="130" text-anchor="middle" class="small svg-special-text-fill-312f2f">矩形</text>
  <text x="420" y="247" text-anchor="middle" class="caption svg-special-text-fill-312f2f svg-special-text-fill-706a67">联合概率由区域积分得到</text>
</svg>
