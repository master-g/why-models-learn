<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">联合分布的概率表与平面区域</title>
  <desc id="desc">左图展示二元离散变量的联合概率表和边缘求和，右图展示单位正方形中矩形事件与三角区域事件的面积。</desc>
  <defs>
    <style>
      text {
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        fill: #312f2f;
      }
      .math {
        font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif;
        font-style: italic;
      }
      .small { font-size: 11px; }
      .label { font-size: 12px; }
      .caption { font-size: 12px; fill: #706a67; }
      .axis { stroke: #b8b2a8; stroke-width: 1.2; }
      .guide { stroke: #c9c4bb; stroke-width: 1.2; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#312f2f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="250" fill="#f4efee"/>
  <line x1="280" y1="16" x2="280" y2="234" stroke="#e5dedb" stroke-width="1"/>

  <text x="140" y="22" text-anchor="middle" class="label">离散联合 PMF 与边缘和</text>
  <text x="170" y="49" text-anchor="middle" class="small math">Y</text>
  <text x="48" y="82" text-anchor="middle" class="small math">X</text>
  <rect x="70" y="53" width="140" height="96" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <line x1="70" y1="85" x2="210" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="70" y1="117" x2="210" y2="117" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="116" y1="53" x2="116" y2="149" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="163" y1="53" x2="163" y2="149" stroke="#b8b2a8" stroke-width="1"/>
  <text x="93" y="75" text-anchor="middle" class="small math">Y=0</text>
  <text x="140" y="75" text-anchor="middle" class="small math">Y=1</text>
  <text x="186" y="75" text-anchor="middle" class="small math">Σ</text>
  <text x="93" y="107" text-anchor="middle" class="small math">1/4</text>
  <text x="140" y="107" text-anchor="middle" class="small math">1/4</text>
  <text x="186" y="107" text-anchor="middle" class="small math">1/2</text>
  <text x="93" y="139" text-anchor="middle" class="small math">1/4</text>
  <text x="140" y="139" text-anchor="middle" class="small math">1/4</text>
  <text x="186" y="139" text-anchor="middle" class="small math">1/2</text>
  <text x="48" y="107" text-anchor="middle" class="small math">X=0</text>
  <text x="48" y="139" text-anchor="middle" class="small math">X=1</text>
  <line x1="214" y1="101" x2="242" y2="101" stroke="#cc785c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="214" y1="133" x2="242" y2="133" stroke="#cc785c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text x="226" y="89" text-anchor="middle" class="small">求和</text>
  <text x="140" y="180" text-anchor="middle" class="caption">行和得到 X 的边缘分布</text>
  <text x="140" y="202" text-anchor="middle" class="caption">列和得到 Y 的边缘分布</text>
  <text x="140" y="230" text-anchor="middle" class="caption math">联合 = 同时取值的概率</text>

  <text x="420" y="22" text-anchor="middle" class="label">连续联合密度：面积是概率</text>
  <rect x="330" y="53" width="164" height="164" fill="#fffaf8" stroke="#b8b2a8" stroke-width="1.2"/>
  <polygon points="330,217 494,53 494,217" fill="#cc785c" fill-opacity="0.16"/>
  <rect x="330" y="135" width="49" height="82" fill="#cc785c" fill-opacity="0.35"/>
  <line x1="330" y1="217" x2="494" y2="53" stroke="#312f2f" stroke-width="1.3"/>
  <text x="412" y="235" text-anchor="middle" class="small math">x</text>
  <text x="318" y="62" class="small math">y</text>
  <text x="354" y="178" text-anchor="middle" class="small math">B</text>
  <text x="430" y="185" text-anchor="middle" class="small">y ≥ x</text>
  <text x="354" y="130" text-anchor="middle" class="small">矩形</text>
  <text x="420" y="247" text-anchor="middle" class="caption">联合概率由区域积分得到</text>
</svg>
