  <title id="title">位置编码把 token 表示与位置表示相加</title>
  <desc id="desc">上方展示 token embedding 与位置向量相加，下方展示正弦和余弦相位以及 attention 位置对。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <linearGradient id="heat" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0"  class="svg-special-fill-stop-color-f1e4dd"/>
      <stop offset="1"  class="svg-special-fill-stop-color-cc785c"/>
    </linearGradient>
    <style>
      .ink{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC",sans-serif}
