  <text class="ink label svg-special-text-fill-312f2f" x="420" y="132">F</text>
  <path class="path svg-ink-stroke" d="M466 125H506"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M506 125l-9-6v12z"/>
  <circle class="add svg-special-fill-fill-f5e7bc svg-special-graphic-stroke-b58128" cx="531" cy="125" r="22"/>
  <path class="path svg-ink-stroke" d="M524 118l14 14M538 118l-14 14"/>
  <path class="path svg-ink-stroke" d="M553 125H599"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M599 125l-9-6v12z"/>
  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="611" y="101" width="70" height="48"/>
  <text class="ink label svg-special-text-fill-312f2f" x="635" y="132">y</text>
  <path class="shortcut svg-coral-stroke-stroke" d="M177 150V174H531V150"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M531 150l-6 9h12z"/>

  <text class="ink label svg-special-text-fill-312f2f" x="42" y="242">post-norm</text>
  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="142" y="218" width="70" height="48"/>
  <text class="ink label svg-special-text-fill-312f2f" x="168" y="249">x</text>
  <path class="path svg-ink-stroke" d="M212 242H260"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M260 242l-9-6v12z"/>
  <rect class="branch svg-special-fill-fill-e7f0ee svg-special-graphic-stroke-4f8f83 svg-special-background-fill-e7f0ee" x="272" y="218" width="70" height="48"/>
  <text class="ink label svg-special-text-fill-312f2f" x="296" y="249">F</text>
  <path class="path svg-ink-stroke" d="M342 242H390"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M390 242l-9-6v12z"/>
  <circle class="add svg-special-fill-fill-f5e7bc svg-special-graphic-stroke-b58128" cx="415" cy="242" r="22"/>
  <path class="path svg-ink-stroke" d="M408 235l14 14M422 235l-14 14"/>
  <path class="shortcut svg-coral-stroke-stroke" d="M177 267V291H415V267"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M415 267l-6 9h12z"/>
  <path class="path svg-ink-stroke" d="M437 242H470"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M470 242l-9-6v12z"/>
  <rect class="norm svg-special-fill-fill-f7dfcf svg-coral-stroke-stroke svg-special-background-fill-f7dfcf" x="482" y="218" width="104" height="48"/>
  <text class="ink svg-special-text-fill-312f2f" x="506" y="249" font-size="18">N</text>
  <path class="path svg-ink-stroke" d="M586 242H611"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M611 242l-9-6v12z"/>
  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="623" y="218" width="70" height="48"/>
  <text class="ink label svg-special-text-fill-312f2f" x="647" y="249">y</text>

  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="142" y="340">pre: J=I+J<tspan baseline-shift="sub" font-size="11">F</tspan>J<tspan baseline-shift="sub" font-size="11">N</tspan></text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="482" y="340">post: J=J<tspan baseline-shift="sub" font-size="11">N</tspan>(I+J<tspan baseline-shift="sub" font-size="11">F</tspan>)</text>
</svg>
