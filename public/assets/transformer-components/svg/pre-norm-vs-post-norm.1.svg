    .svg-special-background-fill-fffdfb { fill: #363535; }



  }
</style>
  <title id="title">Pre-norm 与 post-norm 的残差顺序</title>
  <desc id="desc">上方 pre-norm 先归一化分支输入，再把分支输出与原输入相加；下方 post-norm 先相加，再对合并结果归一化。</desc>
  <style>
    .paper {}
    .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .muted {font-size: 16px; }
    .label {font-size: 20px; font-weight: 650; }
    .small {font-size: 14px; }
    .box {stroke-width: 2; rx: 10; }
    .norm {stroke-width: 2; rx: 10; }
    .branch {stroke-width: 2; rx: 10; }
    .add {stroke-width: 2; }
    .path { fill: none;  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .shortcut { fill: none;  stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; }
    .arrow {}
  </style>
  <rect class="paper svg-special-fill-fill-f4efee svg-special-background-fill-f4efee" width="800" height="373"/>
  <text class="ink label svg-special-text-fill-312f2f" x="42" y="45">同一个 F 和 N，不同的调用顺序</text>
  <text class="ink muted svg-special-text-fill-312f2f svg-muted-fill" x="42" y="72">pre-norm 保留外侧恒等项，post-norm 让相加结果经过 N</text>

  <text class="ink label svg-special-text-fill-312f2f" x="42" y="125">pre-norm</text>
  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="142" y="101" width="70" height="48"/>
  <text class="ink label svg-special-text-fill-312f2f" x="168" y="132">x</text>
  <path class="path svg-ink-stroke" d="M212 125H240"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M240 125l-9-6v12z"/>
  <rect class="norm svg-special-fill-fill-f7dfcf svg-coral-stroke-stroke svg-special-background-fill-f7dfcf" x="252" y="101" width="104" height="48"/>
  <text class="ink svg-special-text-fill-312f2f" x="276" y="132" font-size="18">N(x)</text>
  <path class="path svg-ink-stroke" d="M356 125H384"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M384 125l-9-6v12z"/>
