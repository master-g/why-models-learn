  <text x="121" y="132" text-anchor="middle" class="muted small svg-special-text-fill-706b66">QKᵀ / √dₕ</text>
  <text x="228" y="119" text-anchor="middle" class="ink title svg-special-text-fill-312f2f">+</text>
  <rect x="250" y="82" width="198" height="66" rx="9" class="teal svg-special-fill-fill-e4eeeb svg-special-graphic-stroke-5e7772 svg-special-background-fill-e4eeeb"/>
  <text x="349" y="108" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">距离 bias</text>
  <text x="349" y="132" text-anchor="middle" class="muted small svg-special-text-fill-706b66">−mₕ Δ(i,j)</text>
