      .accent{stroke-width:1.5}
      .teal{stroke-width:1.5}
      .axis{stroke-width:1.2}
      .guide{stroke-width:1;stroke-dasharray:4 4}
      .label{font-size:14px}
      .small{font-size:12px}
      .title{font-size:20px;font-weight:600}
    </style>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-fdfbf8 svg-special-background-fill-fdfbf8"/>
  <text x="34" y="34" class="ink title svg-special-text-fill-312f2f">ALiBi：把距离惩罚直接加入 attention score</text>
  <text x="34" y="57" class="muted small svg-special-text-fill-706b66">Q/K/V 保持原路径，位置条件只改变 softmax 前的 logits</text>

  <rect x="34" y="82" width="174" height="66" rx="9" class="box svg-special-fill-fill-fffdfa svg-axis-stroke svg-special-background-fill-fffdfa"/>
