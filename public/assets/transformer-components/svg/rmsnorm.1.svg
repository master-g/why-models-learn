<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-e7f0ee { fill: #8c9291; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-f5e7bc { fill: #999076; }
  .svg-special-fill-fill-f7dfcf { fill: #9d8e84; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-4f8f83 { stroke: #4f8f83; }
  .svg-special-graphic-stroke-b58128 { stroke: #b58128; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e7f0ee { fill: #e7f0ee; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-f5e7bc { fill: #f5e7bc; }
  .svg-special-background-fill-f7dfcf { fill: #f7dfcf; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-e7f0ee { fill: #8c9291; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-f5e7bc { fill: #999076; }
    .svg-special-fill-fill-f7dfcf { fill: #9d8e84; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-4f8f83 { stroke: #4f8f83; }
    .svg-special-graphic-stroke-b58128 { stroke: #b58128; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e7f0ee { fill: #323433; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-f5e7bc { fill: #34322c; }
    .svg-special-background-fill-f7dfcf { fill: #35312f; }
    .svg-special-background-fill-fffdfb { fill: #363535; }



  }
</style>
  <title id="title">RMSNorm 沿 token 特征轴的计算流程</title>
  <desc id="desc">一个 token 的特征向量先逐坐标平方并求均值，再加入 epsilon 开平方，最后用 inverse RMS 和 gamma 做逐特征缩放；流程不包含减均值。</desc>
  <style>
    .paper {}
    .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .muted {font-size: 16px; }
    .label {font-size: 20px; font-weight: 650; }
    .small {font-size: 14px; }
    .box {stroke-width: 2; rx: 10; }
    .stat {stroke-width: 2; rx: 10; }
    .scale {stroke-width: 2; rx: 10; }
    .param {stroke-width: 2; rx: 10; }
    .path { fill: none;  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .helper { fill: none;  stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; }
    .arrow {}
  </style>
  <rect class="paper svg-special-fill-fill-f4efee svg-special-background-fill-f4efee" width="800" height="373"/>
  <text class="ink label svg-special-text-fill-312f2f" x="42" y="48">一个 token 的 RMSNorm</text>
  <text class="ink muted svg-special-text-fill-312f2f svg-muted-fill" x="42" y="75">平方求均值再缩放，不减去特征均值</text>

  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="42" y="119" width="100" height="58"/>
  <text class="ink label svg-special-text-fill-312f2f" x="75" y="154">x</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="52" y="198">d 个特征</text>
  <path class="path svg-ink-stroke" d="M142 148H173"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M173 148l-9-6v12z"/>

  <rect class="stat svg-special-fill-fill-e7f0ee svg-special-graphic-stroke-4f8f83 svg-special-background-fill-e7f0ee" x="185" y="119" width="118" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="218" y="154" font-size="18">mean(x²)</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="202" y="198">m</text>
  <path class="path svg-ink-stroke" d="M303 148H338"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M338 148l-9-6v12z"/>

  <rect class="stat svg-special-fill-fill-e7f0ee svg-special-graphic-stroke-4f8f83 svg-special-background-fill-e7f0ee" x="350" y="119" width="118" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="377" y="154" font-size="18">√(m+ε)</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="393" y="198">r</text>
  <path class="path svg-ink-stroke" d="M468 148H503"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M503 148l-9-6v12z"/>

  <rect class="scale svg-special-fill-fill-f7dfcf svg-coral-stroke-stroke svg-special-background-fill-f7dfcf" x="515" y="119" width="112" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="540" y="154" font-size="18">x/r</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="540" y="198">inverse RMS</text>
  <path class="path svg-ink-stroke" d="M627 148H657"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M657 148l-9-6v12z"/>

  <rect class="param svg-special-fill-fill-f5e7bc svg-special-graphic-stroke-b58128 svg-special-background-fill-f5e7bc" x="669" y="119" width="88" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="699" y="154" font-size="18">γ⊙</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="684" y="198">逐特征</text>

  <text class="ink label svg-special-text-fill-312f2f" x="42" y="284">统计集合</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="42" y="312">x[b,t,:] 的 d 个特征</text>
  <path class="helper svg-coral-stroke-stroke" d="M91 177V300H42"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M42 300l9-6v12z"/>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="220" y="312">不包含其他 token、batch 或 KV cache</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="515" y="312">规范形式只有 γ</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="515" y="338">LayerNorm 才执行减均值</text>
</svg>
