<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm 沿 token 特征轴的计算流程</title>
  <desc id="desc">一个 token 的特征向量先逐坐标平方并求均值，再加入 epsilon 开平方，最后用 inverse RMS 和 gamma 做逐特征缩放；流程不包含减均值。</desc>
  <style>
    .paper { fill: #f4efee; }
    .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .muted { fill: #6c6a64; font-size: 16px; }
    .label { fill: #312f2f; font-size: 20px; font-weight: 650; }
    .small { fill: #6c6a64; font-size: 14px; }
    .box { fill: #fffdfb; stroke: #312f2f; stroke-width: 2; rx: 10; }
    .stat { fill: #e7f0ee; stroke: #4f8f83; stroke-width: 2; rx: 10; }
    .scale { fill: #f7dfcf; stroke: #a9583e; stroke-width: 2; rx: 10; }
    .param { fill: #f5e7bc; stroke: #b58128; stroke-width: 2; rx: 10; }
    .path { fill: none; stroke: #312f2f; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .helper { fill: none; stroke: #a9583e; stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; }
    .arrow { fill: #312f2f; }
  </style>
  <rect class="paper" width="800" height="373"/>
  <text class="ink label" x="42" y="48">一个 token 的 RMSNorm</text>
  <text class="ink muted" x="42" y="75">平方求均值再缩放，不减去特征均值</text>

  <rect class="box" x="42" y="119" width="100" height="58"/>
  <text class="ink label" x="75" y="154">x</text>
  <text class="ink small" x="52" y="198">d 个特征</text>
  <path class="path" d="M142 148H173"/>
  <path class="arrow" d="M173 148l-9-6v12z"/>

  <rect class="stat" x="185" y="119" width="118" height="58"/>
  <text class="ink" x="218" y="154" font-size="18">mean(x²)</text>
  <text class="ink small" x="202" y="198">m</text>
  <path class="path" d="M303 148H338"/>
  <path class="arrow" d="M338 148l-9-6v12z"/>

  <rect class="stat" x="350" y="119" width="118" height="58"/>
  <text class="ink" x="377" y="154" font-size="18">√(m+ε)</text>
  <text class="ink small" x="393" y="198">r</text>
  <path class="path" d="M468 148H503"/>
  <path class="arrow" d="M503 148l-9-6v12z"/>

  <rect class="scale" x="515" y="119" width="112" height="58"/>
  <text class="ink" x="540" y="154" font-size="18">x/r</text>
  <text class="ink small" x="540" y="198">inverse RMS</text>
  <path class="path" d="M627 148H657"/>
  <path class="arrow" d="M657 148l-9-6v12z"/>

  <rect class="param" x="669" y="119" width="88" height="58"/>
  <text class="ink" x="699" y="154" font-size="18">γ⊙</text>
  <text class="ink small" x="684" y="198">逐特征</text>

  <text class="ink label" x="42" y="284">统计集合</text>
  <text class="ink small" x="42" y="312">x[b,t,:] 的 d 个特征</text>
  <path class="helper" d="M91 177V300H42"/>
  <path class="arrow" d="M42 300l9-6v12z"/>
  <text class="ink small" x="220" y="312">不包含其他 token、batch 或 KV cache</text>
  <text class="ink small" x="515" y="312">规范形式只有 γ</text>
  <text class="ink small" x="515" y="338">LayerNorm 才执行减均值</text>
</svg>
