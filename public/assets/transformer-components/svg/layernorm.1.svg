<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-e7f0ee { fill: #8c9291; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-f5e7bc { fill: #999076; }
  .svg-special-fill-fill-f7dfcf { fill: #9d8e84; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-4f8f83 { stroke: #4f8f83; }
  .svg-special-graphic-stroke-b58128 { stroke: #b58128; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e7f0ee { fill: #e7f0ee; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-f5e7bc { fill: #f5e7bc; }
  .svg-special-background-fill-f7dfcf { fill: #f7dfcf; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-e7f0ee { fill: #8c9291; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-f5e7bc { fill: #999076; }
    .svg-special-fill-fill-f7dfcf { fill: #9d8e84; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-4f8f83 { stroke: #4f8f83; }
    .svg-special-graphic-stroke-b58128 { stroke: #b58128; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e7f0ee { fill: #323433; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-f5e7bc { fill: #34322c; }
    .svg-special-background-fill-f7dfcf { fill: #35312f; }
    .svg-special-background-fill-fffdfb { fill: #363535; }



  }
</style>
  <title id="title">LayerNorm 沿 token 特征轴的计算流程</title>
  <desc id="desc">输入的一个 token 特征向量先计算均值和方差，再中心化和缩放，最后使用 gamma 和 beta 做逐特征仿射变换。</desc>
  <style>
    .paper {}
    .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .muted {font-size: 16px; }
    .label {font-size: 20px; font-weight: 650; }
    .small {font-size: 14px; }
    .box {stroke-width: 2; rx: 10; }
    .stat {stroke-width: 2; rx: 10; }
    .scale {stroke-width: 2; rx: 10; }
    .affine {stroke-width: 2; rx: 10; }
    .path { fill: none;  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .helper { fill: none;  stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; }
    .arrow {}
  </style>
  <rect class="paper svg-special-fill-fill-f4efee svg-special-background-fill-f4efee" width="800" height="373"/>
  <text class="ink label svg-special-text-fill-312f2f" x="42" y="48">一个 token 的 LayerNorm</text>
  <text class="ink muted svg-special-text-fill-312f2f svg-muted-fill" x="42" y="75">只沿特征轴归约，统计量不跨 token 共享</text>

  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="42" y="119" width="112" height="58"/>
  <text class="ink label svg-special-text-fill-312f2f" x="73" y="154">x</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="55" y="198">d 个特征</text>
  <path class="path svg-ink-stroke" d="M154 148H187"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M187 148l-9-6v12z"/>

  <rect class="stat svg-special-fill-fill-e7f0ee svg-special-graphic-stroke-4f8f83 svg-special-background-fill-e7f0ee" x="199" y="103" width="130" height="45"/>
  <text class="ink svg-special-text-fill-312f2f" x="224" y="132" font-size="18">均值 μ</text>
  <rect class="stat svg-special-fill-fill-e7f0ee svg-special-graphic-stroke-4f8f83 svg-special-background-fill-e7f0ee" x="199" y="158" width="130" height="45"/>
  <text class="ink svg-special-text-fill-312f2f" x="224" y="187" font-size="18">方差 v</text>
  <path class="helper svg-coral-stroke-stroke" d="M154 148H175V125H199"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M199 125l-9-6v12z"/>
  <path class="helper svg-coral-stroke-stroke" d="M175 181H199"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M199 181l-9-6v12z"/>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="204" y="226">每个 (b,t) 独立</text>

  <path class="path svg-ink-stroke" d="M329 148H363"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M363 148l-9-6v12z"/>
  <rect class="scale svg-special-fill-fill-f7dfcf svg-coral-stroke-stroke svg-special-background-fill-f7dfcf" x="375" y="119" width="126" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="395" y="154" font-size="18">z=(x−μ)/s</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="388" y="198">s=√(v+ε)</text>

  <path class="path svg-ink-stroke" d="M501 148H535"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M535 148l-9-6v12z"/>
  <rect class="affine svg-special-fill-fill-f5e7bc svg-special-graphic-stroke-b58128 svg-special-background-fill-f5e7bc" x="547" y="119" width="126" height="58"/>
  <text class="ink svg-special-text-fill-312f2f" x="571" y="154" font-size="18">γ⊙z+β</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="561" y="198">逐特征参数</text>

  <path class="path svg-ink-stroke" d="M673 148H707"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M707 148l-9-6v12z"/>
  <rect class="box svg-special-fill-fill-fffdfb svg-ink-stroke svg-special-background-fill-fffdfb" x="719" y="119" width="40" height="58"/>
  <text class="ink label svg-special-text-fill-312f2f" x="729" y="154">y</text>

  <text class="ink label svg-special-text-fill-312f2f" x="42" y="284">统计集合</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="42" y="312">x[b,t,:] 的 d 个特征</text>
  <path class="helper svg-coral-stroke-stroke" d="M154 177V300H42"/>
  <path class="arrow svg-special-fill-fill-312f2f" d="M42 300l9-6v12z"/>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="250" y="312">不包含其他 token、batch 或 KV cache</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="547" y="312">γ, β ∈ Rᵈ</text>
  <text class="ink small svg-special-text-fill-312f2f svg-muted-fill" x="547" y="338">LayerNorm：无 running statistics</text>
</svg>
