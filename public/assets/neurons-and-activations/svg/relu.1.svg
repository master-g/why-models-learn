<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-special-fill-fill-5f827d { fill: #5f827d; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f5f1ec { fill: #93908e; }
  .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
  .svg-special-graphic-stroke-5f827d { stroke: #5f827d; }
  .svg-special-graphic-stroke-8e8982 { stroke: #8e8982; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-5f827d { fill: #597975; }
  .svg-special-text-fill-6f6b65 { fill: #6f6b65; }

  .svg-special-background-fill-f5f1ec { fill: #f5f1ec; }
  .svg-special-background-fill-fbfaf7 { fill: #fbfaf7; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-special-fill-fill-5f827d { fill: #5f827d; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f5f1ec { fill: #93908e; }
    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-5f827d { stroke: #5f827d; }
    .svg-special-graphic-stroke-8e8982 { stroke: #8e8982; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-5f827d { fill: #94a9a6; }
    .svg-special-text-fill-6f6b65 { fill: #a6a4a0; }
    .svg-special-background-fill-f5f1ec { fill: #343433; }
    .svg-special-background-fill-fbfaf7 { fill: #353535; }



  }
</style>
  <title id="title">ReLU 的分段线与活动门</title>
  <desc id="desc">左侧显示负侧为零、正侧斜率为一的 ReLU 曲线，右侧显示其导数在零点两侧从零跳到一。</desc>
  <rect width="800" height="373" rx="18"  class="svg-special-fill-fill-fbfaf7 svg-special-background-fill-fbfaf7"/>
  <text x="34" y="38"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" class="svg-special-text-fill-312f2f">ReLU：正侧直通，负侧关门</text>
  <text x="34" y="64"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" class="svg-special-text-fill-6f6b65">max(0,z) 保留正值，活动门决定梯度是否通过</text>

  <rect x="28" y="86" width="350" height="238" rx="14"   stroke-width="2" class="svg-special-fill-fill-f5f1ec svg-axis-stroke svg-special-background-fill-f5f1ec"/>
  <text x="52" y="119"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" class="svg-special-text-fill-312f2f">函数 ReLU(z)</text>
  <text x="52" y="142"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" class="svg-special-text-fill-6f6b65">负侧输出为 0，正侧斜率为 1</text>
  <line x1="64" y1="244" x2="342" y2="244"  stroke-width="1.5" class="svg-special-graphic-stroke-8e8982"/>
  <line x1="203" y1="158" x2="203" y2="292"  stroke-width="1.5" stroke-dasharray="5 5" class="svg-axis-stroke"/>
  <line x1="64" y1="188" x2="342" y2="188"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="64" y1="288" x2="342" y2="288"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <path d="M 64 244 L 203 244 L 332 158" fill="none"  stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="svg-coral-stroke-stroke"/>
  <circle cx="203" cy="244" r="5"  class="svg-special-fill-fill-cc785c"/>
  <text x="193" y="309"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" class="svg-special-text-fill-6f6b65">z=0</text>
  <text x="68" y="180"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-6f6b65">正值</text>
  <text x="68" y="263"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-6f6b65">0</text>
  <text x="300" y="151"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-coral-text-fill">斜率 1</text>
  <text x="90" y="232"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-6f6b65">负侧被截断</text>

  <rect x="422" y="86" width="350" height="238" rx="14"   stroke-width="2" class="svg-special-fill-fill-f5f1ec svg-axis-stroke svg-special-background-fill-f5f1ec"/>
  <text x="446" y="119"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" class="svg-special-text-fill-312f2f">导数：活动门</text>
  <text x="446" y="142"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" class="svg-special-text-fill-6f6b65">负侧为 0，正侧为 1，零点需约定</text>
  <line x1="458" y1="273" x2="736" y2="273"  stroke-width="1.5" class="svg-special-graphic-stroke-8e8982"/>
  <line x1="597" y1="158" x2="597" y2="292"  stroke-width="1.5" stroke-dasharray="5 5" class="svg-axis-stroke"/>
  <line x1="458" y1="188" x2="736" y2="188"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <path d="M 458 273 L 597 273 L 597 188 L 736 188" fill="none"  stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="svg-special-graphic-stroke-5f827d"/>
  <circle cx="597" cy="273" r="5"  class="svg-special-fill-fill-5f827d"/>
  <circle cx="597" cy="188" r="5"   stroke-width="3" class="svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-5f827d"/>
  <text x="586" y="309"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" class="svg-special-text-fill-6f6b65">z=0</text>
  <text x="727" y="180"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-5f827d">1</text>
  <text x="727" y="284"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-6f6b65">0</text>
  <text x="503" y="263"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-6f6b65">梯度屏蔽</text>
  <text x="651" y="178"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" class="svg-special-text-fill-5f827d">梯度通过</text>

  <path d="M 382 205 H 413" fill="none"  stroke-width="2" class="svg-axis-stroke"/>
  <path d="M 404 198 L 414 205 L 404 212" fill="none"  stroke-width="2" class="svg-axis-stroke"/>
</svg>
