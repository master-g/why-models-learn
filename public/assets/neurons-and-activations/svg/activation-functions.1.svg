  <title id="title">激活函数：形状与任务头</title>
  <desc id="desc">左侧比较 sigmoid、tanh、ReLU 和 GELU 的形状，右侧说明隐藏层和输出头的选择边界。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .grid { fill: none;  stroke-width: 1.2; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .sigmoid { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .tanh { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .relu { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .gelu { fill: none;  stroke-width: 3; stroke-linecap: round; }
  </style>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">激活函数：形状与任务头</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">同一个预激活值，输出范围和反向梯度可以完全不同</text>

  <rect x="52" y="111" width="390" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="75" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">标量形状</text>
  <line x1="99" y1="247" x2="410" y2="247" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="255" y1="166" x2="255" y2="286" class="axis svg-special-graphic-stroke-8f8a81"/>
