  <text x="490" y="166" class="muted svg-muted-fill" font-size="12">隐藏层：非线性与梯度</text>
  <rect x="490" y="179" width="228" height="28" rx="8"  class="svg-special-fill-fill-d9e7e4 svg-special-background-fill-d9e7e4"/>
  <text x="604" y="198" class="ink svg-special-text-fill-312f2f" font-size="12" text-anchor="middle">ReLU / GELU / Swish</text>
  <text x="490" y="230" class="muted svg-muted-fill" font-size="12">输出头：目标变量与损失</text>
  <rect x="490" y="243" width="104" height="28" rx="8"  class="svg-special-fill-fill-f3e3c5 svg-special-background-fill-f3e3c5"/>
  <text x="542" y="262" class="ink svg-special-text-fill-312f2f" font-size="11" text-anchor="middle">回归：identity</text>
  <rect x="606" y="243" width="112" height="28" rx="8"  class="svg-special-fill-fill-f2d6cd svg-special-background-fill-f2d6cd"/>
  <text x="662" y="262" class="ink svg-special-text-fill-312f2f" font-size="11" text-anchor="middle">分类：logit/softmax</text>
  <text x="490" y="297" class="muted svg-muted-fill" font-size="11">先匹配语义，再比较曲线</text>
