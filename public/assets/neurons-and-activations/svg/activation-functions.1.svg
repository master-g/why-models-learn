  <line x1="333" y1="243" x2="333" y2="251" class="axis svg-special-graphic-stroke-8f8a81"/>
  <path d="M 99 276 C 131 275, 150 270, 172 258 C 192 246, 207 227, 220 214 C 235 200, 247 195, 255 195 C 267 195, 281 201, 294 214 C 308 229, 323 247, 339 258 C 359 271, 381 275, 410 276" class="sigmoid svg-coral-stroke-stroke"/>
  <path d="M 99 171 C 128 172, 151 178, 172 190 C 195 202, 215 220, 232 236 C 244 245, 252 247, 255 247 C 263 247, 275 240, 288 230 C 306 215, 326 195, 345 184 C 365 173, 386 170, 410 171" class="tanh svg-special-graphic-stroke-6e8f8a"/>
  <path d="M 99 247 L 255 247 L 410 168" class="relu svg-special-graphic-stroke-e8a55a"/>
  <path d="M 99 257 C 134 257, 166 254, 197 251 C 223 249, 244 247, 255 247 C 279 245, 301 236, 322 224 C 344 211, 365 191, 386 176 C 396 169, 404 166, 410 165" class="gelu svg-special-graphic-stroke-756b91"/>
  <text x="101" y="292" class="muted svg-muted-fill" font-size="11">负侧</text>
  <text x="395" y="292" class="muted svg-muted-fill" font-size="11">正侧</text>
  <circle cx="108" cy="153" r="4"  class="svg-special-fill-fill-cc785c"/>
  <text x="118" y="157" class="muted svg-muted-fill" font-size="11">sigmoid</text>
  <circle cx="183" cy="153" r="4"  class="svg-special-fill-fill-6e8f8a"/>
  <text x="193" y="157" class="muted svg-muted-fill" font-size="11">tanh</text>
  <circle cx="241" cy="153" r="4"  class="svg-special-fill-fill-e8a55a"/>
  <text x="251" y="157" class="muted svg-muted-fill" font-size="11">ReLU</text>
  <circle cx="306" cy="153" r="4"  class="svg-special-fill-fill-756b91"/>
  <text x="316" y="157" class="muted svg-muted-fill" font-size="11">GELU</text>

  <rect x="466" y="111" width="282" height="205" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
