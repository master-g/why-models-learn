<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">Swish 与 SwiGLU</title>
  <desc id="desc">左侧是 SiLU 曲线与 sigmoid 门，右侧是门分支和值分支逐坐标相乘后再输出投影的 SwiGLU 流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a9583e"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #6c6a64; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel { fill: #faf7f5; stroke: #d9d0cc; stroke-width: 1.5; }
      .box { fill: #f2e4df; stroke: #c98b77; stroke-width: 1.5; }
      .value { fill: #e5eee9; stroke: #74a995; stroke-width: 1.5; }
      .line { fill: none; stroke: #a9583e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .gate { fill: none; stroke: #5d8e83; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .axis { stroke: #9b938e; stroke-width: 1; }
      .guide { stroke: #d9d0cc; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="800" height="373" fill="#f4efee"/>
  <text x="28" y="30" class="ink" font-size="19" font-weight="600">Swish 与 SwiGLU</text>
  <text x="28" y="50" class="muted" font-size="11">平滑门控先改变标量形状，再扩展为两分支特征选择</text>

  <rect x="22" y="68" width="315" height="274" rx="10" class="panel"/>
  <text x="42" y="94" class="ink" font-size="15" font-weight="600">SiLU(x) = xσ(x)</text>
  <text x="42" y="113" class="muted" font-size="11">负侧保留小幅输出，正侧趋近 x</text>
  <line x1="54" y1="262" x2="305" y2="262" class="axis"/>
  <line x1="179" y1="133" x2="179" y2="300" class="axis"/>
  <line x1="54" y1="178" x2="305" y2="178" class="guide"/>
  <line x1="54" y1="220" x2="305" y2="220" class="guide"/>
  <line x1="54" y1="304" x2="305" y2="304" class="guide"/>
  <path d="M55 255 C70 258 85 266 99 275 C113 284 127 282 140 263 C151 248 162 237 175 236 C190 235 202 222 214 204 C229 182 246 159 263 145 C279 134 293 128 305 125" class="line"/>
  <path d="M55 292 C80 287 103 277 126 263 C151 247 172 225 191 204 C212 181 234 158 257 144 C275 133 292 126 305 122" class="gate"/>
  <text x="56" y="320" class="muted" font-size="10">负输入</text>
  <text x="168" y="320" class="muted" font-size="10">0</text>
  <text x="285" y="320" class="muted" font-size="10">正输入</text>
  <text x="245" y="149" fill="#a9583e" font-size="10" class="ink">SiLU</text>
  <text x="242" y="137" fill="#5d8e83" font-size="10" class="ink">σ(x)</text>

  <rect x="360" y="68" width="418" height="274" rx="10" class="panel"/>
  <text x="380" y="94" class="ink" font-size="15" font-weight="600">SwiGLU：门分支 ⊙ 值分支</text>
  <text x="380" y="113" class="muted" font-size="11">门是连续缩放，不是概率，也不是跨 token 路由</text>

  <rect x="380" y="142" width="90" height="42" rx="7" class="box"/>
  <text x="425" y="160" text-anchor="middle" class="ink" font-size="13">输入 x</text>
  <text x="425" y="176" text-anchor="middle" class="muted" font-size="10">d 维</text>

  <line x1="470" y1="163" x2="502" y2="163" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="163" x2="490" y2="235" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="505" y="132" width="105" height="57" rx="7" class="box"/>
  <text x="557" y="151" text-anchor="middle" class="ink" font-size="12">Wg x</text>
  <text x="557" y="168" text-anchor="middle" class="muted" font-size="10">门预激活 g</text>
  <text x="557" y="183" text-anchor="middle" class="ink" font-size="11">SiLU(g)</text>

  <rect x="505" y="213" width="105" height="57" rx="7" class="value"/>
  <text x="557" y="232" text-anchor="middle" class="ink" font-size="12">Wu x</text>
  <text x="557" y="249" text-anchor="middle" class="muted" font-size="10">值分支 u</text>
  <text x="557" y="264" text-anchor="middle" class="ink" font-size="11">携带幅度</text>

  <line x1="610" y1="161" x2="637" y2="193" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="241" x2="637" y2="207" stroke="#5d8e83" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="655" cy="200" r="23" fill="#f1d5c9" stroke="#a9583e" stroke-width="1.5"/>
  <text x="655" y="207" text-anchor="middle" class="ink" font-size="19">⊙</text>

  <line x1="678" y1="200" x2="705" y2="200" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="708" y="176" width="54" height="48" rx="7" class="box"/>
  <text x="735" y="195" text-anchor="middle" class="ink" font-size="12">Wd</text>
  <text x="735" y="211" text-anchor="middle" class="muted" font-size="10">输出</text>

  <text x="386" y="309" class="muted" font-size="11">h = SiLU(Wg x) ⊙ Wu x</text>
  <text x="386" y="327" class="muted" font-size="11">再投影回模型宽度 d</text>
</svg>
