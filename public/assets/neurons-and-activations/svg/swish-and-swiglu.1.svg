<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-a9583e { fill: #a9583e; }
  .svg-special-fill-fill-e5eee9 { fill: #8d928f; }
  .svg-special-fill-fill-f1d5c9 { fill: #a08d85; }
  .svg-special-fill-fill-f2e4df { fill: #988f8c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-faf7f5 { fill: #92908f; }
  .svg-special-graphic-stroke-5d8e83 { stroke: #5d8e83; }
  .svg-special-graphic-stroke-74a995 { stroke: #6a9a88; }
  .svg-special-graphic-stroke-9b938e { stroke: #978f8b; }
  .svg-special-graphic-stroke-c98b77 { stroke: #bd8370; }
  .svg-special-graphic-stroke-d9d0cc { stroke: #968f8d; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-5d8e83 { fill: #517b72; }

  .svg-special-background-fill-e5eee9 { fill: #e5eee9; }
  .svg-special-background-fill-f2e4df { fill: #f2e4df; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-faf7f5 { fill: #faf7f5; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-a9583e { fill: #a9583e; }
    .svg-special-fill-fill-e5eee9 { fill: #8d928f; }
    .svg-special-fill-fill-f1d5c9 { fill: #a08d85; }
    .svg-special-fill-fill-f2e4df { fill: #988f8c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-faf7f5 { fill: #92908f; }
    .svg-special-graphic-stroke-5d8e83 { stroke: #5d8e83; }
    .svg-special-graphic-stroke-74a995 { stroke: #6a9a88; }
    .svg-special-graphic-stroke-9b938e { stroke: #978f8b; }
    .svg-special-graphic-stroke-c98b77 { stroke: #bd8370; }
    .svg-special-graphic-stroke-d9d0cc { stroke: #968f8d; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-5d8e83 { fill: #8faaa4; }
    .svg-special-background-fill-e5eee9 { fill: #323333; }
    .svg-special-background-fill-f2e4df { fill: #343231; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-faf7f5 { fill: #353534; }



  }
</style>
  <title id="title">Swish 与 SwiGLU</title>
  <desc id="desc">左侧是 SiLU 曲线与 sigmoid 门，右侧是门分支和值分支逐坐标相乘后再输出投影的 SwiGLU 流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z"  class="svg-special-fill-fill-a9583e"/>
    </marker>
    <style>
      .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel {stroke-width: 1.5; }
      .box {stroke-width: 1.5; }
      .value {stroke-width: 1.5; }
      .line { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .gate { fill: none;  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .axis {stroke-width: 1; }
      .guide {stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="28" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">Swish 与 SwiGLU</text>
  <text x="28" y="50" class="muted svg-muted-fill" font-size="11">平滑门控先改变标量形状，再扩展为两分支特征选择</text>

  <rect x="22" y="68" width="315" height="274" rx="10" class="panel svg-special-fill-fill-faf7f5 svg-special-graphic-stroke-d9d0cc svg-special-background-fill-faf7f5"/>
  <text x="42" y="94" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">SiLU(x) = xσ(x)</text>
  <text x="42" y="113" class="muted svg-muted-fill" font-size="11">负侧保留小幅输出，正侧趋近 x</text>
  <line x1="54" y1="262" x2="305" y2="262" class="axis svg-special-graphic-stroke-9b938e"/>
  <line x1="179" y1="133" x2="179" y2="300" class="axis svg-special-graphic-stroke-9b938e"/>
  <line x1="54" y1="178" x2="305" y2="178" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <line x1="54" y1="220" x2="305" y2="220" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <line x1="54" y1="304" x2="305" y2="304" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <path d="M55 255 C70 258 85 266 99 275 C113 284 127 282 140 263 C151 248 162 237 175 236 C190 235 202 222 214 204 C229 182 246 159 263 145 C279 134 293 128 305 125" class="line svg-coral-stroke-stroke"/>
  <path d="M55 292 C80 287 103 277 126 263 C151 247 172 225 191 204 C212 181 234 158 257 144 C275 133 292 126 305 122" class="gate svg-special-graphic-stroke-5d8e83"/>
  <text x="56" y="320" class="muted svg-muted-fill" font-size="10">负输入</text>
  <text x="168" y="320" class="muted svg-muted-fill" font-size="10">0</text>
  <text x="285" y="320" class="muted svg-muted-fill" font-size="10">正输入</text>
  <text x="245" y="149"  font-size="10" class="ink svg-special-text-fill-312f2f svg-coral-text-fill">SiLU</text>
  <text x="242" y="137"  font-size="10" class="ink svg-special-text-fill-312f2f svg-special-text-fill-5d8e83">σ(x)</text>

  <rect x="360" y="68" width="418" height="274" rx="10" class="panel svg-special-fill-fill-faf7f5 svg-special-graphic-stroke-d9d0cc svg-special-background-fill-faf7f5"/>
  <text x="380" y="94" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">SwiGLU：门分支 ⊙ 值分支</text>
  <text x="380" y="113" class="muted svg-muted-fill" font-size="11">门是连续缩放，不是概率，也不是跨 token 路由</text>

  <rect x="380" y="142" width="90" height="42" rx="7" class="box svg-special-fill-fill-f2e4df svg-special-graphic-stroke-c98b77 svg-special-background-fill-f2e4df"/>
  <text x="425" y="160" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13">输入 x</text>
  <text x="425" y="176" text-anchor="middle" class="muted svg-muted-fill" font-size="10">d 维</text>

  <line x1="470" y1="163" x2="502" y2="163"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="470" y1="163" x2="490" y2="235"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="505" y="132" width="105" height="57" rx="7" class="box svg-special-fill-fill-f2e4df svg-special-graphic-stroke-c98b77 svg-special-background-fill-f2e4df"/>
  <text x="557" y="151" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">Wg x</text>
  <text x="557" y="168" text-anchor="middle" class="muted svg-muted-fill" font-size="10">门预激活 g</text>
  <text x="557" y="183" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">SiLU(g)</text>

  <rect x="505" y="213" width="105" height="57" rx="7" class="value svg-special-fill-fill-e5eee9 svg-special-graphic-stroke-74a995 svg-special-background-fill-e5eee9"/>
  <text x="557" y="232" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">Wu x</text>
  <text x="557" y="249" text-anchor="middle" class="muted svg-muted-fill" font-size="10">值分支 u</text>
  <text x="557" y="264" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">携带幅度</text>

  <line x1="610" y1="161" x2="637" y2="193"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="610" y1="241" x2="637" y2="207"  stroke-width="2" marker-end="url(#arrow)" class="svg-special-graphic-stroke-5d8e83"/>

  <circle cx="655" cy="200" r="23"   stroke-width="1.5" class="svg-special-fill-fill-f1d5c9 svg-coral-stroke-stroke"/>
  <text x="655" y="207" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="19">⊙</text>

  <line x1="678" y1="200" x2="705" y2="200"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <rect x="708" y="176" width="54" height="48" rx="7" class="box svg-special-fill-fill-f2e4df svg-special-graphic-stroke-c98b77 svg-special-background-fill-f2e4df"/>
  <text x="735" y="195" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">Wd</text>
  <text x="735" y="211" text-anchor="middle" class="muted svg-muted-fill" font-size="10">输出</text>

  <text x="386" y="309" class="muted svg-muted-fill" font-size="11">h = SiLU(Wg x) ⊙ Wu x</text>
  <text x="386" y="327" class="muted svg-muted-fill" font-size="11">再投影回模型宽度 d</text>
</svg>
