<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">死亡 ReLU 与 Leaky ReLU</title>
  <desc id="desc">左侧显示普通 ReLU 在负侧完全水平、神经元无法得到梯度，右侧显示 Leaky ReLU 在负侧保留小斜率。</desc>
  <rect width="800" height="373" rx="18" fill="#fbfaf7"/>
  <text x="34" y="38" fill="#312f2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">负侧梯度：死亡 ReLU 与 Leaky ReLU</text>
  <text x="34" y="64" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">一个把梯度截成 0，一个保留小斜率作为恢复路径</text>

  <rect x="28" y="86" width="350" height="238" rx="14" fill="#f5f1ec" stroke="#b8b2a8" stroke-width="2"/>
  <text x="52" y="119" fill="#312f2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">普通 ReLU：负侧被截断</text>
  <text x="52" y="142" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">全负输入时输出和梯度都为 0</text>
  <line x1="64" y1="244" x2="342" y2="244" stroke="#8e8982" stroke-width="1.5"/>
  <line x1="203" y1="158" x2="203" y2="292" stroke="#b8b2a8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="64" y1="188" x2="342" y2="188" stroke="#c9c4bb" stroke-width="1"/>
  <line x1="64" y1="288" x2="342" y2="288" stroke="#c9c4bb" stroke-width="1"/>
  <path d="M 64 244 L 203 244 L 332 158" fill="none" stroke="#cc785c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="244" r="5" fill="#cc785c"/>
  <circle cx="139" cy="244" r="5" fill="#cc785c"/>
  <circle cx="174" cy="244" r="5" fill="#cc785c"/>
  <text x="78" y="229" fill="#cc785c" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">全负 batch</text>
  <text x="193" y="309" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">z=0</text>
  <text x="82" y="272" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">输出 0，梯度 0</text>

  <rect x="422" y="86" width="350" height="238" rx="14" fill="#f5f1ec" stroke="#b8b2a8" stroke-width="2"/>
  <text x="446" y="119" fill="#312f2f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Leaky ReLU：负侧留坡</text>
  <text x="446" y="142" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">α&gt;0，让梯度保留一条返回路径</text>
  <line x1="458" y1="244" x2="736" y2="244" stroke="#8e8982" stroke-width="1.5"/>
  <line x1="597" y1="158" x2="597" y2="292" stroke="#b8b2a8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="458" y1="188" x2="736" y2="188" stroke="#c9c4bb" stroke-width="1"/>
  <path d="M 458 269 L 597 244 L 726 158" fill="none" stroke="#5f827d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="597" cy="244" r="5" fill="#5f827d"/>
  <text x="586" y="309" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">z=0</text>
  <text x="470" y="263" fill="#5f827d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">斜率 α</text>
  <text x="657" y="178" fill="#5f827d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">斜率 1</text>
  <text x="468" y="291" fill="#6f6b65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">输出可为负，梯度非零</text>

  <path d="M 382 205 H 413" fill="none" stroke="#b8b2a8" stroke-width="2"/>
  <path d="M 404 198 L 414 205 L 404 212" fill="none" stroke="#b8b2a8" stroke-width="2"/>
</svg>
