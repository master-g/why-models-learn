<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">饱和与梯度消失</title>
  <desc id="desc">左侧比较 sigmoid 和 tanh 在两端的饱和，右侧展示多层局部导数与权重沿反向路径相乘。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#a9583e"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #6c6a64; font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel { fill: #faf7f5; stroke: #d9d0cc; stroke-width: 1.5; }
      .sig { fill: none; stroke: #a9583e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .tanh { fill: none; stroke: #5d8e83; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .axis { stroke: #9b938e; stroke-width: 1; }
      .guide { stroke: #d9d0cc; stroke-width: 1; stroke-dasharray: 4 4; }
      .node { fill: #f2e4df; stroke: #c98b77; stroke-width: 1.5; }
      .gain { fill: #e5eee9; stroke: #74a995; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="373" fill="#f4efee"/>
  <text x="28" y="30" class="ink" font-size="19" font-weight="600">饱和与梯度消失</text>
  <text x="28" y="50" class="muted" font-size="11">局部导数先变小，深层链式乘积再把信号压到早期</text>

  <rect x="22" y="68" width="330" height="274" rx="10" class="panel"/>
  <text x="42" y="94" class="ink" font-size="15" font-weight="600">尾部饱和：输出还在变吗？</text>
  <text x="42" y="113" class="muted" font-size="11">导数接近 0 才意味着局部反向信号变弱</text>
  <line x1="53" y1="258" x2="326" y2="258" class="axis"/>
  <line x1="190" y1="132" x2="190" y2="304" class="axis"/>
  <line x1="53" y1="174" x2="326" y2="174" class="guide"/>
  <line x1="53" y1="216" x2="326" y2="216" class="guide"/>
  <line x1="53" y1="300" x2="326" y2="300" class="guide"/>
  <path d="M54 289 C74 287 92 281 108 269 C126 255 143 240 158 228 C174 215 184 205 190 198 C197 190 208 181 223 170 C240 158 257 146 274 139 C294 132 312 128 326 126" class="sig"/>
  <path d="M54 299 C76 299 96 298 113 293 C132 286 148 275 163 258 C177 243 186 226 190 198 C194 170 203 153 218 143 C233 133 252 126 273 122 C295 119 313 118 326 118" class="tanh"/>
  <text x="270" y="143" class="ink" fill="#a9583e" font-size="10">sigmoid</text>
  <text x="270" y="123" class="ink" fill="#5d8e83" font-size="10">tanh</text>
  <text x="55" y="320" class="muted" font-size="10">负尾</text>
  <text x="184" y="320" class="muted" font-size="10">0</text>
  <text x="307" y="320" class="muted" font-size="10">正尾</text>

  <rect x="375" y="68" width="403" height="274" rx="10" class="panel"/>
  <text x="395" y="94" class="ink" font-size="15" font-weight="600">反向路径：局部增益连乘</text>
  <text x="395" y="113" class="muted" font-size="11">每个节点的 w · f′(z) 都会改变早期梯度</text>

  <rect x="394" y="146" width="61" height="44" rx="7" class="node"/>
  <text x="424" y="164" text-anchor="middle" class="ink" font-size="12">gL</text>
  <text x="424" y="180" text-anchor="middle" class="muted" font-size="10">末层</text>
  <line x1="455" y1="168" x2="476" y2="168" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="479" y="146" width="65" height="44" rx="7" class="gain"/>
  <text x="511" y="164" text-anchor="middle" class="ink" font-size="11">wL f′</text>
  <text x="511" y="180" text-anchor="middle" class="muted" font-size="10">0.2</text>
  <line x1="544" y1="168" x2="565" y2="168" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="568" y="146" width="65" height="44" rx="7" class="gain"/>
  <text x="600" y="164" text-anchor="middle" class="ink" font-size="11">wL−1 f′</text>
  <text x="600" y="180" text-anchor="middle" class="muted" font-size="10">0.3</text>
  <line x1="633" y1="168" x2="654" y2="168" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="657" y="146" width="65" height="44" rx="7" class="gain"/>
  <text x="689" y="164" text-anchor="middle" class="ink" font-size="11">…</text>
  <text x="689" y="180" text-anchor="middle" class="muted" font-size="10">many layers</text>

  <path d="M722 168 C744 168 744 226 708 226 L454 226 C435 226 435 249 454 249" fill="none" stroke="#a9583e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="479" y="232" width="139" height="45" rx="7" class="node"/>
  <text x="548" y="251" text-anchor="middle" class="ink" font-size="12">早期梯度</text>
  <text x="548" y="267" text-anchor="middle" class="muted" font-size="10">0.2 × 0.3 × …</text>
  <text x="395" y="309" class="muted" font-size="11">平均因子 &lt; 1：消失</text>
  <text x="395" y="327" class="muted" font-size="11">平均因子 &gt; 1：爆炸</text>
</svg>
