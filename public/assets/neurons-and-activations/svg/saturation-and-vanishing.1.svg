<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-a9583e { fill: #a9583e; }
  .svg-special-fill-fill-e5eee9 { fill: #8d928f; }
  .svg-special-fill-fill-f2e4df { fill: #988f8c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-faf7f5 { fill: #92908f; }
  .svg-special-graphic-stroke-5d8e83 { stroke: #5d8e83; }
  .svg-special-graphic-stroke-74a995 { stroke: #6a9a88; }
  .svg-special-graphic-stroke-9b938e { stroke: #978f8b; }
  .svg-special-graphic-stroke-c98b77 { stroke: #bd8370; }
  .svg-special-graphic-stroke-d9d0cc { stroke: #968f8d; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-5d8e83 { fill: #517b72; }

  .svg-special-background-fill-e5eee9 { fill: #e5eee9; }
  .svg-special-background-fill-f2e4df { fill: #f2e4df; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-faf7f5 { fill: #faf7f5; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-a9583e { fill: #a9583e; }
    .svg-special-fill-fill-e5eee9 { fill: #8d928f; }
    .svg-special-fill-fill-f2e4df { fill: #988f8c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-faf7f5 { fill: #92908f; }
    .svg-special-graphic-stroke-5d8e83 { stroke: #5d8e83; }
    .svg-special-graphic-stroke-74a995 { stroke: #6a9a88; }
    .svg-special-graphic-stroke-9b938e { stroke: #978f8b; }
    .svg-special-graphic-stroke-c98b77 { stroke: #bd8370; }
    .svg-special-graphic-stroke-d9d0cc { stroke: #968f8d; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-5d8e83 { fill: #8faaa4; }
    .svg-special-background-fill-e5eee9 { fill: #323333; }
    .svg-special-background-fill-f2e4df { fill: #343231; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-faf7f5 { fill: #353534; }



  }
</style>
  <title id="title">饱和与梯度消失</title>
  <desc id="desc">左侧比较 sigmoid 和 tanh 在两端的饱和，右侧展示多层局部导数与权重沿反向路径相乘。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z"  class="svg-special-fill-fill-a9583e"/>
    </marker>
    <style>
      .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel {stroke-width: 1.5; }
      .sig { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .tanh { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .axis {stroke-width: 1; }
      .guide {stroke-width: 1; stroke-dasharray: 4 4; }
      .node {stroke-width: 1.5; }
      .gain {stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="28" y="30" class="ink svg-special-text-fill-312f2f" font-size="19" font-weight="600">饱和与梯度消失</text>
  <text x="28" y="50" class="muted svg-muted-fill" font-size="11">局部导数先变小，深层链式乘积再把信号压到早期</text>

  <rect x="22" y="68" width="330" height="274" rx="10" class="panel svg-special-fill-fill-faf7f5 svg-special-graphic-stroke-d9d0cc svg-special-background-fill-faf7f5"/>
  <text x="42" y="94" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">尾部饱和：输出还在变吗？</text>
  <text x="42" y="113" class="muted svg-muted-fill" font-size="11">导数接近 0 才意味着局部反向信号变弱</text>
  <line x1="53" y1="258" x2="326" y2="258" class="axis svg-special-graphic-stroke-9b938e"/>
  <line x1="190" y1="132" x2="190" y2="304" class="axis svg-special-graphic-stroke-9b938e"/>
  <line x1="53" y1="174" x2="326" y2="174" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <line x1="53" y1="216" x2="326" y2="216" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <line x1="53" y1="300" x2="326" y2="300" class="guide svg-special-graphic-stroke-d9d0cc"/>
  <path d="M54 289 C74 287 92 281 108 269 C126 255 143 240 158 228 C174 215 184 205 190 198 C197 190 208 181 223 170 C240 158 257 146 274 139 C294 132 312 128 326 126" class="sig svg-coral-stroke-stroke"/>
  <path d="M54 299 C76 299 96 298 113 293 C132 286 148 275 163 258 C177 243 186 226 190 198 C194 170 203 153 218 143 C233 133 252 126 273 122 C295 119 313 118 326 118" class="tanh svg-special-graphic-stroke-5d8e83"/>
  <text x="270" y="143" class="ink svg-special-text-fill-312f2f svg-coral-text-fill"  font-size="10">sigmoid</text>
  <text x="270" y="123" class="ink svg-special-text-fill-312f2f svg-special-text-fill-5d8e83"  font-size="10">tanh</text>
  <text x="55" y="320" class="muted svg-muted-fill" font-size="10">负尾</text>
  <text x="184" y="320" class="muted svg-muted-fill" font-size="10">0</text>
  <text x="307" y="320" class="muted svg-muted-fill" font-size="10">正尾</text>

  <rect x="375" y="68" width="403" height="274" rx="10" class="panel svg-special-fill-fill-faf7f5 svg-special-graphic-stroke-d9d0cc svg-special-background-fill-faf7f5"/>
  <text x="395" y="94" class="ink svg-special-text-fill-312f2f" font-size="15" font-weight="600">反向路径：局部增益连乘</text>
  <text x="395" y="113" class="muted svg-muted-fill" font-size="11">每个节点的 w · f′(z) 都会改变早期梯度</text>

  <rect x="394" y="146" width="61" height="44" rx="7" class="node svg-special-fill-fill-f2e4df svg-special-graphic-stroke-c98b77 svg-special-background-fill-f2e4df"/>
  <text x="424" y="164" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">gL</text>
  <text x="424" y="180" text-anchor="middle" class="muted svg-muted-fill" font-size="10">末层</text>
  <line x1="455" y1="168" x2="476" y2="168"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="479" y="146" width="65" height="44" rx="7" class="gain svg-special-fill-fill-e5eee9 svg-special-graphic-stroke-74a995 svg-special-background-fill-e5eee9"/>
  <text x="511" y="164" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">wL f′</text>
  <text x="511" y="180" text-anchor="middle" class="muted svg-muted-fill" font-size="10">0.2</text>
  <line x1="544" y1="168" x2="565" y2="168"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="568" y="146" width="65" height="44" rx="7" class="gain svg-special-fill-fill-e5eee9 svg-special-graphic-stroke-74a995 svg-special-background-fill-e5eee9"/>
  <text x="600" y="164" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">wL−1 f′</text>
  <text x="600" y="180" text-anchor="middle" class="muted svg-muted-fill" font-size="10">0.3</text>
  <line x1="633" y1="168" x2="654" y2="168"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="657" y="146" width="65" height="44" rx="7" class="gain svg-special-fill-fill-e5eee9 svg-special-graphic-stroke-74a995 svg-special-background-fill-e5eee9"/>
  <text x="689" y="164" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="11">…</text>
  <text x="689" y="180" text-anchor="middle" class="muted svg-muted-fill" font-size="10">many layers</text>

  <path d="M722 168 C744 168 744 226 708 226 L454 226 C435 226 435 249 454 249" fill="none"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <rect x="479" y="232" width="139" height="45" rx="7" class="node svg-special-fill-fill-f2e4df svg-special-graphic-stroke-c98b77 svg-special-background-fill-f2e4df"/>
  <text x="548" y="251" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">早期梯度</text>
  <text x="548" y="267" text-anchor="middle" class="muted svg-muted-fill" font-size="10">0.2 × 0.3 × …</text>
  <text x="395" y="309" class="muted svg-muted-fill" font-size="11">平均因子 &lt; 1：消失</text>
  <text x="395" y="327" class="muted svg-muted-fill" font-size="11">平均因子 &gt; 1：爆炸</text>
</svg>
