<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
  .svg-special-fill-fill-f4f0ec { fill: #93908e; }
  .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f3e1d9 { fill: #f3e1d9; }
  .svg-special-background-fill-f4f0ec { fill: #f4f0ec; }
  .svg-special-background-fill-f7f4f0 { fill: #f7f4f0; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f3e1d9 { fill: #9a8e89; }
    .svg-special-fill-fill-f4f0ec { fill: #93908e; }
    .svg-special-fill-fill-f7f4f0 { fill: #92908e; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f3e1d9 { fill: #343230; }
    .svg-special-background-fill-f4f0ec { fill: #343433; }
    .svg-special-background-fill-f7f4f0 { fill: #353434; }



  }
</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
      .small { font-size:14px; }
      .label { font-size:16px; font-weight:600; }
      .muted {font-size:13px; }
      .box {stroke-width:1.2; }
      .accent {stroke-width:1.5; }
      .line { fill:none;  stroke-width:2; marker-end:url(#arrow); }
      .guide { fill:none;  stroke-width:1; stroke-dasharray:4 4; }
    </style>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f4f0ec svg-special-background-fill-f4f0ec"/>
  <text x="36" y="34" class="ink label svg-special-text-fill-312f2f">Softmax：先定轴，再做稳定归一化</text>
  <text x="36" y="57" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">它是共享分母的向量函数，不是逐坐标复制的标量激活</text>

  <rect x="36" y="84" width="170" height="78" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="121" y="111" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">logits z</text>
  <text x="121" y="135" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">任意实数向量</text>
  <text x="121" y="153" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">每个坐标是相对分数</text>

  <rect x="254" y="84" width="190" height="78" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="349" y="111" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">归一化轴</text>
  <text x="349" y="135" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">class · key · vocab</text>
  <text x="349" y="153" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">每个竞争集合独立求和</text>

  <rect x="492" y="76" width="272" height="94" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="628" y="103" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">稳定化</text>
  <text x="628" y="127" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">m = max(z)，先算 z − m</text>
  <text x="628" y="149" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">避免 exp 上溢，保留 log-sum-exp</text>

  <path d="M206 123 H248" class="line svg-coral-stroke-stroke"/>
  <path d="M444 123 H486" class="line svg-coral-stroke-stroke"/>

  <rect x="36" y="216" width="194" height="91" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="133" y="243" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">可选 mask</text>
  <text x="133" y="267" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">无效位置 → −∞</text>
  <text x="133" y="287" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">空集合要显式处理</text>

  <rect x="274" y="208" width="226" height="99" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="387" y="235" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">exp + reduce</text>
  <text x="387" y="259" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">p = exp(z − m) / Σ exp(z − m)</text>
  <text x="387" y="282" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">分子与分母沿同一轴计算</text>

  <rect x="544" y="216" width="220" height="91" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="654" y="243" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">概率单纯形 p</text>
  <text x="654" y="267" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">pₖ &gt; 0 · Σpₖ = 1</text>
  <text x="654" y="287" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">Jacobian 耦合 · CE 梯度 p − y</text>

  <path d="M628 170 V190 H387 V202" class="line svg-coral-stroke-stroke"/>
  <path d="M230 261 H268" class="line svg-coral-stroke-stroke"/>
  <path d="M500 261 H538" class="line svg-coral-stroke-stroke"/>

  <path d="M764 261 V340 H36" class="line svg-coral-stroke-stroke"/>
  <path d="M36 340 H764" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="363" text-anchor="middle" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">验收：总和 · 平移不变性 · Jacobian 差分 · dtype 与 mask 边界</text>
</svg>
