    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-5f827d { stroke: #5f827d; }
    .svg-special-graphic-stroke-8e8982 { stroke: #8e8982; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-5f827d { fill: #94a9a6; }
