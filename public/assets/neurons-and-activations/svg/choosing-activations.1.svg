  <rect x="642" y="219" width="122" height="91" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="703" y="246" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">复测</text>
