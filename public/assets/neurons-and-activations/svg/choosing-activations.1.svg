  <text x="322" y="290" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">公平参数预算</text>

  <rect x="440" y="219" width="168" height="91" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="524" y="246" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">实现条件</text>
