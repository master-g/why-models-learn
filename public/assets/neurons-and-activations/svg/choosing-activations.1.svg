  <rect x="36" y="219" width="168" height="91" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="120" y="246" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输入统计</text>
  <text x="120" y="270" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">均值 · 方差 · 分位数</text>
  <text x="120" y="290" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">零值比例 · 导数分布</text>
  <path d="M407 203 H204 V248 H210" class="line svg-coral-stroke-stroke"/>

  <rect x="238" y="219" width="168" height="91" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="322" y="246" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">结构条件</text>
