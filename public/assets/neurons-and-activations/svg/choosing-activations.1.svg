  <text x="703" y="289" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">反向</text>
  <text x="703" y="308" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">部署</text>

  <path d="M204 265 H232" class="line svg-coral-stroke-stroke"/>
  <path d="M406 265 H434" class="line svg-coral-stroke-stroke"/>
  <path d="M608 265 H636" class="line svg-coral-stroke-stroke"/>
