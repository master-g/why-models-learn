  <text x="121" y="153" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">是否需要概率或正值</text>

  <rect x="273" y="78" width="214" height="90" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
