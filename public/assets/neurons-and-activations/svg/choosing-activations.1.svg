  <text x="380" y="151" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">sigmoid · softmax</text>

  <rect x="554" y="86" width="210" height="74" rx="10" class="box svg-special-fill-fill-f7f4f0 svg-axis-stroke svg-special-background-fill-f7f4f0"/>
  <text x="659" y="113" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">输出可表示吗？</text>
  <text x="659" y="137" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">与损失的梯度是否匹配</text>
  <text x="659" y="153" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">先排除错误输出空间</text>
