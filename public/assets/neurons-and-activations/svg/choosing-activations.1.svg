  <text x="36" y="57" class="ink muted svg-special-text-fill-312f2f svg-muted-fill">同一个名字在隐藏层、门控层和输出头里承担不同职责</text>

  <rect x="36" y="86" width="170" height="74" rx="10" class="accent svg-special-fill-fill-f3e1d9 svg-coral-stroke-stroke svg-special-background-fill-f3e1d9"/>
  <text x="121" y="113" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">任务约束</text>
