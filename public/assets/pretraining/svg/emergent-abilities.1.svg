<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-eee9e2 { fill: #94908c; }
  .svg-special-fill-fill-f5f1eb { fill: #93908d; }
  .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-eee9e2 { fill: #eee9e2; }
  .svg-special-background-fill-f5f1eb { fill: #f5f1eb; }
  .svg-special-background-fill-f8e6df { fill: #f8e6df; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-eee9e2 { fill: #94908c; }
    .svg-special-fill-fill-f5f1eb { fill: #93908d; }
    .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-eee9e2 { fill: #333332; }
    .svg-special-background-fill-f5f1eb { fill: #343433; }
    .svg-special-background-fill-f8e6df { fill: #353231; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title id="title">能力涌现的测量路径</title>
  <desc id="desc">潜在成功率随模型规模平滑上升，任务组合使曲线更陡，阈值化指标把连续曲线报告成突然的能力边界。右侧列出提示、解码、样本和评分协议。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .small { font-size: 13px; }
      .label { font-size: 16px; font-weight: 600; }
      .note { font-size: 12px; }
      .axis {stroke-width: 1.2; }
      .curve { fill: none;  stroke-width: 2.2; }
      .sharp { fill: none;  stroke-width: 2.2; }
      .dash { fill: none;  stroke-width: 1.3; stroke-dasharray: 5 4; }
      .box {stroke-width: 1.5; }
      .check {stroke-width: 1.2; }
      .warn {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="12"  class="svg-special-fill-fill-f5f1eb svg-special-background-fill-f5f1eb"/>
  <text x="38" y="33" class="ink label svg-special-text-fill-312f2f">能力涌现：连续能力经过任务与指标映射</text>
  <text x="38" y="55" class="ink small svg-special-text-fill-312f2f">先观察潜在曲线，再检查组合、阈值、样本和评测协议</text>

  <rect x="35" y="78" width="430" height="170" rx="8"   stroke-width="1.2" class="svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="54" y="101" class="ink label svg-special-text-fill-312f2f">连续的潜在成功率</text>
  <line x1="76" y1="216" x2="435" y2="216" class="axis svg-axis-stroke"/>
  <line x1="76" y1="116" x2="76" y2="216" class="axis svg-axis-stroke"/>
  <text x="74" y="232" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">小</text>
  <text x="435" y="232" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">大</text>
  <text x="58" y="121" text-anchor="end" class="ink note svg-special-text-fill-312f2f">1</text>
  <text x="58" y="219" text-anchor="end" class="ink note svg-special-text-fill-312f2f">0</text>
  <text x="252" y="245" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">模型规模 N</text>
  <path d="M78 211 C125 207 160 196 199 180 C241 163 267 145 301 132 C337 119 373 115 433 112" class="curve svg-ink-stroke"/>
  <path d="M78 214 C125 213 161 211 199 207 C241 202 270 192 301 180 C337 166 373 141 433 123" class="sharp svg-coral-stroke-stroke"/>
  <line x1="76" y1="166" x2="435" y2="166" class="dash svg-coral-stroke-stroke"/>
  <text x="437" y="169" class="ink note svg-special-text-fill-312f2f">阈值 τ</text>
  <circle cx="301" cy="132" r="4"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="373" cy="141" r="4"  class="svg-special-fill-fill-cc785c"/>
  <text x="104" y="126" class="ink note svg-special-text-fill-312f2f">latent p(N)</text>
  <text x="104" y="145" class="ink note svg-special-text-fill-312f2f">task p(N)^k</text>

  <rect x="493" y="78" width="272" height="170" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="513" y="101" class="ink label svg-special-text-fill-312f2f">观察层</text>
  <rect x="513" y="116" width="112" height="34" rx="6" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="569" y="138" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">prompt</text>
  <rect x="637" y="116" width="112" height="34" rx="6" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="693" y="138" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">解码</text>
  <rect x="513" y="163" width="112" height="34" rx="6" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="569" y="185" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">样本与 seed</text>
  <rect x="637" y="163" width="112" height="34" rx="6" class="warn svg-special-fill-fill-f8e6df svg-coral-stroke-stroke svg-special-background-fill-f8e6df"/>
  <text x="693" y="185" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">评分与阈值</text>
  <text x="513" y="220" class="ink note svg-special-text-fill-312f2f">相同模型也会因协议改变分数</text>

  <path d="M465 163 L493 163"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M435 166 C459 166 459 179 493 179" fill="none"  stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="77" y="285" width="198" height="52" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="176" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">连续指标</text>
  <text x="176" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">概率 · 子步骤 · 部分得分</text>

  <rect x="301" y="285" width="198" height="52" rx="8" class="warn svg-special-fill-fill-f8e6df svg-coral-stroke-stroke svg-special-background-fill-f8e6df"/>
  <text x="400" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">离散报告</text>
  <text x="400" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">exact match · pass threshold</text>

  <rect x="525" y="285" width="198" height="52" rx="8" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="624" y="308" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">证据边界</text>
  <text x="624" y="326" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">区间 · 对照 · 污染检查</text>

  <path d="M250 248 C238 267 207 270 176 285" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M344 248 C365 267 388 270 400 285" fill="none"  stroke-width="1.4" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>
  <path d="M616 248 C622 267 624 270 624 285" fill="none"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>

  <text x="38" y="359" class="ink note svg-special-text-fill-312f2f">红色曲线和框：任务组合与阈值可以放大拐点；机制结论需要额外对照证据</text>
</svg>
