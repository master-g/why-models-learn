<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-eee9e2 { fill: #94908c; }
  .svg-special-fill-fill-f5f1eb { fill: #93908d; }
  .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-eee9e2 { fill: #eee9e2; }
  .svg-special-background-fill-f5f1eb { fill: #f5f1eb; }
  .svg-special-background-fill-f8e6df { fill: #f8e6df; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-eee9e2 { fill: #94908c; }
    .svg-special-fill-fill-f5f1eb { fill: #93908d; }
    .svg-special-fill-fill-f8e6df { fill: #9a8e8a; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-eee9e2 { fill: #333332; }
    .svg-special-background-fill-f5f1eb { fill: #343433; }
    .svg-special-background-fill-f8e6df { fill: #353231; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title id="title">困惑度评估协议</title>
  <desc id="desc">文本经过 tokenizer 和上下文窗口切分，窗口只对不重复的 target 区域计算 NLL，所有有效 token 的 NLL 汇总后指数化为 PPL。侧边记录 tokenizer、mask、污染和版本证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .small { font-size: 13px; }
      .label { font-size: 16px; font-weight: 600; }
      .note { font-size: 12px; }
      .box {stroke-width: 1.5; }
      .check {stroke-width: 1.2; }
      .warn {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="373" rx="12"  class="svg-special-fill-fill-f5f1eb svg-special-background-fill-f5f1eb"/>
  <text x="38" y="33" class="ink label svg-special-text-fill-312f2f">困惑度评估：先固定事件，再汇总 NLL</text>
  <text x="38" y="55" class="ink small svg-special-text-fill-312f2f">tokenizer、target mask、context window 与 reduction 共同定义结果</text>

  <rect x="35" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="98" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">文本</text>
  <text x="98" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">raw · split · hash</text>

  <rect x="186" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="249" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Tokenizer</text>
  <text x="249" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">token · BOS · EOS</text>

  <rect x="337" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="400" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">窗口</text>
  <text x="400" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">context · stride</text>

  <rect x="488" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="551" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Target mask</text>
  <text x="551" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">只计分新位置</text>

  <rect x="639" y="88" width="126" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="702" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">log probability</text>
  <text x="702" y="136" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">teacher forcing</text>

  <path d="M161 119 L186 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M312 119 L337 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M463 119 L488 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M614 119 L639 119"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>

  <rect x="112" y="192" width="180" height="53" rx="8" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="202" y="215" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">充分统计量</text>
  <text x="202" y="233" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">S = NLL · Q = 有效 token</text>

  <rect x="310" y="192" width="180" height="53" rx="8" class="warn svg-special-fill-fill-f8e6df svg-coral-stroke-stroke svg-special-background-fill-f8e6df"/>
  <text x="400" y="215" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">版本与污染证据</text>
  <text x="400" y="233" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">manifest · duplicate · clean set</text>

  <rect x="508" y="192" width="180" height="53" rx="8" class="box svg-special-fill-fill-faf8f5 svg-ink-stroke svg-special-background-fill-faf8f5"/>
  <text x="598" y="215" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">PPL = exp(S / Q)</text>
  <text x="598" y="233" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">先汇总，最后指数化</text>

  <path d="M702 150 C702 170 620 175 598 192" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M551 150 C551 170 250 170 202 192" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M400 150 L400 192"  stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#coral-arrow)" class="svg-coral-stroke-stroke"/>
  <path d="M292 218 L508 218"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-ink-stroke"/>

  <rect x="40" y="288" width="215" height="50" rx="8" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="147.5" y="310" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">token-level</text>
  <text x="147.5" y="328" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">按有效 token 加权</text>

  <rect x="292" y="288" width="215" height="50" rx="8" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="399.5" y="310" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">sequence-level</text>
  <text x="399.5" y="328" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">每条文档等权</text>

  <rect x="545" y="288" width="215" height="50" rx="8" class="check svg-special-fill-fill-eee9e2 svg-axis-stroke svg-special-background-fill-eee9e2"/>
  <text x="652.5" y="310" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">报告</text>
  <text x="652.5" y="328" text-anchor="middle" class="ink note svg-special-text-fill-312f2f">NLL · PPL · CI · 限制</text>

  <path d="M598 245 C598 268 652 268 652.5 288" fill="none"  stroke-width="1.3" marker-end="url(#arrow)" class="svg-ink-stroke"/>
  <path d="M202 245 C202 268 147.5 268 147.5 288" fill="none"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M400 245 L399.5 288"  stroke-width="1.2" marker-end="url(#arrow)" class="svg-axis-stroke"/>

  <text x="40" y="269" class="ink note svg-special-text-fill-312f2f">重叠窗口可以共享 context，不能重复计入 target</text>
  <text x="40" y="357" class="ink note svg-special-text-fill-312f2f">同一文本、tokenizer、mask、窗口和版本协议下，PPL 才具有可比性</text>
</svg>
