<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">下一词预测与最大似然</title>
  <desc id="desc">token 序列经过因果分解、对数求和与损失归约，形成训练目标</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cc785c"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #6e6965; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 14px; }
      .label { font-size: 16px; font-weight: 650; }
      .formula { font-size: 18px; font-weight: 650; }
      .card { fill: #f7f4ef; stroke: #b8b2a8; stroke-width: 1.5; }
      .accent { fill: #fff3ed; stroke: #cc785c; stroke-width: 1.6; }
      .line { fill: none; stroke: #cc785c; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #c9c4bb; stroke-width: 1.3; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="800" height="373" fill="#fcfaf7"/>
  <text x="40" y="34" class="ink" font-size="22" font-weight="700">下一词预测 = 固定 token 事件上的最大似然</text>
  <text x="40" y="58" class="muted small">tokenizer、边界、mask 和权重先固定；模型只调整条件概率</text>

  <rect x="34" y="87" width="162" height="126" rx="12" class="card"/>
  <text x="50" y="113" class="ink label">真实 token 序列</text>
  <text x="50" y="142" class="ink formula">BOS  a  b  EOS</text>
  <text x="50" y="170" class="muted small">前缀 cₜ → 标签 yₜ</text>
  <text x="50" y="194" class="muted small">每个有效位置一条事件</text>

  <path d="M198 150 H238" class="line"/>

  <rect x="241" y="87" width="176" height="126" rx="12" class="accent"/>
  <text x="257" y="113" class="ink label">因果分解</text>
  <text x="257" y="143" class="ink formula">p(x₁:T | x₀)</text>
  <text x="257" y="170" class="ink formula">= ∏ₜ p(yₜ | cₜ)</text>
  <text x="257" y="194" class="muted small">真实前缀由 causal mask 固定</text>

  <path d="M419 150 H459" class="line"/>

  <rect x="462" y="87" width="150" height="126" rx="12" class="card"/>
  <text x="478" y="113" class="ink label">对数求和</text>
  <text x="478" y="143" class="ink formula">log ∏ pₜ</text>
  <text x="478" y="170" class="ink formula">= Σ log pₜ</text>
  <text x="478" y="194" class="muted small">避免长序列下溢</text>

  <path d="M614 150 H654" class="line"/>

  <rect x="657" y="87" width="109" height="126" rx="12" class="accent"/>
  <text x="671" y="113" class="ink label">NLL</text>
  <text x="671" y="143" class="ink formula">−Σ log pₜ</text>
  <text x="671" y="170" class="muted small">/ 有效 token</text>
  <text x="671" y="194" class="muted small">反向传播</text>

  <path d="M96 232 V278 H704 V232" class="dash"/>
  <text x="40" y="307" class="ink label">目标合同</text>
  <text x="40" y="333" class="muted small">token-level mean 与总 NLL 只差固定常数；sequence-level mean、加权采样、label smoothing 会改变被拟合的分布</text>
  <circle cx="704" cy="278" r="5" fill="#cc785c"/>
</svg>
