<?xml version="1.0" encoding="UTF-8"?>
<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f7f4ef { fill: #92908e; }
  .svg-special-fill-fill-fcfaf7 { fill: #92908f; }
  .svg-special-fill-fill-fff3ed { fill: #978f8c; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6e6965 { fill: #6e6965; }

  .svg-special-background-fill-f7f4ef { fill: #f7f4ef; }
  .svg-special-background-fill-fcfaf7 { fill: #fcfaf7; }
  .svg-special-background-fill-fff3ed { fill: #fff3ed; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f7f4ef { fill: #92908e; }
    .svg-special-fill-fill-fcfaf7 { fill: #92908f; }
    .svg-special-fill-fill-fff3ed { fill: #978f8c; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6e6965 { fill: #a7a4a1; }
    .svg-special-background-fill-f7f4ef { fill: #353434; }
    .svg-special-background-fill-fcfaf7 { fill: #353535; }
    .svg-special-background-fill-fff3ed { fill: #363433; }



  }
</style>
  <title id="title">下一词预测与最大似然</title>
  <desc id="desc">token 序列经过因果分解、对数求和与损失归约，形成训练目标</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted {font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 14px; }
      .label { font-size: 16px; font-weight: 650; }
      .formula { font-size: 18px; font-weight: 650; }
      .card {stroke-width: 1.5; }
      .accent {stroke-width: 1.6; }
      .line { fill: none;  stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none;  stroke-width: 1.3; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-fcfaf7 svg-special-background-fill-fcfaf7"/>
  <text x="40" y="34" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">下一词预测 = 固定 token 事件上的最大似然</text>
  <text x="40" y="58" class="muted small svg-special-text-fill-6e6965">tokenizer、边界、mask 和权重先固定；模型只调整条件概率</text>

  <rect x="34" y="87" width="162" height="126" rx="12" class="card svg-special-fill-fill-f7f4ef svg-axis-stroke svg-special-background-fill-f7f4ef"/>
  <text x="50" y="113" class="ink label svg-special-text-fill-312f2f">真实 token 序列</text>
  <text x="50" y="142" class="ink formula svg-special-text-fill-312f2f">BOS  a  b  EOS</text>
  <text x="50" y="170" class="muted small svg-special-text-fill-6e6965">前缀 cₜ → 标签 yₜ</text>
  <text x="50" y="194" class="muted small svg-special-text-fill-6e6965">每个有效位置一条事件</text>

  <path d="M198 150 H238" class="line svg-coral-stroke-stroke"/>

  <rect x="241" y="87" width="176" height="126" rx="12" class="accent svg-special-fill-fill-fff3ed svg-coral-stroke-stroke svg-special-background-fill-fff3ed"/>
  <text x="257" y="113" class="ink label svg-special-text-fill-312f2f">因果分解</text>
  <text x="257" y="143" class="ink formula svg-special-text-fill-312f2f">p(x₁:T | x₀)</text>
  <text x="257" y="170" class="ink formula svg-special-text-fill-312f2f">= ∏ₜ p(yₜ | cₜ)</text>
  <text x="257" y="194" class="muted small svg-special-text-fill-6e6965">真实前缀由 causal mask 固定</text>

  <path d="M419 150 H459" class="line svg-coral-stroke-stroke"/>

  <rect x="462" y="87" width="150" height="126" rx="12" class="card svg-special-fill-fill-f7f4ef svg-axis-stroke svg-special-background-fill-f7f4ef"/>
  <text x="478" y="113" class="ink label svg-special-text-fill-312f2f">对数求和</text>
  <text x="478" y="143" class="ink formula svg-special-text-fill-312f2f">log ∏ pₜ</text>
  <text x="478" y="170" class="ink formula svg-special-text-fill-312f2f">= Σ log pₜ</text>
  <text x="478" y="194" class="muted small svg-special-text-fill-6e6965">避免长序列下溢</text>

  <path d="M614 150 H654" class="line svg-coral-stroke-stroke"/>

  <rect x="657" y="87" width="109" height="126" rx="12" class="accent svg-special-fill-fill-fff3ed svg-coral-stroke-stroke svg-special-background-fill-fff3ed"/>
  <text x="671" y="113" class="ink label svg-special-text-fill-312f2f">NLL</text>
  <text x="671" y="143" class="ink formula svg-special-text-fill-312f2f">−Σ log pₜ</text>
  <text x="671" y="170" class="muted small svg-special-text-fill-6e6965">/ 有效 token</text>
  <text x="671" y="194" class="muted small svg-special-text-fill-6e6965">反向传播</text>

  <path d="M96 232 V278 H704 V232" class="dash svg-special-graphic-stroke-c9c4bb"/>
  <text x="40" y="307" class="ink label svg-special-text-fill-312f2f">目标合同</text>
  <text x="40" y="333" class="muted small svg-special-text-fill-6e6965">token-level mean 与总 NLL 只差固定常数；sequence-level mean、加权采样、label smoothing 会改变被拟合的分布</text>
  <circle cx="704" cy="278" r="5"  class="svg-special-fill-fill-cc785c"/>
</svg>
