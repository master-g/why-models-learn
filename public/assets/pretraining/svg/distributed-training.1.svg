      <text x="190" y="36" text-anchor="middle" font-size="12">DP rank 1</text>
      <path d="M58 54 V75 M190 54 V75"  stroke-width="1.5" stroke-dasharray="4 4" class="svg-axis-stroke"/>
      <text x="0" y="98" font-size="13" font-weight="600">pipeline stages</text>
      <rect x="0" y="112" width="96" height="62" rx="7"   class="svg-special-fill-fill-f5e2d9 svg-coral-stroke-stroke svg-special-background-fill-f5e2d9"/>
      <rect x="122" y="112" width="96" height="62" rx="7"   class="svg-special-fill-fill-e7eee9 svg-special-graphic-stroke-5f7c75 svg-special-background-fill-e7eee9"/>
      <rect x="244" y="112" width="96" height="62" rx="7"   class="svg-special-fill-fill-f1e8df svg-special-graphic-stroke-9a6f4f svg-special-background-fill-f1e8df"/>
      <text x="48" y="137" text-anchor="middle" font-size="13" font-weight="600">stage 0</text>
      <text x="48" y="157" text-anchor="middle" font-size="11">layer 0–L₀</text>
      <text x="170" y="137" text-anchor="middle" font-size="13" font-weight="600">stage 1</text>
      <text x="170" y="157" text-anchor="middle" font-size="11">layer L₀–L₁</text>
      <text x="292" y="137" text-anchor="middle" font-size="13" font-weight="600">stage 2</text>
      <text x="292" y="157" text-anchor="middle" font-size="11">layer L₁–L</text>
      <path d="M96 143 H122 M218 143 H244"  stroke-width="2" class="svg-special-graphic-stroke-8b857d"/>
      <path d="M112 137 L122 143 L112 149 M234 137 L244 143 L234 149" fill="none"  stroke-width="2" class="svg-special-graphic-stroke-8b857d"/>
      <circle cx="32" cy="194" r="5"  class="svg-special-fill-fill-cc785c"/>
      <circle cx="52" cy="194" r="5"  class="svg-special-fill-fill-cc785c"/>
      <circle cx="72" cy="194" r="5"  class="svg-special-fill-fill-cc785c"/>
      <text x="88" y="199" font-size="11"  class="svg-special-text-fill-6f6a63">micro-batches</text>
      <path d="M48 224 H292"  stroke-width="2" class="svg-axis-stroke"/>
      <path d="M292 224 L282 218 M292 224 L282 230"  stroke-width="2" class="svg-axis-stroke"/>
      <text x="0" y="247" font-size="12"  class="svg-special-text-fill-6f6a63">activation →</text>
      <text x="184" y="247" font-size="12"  class="svg-special-text-fill-6f6a63">gradient ←</text>
    </g>
    <g transform="translate(450 86)">
      <rect x="0" y="0" width="304" height="222" rx="8"   class="svg-special-fill-fill-fffaf5 svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fffaf5"/>
