      <text x="60" y="195" font-size="13">all-gather / reduce-scatter</text>
      <circle cx="45" cy="217" r="6"  class="svg-special-fill-fill-9a6f4f"/>
      <text x="60" y="222" font-size="13">all-to-all for experts</text>
