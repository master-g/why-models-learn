  <title id="title">分布式训练的并行轴与通信</title>
  <desc id="desc">左侧显示数据并行副本和流水线 stage，右侧显示 global batch、局部张量和 collective 通信。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f7f3ee svg-special-background-fill-f7f3ee"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC',sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="40" y="34" font-size="20" font-weight="600">分布式训练：global batch、并行轴与 collective</text>
    <text x="40" y="58" font-size="12"  class="svg-special-text-fill-6f6a63">数据副本切 batch，模型副本切层或矩阵，通信保持局部结果一致</text>
    <g transform="translate(48 86)">
      <text x="0" y="0" font-size="13" font-weight="600">DP replicas</text>
