<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
  <rect width="800" height="373" fill="#f7f3ee"/>
  <style>
    .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box { stroke: #b8b2a8; stroke-width: 1.5; rx: 12; }
    .arrow { stroke: #312f2f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #c9c4bb; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#312f2f"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="ink title">预训练：数据合同决定参数看到的 token</text>
  <text x="400" y="51" text-anchor="middle" class="ink small">token budget、更新状态和验证协议与模型前向同样需要保存</text>

  <rect x="24" y="91" width="112" height="112" class="box" fill="#f0e2dc"/>
  <text x="80" y="116" text-anchor="middle" class="ink label">corpus</text>
  <text x="80" y="139" text-anchor="middle" class="ink small">documents</text>
  <text x="80" y="160" text-anchor="middle" class="ink small">source / license</text>
  <text x="80" y="181" text-anchor="middle" class="ink small">dedup / filter</text>

  <rect x="160" y="91" width="112" height="112" class="box" fill="#f2ead9"/>
  <text x="216" y="116" text-anchor="middle" class="ink label">tokenize</text>
  <text x="216" y="139" text-anchor="middle" class="ink small">token IDs</text>
  <text x="216" y="160" text-anchor="middle" class="ink small">EOS / PAD</text>
  <text x="216" y="181" text-anchor="middle" class="ink small">mixture πᵢ</text>

  <rect x="296" y="91" width="112" height="112" class="box" fill="#e3edf0"/>
  <text x="352" y="116" text-anchor="middle" class="ink label">pack</text>
  <text x="352" y="139" text-anchor="middle" class="ink small">X / shifted Y</text>
  <text x="352" y="160" text-anchor="middle" class="ink small">mask / boundary</text>
  <text x="352" y="181" text-anchor="middle" class="ink small">B × S</text>

  <rect x="432" y="91" width="112" height="112" class="box" fill="#e3edf0"/>
  <text x="488" y="116" text-anchor="middle" class="ink label">model</text>
  <text x="488" y="139" text-anchor="middle" class="ink small">next-token logits</text>
  <text x="488" y="160" text-anchor="middle" class="ink small">causal mask</text>
  <text x="488" y="181" text-anchor="middle" class="ink small">loss</text>

  <rect x="568" y="91" width="96" height="112" class="box" fill="#f2ead9"/>
  <text x="616" y="116" text-anchor="middle" class="ink label">update</text>
  <text x="616" y="139" text-anchor="middle" class="ink small">global batch</text>
  <text x="616" y="160" text-anchor="middle" class="ink small">optimizer</text>
  <text x="616" y="181" text-anchor="middle" class="ink small">tokens seen</text>

  <rect x="688" y="91" width="88" height="112" class="box" fill="#f0e2dc"/>
  <text x="732" y="116" text-anchor="middle" class="ink label">state</text>
  <text x="732" y="139" text-anchor="middle" class="ink small">checkpoint</text>
  <text x="732" y="160" text-anchor="middle" class="ink small">validation</text>
  <text x="732" y="181" text-anchor="middle" class="ink small">resume</text>

  <path d="M136 147 L160 147" class="arrow"/>
  <path d="M272 147 L296 147" class="arrow"/>
  <path d="M408 147 L432 147" class="arrow"/>
  <path d="M544 147 L568 147" class="arrow"/>
  <path d="M664 147 L688 147" class="arrow"/>

  <path d="M732 219 L732 272 L80 272 L80 219" class="dash"/>
  <text x="400" y="300" text-anchor="middle" class="ink label">可恢复训练的计数</text>
  <text x="400" y="322" text-anchor="middle" class="ink small">valid target tokens · data mixture · optimizer state · RNG · dataloader cursor · evaluation split</text>
</svg>
