<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-ead2c7 { fill: #9e8d86; }
  .svg-special-fill-fill-ece6dc { fill: #94908a; }
  .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
  .svg-special-fill-fill-f5f1ea { fill: #93908c; }
  .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6d6862 { fill: #6d6862; }

  .svg-special-background-fill-ead2c7 { fill: #ead2c7; }
  .svg-special-background-fill-ece6dc { fill: #ece6dc; }
  .svg-special-background-fill-f0d9d0 { fill: #f0d9d0; }
  .svg-special-background-fill-f5f1ea { fill: #f5f1ea; }
  .svg-special-background-fill-fbfaf7 { fill: #fbfaf7; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-ead2c7 { fill: #9e8d86; }
    .svg-special-fill-fill-ece6dc { fill: #94908a; }
    .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
    .svg-special-fill-fill-f5f1ea { fill: #93908c; }
    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6d6862 { fill: #a7a4a0; }
    .svg-special-background-fill-ead2c7 { fill: #332f2e; }
    .svg-special-background-fill-ece6dc { fill: #333231; }
    .svg-special-background-fill-f0d9d0 { fill: #34302f; }
    .svg-special-background-fill-f5f1ea { fill: #343433; }
    .svg-special-background-fill-fbfaf7 { fill: #353535; }



  }
</style>
  <title id="title">线性 attention 通过特征映射先汇总 key/value</title>
  <desc id="desc">左侧展示标准 attention 先构造 T 乘 S 矩阵，右侧展示线性 attention 先计算 phi(K) 转置 V 与 phi(K) 的摘要，再由 phi(Q) 读取；底部展示 causal prefix state。</desc>
  <style>
    .ink {}
    .muted {}
    .coral {}
    .coral-soft {}
    .paper {stroke-width: 1; }
    .line {stroke-width: 1.6; fill: none; }
    .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .grid {stroke-width: 1; }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-f5f1ea svg-special-background-fill-f5f1ea"/>
  <text x="40" y="32" class="ink title svg-special-text-fill-312f2f">先配对全部 key，还是先压缩成一个摘要？</text>
  <text x="40" y="53" class="muted label svg-special-text-fill-6d6862">linear attention 用特征映射和结合律避开显式 T×S 矩阵，通常以近似 softmax 为代价</text>

  <rect x="28" y="72" width="352" height="187" rx="10" class="paper svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="46" y="99" class="ink head svg-special-text-fill-312f2f">标准 dense attention</text>
  <rect x="48" y="119" width="54" height="36" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="75" y="142" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Q</text>
  <path d="M106 137H143" class="arrow svg-coral-stroke-stroke"/>
  <rect x="151" y="115" width="106" height="74" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <path d="M151 115H257M151 133H257M151 151H257M151 169H257M151 187H257M169 115V189M187 115V189M205 115V189M223 115V189M241 115V189" class="grid svg-special-graphic-stroke-c9c4bb"/>
  <text x="204" y="210" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">T × S map</text>
  <path d="M263 137H300" class="arrow svg-coral-stroke-stroke"/>
  <rect x="308" y="119" width="54" height="36" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="335" y="142" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">A V</text>
  <text x="46" y="239" class="muted small svg-special-text-fill-6d6862">位置对：T S　·　map：通常物化</text>

  <rect x="400" y="72" width="372" height="187" rx="10" class="paper svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="418" y="99" class="ink head svg-special-text-fill-312f2f">linear attention</text>
  <rect x="418" y="119" width="74" height="36" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="455" y="142" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">φ(K)ᵀV</text>
  <rect x="418" y="168" width="74" height="36" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="455" y="191" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">φ(K)ᵀ1</text>
  <path d="M498 137H535" class="arrow svg-coral-stroke-stroke"/>
  <path d="M498 186H535" class="arrow svg-coral-stroke-stroke"/>
  <rect x="543" y="119" width="74" height="36" rx="5"  class="svg-special-fill-fill-ead2c7 svg-special-background-fill-ead2c7"/>
  <text x="580" y="142" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">G, z</text>
  <rect x="543" y="168" width="74" height="36" rx="5"  class="svg-special-fill-fill-ead2c7 svg-special-background-fill-ead2c7"/>
  <text x="580" y="191" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">r × d<tspan baseline-shift="sub" font-size="10">v</tspan></text>
  <rect x="648" y="144" width="74" height="36" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="685" y="167" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">φ(Q)</text>
  <path d="M623 137H642" class="arrow svg-coral-stroke-stroke"/>
  <path d="M623 186H642" class="arrow svg-coral-stroke-stroke"/>
  <text x="418" y="239" class="muted small svg-special-text-fill-6d6862">摘要：r(d<tspan baseline-shift="sub" font-size="9">v</tspan>+1)　·　长度项：T+S</text>

  <rect x="28" y="278" width="744" height="71" rx="9"  class="svg-special-fill-fill-ece6dc svg-special-background-fill-ece6dc"/>
  <text x="46" y="302" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">causal：</tspan>G<tspan baseline-shift="sub" font-size="10">t</tspan>=G<tspan baseline-shift="sub" font-size="10">t−1</tspan>+φ(k<tspan baseline-shift="sub" font-size="10">t</tspan>)v<tspan baseline-shift="sub" font-size="10">t</tspan>ᵀ，z<tspan baseline-shift="sub" font-size="10">t</tspan>=z<tspan baseline-shift="sub" font-size="10">t−1</tspan>+φ(k<tspan baseline-shift="sub" font-size="10">t</tspan>)</text>
  <text x="46" y="326" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">检查：</tspan>固定 r 时每步读取摘要的成本不随历史长度增长，但有限 φ 通常不等于标准 softmax</text>
</svg>
