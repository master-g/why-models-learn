<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-ead2c7 { fill: #9e8d86; }
  .svg-special-fill-fill-ece6dc { fill: #94908a; }
  .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
  .svg-special-fill-fill-f5f1ea { fill: #93908c; }
  .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6d6862 { fill: #6d6862; }

  .svg-special-background-fill-ead2c7 { fill: #ead2c7; }
  .svg-special-background-fill-ece6dc { fill: #ece6dc; }
  .svg-special-background-fill-f0d9d0 { fill: #f0d9d0; }
  .svg-special-background-fill-f5f1ea { fill: #f5f1ea; }
  .svg-special-background-fill-fbfaf7 { fill: #fbfaf7; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-ead2c7 { fill: #9e8d86; }
    .svg-special-fill-fill-ece6dc { fill: #94908a; }
    .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
    .svg-special-fill-fill-f5f1ea { fill: #93908c; }
    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6d6862 { fill: #a7a4a0; }
    .svg-special-background-fill-ead2c7 { fill: #332f2e; }
    .svg-special-background-fill-ece6dc { fill: #333231; }
    .svg-special-background-fill-f0d9d0 { fill: #34302f; }
    .svg-special-background-fill-f5f1ea { fill: #343433; }
    .svg-special-background-fill-fbfaf7 { fill: #353535; }



  }
</style>
  <title id="title">FlashAttention 用 tile 和在线 softmax 避免物化完整 attention matrix</title>
  <desc id="desc">左侧显示 naive attention 生成完整 T 乘 S 矩阵，右侧显示 query block 依次读取 key/value block，用 m、l、o 状态合并并只写回输出。</desc>
  <style>
    .ink {}
    .muted {}
    .coral {}
    .coral-soft {}
    .paper {stroke-width: 1; }
    .grid {stroke-width: 1; }
    .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .state {}
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-f5f1ea svg-special-background-fill-f5f1ea"/>
  <text x="40" y="32" class="ink title svg-special-text-fill-312f2f">FlashAttention：tile 内完成 dense attention</text>
  <text x="40" y="53" class="muted label svg-special-text-fill-6d6862">保留 T×S 逻辑交互；不把完整 score / weight matrix 写入高带宽显存</text>

  <rect x="28" y="72" width="300" height="187" rx="10" class="paper svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="46" y="99" class="ink head svg-special-text-fill-312f2f">naive dense</text>
  <rect x="48" y="119" width="48" height="32" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="72" y="140" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Q</text>
  <path d="M100 135H126" class="arrow svg-coral-stroke-stroke"/>
  <rect x="134" y="113" width="92" height="78" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <path d="M134 113H226M134 132H226M134 151H226M134 170H226M134 189H226M153 113V191M172 113V191M191 113V191M210 113V191" class="grid svg-special-graphic-stroke-c9c4bb"/>
  <text x="180" y="211" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">T × S</text>
  <path d="M232 135H258" class="arrow svg-coral-stroke-stroke"/>
  <rect x="266" y="119" width="48" height="32" rx="5" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="290" y="140" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">P V</text>
  <text x="46" y="239" class="muted small svg-special-text-fill-6d6862">完整矩阵：写入并再次读取 HBM</text>

  <rect x="348" y="72" width="424" height="187" rx="10" class="paper svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="366" y="99" class="ink head svg-special-text-fill-312f2f">FlashAttention</text>
  <rect x="366" y="116" width="66" height="34" rx="5"  class="svg-special-fill-fill-ead2c7 svg-special-background-fill-ead2c7"/>
  <text x="399" y="138" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Q block</text>
  <path d="M438 133H465" class="arrow svg-coral-stroke-stroke"/>
  <g transform="translate(473 112)">
    <rect width="126" height="86"  class="svg-special-fill-fill-fbfaf7 svg-special-background-fill-fbfaf7"/>
    <path d="M0 0H126M0 21H126M0 42H126M0 63H126M21 0V86M42 0V86M63 0V86M84 0V86M105 0V86" class="grid svg-special-graphic-stroke-c9c4bb"/>
    <rect x="0" y="0" width="42" height="42" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
    <text x="63" y="105" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">score tile</text>
  </g>
  <path d="M611 133H634" class="arrow svg-coral-stroke-stroke"/>
  <rect x="642" y="112" width="108" height="36" rx="5" class="state svg-special-fill-fill-ead2c7 svg-special-background-fill-ead2c7"/>
  <text x="696" y="135" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">m, ℓ, o</text>
  <text x="366" y="178" class="muted small svg-special-text-fill-6d6862">K/V block 1 → tile softmax → 更新状态</text>
  <text x="366" y="197" class="muted small svg-special-text-fill-6d6862">K/V block 2 → tile softmax → 重标度并累加</text>
  <path d="M601 217H674" class="arrow svg-coral-stroke-stroke"/>
  <rect x="682" y="201" width="68" height="32" rx="5"  class="svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
  <text x="716" y="222" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">O / LSE</text>
  <text x="366" y="239" class="muted small svg-special-text-fill-6d6862">片上工作区：Bᵣ×B𝚌；最终只写回输出与少量统计</text>

  <rect x="28" y="278" width="744" height="71" rx="9"  class="svg-special-fill-fill-ece6dc svg-special-background-fill-ece6dc"/>
  <text x="46" y="302" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">在线 softmax：</tspan>m′=max(m, tile max)，ℓ′=e^(m−m′)ℓ+tile sum，o′ 同步重标度</text>
  <text x="46" y="326" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">边界：</tspan>算术仍是 dense T×S；sparse / linear attention 才改变连接数量或代数形式</text>
</svg>
