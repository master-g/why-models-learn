<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention 用 tile 和在线 softmax 避免物化完整 attention matrix</title>
  <desc id="desc">左侧显示 naive attention 生成完整 T 乘 S 矩阵，右侧显示 query block 依次读取 key/value block，用 m、l、o 状态合并并只写回输出。</desc>
  <style>
    .ink { fill: #312f2f; }
    .muted { fill: #6d6862; }
    .coral { fill: #cc785c; }
    .coral-soft { fill: #f0d9d0; }
    .paper { fill: #fbfaf7; stroke: #d7d1c8; stroke-width: 1; }
    .grid { stroke: #c9c4bb; stroke-width: 1; }
    .arrow { stroke: #cc785c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .state { fill: #ead2c7; }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
  </defs>

  <rect width="800" height="373" fill="#f5f1ea"/>
  <text x="40" y="32" class="ink title">FlashAttention：tile 内完成 dense attention</text>
  <text x="40" y="53" class="muted label">保留 T×S 逻辑交互；不把完整 score / weight matrix 写入高带宽显存</text>

  <rect x="28" y="72" width="300" height="187" rx="10" class="paper"/>
  <text x="46" y="99" class="ink head">naive dense</text>
  <rect x="48" y="119" width="48" height="32" rx="5" class="coral-soft"/>
  <text x="72" y="140" text-anchor="middle" class="ink label">Q</text>
  <path d="M100 135H126" class="arrow"/>
  <rect x="134" y="113" width="92" height="78" class="coral-soft"/>
  <path d="M134 113H226M134 132H226M134 151H226M134 170H226M134 189H226M153 113V191M172 113V191M191 113V191M210 113V191" class="grid"/>
  <text x="180" y="211" text-anchor="middle" class="ink label">T × S</text>
  <path d="M232 135H258" class="arrow"/>
  <rect x="266" y="119" width="48" height="32" rx="5" class="coral-soft"/>
  <text x="290" y="140" text-anchor="middle" class="ink label">P V</text>
  <text x="46" y="239" class="muted small">完整矩阵：写入并再次读取 HBM</text>

  <rect x="348" y="72" width="424" height="187" rx="10" class="paper"/>
  <text x="366" y="99" class="ink head">FlashAttention</text>
  <rect x="366" y="116" width="66" height="34" rx="5" fill="#ead2c7"/>
  <text x="399" y="138" text-anchor="middle" class="ink label">Q block</text>
  <path d="M438 133H465" class="arrow"/>
  <g transform="translate(473 112)">
    <rect width="126" height="86" fill="#fbfaf7"/>
    <path d="M0 0H126M0 21H126M0 42H126M0 63H126M21 0V86M42 0V86M63 0V86M84 0V86M105 0V86" class="grid"/>
    <rect x="0" y="0" width="42" height="42" class="coral-soft"/>
    <text x="63" y="105" text-anchor="middle" class="ink small">score tile</text>
  </g>
  <path d="M611 133H634" class="arrow"/>
  <rect x="642" y="112" width="108" height="36" rx="5" class="state"/>
  <text x="696" y="135" text-anchor="middle" class="ink label">m, ℓ, o</text>
  <text x="366" y="178" class="muted small">K/V block 1 → tile softmax → 更新状态</text>
  <text x="366" y="197" class="muted small">K/V block 2 → tile softmax → 重标度并累加</text>
  <path d="M601 217H674" class="arrow"/>
  <rect x="682" y="201" width="68" height="32" rx="5" fill="#f0d9d0"/>
  <text x="716" y="222" text-anchor="middle" class="ink label">O / LSE</text>
  <text x="366" y="239" class="muted small">片上工作区：Bᵣ×B𝚌；最终只写回输出与少量统计</text>

  <rect x="28" y="278" width="744" height="71" rx="9" fill="#ece6dc"/>
  <text x="46" y="302" class="ink label"><tspan font-weight="700">在线 softmax：</tspan>m′=max(m, tile max)，ℓ′=e^(m−m′)ℓ+tile sum，o′ 同步重标度</text>
  <text x="46" y="326" class="ink label"><tspan font-weight="700">边界：</tspan>算术仍是 dense T×S；sparse / linear attention 才改变连接数量或代数形式</text>
</svg>
