<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-ece6dc { fill: #94908a; }
  .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
  .svg-special-fill-fill-f5f1ea { fill: #93908c; }
  .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6d6862 { fill: #6d6862; }

  .svg-special-background-fill-ece6dc { fill: #ece6dc; }
  .svg-special-background-fill-f0d9d0 { fill: #f0d9d0; }
  .svg-special-background-fill-f5f1ea { fill: #f5f1ea; }
  .svg-special-background-fill-fbfaf7 { fill: #fbfaf7; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-ece6dc { fill: #94908a; }
    .svg-special-fill-fill-f0d9d0 { fill: #9c8e88; }
    .svg-special-fill-fill-f5f1ea { fill: #93908c; }
    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d7d1c8 { stroke: #95908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6d6862 { fill: #a7a4a0; }
    .svg-special-background-fill-ece6dc { fill: #333231; }
    .svg-special-background-fill-f0d9d0 { fill: #34302f; }
    .svg-special-background-fill-f5f1ea { fill: #343433; }
    .svg-special-background-fill-fbfaf7 { fill: #353535; }



  }
</style>
  <title id="title">注意力复杂度由 query 行数乘以 key 列数决定</title>
  <desc id="desc">三个面板分别展示 self-attention 的 L 乘 L、cross-attention 的 T 乘 S 和 decode 单个 query 读取历史 key 的交互结构；底部标注 FlashAttention 与 GQA 的资源变化。</desc>
  <style>
    .ink {}
    .muted {}
    .coral {}
    .coral-soft {}
    .axis {stroke-width: 1.5; }
    .grid {stroke-width: 1; }
    .dash {stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .panel {stroke-width: 1; }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .head { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
  </style>

  <rect width="800" height="373"  class="svg-special-fill-fill-f5f1ea svg-special-background-fill-f5f1ea"/>
  <text x="40" y="32" class="ink title svg-special-text-fill-312f2f">query 行数 × key 列数 = 逻辑交互数</text>
  <text x="40" y="53" class="muted label svg-special-text-fill-6d6862">dense attention 的长度项由 T×S 决定；self-attention 只是 T=S=L 的特例</text>

  <rect x="28" y="72" width="236" height="205" rx="10" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="46" y="99" class="ink head svg-special-text-fill-312f2f">self-attention</text>
  <text x="46" y="118" class="muted label svg-special-text-fill-6d6862">T=S=L</text>
  <text x="46" y="137" class="muted small svg-special-text-fill-6d6862">每个位置读取同一序列</text>
  <g transform="translate(67 151)">
    <rect width="120" height="96" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
    <path d="M0 0H120M0 24H120M0 48H120M0 72H120M24 0V96M48 0V96M72 0V96M96 0V96" class="grid svg-special-graphic-stroke-c9c4bb"/>
    <path d="M0 0L120 96" class="dash svg-coral-stroke-stroke"/>
    <text x="60" y="115" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">L × L</text>
  </g>
  <text x="46" y="267" class="coral label svg-coral-text-fill">交互数：B h<tspan baseline-shift="sub" font-size="10">q</tspan> L²</text>

  <rect x="282" y="72" width="236" height="205" rx="10" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="300" y="99" class="ink head svg-special-text-fill-312f2f">cross-attention</text>
  <text x="300" y="118" class="muted label svg-special-text-fill-6d6862">T ≠ S</text>
  <text x="300" y="137" class="muted small svg-special-text-fill-6d6862">目标 query 读取 source key/value</text>
  <g transform="translate(310 151)">
    <rect width="160" height="96" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
    <path d="M0 0H160M0 24H160M0 48H160M0 72H160M32 0V96M64 0V96M96 0V96M128 0V96" class="grid svg-special-graphic-stroke-c9c4bb"/>
    <text x="80" y="115" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">T × S</text>
  </g>
  <text x="300" y="267" class="coral label svg-coral-text-fill">交互数：B h<tspan baseline-shift="sub" font-size="10">q</tspan> T S</text>

  <rect x="536" y="72" width="236" height="205" rx="10" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d7d1c8 svg-special-background-fill-fbfaf7"/>
  <text x="554" y="99" class="ink head svg-special-text-fill-312f2f">decode · one token</text>
  <text x="554" y="118" class="muted label svg-special-text-fill-6d6862">T=1，S=L</text>
  <text x="554" y="137" class="muted small svg-special-text-fill-6d6862">新 query 读取已缓存历史</text>
  <g transform="translate(563 151)">
    <rect width="170" height="24" class="coral-soft svg-special-fill-fill-f0d9d0 svg-special-background-fill-f0d9d0"/>
    <path d="M0 0V24M28 0V24M56 0V24M84 0V24M112 0V24M140 0V24" class="grid svg-special-graphic-stroke-c9c4bb"/>
    <circle cx="14" cy="12" r="4"  class="svg-special-fill-fill-cc785c"/>
    <path d="M14 35V54M14 54H156" class="axis svg-axis-stroke"/>
    <text x="85" y="73" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">1 × L</text>
  </g>
  <text x="554" y="267" class="coral label svg-coral-text-fill">每步：B h<tspan baseline-shift="sub" font-size="10">q</tspan> L</text>

  <rect x="28" y="296" width="744" height="53" rx="9"  class="svg-special-fill-fill-ece6dc svg-special-background-fill-ece6dc"/>
  <text x="46" y="319" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">FlashAttention：</tspan>仍处理 T×S 交互，不物化完整 A，减少显存读写</text>
  <text x="46" y="338" class="ink label svg-special-text-fill-312f2f"><tspan font-weight="700">GQA / MQA：</tspan>减少 h<tspan baseline-shift="sub" font-size="10">kv</tspan> 的 K/V cache，保留 h<tspan baseline-shift="sub" font-size="10">q</tspan> 个 score 头</text>
</svg>
