  <rect width="560" height="250"  class="svg-special-fill-fill-f7f3ef svg-special-background-fill-f7f3ef"/>
  <text x="28" y="29"  font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">约束优化每步先移动，再回到可行域</text>
  <text x="28" y="51"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">目标梯度与集合几何同时决定下一点</text>

  <rect x="24" y="72" width="150" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="40" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">原始梯度步</text>
  <text x="40" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">z = x − ηg</text>
  <text x="40" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">可能越出集合</text>

  <line x1="179" y1="117" x2="204" y2="117"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="204,117 196,112 196,122"  class="svg-special-fill-fill-cc785c"/>

  <rect x="204" y="72" width="151" height="91" rx="10"   class="svg-special-fill-fill-f2dfd7 svg-coral-stroke-stroke svg-special-background-fill-f2dfd7"/>
  <text x="220" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">可行性修正</text>
  <text x="220" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">Π𝒞(z)</text>
  <text x="220" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">投影或约束子问题</text>

  <line x1="360" y1="117" x2="385" y2="117"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="385,117 377,112 377,122"  class="svg-special-fill-fill-cc785c"/>

  <rect x="385" y="72" width="151" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="401" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">新的可行点</text>
  <text x="401" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">x₊ = Π𝒞(z)</text>
  <text x="401" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">再计算梯度</text>

  <rect x="24" y="183" width="512" height="43" rx="9"  class="svg-special-fill-fill-e8e3df svg-special-background-fill-e8e3df"/>
  <line x1="194" y1="190" x2="194" y2="219"  class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="365" y1="190" x2="365" y2="219"  class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="43" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">等式</text>
  <text x="43" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">KKT 线性系统</text>
  <text x="214" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">罚与乘子</text>
  <text x="214" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">残差逐步减小</text>
  <text x="384" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">分裂</text>
  <text x="384" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">ADMM 交替求解</text>
</svg>
