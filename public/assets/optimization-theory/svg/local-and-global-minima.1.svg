<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-ffffff { fill: #737373; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-ffffff { fill: #a5a5a5; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>局部谷底不一定是全局谷底</title>
  <desc>左侧曲线有两个深度不同的谷底，左边是局部最小点，右边是更低的全局最小点；右侧区分局部和全局的比较范围。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; }
    .axis {stroke-width: 1.1; fill: none; }
    .curve {stroke-width: 2.3; fill: none; }
    .guide {stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .local {stroke-width: 1.5; }
    .global {stroke-width: 1.5; }
    .box {stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">局部谷底不一定是全局谷底</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">梯度为 0 只描述当前位置；全局最小要比较整个可行域</text>

  <path d="M44 204 H320 M68 220 V70" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>
  <text x="311" y="219" class="body svg-special-text-fill-312f2f">x</text>
  <text x="52" y="78" class="body svg-special-text-fill-312f2f">f(x)</text>
  <path d="M52 90 C76 101 95 137 121 145 C144 152 157 124 177 99 C198 78 215 151 244 184 C266 205 288 160 312 119" class="curve svg-ink-stroke"/>

  <path d="M121 145 V204 M244 184 V204" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="121" cy="145" r="4.5" class="local svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke"/>
  <circle cx="244" cy="184" r="4.5" class="global svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <text x="121" y="137" text-anchor="middle" class="label svg-special-text-fill-312f2f">局部</text>
  <text x="244" y="201" text-anchor="middle" class="label svg-special-text-fill-312f2f svg-special-text-fill-ffffff" >全局</text>
  <text x="112" y="221" class="body svg-special-text-fill-312f2f">x≈−1</text>
  <text x="235" y="221" class="body svg-special-text-fill-312f2f">x≈1</text>

  <rect x="348" y="74" width="184" height="62" rx="8" class="local svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="440" y="98" text-anchor="middle" class="label svg-special-text-fill-312f2f">局部最小</text>
  <text x="440" y="120" text-anchor="middle" class="formula svg-special-text-fill-312f2f">只看一个邻域</text>

  <path d="M440 136 V152" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>
  <rect x="348" y="157" width="184" height="62" rx="8" class="box svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="440" y="181" text-anchor="middle" class="label svg-special-text-fill-312f2f">全局最小</text>
  <text x="440" y="203" text-anchor="middle" class="formula svg-special-text-fill-312f2f">比较全部可行点</text>
</svg>
