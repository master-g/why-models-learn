<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-9b6b5b { fill: #9b6b5b; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-f7f3ef { fill: #93908e; }
  .svg-special-fill-fill-fbf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-9b6b5b { stroke: #9b6b5b; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-615d57 { fill: #615d57; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f7f3ef { fill: #f7f3ef; }
  .svg-special-background-fill-fbf8f5 { fill: #fbf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-9b6b5b { fill: #9b6b5b; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f7f3ef { fill: #93908e; }
    .svg-special-fill-fill-fbf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-9b6b5b { stroke: #9b6b5b; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-615d57 { fill: #a6a4a0; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f7f3ef { fill: #353434; }
    .svg-special-background-fill-fbf8f5 { fill: #353534; }



  }
</style>
  <title id="title">梯度下降的步长受最大曲率约束</title>
  <desc id="desc">左侧是等值线上的稳定下降轨迹，右侧比较收敛步长与过大步长。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z"  class="svg-special-fill-fill-9b6b5b"/>
    </marker>
  </defs>
  <style>
    .paper {}
    .title {font: 600 17px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .body {font: 13px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .small {font: 11px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .formula {font: 600 15px "STIX Two Text", "Times New Roman", serif; }
    .axis {stroke-width: 1.3; }
    .contour { fill: none;  stroke-width: 1.3; }
    .stable { fill: none;  stroke-width: 2.2; marker-end: url(#arrow); }
    .unstable { fill: none;  stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow-muted); }
    .point {}
    .panel {stroke-width: 1.2; }
    .panel-good {stroke-width: 1.4; }
  </style>
  <rect class="paper svg-special-fill-fill-f7f3ef svg-special-background-fill-f7f3ef" x="0" y="0" width="560" height="250"/>
  <text class="title svg-special-text-fill-312f2f" x="28" y="28">梯度下降：步长与曲率</text>
  <text class="body svg-special-text-fill-312f2f" x="28" y="48">最陡方向不等于任意步长；最大特征值给出上限。</text>

  <g aria-label="稳定下降轨迹">
    <line class="axis svg-axis-stroke" x1="38" y1="205" x2="236" y2="205"/>
    <line class="axis svg-axis-stroke" x1="61" y1="222" x2="61" y2="66"/>
    <path class="contour svg-special-graphic-stroke-c9c4bb" d="M61 137 C61 102 94 84 137 84 C180 84 213 102 213 137 C213 172 180 190 137 190 C94 190 61 172 61 137 Z"/>
    <path class="contour svg-special-graphic-stroke-c9c4bb" d="M82 137 C82 112 105 99 137 99 C169 99 192 112 192 137 C192 162 169 175 137 175 C105 175 82 162 82 137 Z"/>
    <path class="contour svg-special-graphic-stroke-c9c4bb" d="M104 137 C104 121 118 113 137 113 C156 113 170 121 170 137 C170 153 156 161 137 161 C118 161 104 153 104 137 Z"/>
    <path class="stable svg-coral-stroke-stroke" d="M201 92 Q181 99 172 113"/>
    <path class="stable svg-coral-stroke-stroke" d="M172 113 Q156 116 151 126"/>
    <path class="stable svg-coral-stroke-stroke" d="M151 126 Q143 132 137 137"/>
    <circle class="point svg-special-fill-fill-cc785c" cx="201" cy="92" r="4"/>
    <circle class="point svg-special-fill-fill-cc785c" cx="172" cy="113" r="4"/>
    <circle class="point svg-special-fill-fill-cc785c" cx="151" cy="126" r="4"/>
    <circle class="point svg-special-fill-fill-cc785c" cx="137" cy="137" r="4.5"/>
    <text class="small svg-special-text-fill-615d57" x="139" y="151">最小点</text>
    <text class="formula svg-special-text-fill-312f2f" x="44" y="224">η ≤ 1/L</text>
    <text class="small svg-special-text-fill-615d57" x="112" y="224">稳定下降</text>
  </g>

  <g aria-label="步长条件比较">
    <rect class="panel-good svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4" x="286" y="68" width="246" height="60" rx="9"/>
    <text class="formula svg-special-text-fill-312f2f" x="409" y="91" text-anchor="middle">0 &lt; η &lt; 2/L</text>
    <text class="body svg-special-text-fill-312f2f" x="409" y="112" text-anchor="middle">各特征方向都收敛</text>
    <rect class="panel svg-special-fill-fill-fbf8f5 svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fbf8f5" x="286" y="145" width="246" height="60" rx="9"/>
    <text class="formula svg-special-text-fill-312f2f" x="409" y="168" text-anchor="middle">η ≥ 2/L</text>
    <text class="body svg-special-text-fill-312f2f" x="409" y="189" text-anchor="middle">最大曲率方向不衰减</text>
    <path class="unstable svg-special-graphic-stroke-9b6b5b" d="M409 128 L409 145"/>
    <text class="small svg-special-text-fill-615d57" x="286" y="225">L = 梯度变化的最大允许速度</text>
  </g>
</svg>
