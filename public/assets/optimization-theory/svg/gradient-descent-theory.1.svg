<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">梯度下降的步长受最大曲率约束</title>
  <desc id="desc">左侧是等值线上的稳定下降轨迹，右侧比较收敛步长与过大步长。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc785c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9b6b5b"/>
    </marker>
  </defs>
  <style>
    .paper { fill: #f7f3ef; }
    .title { fill: #312f2f; font: 600 17px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .body { fill: #312f2f; font: 13px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .small { fill: #615d57; font: 11px system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
    .formula { fill: #312f2f; font: 600 15px "STIX Two Text", "Times New Roman", serif; }
    .axis { stroke: #b8b2a8; stroke-width: 1.3; }
    .contour { fill: none; stroke: #c9c4bb; stroke-width: 1.3; }
    .stable { fill: none; stroke: #cc785c; stroke-width: 2.2; marker-end: url(#arrow); }
    .unstable { fill: none; stroke: #9b6b5b; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow-muted); }
    .point { fill: #cc785c; }
    .panel { fill: #fbf8f5; stroke: #c9c4bb; stroke-width: 1.2; }
    .panel-good { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.4; }
  </style>
  <rect class="paper" x="0" y="0" width="560" height="250"/>
  <text class="title" x="28" y="28">梯度下降：步长与曲率</text>
  <text class="body" x="28" y="48">最陡方向不等于任意步长；最大特征值给出上限。</text>

  <g aria-label="稳定下降轨迹">
    <line class="axis" x1="38" y1="205" x2="236" y2="205"/>
    <line class="axis" x1="61" y1="222" x2="61" y2="66"/>
    <path class="contour" d="M61 137 C61 102 94 84 137 84 C180 84 213 102 213 137 C213 172 180 190 137 190 C94 190 61 172 61 137 Z"/>
    <path class="contour" d="M82 137 C82 112 105 99 137 99 C169 99 192 112 192 137 C192 162 169 175 137 175 C105 175 82 162 82 137 Z"/>
    <path class="contour" d="M104 137 C104 121 118 113 137 113 C156 113 170 121 170 137 C170 153 156 161 137 161 C118 161 104 153 104 137 Z"/>
    <path class="stable" d="M201 92 Q181 99 172 113"/>
    <path class="stable" d="M172 113 Q156 116 151 126"/>
    <path class="stable" d="M151 126 Q143 132 137 137"/>
    <circle class="point" cx="201" cy="92" r="4"/>
    <circle class="point" cx="172" cy="113" r="4"/>
    <circle class="point" cx="151" cy="126" r="4"/>
    <circle class="point" cx="137" cy="137" r="4.5"/>
    <text class="small" x="139" y="151">最小点</text>
    <text class="formula" x="44" y="224">η ≤ 1/L</text>
    <text class="small" x="112" y="224">稳定下降</text>
  </g>

  <g aria-label="步长条件比较">
    <rect class="panel-good" x="286" y="68" width="246" height="60" rx="9"/>
    <text class="formula" x="409" y="91" text-anchor="middle">0 &lt; η &lt; 2/L</text>
    <text class="body" x="409" y="112" text-anchor="middle">各特征方向都收敛</text>
    <rect class="panel" x="286" y="145" width="246" height="60" rx="9"/>
    <text class="formula" x="409" y="168" text-anchor="middle">η ≥ 2/L</text>
    <text class="body" x="409" y="189" text-anchor="middle">最大曲率方向不衰减</text>
    <path class="unstable" d="M409 128 L409 145"/>
    <text class="small" x="286" y="225">L = 梯度变化的最大允许速度</text>
  </g>
</svg>
