<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-faf8f5 { fill: #92908f; }
  .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-faf8f5 { fill: #faf8f5; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8f8a83 { fill: #8f8a83; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-faf8f5 { fill: #92908f; }
    .svg-special-graphic-stroke-8f8a83 { stroke: #8f8a83; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-faf8f5 { fill: #353534; }



  }
</style>
  <title>优化问题是在可行集内寻找最低等高线</title>
  <desc>左侧坐标图显示一个椭圆等高线目标和浅色可行集，珊瑚色点是可行集内达到最低目标的解；右侧写出最小化问题的三个组成部分。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 17px; font-weight: 600; }
    .label { font-size: 13px; font-weight: 600; }
    .body { font-size: 12px; }
    .formula { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; }
    .axis {stroke-width: 1.1; fill: none; }
    .contour {stroke-width: 1.5; fill: none; }
    .feasible {fill-opacity: .65;  stroke-width: 1.6; }
    .guide {stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8f8a83"/>
    </marker>
  </defs>

  <text x="28" y="29" class="title svg-special-text-fill-312f2f">优化问题：在可行集里找最低的目标值</text>
  <text x="28" y="50" class="body svg-special-text-fill-312f2f">min f(x)，x 只能落在 C 中；珊瑚点是一个可行最优解</text>

  <path d="M42 201 H322 M62 220 V73" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>
  <text x="314" y="217" class="body svg-special-text-fill-312f2f">x₁</text>
  <text x="48" y="80" class="body svg-special-text-fill-312f2f">x₂</text>

  <ellipse cx="190" cy="143" rx="105" ry="55" class="contour svg-axis-stroke"/>
  <ellipse cx="190" cy="143" rx="76" ry="39" class="contour svg-axis-stroke"/>
  <ellipse cx="190" cy="143" rx="45" ry="23" class="contour svg-axis-stroke"/>
  <text x="255" y="103" class="body svg-special-text-fill-312f2f">f 较大</text>
  <text x="208" y="141" class="body svg-special-text-fill-312f2f">f 较小</text>

  <path d="M85 177 C94 117 150 92 239 104 C284 111 303 149 278 181 C248 218 141 217 99 195 Z" class="feasible svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke"/>
  <text x="104" y="111" class="label svg-special-text-fill-312f2f">可行集 C</text>
  <path d="M239 104 L190 143" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="190" cy="143" r="5"  class="svg-special-fill-fill-cc785c"/>
  <text x="198" y="159" class="label svg-special-text-fill-312f2f">x*</text>

  <rect x="360" y="79" width="172" height="55" rx="8" class="feasible svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
  <text x="446" y="101" text-anchor="middle" class="label svg-special-text-fill-312f2f">可行集</text>
  <text x="446" y="122" text-anchor="middle" class="formula svg-special-text-fill-312f2f">x ∈ C</text>

  <path d="M446 134 V151" class="axis svg-special-graphic-stroke-8f8a83" marker-end="url(#arrow)"/>

  <rect x="360" y="157" width="172" height="55" rx="8"   stroke-width="1.4" class="svg-special-fill-fill-faf8f5 svg-axis-stroke svg-special-background-fill-faf8f5"/>
  <text x="446" y="179" text-anchor="middle" class="label svg-special-text-fill-312f2f">目标函数</text>
  <text x="446" y="200" text-anchor="middle" class="formula svg-special-text-fill-312f2f">min f(x) → x*</text>
</svg>
