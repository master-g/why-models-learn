<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <rect width="560" height="250" fill="#f7f3ef"/>
  <text x="28" y="29" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">鞍点沿不同方向一升一降</text>
  <text x="28" y="51" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">负曲率方向让最小化轨迹离开驻点</text>

  <rect x="24" y="72" width="154" height="92" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="40" y="95" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">驻点</text>
  <text x="40" y="123" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">∇F(θ*) = 0</text>
  <text x="40" y="147" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">一阶变化消失</text>

  <line x1="183" y1="117" x2="207" y2="117" stroke="#cc785c" stroke-width="2"/>
  <polygon points="207,117 199,112 199,122" fill="#cc785c"/>

  <rect x="207" y="72" width="151" height="92" rx="10" fill="#f2dfd7" stroke="#cc785c"/>
  <text x="223" y="95" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Hessian</text>
  <text x="223" y="123" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">λ₊ &gt; 0，λ₋ &lt; 0</text>
  <text x="223" y="147" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">正负曲率并存</text>

  <line x1="363" y1="117" x2="387" y2="117" stroke="#cc785c" stroke-width="2"/>
  <polygon points="387,117 379,112 379,122" fill="#cc785c"/>

  <rect x="387" y="72" width="149" height="92" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="403" y="95" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">两种方向</text>
  <text x="403" y="123" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">正：上升</text>
  <text x="403" y="147" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">负：下降</text>

  <rect x="24" y="183" width="512" height="43" rx="9" fill="#e8e3df"/>
  <line x1="280" y1="190" x2="280" y2="219" stroke="#c9c4bb"/>
  <text x="43" y="201" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">最小化</text>
  <text x="43" y="217" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">沿负曲率逃逸</text>
  <text x="300" y="201" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">min-max</text>
  <text x="300" y="217" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">鞍点可能正是目标</text>
</svg>
