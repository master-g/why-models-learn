<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e8e3df { fill: #94908e; }
  .svg-special-fill-fill-eee9e5 { fill: #94908e; }
  .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
  .svg-special-fill-fill-f7f3ef { fill: #93908e; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6e6963 { fill: #6e6963; }

  .svg-special-background-fill-e8e3df { fill: #e8e3df; }
  .svg-special-background-fill-eee9e5 { fill: #eee9e5; }
  .svg-special-background-fill-f2dfd7 { fill: #f2dfd7; }
  .svg-special-background-fill-f7f3ef { fill: #f7f3ef; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e8e3df { fill: #94908e; }
    .svg-special-fill-fill-eee9e5 { fill: #94908e; }
    .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
    .svg-special-fill-fill-f7f3ef { fill: #93908e; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6e6963 { fill: #a7a4a0; }
    .svg-special-background-fill-e8e3df { fill: #333231; }
    .svg-special-background-fill-eee9e5 { fill: #333332; }
    .svg-special-background-fill-f2dfd7 { fill: #343130; }
    .svg-special-background-fill-f7f3ef { fill: #353434; }



  }
</style>
  <rect width="560" height="250"  class="svg-special-fill-fill-f7f3ef svg-special-background-fill-f7f3ef"/>
  <text x="28" y="29"  font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">鞍点沿不同方向一升一降</text>
  <text x="28" y="51"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">负曲率方向让最小化轨迹离开驻点</text>

  <rect x="24" y="72" width="154" height="92" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="40" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">驻点</text>
  <text x="40" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">∇F(θ*) = 0</text>
  <text x="40" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">一阶变化消失</text>

  <line x1="183" y1="117" x2="207" y2="117"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="207,117 199,112 199,122"  class="svg-special-fill-fill-cc785c"/>

  <rect x="207" y="72" width="151" height="92" rx="10"   class="svg-special-fill-fill-f2dfd7 svg-coral-stroke-stroke svg-special-background-fill-f2dfd7"/>
  <text x="223" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">Hessian</text>
  <text x="223" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">λ₊ &gt; 0，λ₋ &lt; 0</text>
  <text x="223" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">正负曲率并存</text>

  <line x1="363" y1="117" x2="387" y2="117"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="387,117 379,112 379,122"  class="svg-special-fill-fill-cc785c"/>

  <rect x="387" y="72" width="149" height="92" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="403" y="95"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">两种方向</text>
  <text x="403" y="123"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">正：上升</text>
  <text x="403" y="147"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">负：下降</text>

  <rect x="24" y="183" width="512" height="43" rx="9"  class="svg-special-fill-fill-e8e3df svg-special-background-fill-e8e3df"/>
  <line x1="280" y1="190" x2="280" y2="219"  class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="43" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">最小化</text>
  <text x="43" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">沿负曲率逃逸</text>
  <text x="300" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">min-max</text>
  <text x="300" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">鞍点可能正是目标</text>
</svg>
