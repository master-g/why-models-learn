<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e8e3df { fill: #94908e; }
  .svg-special-fill-fill-eee9e5 { fill: #94908e; }
  .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
  .svg-special-fill-fill-f7f3ef { fill: #93908e; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6e6963 { fill: #6e6963; }

  .svg-special-background-fill-e8e3df { fill: #e8e3df; }
  .svg-special-background-fill-eee9e5 { fill: #eee9e5; }
  .svg-special-background-fill-f2dfd7 { fill: #f2dfd7; }
  .svg-special-background-fill-f7f3ef { fill: #f7f3ef; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e8e3df { fill: #94908e; }
    .svg-special-fill-fill-eee9e5 { fill: #94908e; }
    .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
    .svg-special-fill-fill-f7f3ef { fill: #93908e; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6e6963 { fill: #a7a4a0; }
    .svg-special-background-fill-e8e3df { fill: #333231; }
    .svg-special-background-fill-eee9e5 { fill: #333332; }
    .svg-special-background-fill-f2dfd7 { fill: #343130; }
    .svg-special-background-fill-f7f3ef { fill: #353434; }



  }
</style>
  <rect width="560" height="250"  class="svg-special-fill-fill-f7f3ef svg-special-background-fill-f7f3ef"/>
  <text x="28" y="29"  font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">二阶方法先拟合局部模型，再解线性系统</text>
  <text x="28" y="51"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">曲率决定不同方向该走多远</text>

  <rect x="24" y="73" width="164" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="40" y="96"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">局部二次模型</text>
  <text x="40" y="122"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">F + gᵀp</text>
  <text x="40" y="146"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">+ ½ pᵀHp</text>

  <line x1="193" y1="118" x2="218" y2="118"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="218,118 210,113 210,123"  class="svg-special-fill-fill-cc785c"/>

  <rect x="218" y="73" width="140" height="91" rx="10"   class="svg-special-fill-fill-f2dfd7 svg-coral-stroke-stroke svg-special-background-fill-f2dfd7"/>
  <text x="235" y="96"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">求驻点</text>
  <text x="236" y="125"  font-family="system-ui, -apple-system, sans-serif" font-size="14" class="svg-special-text-fill-312f2f">Hp = −g</text>
  <text x="236" y="148"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">解线性系统</text>

  <line x1="363" y1="118" x2="388" y2="118"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="388,118 380,113 380,123"  class="svg-special-fill-fill-cc785c"/>

  <rect x="388" y="73" width="148" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="404" y="96"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">得到更新</text>
  <text x="404" y="124"  font-family="system-ui, -apple-system, sans-serif" font-size="14" class="svg-special-text-fill-312f2f">θ ← θ + αp</text>
  <text x="404" y="148"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">线搜索或信赖域</text>

  <rect x="24" y="183" width="512" height="43" rx="9"  class="svg-special-fill-fill-e8e3df svg-special-background-fill-e8e3df"/>
  <line x1="280" y1="190" x2="280" y2="219"  class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="43" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">H 正定</text>
  <text x="43" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">Newton 步可作下降方向</text>
  <text x="300" y="201"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">H 奇异或不定</text>
  <text x="300" y="217"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">阻尼、负曲率或信赖域</text>
</svg>
