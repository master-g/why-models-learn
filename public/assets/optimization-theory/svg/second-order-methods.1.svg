<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <rect width="560" height="250" fill="#f7f3ef"/>
  <text x="28" y="29" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">二阶方法先拟合局部模型，再解线性系统</text>
  <text x="28" y="51" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">曲率决定不同方向该走多远</text>

  <rect x="24" y="73" width="164" height="91" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="40" y="96" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">局部二次模型</text>
  <text x="40" y="122" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">F + gᵀp</text>
  <text x="40" y="146" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">+ ½ pᵀHp</text>

  <line x1="193" y1="118" x2="218" y2="118" stroke="#cc785c" stroke-width="2"/>
  <polygon points="218,118 210,113 210,123" fill="#cc785c"/>

  <rect x="218" y="73" width="140" height="91" rx="10" fill="#f2dfd7" stroke="#cc785c"/>
  <text x="235" y="96" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">求驻点</text>
  <text x="236" y="125" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14">Hp = −g</text>
  <text x="236" y="148" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">解线性系统</text>

  <line x1="363" y1="118" x2="388" y2="118" stroke="#cc785c" stroke-width="2"/>
  <polygon points="388,118 380,113 380,123" fill="#cc785c"/>

  <rect x="388" y="73" width="148" height="91" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="404" y="96" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">得到更新</text>
  <text x="404" y="124" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14">θ ← θ + αp</text>
  <text x="404" y="148" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">线搜索或信赖域</text>

  <rect x="24" y="183" width="512" height="43" rx="9" fill="#e8e3df"/>
  <line x1="280" y1="190" x2="280" y2="219" stroke="#c9c4bb"/>
  <text x="43" y="201" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">H 正定</text>
  <text x="43" y="217" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">Newton 步可作下降方向</text>
  <text x="300" y="201" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">H 奇异或不定</text>
  <text x="300" y="217" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">阻尼、负曲率或信赖域</text>
</svg>
