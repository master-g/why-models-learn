<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <rect width="560" height="250" fill="#f7f3ef"/>
  <text x="28" y="29" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">自适应学习率按坐标缩放步长</text>
  <text x="28" y="51" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="12">同一个基础学习率 η，先除以各坐标的历史尺度</text>

  <rect x="24" y="70" width="150" height="91" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="39" y="92" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">当前梯度</text>
  <text x="43" y="119" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">大坐标  g₁ = 6</text>
  <text x="43" y="145" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">小坐标  g₂ = 1</text>

  <line x1="179" y1="115" x2="204" y2="115" stroke="#cc785c" stroke-width="2"/>
  <polygon points="204,115 196,110 196,120" fill="#cc785c"/>

  <rect x="204" y="70" width="151" height="91" rx="10" fill="#f2dfd7" stroke="#cc785c"/>
  <text x="219" y="92" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">历史尺度 dₜ</text>
  <text x="222" y="119" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">大梯度 → 分母大</text>
  <text x="222" y="145" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">小梯度 → 分母小</text>

  <line x1="360" y1="115" x2="385" y2="115" stroke="#cc785c" stroke-width="2"/>
  <polygon points="385,115 377,110 377,120" fill="#cc785c"/>

  <rect x="385" y="70" width="151" height="91" rx="10" fill="#eee9e5" stroke="#b8b2a8"/>
  <text x="400" y="92" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">有效更新</text>
  <text x="399" y="120" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">η · gₜ / dₜ</text>
  <text x="399" y="145" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13">逐坐标改变步长</text>

  <rect x="24" y="180" width="512" height="46" rx="9" fill="#e8e3df"/>
  <line x1="195" y1="188" x2="195" y2="218" stroke="#c9c4bb"/>
  <line x1="365" y1="188" x2="365" y2="218" stroke="#c9c4bb"/>
  <text x="43" y="199" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">AdaGrad</text>
  <text x="43" y="216" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">累积全部历史</text>
  <text x="214" y="199" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">RMSProp</text>
  <text x="214" y="216" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">指数遗忘旧尺度</text>
  <text x="384" y="199" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Adam</text>
  <text x="384" y="216" fill="#6e6963" font-family="system-ui, -apple-system, sans-serif" font-size="11">方向 + 尺度</text>
</svg>
