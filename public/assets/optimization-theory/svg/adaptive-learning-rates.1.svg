<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e8e3df { fill: #94908e; }
  .svg-special-fill-fill-eee9e5 { fill: #94908e; }
  .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
  .svg-special-fill-fill-f7f3ef { fill: #93908e; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6e6963 { fill: #6e6963; }

  .svg-special-background-fill-e8e3df { fill: #e8e3df; }
  .svg-special-background-fill-eee9e5 { fill: #eee9e5; }
  .svg-special-background-fill-f2dfd7 { fill: #f2dfd7; }
  .svg-special-background-fill-f7f3ef { fill: #f7f3ef; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e8e3df { fill: #94908e; }
    .svg-special-fill-fill-eee9e5 { fill: #94908e; }
    .svg-special-fill-fill-f2dfd7 { fill: #9b8e89; }
    .svg-special-fill-fill-f7f3ef { fill: #93908e; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6e6963 { fill: #a7a4a0; }
    .svg-special-background-fill-e8e3df { fill: #333231; }
    .svg-special-background-fill-eee9e5 { fill: #333332; }
    .svg-special-background-fill-f2dfd7 { fill: #343130; }
    .svg-special-background-fill-f7f3ef { fill: #353434; }



  }
</style>
  <rect width="560" height="250"  class="svg-special-fill-fill-f7f3ef svg-special-background-fill-f7f3ef"/>
  <text x="28" y="29"  font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" class="svg-special-text-fill-312f2f">自适应学习率按坐标缩放步长</text>
  <text x="28" y="51"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6e6963">同一个基础学习率 η，先除以各坐标的历史尺度</text>

  <rect x="24" y="70" width="150" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="39" y="92"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">当前梯度</text>
  <text x="43" y="119"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">大坐标  g₁ = 6</text>
  <text x="43" y="145"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">小坐标  g₂ = 1</text>

  <line x1="179" y1="115" x2="204" y2="115"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="204,115 196,110 196,120"  class="svg-special-fill-fill-cc785c"/>

  <rect x="204" y="70" width="151" height="91" rx="10"   class="svg-special-fill-fill-f2dfd7 svg-coral-stroke-stroke svg-special-background-fill-f2dfd7"/>
  <text x="219" y="92"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">历史尺度 dₜ</text>
  <text x="222" y="119"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">大梯度 → 分母大</text>
  <text x="222" y="145"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">小梯度 → 分母小</text>

  <line x1="360" y1="115" x2="385" y2="115"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <polygon points="385,115 377,110 377,120"  class="svg-special-fill-fill-cc785c"/>

  <rect x="385" y="70" width="151" height="91" rx="10"   class="svg-special-fill-fill-eee9e5 svg-axis-stroke svg-special-background-fill-eee9e5"/>
  <text x="400" y="92"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">有效更新</text>
  <text x="399" y="120"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">η · gₜ / dₜ</text>
  <text x="399" y="145"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-312f2f">逐坐标改变步长</text>

  <rect x="24" y="180" width="512" height="46" rx="9"  class="svg-special-fill-fill-e8e3df svg-special-background-fill-e8e3df"/>
  <line x1="195" y1="188" x2="195" y2="218"  class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="365" y1="188" x2="365" y2="218"  class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="43" y="199"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">AdaGrad</text>
  <text x="43" y="216"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">累积全部历史</text>
  <text x="214" y="199"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">RMSProp</text>
  <text x="214" y="216"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">指数遗忘旧尺度</text>
  <text x="384" y="199"  font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">Adam</text>
  <text x="384" y="216"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6e6963">方向 + 尺度</text>
</svg>
