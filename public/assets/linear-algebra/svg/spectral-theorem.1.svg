<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="spectral-title spectral-desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-fffdfb { fill: #fffdfb; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-fffdfb { fill: #363535; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <title id="spectral-title">实对称矩阵的正交谱分解</title>
  <desc id="spectral-desc">左侧显示对称矩阵分解为正交矩阵 Q、对角特征值矩阵 Lambda 和 Q 的转置，右侧椭圆的主轴显示两个正交特征方向。</desc>
  <defs>
    <marker id="spectral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="spectral-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="280" y1="18" x2="280" y2="232"  class="svg-special-graphic-stroke-e2dbd3"/>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="20" y="25" font-size="13" font-weight="600">对称矩阵的正交分解</text>
    <text x="300" y="25" font-size="13" font-weight="600">正交主方向与椭圆</text>
  </g>

  <!-- Left panel: A = Q Lambda Q^T -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="49" y="55">A</text>
    <text x="203" y="55">Λ</text>
  </g>
  <g transform="translate(23 69)"  stroke-width="1" class="svg-axis-stroke">
    <rect x="0" y="0" width="52" height="52"  fill-opacity="0.16"  stroke-width="1.4" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
    <rect x="52" y="0" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="0" y="52" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="52" y="52" width="52" height="52"  fill-opacity="0.16"  stroke-width="1.4" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  </g>
  <g transform="translate(177 69)"  stroke-width="1" class="svg-axis-stroke">
    <rect x="0" y="0" width="52" height="52"  fill-opacity="0.16"  stroke-width="1.4" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
    <rect x="52" y="0" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="0" y="52" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="52" y="52" width="52" height="52"  fill-opacity="0.16"  stroke-width="1.4" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="49" y="102">3</text>
    <text x="101" y="102">1</text>
    <text x="49" y="154">1</text>
    <text x="101" y="154">3</text>
    <text x="203" y="102">4</text>
    <text x="255" y="102">0</text>
    <text x="203" y="154">0</text>
    <text x="255" y="154">2</text>
  </g>
  <text x="128" y="112" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" text-anchor="middle"  class="svg-coral-text-fill">Q · · Qᵀ</text>
  <line x1="128" y1="166" x2="128" y2="184"  stroke-width="1.5" marker-end="url(#spectral-arrow)" class="svg-ink-stroke"/>
  <text x="23" y="205" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15"  class="svg-coral-text-fill">A=QΛQᵀ</text>
  <text x="23" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">Q 保持长度与角度</text>

  <!-- Right panel: ellipse with orthogonal axes -->
  <g  stroke-width="1" fill="none" class="svg-axis-stroke">
    <line x1="300" y1="137" x2="548" y2="137" marker-end="url(#spectral-arrow)"/>
    <line x1="424" y1="224" x2="424" y2="43" marker-end="url(#spectral-arrow)"/>
  </g>
  <ellipse cx="424" cy="137" rx="82" ry="35" transform="rotate(-35 424 137)"  fill-opacity="0.12"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-coral-stroke-stroke"/>
  <line x1="358" y1="183" x2="490" y2="91"  stroke-width="2" marker-end="url(#spectral-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="404" y1="106" x2="444" y2="168"  stroke-width="1.8" marker-end="url(#spectral-arrow)" class="svg-ink-stroke"/>
  <text x="493" y="89" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-coral-text-fill">q₁，λ₁=4</text>
  <text x="447" y="174" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">q₂，λ₂=2</text>
  <text x="300" y="207" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">特征向量正交，特征值控制轴向缩放</text>
  <text x="300" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-coral-text-fill">4/6=2/3：第一方向的方差占比</text>
</svg>
