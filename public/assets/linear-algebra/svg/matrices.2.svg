<svg data-svg-theme="paper-ink-v1" width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }



@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="a-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 左 panel:变换前 -->
  <text x="40" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">变换前</text>
  <!-- 方格 -->
  <line x1="70" y1="55" x2="70" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="100" y1="55" x2="100" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="130" y1="55" x2="130" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="160" y1="55" x2="160" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="175" x2="170" y2="175"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="145" x2="170" y2="145"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="115" x2="170" y2="115"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="85" x2="170" y2="85"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="205" x2="182" y2="205"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="40" y1="205" x2="40" y2="48"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="188" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <!-- 单位正方形 -->
  <rect x="40" y="175" width="30" height="30"  opacity="0.06"  stroke-width="1.5" class="svg-special-fill-fill-312f2f svg-ink-stroke"/>
  <!-- 基向量 -->
  <line x1="40" y1="198" x2="68" y2="198"  stroke-width="1.8" marker-end="url(#a-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="47" y1="205" x2="47" y2="177"  stroke-width="1.8" marker-end="url(#a-coral)" class="svg-coral-stroke-stroke"/>
  <text x="76" y="202" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">e<tspan dy="3" font-size="9">1</tspan></text>
  <text x="54" y="173" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">e<tspan dy="3" font-size="9">2</tspan></text>

  <!-- 右 panel:S 作用后 -->
  <text x="300" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">S 作用后</text>
  <!-- 幽灵方格(变换前的位置) -->
  <line x1="330" y1="55" x2="330" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="360" y1="55" x2="360" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="390" y1="55" x2="390" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="420" y1="55" x2="420" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="175" x2="450" y2="175"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="145" x2="450" y2="145"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="115" x2="450" y2="115"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="85" x2="450" y2="85"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 变换后的斜格 -->
  <line x1="300" y1="205" x2="420" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="330" y1="205" x2="450" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="360" y1="205" x2="480" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="390" y1="205" x2="510" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="420" y1="205" x2="540" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="330" y1="175" x2="450" y2="175"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="360" y1="145" x2="480" y2="145"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="390" y1="115" x2="510" y2="115"  stroke-width="1" class="svg-axis-stroke"/>
  <line x1="420" y1="85" x2="540" y2="85"  stroke-width="1" class="svg-axis-stroke"/>
  <!-- 坐标轴 -->
  <line x1="300" y1="205" x2="462" y2="205"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="300" y1="205" x2="300" y2="48"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="468" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="292" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <!-- 幽灵单位正方形 -->
  <rect x="300" y="175" width="30" height="30" fill="none"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 剪切后的平行四边形 -->
  <polygon points="300,205 330,205 360,175 330,175"  opacity="0.08"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-ink-stroke"/>
  <!-- 基向量的像 -->
  <line x1="300" y1="198" x2="328" y2="198"  stroke-width="1.8" marker-end="url(#a-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="303" y1="203" x2="331" y2="177"  stroke-width="1.8" marker-end="url(#a-ink)" class="svg-ink-stroke"/>
  <text x="336" y="202" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">e<tspan dy="3" font-size="9">1</tspan></text>
  <text x="339" y="172" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">e<tspan dy="3" font-size="9">2</tspan></text>

  <!-- 底部点题 -->
  <text x="430" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5"  text-anchor="middle" class="svg-special-text-fill-312f2f">矩阵的第 j 列 = 第 j 个基向量的去向</text>
</svg>
