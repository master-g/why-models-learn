<svg width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
    <marker id="a-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b2a8"/>
    </marker>
  </defs>

  <!-- 左 panel:变换前 -->
  <text x="40" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6c6a64">变换前</text>
  <!-- 方格 -->
  <line x1="70" y1="55" x2="70" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="55" x2="100" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="130" y1="55" x2="130" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="55" x2="160" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="175" x2="170" y2="175" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="145" x2="170" y2="145" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="115" x2="170" y2="115" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="85" x2="170" y2="85" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="205" x2="182" y2="205" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="40" y1="205" x2="40" y2="48" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="188" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">x</text>
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">y</text>
  <!-- 单位正方形 -->
  <rect x="40" y="175" width="30" height="30" fill="#312f2f" opacity="0.06" stroke="#312f2f" stroke-width="1.5"/>
  <!-- 基向量 -->
  <line x1="40" y1="198" x2="68" y2="198" stroke="#cc785c" stroke-width="1.8" marker-end="url(#a-coral)"/>
  <line x1="47" y1="205" x2="47" y2="177" stroke="#cc785c" stroke-width="1.8" marker-end="url(#a-coral)"/>
  <text x="76" y="202" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c">e<tspan dy="3" font-size="9">1</tspan></text>
  <text x="54" y="173" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c">e<tspan dy="3" font-size="9">2</tspan></text>

  <!-- 右 panel:S 作用后 -->
  <text x="300" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6c6a64">S 作用后</text>
  <!-- 幽灵方格(变换前的位置) -->
  <line x1="330" y1="55" x2="330" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="360" y1="55" x2="360" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="390" y1="55" x2="390" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="420" y1="55" x2="420" y2="205" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="175" x2="450" y2="175" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="145" x2="450" y2="145" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="115" x2="450" y2="115" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="300" y1="85" x2="450" y2="85" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- 变换后的斜格 -->
  <line x1="300" y1="205" x2="420" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="330" y1="205" x2="450" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="360" y1="205" x2="480" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="390" y1="205" x2="510" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="420" y1="205" x2="540" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="330" y1="175" x2="450" y2="175" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="360" y1="145" x2="480" y2="145" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="390" y1="115" x2="510" y2="115" stroke="#b8b2a8" stroke-width="1"/>
  <line x1="420" y1="85" x2="540" y2="85" stroke="#b8b2a8" stroke-width="1"/>
  <!-- 坐标轴 -->
  <line x1="300" y1="205" x2="462" y2="205" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="300" y1="205" x2="300" y2="48" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="468" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">x</text>
  <text x="292" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">y</text>
  <!-- 幽灵单位正方形 -->
  <rect x="300" y="175" width="30" height="30" fill="none" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- 剪切后的平行四边形 -->
  <polygon points="300,205 330,205 360,175 330,175" fill="#cc785c" opacity="0.08" stroke="#312f2f" stroke-width="1.5"/>
  <!-- 基向量的像 -->
  <line x1="300" y1="198" x2="328" y2="198" stroke="#cc785c" stroke-width="1.8" marker-end="url(#a-coral)"/>
  <line x1="303" y1="203" x2="331" y2="177" stroke="#312f2f" stroke-width="1.8" marker-end="url(#a-ink)"/>
  <text x="336" y="202" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c">e<tspan dy="3" font-size="9">1</tspan></text>
  <text x="339" y="172" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">e<tspan dy="3" font-size="9">2</tspan></text>

  <!-- 底部点题 -->
  <text x="430" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#312f2f" text-anchor="middle">矩阵的第 j 列 = 第 j 个基向量的去向</text>
</svg>
