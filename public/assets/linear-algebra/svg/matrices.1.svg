<svg data-svg-theme="paper-ink-v1" width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-fill { fill: #cc785c; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-fill { fill: #312f2f; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  @media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-fill { fill: #e28466; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-fill { fill: #f0efe8; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
  }
</style>
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-ink-fill"/>
    </marker>
    <marker id="a-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-coral-stroke-fill"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 左:矩阵本体,两列分别高亮 -->
  <rect x="60" y="68" width="32" height="110"  opacity="0.10" class="svg-coral-stroke-fill"/>
  <rect x="94" y="68" width="32" height="110"  opacity="0.07" class="svg-ink-fill"/>
  <path d="M56,66 L46,66 L46,182 L56,182" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M130,66 L140,66 L140,182 L130,182" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <text x="76" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="22"  text-anchor="middle" class="svg-coral-stroke-fill">3</text>
  <text x="110" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="22"  text-anchor="middle" class="svg-ink-fill">1</text>
  <text x="76" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="22"  text-anchor="middle" class="svg-coral-stroke-fill">1</text>
  <text x="110" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="22"  text-anchor="middle" class="svg-ink-fill">2</text>
  <text x="76" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  text-anchor="middle" class="svg-coral-stroke-fill">第 1 列</text>
  <text x="110" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  text-anchor="middle" class="svg-ink-fill">第 2 列</text>

  <!-- 等号 -->
  <text x="164" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="22"  text-anchor="middle" class="svg-ink-fill">=</text>

  <!-- 右:平面上的两个列向量 -->
  <line x1="220" y1="190" x2="375" y2="190"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="220" y1="190" x2="220" y2="45"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="381" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="212" y="38" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <circle cx="220" cy="190" r="2.6"  class="svg-ink-fill"/>

  <line x1="220" y1="190" x2="346" y2="148"  stroke-width="1.8" marker-end="url(#a-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="220" y1="190" x2="262" y2="106"  stroke-width="1.8" marker-end="url(#a-ink)" class="svg-ink-stroke"/>
  <text x="300" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-coral-stroke-fill">u = (3, 1)</text>
  <text x="270" y="98" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">v = (1, 2)</text>
</svg>
