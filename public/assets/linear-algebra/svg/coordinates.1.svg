<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-fill { fill: #cc785c; }
  .svg-ink-fill { fill: #312f2f; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  @media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-fill { fill: #e28466; }
    .svg-ink-fill { fill: #f0efe8; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
  }
</style>
  <defs>
    <marker id="co-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-ink-fill"/>
    </marker>
    <marker id="co-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-coral-stroke-fill"/>
    </marker>
    <marker id="co-arr-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- ============ 左:多项式 p(x) = 2 − x + 0.5x² ============ -->
  <!-- 原点 (60,150),x:40px/单位,y:25px/单位 -->
  <line x1="60" y1="150" x2="172" y2="150"  stroke-width="1" marker-end="url(#co-arr-axis)" class="svg-axis-stroke"/>
  <line x1="60" y1="150" x2="60" y2="38"  stroke-width="1" marker-end="url(#co-arr-axis)" class="svg-axis-stroke"/>
  <text x="176" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">x</text>
  <text x="52" y="32" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">p</text>

  <!-- 抛物线:过 (0,2)、(0.5,1.625)、(1,1.5)、(1.5,1.625)、(2,2) -->
  <polyline points="60,100 80,109.4 100,112.5 120,109.4 140,100" fill="none"  stroke-width="1.8" class="svg-ink-stroke"/>
  <circle cx="100" cy="112.5" r="2"  class="svg-muted-fill"/>

  <text x="24" y="186" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">p(x) = 2 − x + 0.5x²</text>

  <!-- ============ 中:坐标映射桥 ============ -->
  <line x1="196" y1="105" x2="292" y2="105"  stroke-width="1.4" marker-end="url(#co-arr-ink)" class="svg-ink-stroke"/>
  <text x="218" y="96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-ink-fill">[·]<tspan dy="3" font-size="10">B</tspan></text>
  <text x="204" y="126" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11"  class="svg-muted-fill">B = (1, x, x²)</text>

  <!-- ============ 右:坐标排成列向量 ============ -->
  <!-- 括号(matrices.1 约定:三段折线) -->
  <path d="M442,74 L432,74 L432,156 L442,156" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M478,74 L488,74 L488,156 L478,156" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>

  <!-- 三个坐标值 -->
  <text x="460" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="20"  text-anchor="middle" class="svg-coral-stroke-fill">2</text>
  <text x="460" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="20"  text-anchor="middle" class="svg-coral-stroke-fill">−1</text>
  <text x="460" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="20"  text-anchor="middle" class="svg-coral-stroke-fill">0.5</text>

  <!-- 行标签:对应的基元素 -->
  <text x="404" y="105" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">1</text>
  <text x="400" y="129" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="392" y="153" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x²</text>

  <text x="366" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">p 的坐标,排成列向量</text>
</svg>
