<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rk-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
    <marker id="rk-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
  </defs>

  <!-- ============ 左 panel:三列共面,秩 2 ============ -->
  <!-- 平面补丁:平行四边形 O=(70,150), 边 u=(120,-20), v=(60,-55) -->
  <path d="M70,150 L190,130 L250,75 L130,95 Z" fill="rgba(49,47,47,0.05)" stroke="#c9c4bb" stroke-width="1"/>
  <!-- 加法平行四边形的两条补边(虚线):c1 顶端 → c3 顶端、c2 顶端 → c3 顶端 -->
  <line x1="190" y1="130" x2="250" y2="75" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="130" y1="95" x2="250" y2="75" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 三个向量:c1 墨色、c2 墨色、c3=c1+c2 珊瑚色 -->
  <line x1="70" y1="150" x2="190" y2="130" stroke="#312f2f" stroke-width="1.5" marker-end="url(#rk-arr-ink)"/>
  <line x1="70" y1="150" x2="130" y2="95" stroke="#312f2f" stroke-width="1.5" marker-end="url(#rk-arr-ink)"/>
  <line x1="70" y1="150" x2="250" y2="75" stroke="#cc785c" stroke-width="1.5" marker-end="url(#rk-arr-coral)"/>
  <!-- 原点 -->
  <circle cx="70" cy="150" r="2.5" fill="#312f2f"/>
  <!-- 向量标签:一个对象一个标签,标签紧贴所标对象 -->
  <text x="196" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">c₁</text>
  <text x="112" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">c₂</text>
  <text x="250" y="60" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c" text-anchor="middle">c₃ = c₁ + c₂</text>
  <!-- panel 标题 -->
  <text x="145" y="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6a64" text-anchor="middle">三列张成平面 ⟹ 秩 2</text>

  <!-- ============ 分隔虚线 ============ -->
  <line x1="300" y1="20" x2="300" y2="180" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ 右 panel:三列共线,秩 1 ============ -->
  <!-- 张成的直线(延长,浅色虚线):过 O2=(370,140) 方向 w=(150,-60) -->
  <line x1="310" y1="164" x2="550" y2="68" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 三个共线向量:d1=0.4w、d2=w=2.5d1(珊瑚)、d3=-0.7d1 -->
  <line x1="370" y1="140" x2="430" y2="116" stroke="#312f2f" stroke-width="1.5" marker-end="url(#rk-arr-ink)"/>
  <line x1="370" y1="140" x2="520" y2="80" stroke="#cc785c" stroke-width="1.5" marker-end="url(#rk-arr-coral)"/>
  <line x1="370" y1="140" x2="328" y2="156.8" stroke="#312f2f" stroke-width="1.5" marker-end="url(#rk-arr-ink)"/>
  <!-- 原点 -->
  <circle cx="370" cy="140" r="2.5" fill="#312f2f"/>
  <!-- 向量标签 -->
  <text x="434" y="110" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">d₁</text>
  <text x="445" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c" text-anchor="middle">d₂ = 2.5d₁</text>
  <text x="312" y="176" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">d₃ = −0.7d₁</text>
  <!-- panel 标题 -->
  <text x="430" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6a64" text-anchor="middle">三列张成直线 ⟹ 秩 1</text>
</svg>
