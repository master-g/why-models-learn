<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }



@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="rk-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="rk-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <!-- ============ 左 panel:三列共面,秩 2 ============ -->
  <!-- 平面补丁:平行四边形 O=(70,150), 边 u=(120,-20), v=(60,-55) -->
  <path d="M70,150 L190,130 L250,75 L130,95 Z"  fill-opacity="0.05"  stroke-width="1" class="svg-special-fill-fill-312f2f svg-special-graphic-stroke-c9c4bb"/>
  <!-- 加法平行四边形的两条补边(虚线):c1 顶端 → c3 顶端、c2 顶端 → c3 顶端 -->
  <line x1="190" y1="130" x2="250" y2="75"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="130" y1="95" x2="250" y2="75"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 三个向量:c1 墨色、c2 墨色、c3=c1+c2 珊瑚色 -->
  <line x1="70" y1="150" x2="190" y2="130"  stroke-width="1.5" marker-end="url(#rk-arr-ink)" class="svg-ink-stroke"/>
  <line x1="70" y1="150" x2="130" y2="95"  stroke-width="1.5" marker-end="url(#rk-arr-ink)" class="svg-ink-stroke"/>
  <line x1="70" y1="150" x2="250" y2="75"  stroke-width="1.5" marker-end="url(#rk-arr-coral)" class="svg-coral-stroke-stroke"/>
  <!-- 原点 -->
  <circle cx="70" cy="150" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <!-- 向量标签:一个对象一个标签,标签紧贴所标对象 -->
  <text x="196" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">c₁</text>
  <text x="112" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">c₂</text>
  <text x="250" y="60" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-coral-text-fill">c₃ = c₁ + c₂</text>
  <!-- panel 标题 -->
  <text x="145" y="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">三列张成平面 ⟹ 秩 2</text>

  <!-- ============ 分隔虚线 ============ -->
  <line x1="300" y1="20" x2="300" y2="180"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>

  <!-- ============ 右 panel:三列共线,秩 1 ============ -->
  <!-- 张成的直线(延长,浅色虚线):过 O2=(370,140) 方向 w=(150,-60) -->
  <line x1="310" y1="164" x2="550" y2="68"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 三个共线向量:d1=0.4w、d2=w=2.5d1(珊瑚)、d3=-0.7d1 -->
  <line x1="370" y1="140" x2="430" y2="116"  stroke-width="1.5" marker-end="url(#rk-arr-ink)" class="svg-ink-stroke"/>
  <line x1="370" y1="140" x2="520" y2="80"  stroke-width="1.5" marker-end="url(#rk-arr-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="370" y1="140" x2="328" y2="156.8"  stroke-width="1.5" marker-end="url(#rk-arr-ink)" class="svg-ink-stroke"/>
  <!-- 原点 -->
  <circle cx="370" cy="140" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <!-- 向量标签 -->
  <text x="434" y="110" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">d₁</text>
  <text x="445" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-coral-text-fill">d₂ = 2.5d₁</text>
  <text x="312" y="176" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">d₃ = −0.7d₁</text>
  <!-- panel 标题 -->
  <text x="430" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">三列张成直线 ⟹ 秩 1</text>
</svg>
