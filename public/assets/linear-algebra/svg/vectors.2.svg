<svg data-svg-theme="paper-ink-v1" width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }



@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="a-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 坐标轴 -->
  <line x1="55" y1="215" x2="366" y2="215"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="55" y1="215" x2="55" y2="30"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="372" y="219" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="47" y="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <text x="41" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">O</text>

  <!-- 平行四边形(另一边路径):O → (1,2) → (4,3) -->
  <line x1="55" y1="215" x2="93" y2="136"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="95" y1="135" x2="212" y2="96"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>

  <!-- u = (3,1) -->
  <line x1="55" y1="215" x2="172" y2="176"  stroke-width="1.8" marker-end="url(#a-ink)" class="svg-ink-stroke"/>
  <text x="100" y="211" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">u</text>

  <!-- v = (1,2),从 u 的终点接着走(首尾相接) -->
  <line x1="175" y1="175" x2="213" y2="97"  stroke-width="1.8" marker-end="url(#a-ink)" class="svg-ink-stroke"/>
  <text x="205" y="142" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">v</text>

  <!-- u + v = (4,3):对角线 -->
  <line x1="55" y1="215" x2="212" y2="97"  stroke-width="1.8" marker-end="url(#a-coral)" class="svg-coral-stroke-stroke"/>
  <text x="97" y="143" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-coral-text-fill">u + v</text>

  <!-- 关键点与坐标 -->
  <circle cx="55" cy="215" r="2.6"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="175" cy="175" r="2.6"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="95" cy="135" r="2.6"  class="svg-axis-fill"/>
  <circle cx="215" cy="95" r="2.6"  class="svg-special-fill-fill-cc785c"/>
  <text x="180" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5"  class="svg-muted-fill">(3, 1)</text>
  <text x="60" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5"  class="svg-muted-fill">(1, 2)</text>
  <text x="224" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5"  class="svg-muted-fill">(4, 3)</text>
</svg>
