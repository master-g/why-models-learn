<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
    <marker id="a-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b2a8"/>
    </marker>
  </defs>

  <!-- 坐标轴 -->
  <line x1="55" y1="215" x2="366" y2="215" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="55" y1="215" x2="55" y2="30" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="372" y="219" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">x</text>
  <text x="47" y="22" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">y</text>
  <text x="41" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#6c6a64">O</text>

  <!-- 平行四边形(另一边路径):O → (1,2) → (4,3) -->
  <line x1="55" y1="215" x2="93" y2="136" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="95" y1="135" x2="212" y2="96" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- u = (3,1) -->
  <line x1="55" y1="215" x2="172" y2="176" stroke="#312f2f" stroke-width="1.8" marker-end="url(#a-ink)"/>
  <text x="100" y="211" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">u</text>

  <!-- v = (1,2),从 u 的终点接着走(首尾相接) -->
  <line x1="175" y1="175" x2="213" y2="97" stroke="#312f2f" stroke-width="1.8" marker-end="url(#a-ink)"/>
  <text x="205" y="142" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">v</text>

  <!-- u + v = (4,3):对角线 -->
  <line x1="55" y1="215" x2="212" y2="97" stroke="#cc785c" stroke-width="1.8" marker-end="url(#a-coral)"/>
  <text x="97" y="143" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#a9583e">u + v</text>

  <!-- 关键点与坐标 -->
  <circle cx="55" cy="215" r="2.6" fill="#312f2f"/>
  <circle cx="175" cy="175" r="2.6" fill="#312f2f"/>
  <circle cx="95" cy="135" r="2.6" fill="#b8b2a8"/>
  <circle cx="215" cy="95" r="2.6" fill="#cc785c"/>
  <text x="180" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6c6a64">(3, 1)</text>
  <text x="60" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6c6a64">(1, 2)</text>
  <text x="224" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#6c6a64">(4, 3)</text>
</svg>
