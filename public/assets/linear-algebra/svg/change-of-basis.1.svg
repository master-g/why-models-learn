<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-coral-stroke-fill { fill: #cc785c; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-fill { fill: #312f2f; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  @media (prefers-color-scheme: dark) {
    .svg-coral-stroke-fill { fill: #e28466; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-fill { fill: #f0efe8; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
  }
</style>
  <defs>
    <marker id="cb-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-ink-fill"/>
    </marker>
    <marker id="cb-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-coral-stroke-fill"/>
    </marker>
  </defs>

  <!-- 顶部:世界中的向量 b -->
  <circle cx="280" cy="36" r="3"  class="svg-coral-stroke-fill"/>
  <text x="292" y="32" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15"  class="svg-coral-text-fill">b</text>

  <!-- 左侧箭头:b → [b]_B -->
  <line x1="270" y1="46" x2="196" y2="112"  stroke-width="1.4" marker-end="url(#cb-arr-ink)" class="svg-ink-stroke"/>
  <text x="176" y="82" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">[·]<tspan dy="3" font-size="9">B</tspan></text>

  <!-- 右侧箭头:b → [b]_C -->
  <line x1="290" y1="46" x2="364" y2="112"  stroke-width="1.4" marker-end="url(#cb-arr-ink)" class="svg-ink-stroke"/>
  <text x="340" y="82" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">[·]<tspan dy="3" font-size="9">C</tspan></text>

  <!-- 底部左:[b]_B 列向量 (0.4, 2.8) -->
  <path d="M160,118 L150,118 L150,168 L160,168" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M180,118 L190,118 L190,168 L180,168" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <text x="170" y="141" font-family="Georgia, 'Times New Roman', serif" font-size="14"  text-anchor="middle" class="svg-ink-fill">0.4</text>
  <text x="170" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="14"  text-anchor="middle" class="svg-ink-fill">2.8</text>
  <text x="170" y="190" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-muted-fill">[b]<tspan dy="3" font-size="9">B</tspan></text>

  <!-- 底部右:[b]_C 列向量 (5, −1) -->
  <path d="M380,118 L370,118 L370,168 L380,168" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M400,118 L410,118 L410,168 L400,168" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <text x="390" y="141" font-family="Georgia, 'Times New Roman', serif" font-size="14"  text-anchor="middle" class="svg-ink-fill">5</text>
  <text x="390" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="14"  text-anchor="middle" class="svg-ink-fill">−1</text>
  <text x="390" y="190" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-muted-fill">[b]<tspan dy="3" font-size="9">C</tspan></text>

  <!-- 底部箭头:[b]_B → [b]_C(过渡矩阵) -->
  <line x1="196" y1="143" x2="364" y2="143"  stroke-width="1.4" marker-end="url(#cb-arr-coral)" class="svg-coral-stroke-stroke"/>

  <!-- 过渡矩阵 2×2:[[2, 1.5],[1, −0.5]] -->
  <path d="M256,96 L248,96 L248,132 L256,132" fill="none"  stroke-width="1.2" class="svg-ink-stroke"/>
  <path d="M312,96 L320,96 L320,132 L312,132" fill="none"  stroke-width="1.2" class="svg-ink-stroke"/>
  <text x="272" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="11"  text-anchor="middle" class="svg-ink-fill">2</text>
  <text x="298" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="11"  text-anchor="middle" class="svg-ink-fill">1.5</text>
  <text x="272" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="11"  text-anchor="middle" class="svg-ink-fill">1</text>
  <text x="298" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="11"  text-anchor="middle" class="svg-ink-fill">−0.5</text>
  <text x="284" y="88" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  text-anchor="middle" class="svg-coral-text-fill">P<tspan dy="3" font-size="9">C←B</tspan></text>
</svg>
