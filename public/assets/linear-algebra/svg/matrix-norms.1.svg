<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="norm-title norm-desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f3eee8 { fill: #94908d; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f3eee8 { fill: #f3eee8; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f3eee8 { fill: #94908d; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f3eee8 { fill: #343333; }
    .svg-special-background-fill-fffdfb { fill: #363535; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <title id="norm-title">矩阵范数的五把尺子</title>
  <desc id="norm-desc">同一个矩阵 A 分别用最大列和、最大行和、最大长度放大、全部元素和奇异值之和来测量。</desc>
  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="207" y1="42" x2="207" y2="228"  class="svg-special-graphic-stroke-e2dbd3"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="22" y="28" font-size="15" font-weight="600">同一个 A，五种读法</text>
    <text x="25" y="57" font-size="13"  class="svg-muted-fill">元素矩阵</text>
    <text x="25" y="203" font-size="12"  class="svg-muted-fill">A = (3, 4) 的外积</text>
    <text x="230" y="28" font-size="13"  class="svg-muted-fill">每把尺子回答不同问题</text>
  </g>

  <g  font-family="Georgia, 'Times New Roman', serif" font-size="25" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="55" y="105">A =</text>
    <text x="120" y="90">3</text>
    <text x="158" y="90">4</text>
    <text x="120" y="130">0</text>
    <text x="158" y="130">0</text>
  </g>
  <g  stroke-width="1.5" fill="none" class="svg-ink-stroke">
    <path d="M105 72 h8 M105 72 v76 M105 148 h8"/>
    <path d="M180 72 h-8 M180 72 v76 M180 148 h-8"/>
  </g>
  <line x1="75" y1="166" x2="174" y2="166"  stroke-width="2" class="svg-coral-stroke-stroke"/>
  <circle cx="75" cy="166" r="3"  class="svg-special-fill-fill-cc785c"/>
  <circle cx="174" cy="166" r="3"  class="svg-special-fill-fill-cc785c"/>
  <text x="83" y="183" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  class="svg-coral-text-fill">非零行的长度是 5</text>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
    <rect x="230" y="43" width="302" height="33" rx="5"  class="svg-special-fill-fill-f3eee8 svg-special-background-fill-f3eee8"/>
    <text x="244" y="64"  class="svg-special-text-fill-312f2f">诱导 1 范数：最大列和</text>
    <text x="445" y="64"  class="svg-coral-text-fill">‖A‖₁ = 4</text>

    <rect x="230" y="80" width="302" height="33" rx="5"  class="svg-special-fill-fill-f3eee8 svg-special-background-fill-f3eee8"/>
    <text x="244" y="101"  class="svg-special-text-fill-312f2f">诱导 ∞ 范数：最大行和</text>
    <text x="445" y="101"  class="svg-coral-text-fill">‖A‖∞ = 7</text>

    <rect x="230" y="117" width="302" height="33" rx="5"  class="svg-special-fill-fill-f3eee8 svg-special-background-fill-f3eee8"/>
    <text x="244" y="138"  class="svg-special-text-fill-312f2f">谱范数：最长长度放大</text>
    <text x="445" y="138"  class="svg-coral-text-fill">‖A‖₂ = 5</text>

    <rect x="230" y="154" width="302" height="33" rx="5"  class="svg-special-fill-fill-f3eee8 svg-special-background-fill-f3eee8"/>
    <text x="244" y="175"  class="svg-special-text-fill-312f2f">Frobenius：所有元素</text>
    <text x="445" y="175"  class="svg-coral-text-fill">‖A‖F = 5</text>

    <rect x="230" y="191" width="302" height="33" rx="5"  class="svg-special-fill-fill-f3eee8 svg-special-background-fill-f3eee8"/>
    <text x="244" y="212"  class="svg-special-text-fill-312f2f">核范数：奇异值总和</text>
    <text x="445" y="212"  class="svg-coral-text-fill">‖A‖* = 5</text>
  </g>
</svg>
