<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-8a867d { fill: #8a867d; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-graphic-stroke-8a867d { stroke: #8a867d; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-8a867d { fill: #76726b; }



@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-8a867d { fill: #8a867d; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-graphic-stroke-8a867d { stroke: #8a867d; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-8a867d { fill: #a7a49f; }



  }
</style>
  <defs>
    <marker id="ss-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="ss-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="ss-arr-aux" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-special-fill-fill-8a867d"/>
    </marker>
  </defs>

  <!-- ============ 左 panel:过原点直线 y=2x,封闭 ============ -->
  <!-- 平面补丁 -->
  <rect x="25" y="25" width="255" height="155"  fill-opacity="0.04"  stroke-width="1" class="svg-special-fill-fill-312f2f svg-special-graphic-stroke-c9c4bb"/>
  <!-- 直线 y=2x(过原点 O1=(85,165),20px/单位) -->
  <line x1="74" y1="187" x2="146" y2="43"  stroke-width="1.5" class="svg-special-graphic-stroke-8a867d"/>
  <!-- 向量:u、v 墨色,u+v 珊瑚,0.5u 辅助灰,全部贴线 -->
  <line x1="85" y1="165" x2="105" y2="125"  stroke-width="1.5" marker-end="url(#ss-arr-ink)" class="svg-ink-stroke"/>
  <line x1="85" y1="165" x2="125" y2="85"  stroke-width="1.5" marker-end="url(#ss-arr-ink)" class="svg-ink-stroke"/>
  <line x1="85" y1="165" x2="145" y2="45"  stroke-width="1.5" marker-end="url(#ss-arr-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="85" y1="165" x2="95" y2="145"  stroke-width="1.5" marker-end="url(#ss-arr-aux)" class="svg-special-graphic-stroke-8a867d"/>
  <!-- 原点 -->
  <circle cx="85" cy="165" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <!-- 标签:关系并入标签,紧贴所标对象 -->
  <text x="93" y="117" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">u</text>
  <text x="111" y="76" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">v</text>
  <text x="150" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">u + v</text>
  <text x="100" y="159" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-8a867d">0.5u</text>
  <text x="76" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">O</text>
  <!-- panel 标题 -->
  <text x="152" y="193" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">过原点直线:相加、缩放都在线上 ⟹ 子空间</text>

  <!-- ============ 分隔虚线 ============ -->
  <line x1="300" y1="20" x2="300" y2="180"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>

  <!-- ============ 右 panel:平移直线 y=2x+1,数乘逃逸 ============ -->
  <!-- 坐标轴(O2=(375,165),20px/单位) -->
  <line x1="320" y1="165" x2="555" y2="165"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="375" y1="190" x2="375" y2="25"  stroke-width="1" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 平移直线 y=2x+1(不过原点) -->
  <line x1="363" y1="169" x2="431" y2="33"  stroke-width="1.5" class="svg-special-graphic-stroke-8a867d"/>
  <!-- q=(1,3) 墨色在线上,0.5q=(0.5,1.5) 珊瑚虚线离线 -->
  <line x1="375" y1="165" x2="395" y2="105"  stroke-width="1.5" marker-end="url(#ss-arr-ink)" class="svg-ink-stroke"/>
  <line x1="375" y1="165" x2="385" y2="135"  stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ss-arr-coral)" class="svg-coral-stroke-stroke"/>
  <!-- 从 0.5q 到直线的「应在位置」虚线连接 -->
  <line x1="385" y1="135" x2="385" y2="125"  stroke-width="1" stroke-dasharray="2 2" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 原点 -->
  <circle cx="375" cy="165" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <!-- 标签 -->
  <text x="401" y="108" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">q</text>
  <text x="392" y="141" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">0.5q ✗</text>
  <text x="365" y="180" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-special-text-fill-312f2f">O</text>
  <!-- panel 标题 -->
  <text x="437" y="193" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">平移直线不过原点:一缩放就离线 ⟹ 非子空间</text>
</svg>
