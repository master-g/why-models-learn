<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="vs-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
    <marker id="vs-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
    <marker id="vs-arr-aux" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a867d"/>
    </marker>
  </defs>

  <!-- ============ 左 panel:R² 平面,加法与数乘封闭 ============ -->
  <!-- 平面补丁 -->
  <rect x="25" y="25" width="255" height="155" fill="rgba(49,47,47,0.04)" stroke="#c9c4bb" stroke-width="1"/>
  <!-- 加法平行四边形的补边(虚线) -->
  <line x1="130" y1="120" x2="160" y2="60" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100" y1="90" x2="160" y2="60" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 向量:u、v 墨色,u+v 珊瑚,0.5u 辅助灰 -->
  <line x1="70" y1="150" x2="130" y2="120" stroke="#312f2f" stroke-width="1.5" marker-end="url(#vs-arr-ink)"/>
  <line x1="70" y1="150" x2="100" y2="90" stroke="#312f2f" stroke-width="1.5" marker-end="url(#vs-arr-ink)"/>
  <line x1="70" y1="150" x2="160" y2="60" stroke="#cc785c" stroke-width="1.5" marker-end="url(#vs-arr-coral)"/>
  <line x1="70" y1="150" x2="100" y2="135" stroke="#8a867d" stroke-width="1.5" marker-end="url(#vs-arr-aux)"/>
  <!-- 原点 -->
  <circle cx="70" cy="150" r="2.5" fill="#312f2f"/>
  <!-- 向量标签 -->
  <text x="136" y="126" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">u</text>
  <text x="80" y="84" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">v</text>
  <text x="166" y="62" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c">u + v</text>
  <text x="106" y="142" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8a867d">0.5u</text>
  <!-- panel 标题 -->
  <text x="150" y="193" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6a64" text-anchor="middle">相加、缩放,结果永远在面内 ⟹ 封闭</text>

  <!-- ============ 分隔虚线 ============ -->
  <line x1="300" y1="20" x2="300" y2="180" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ 右 panel:第一象限,−u 逃逸 ============ -->
  <!-- 第一象限着色(x≥0 且 y≥0,原点 O2=(375,155)) -->
  <rect x="375" y="25" width="180" height="130" fill="rgba(49,47,47,0.05)"/>
  <!-- 坐标轴 -->
  <line x1="315" y1="155" x2="558" y2="155" stroke="#c9c4bb" stroke-width="1"/>
  <line x1="375" y1="190" x2="375" y2="20" stroke="#c9c4bb" stroke-width="1"/>
  <!-- u 墨色,−u 珊瑚虚线逃逸 -->
  <line x1="375" y1="155" x2="420" y2="132.5" stroke="#312f2f" stroke-width="1.5" marker-end="url(#vs-arr-ink)"/>
  <line x1="375" y1="155" x2="330" y2="177.5" stroke="#cc785c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#vs-arr-coral)"/>
  <!-- 原点 -->
  <circle cx="375" cy="155" r="2.5" fill="#312f2f"/>
  <!-- 向量标签 -->
  <text x="426" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">u</text>
  <text x="322" y="168" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#cc785c">−u</text>
  <!-- panel 标题 -->
  <text x="435" y="193" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6a64" text-anchor="middle">−u 逃出象限 ⟹ 数乘不封闭,不是向量空间</text>
</svg>
