<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-text-fill-312f2f { fill: #312f2f; }


@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="ge-arr" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 宏:每个矩阵 bracket 左/右 + 分隔虚线 + 3×4 数字。矩阵 x0 ∈ {12,149,286,423},宽 92 -->
  <!-- ============ M0 初始 ============ -->
  <path d="M16,62 L10,62 L10,134 L16,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M98,62 L104,62 L104,134 L98,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <line x1="78" y1="66" x2="78" y2="130"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13"  text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="30" y="79">1</text><text x="50" y="79">1</text><text x="66" y="79">1</text><text x="91" y="79">4</text>
    <text x="30" y="105">2</text><text x="50" y="105">−1</text><text x="66" y="105">1</text><text x="91" y="105">0</text>
    <text x="30" y="131">1</text><text x="50" y="131">2</text><text x="66" y="131">−1</text><text x="91" y="131">9</text>
  </g>
  <text x="57" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">初始增广矩阵</text>

  <!-- 箭头1 + 标注 -->
  <line x1="110" y1="98" x2="144" y2="98"  stroke-width="1.2" marker-end="url(#ge-arr)" class="svg-axis-stroke"/>
  <text x="127" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="10"  text-anchor="middle" class="svg-muted-fill">R₂−2R₁</text>
  <text x="127" y="53" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="10"  text-anchor="middle" class="svg-muted-fill">R₃−R₁</text>

  <!-- ============ M1 消第一列 ============ -->
  <path d="M153,62 L147,62 L147,134 L153,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M235,62 L241,62 L241,134 L235,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <line x1="215" y1="66" x2="215" y2="130"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13"  text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="167" y="79">1</text><text x="187" y="79">1</text><text x="203" y="79">1</text><text x="228" y="79">4</text>
    <text x="167" y="105">0</text><text x="187" y="105">−3</text><text x="203" y="105">−1</text><text x="228" y="105">−8</text>
    <text x="167" y="131">0</text><text x="187" y="131">1</text><text x="203" y="131">−2</text><text x="228" y="131">5</text>
  </g>
  <text x="194" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">① 消第一列</text>

  <!-- 箭头2 + 标注 -->
  <line x1="247" y1="98" x2="281" y2="98"  stroke-width="1.2" marker-end="url(#ge-arr)" class="svg-axis-stroke"/>
  <text x="264" y="46" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="10"  text-anchor="middle" class="svg-muted-fill">交换 R₂↔R₃</text>

  <!-- ============ M2 换行 ============ -->
  <path d="M290,62 L284,62 L284,134 L290,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M372,62 L378,62 L378,134 L372,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <line x1="352" y1="66" x2="352" y2="130"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13"  text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="304" y="79">1</text><text x="324" y="79">1</text><text x="340" y="79">1</text><text x="365" y="79">4</text>
    <text x="304" y="105">0</text><text x="324" y="105">1</text><text x="340" y="105">−2</text><text x="365" y="105">5</text>
    <text x="304" y="131">0</text><text x="324" y="131">−3</text><text x="340" y="131">−1</text><text x="365" y="131">−8</text>
  </g>
  <text x="331" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">② 主元换成 1</text>

  <!-- 箭头3 + 标注 -->
  <line x1="384" y1="98" x2="418" y2="98"  stroke-width="1.2" marker-end="url(#ge-arr)" class="svg-axis-stroke"/>
  <text x="401" y="46" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="10"  text-anchor="middle" class="svg-muted-fill">R₃+3R₂</text>

  <!-- ============ M3 上三角(主元珊瑚色) ============ -->
  <path d="M427,62 L421,62 L421,134 L427,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <path d="M509,62 L515,62 L515,134 L509,134" fill="none"  stroke-width="1.5" class="svg-ink-stroke"/>
  <line x1="489" y1="66" x2="489" y2="130"  stroke-width="1" stroke-dasharray="3 3" class="svg-special-graphic-stroke-c9c4bb"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13"  text-anchor="middle" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="441" y="79"  font-weight="bold" class="svg-coral-text-fill">1</text><text x="461" y="79">1</text><text x="477" y="79">1</text><text x="502" y="79">4</text>
    <text x="441" y="105">0</text><text x="461" y="105"  font-weight="bold" class="svg-coral-text-fill">1</text><text x="477" y="105">−2</text><text x="502" y="105">5</text>
    <text x="441" y="131">0</text><text x="461" y="131">0</text><text x="477" y="131"  font-weight="bold" class="svg-coral-text-fill">−7</text><text x="502" y="131">7</text>
  </g>
  <text x="468" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  text-anchor="middle" class="svg-muted-fill">③ 上三角,主元 1、1、−7</text>

  <!-- 底部点题 -->
  <text x="280" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5"  text-anchor="middle" class="svg-special-text-fill-312f2f">三种行变换、四张快照：方程组被一步步折成三角形，然后回代收尾</text>
</svg>
