<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="op-title op-desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-6c6a64 { fill: #6c6a64; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-6c6a64 { fill: #6c6a64; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fffdfb { fill: #363535; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <title id="op-title">正交投影与正规方程</title>
  <desc id="op-desc">左侧把向量 x 分成子空间 W 内的最近点 p 与垂直残差 r，右侧展示一般列基的投影矩阵公式。</desc>
  <defs>
    <marker id="op-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="op-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="op-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-6c6a64"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="278" y1="18" x2="278" y2="224"  class="svg-special-graphic-stroke-e2dbd3"/>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="18" y="24" font-size="13" font-weight="600">几何：x = p + r</text>
    <text x="300" y="24" font-size="13" font-weight="600">矩阵：投影与正规方程</text>
  </g>

  <!-- 左 panel: W=span(1,1), x=(2,1), p=(3/2,3/2) -->
  <line x1="30" y1="244" x2="245" y2="29"  stroke-width="1.5" stroke-dasharray="5 4" class="svg-axis-stroke"/>
  <text x="224" y="45" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-muted-fill">W</text>
  <line x1="84" y1="190" x2="84" y2="48"  stroke-width="1" marker-end="url(#op-arrow-muted)" class="svg-axis-stroke"/>
  <line x1="31" y1="190" x2="246" y2="190"  stroke-width="1" marker-end="url(#op-arrow-muted)" class="svg-axis-stroke"/>
  <line x1="84" y1="190" x2="174" y2="145"  stroke-width="2.2" marker-end="url(#op-arrow-ink)" class="svg-ink-stroke"/>
  <line x1="84" y1="190" x2="151.5" y2="122.5"  stroke-width="2.4" marker-end="url(#op-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <line x1="151.5" y1="122.5" x2="174" y2="145"  stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#op-arrow-muted)" class="svg-special-graphic-stroke-6c6a64"/>
  <path d="M 145.8 128.2 L 151.5 133.8 L 157.2 128.2" fill="none"  stroke-width="1.2" class="svg-special-graphic-stroke-6c6a64"/>
  <text x="177" y="143" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">x</text>
  <text x="150" y="116" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-coral-text-fill">p</text>
  <text x="174" y="114" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-muted-fill">r</text>
  <text x="31" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">p∈W，r=x−p⊥W</text>

  <!-- 右 panel: matrix flow -->
  <rect x="301" y="50" width="236" height="58" rx="6"   class="svg-special-fill-fill-f4efee svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-f4efee"/>
  <text x="316" y="73" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16"  class="svg-special-text-fill-312f2f">P<tspan dy="4" font-size="11">A</tspan><tspan dy="-4">=A(AᵀA)⁻¹Aᵀ</tspan></text>
  <text x="316" y="95" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5"  class="svg-muted-fill">列不正交时，先解正规方程</text>
  <line x1="316" y1="136" x2="522" y2="136"  stroke-width="2" marker-end="url(#op-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <text x="316" y="130" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">x</text>
  <text x="413" y="130" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-coral-text-fill">P<tspan dy="3" font-size="10">A</tspan><tspan dy="-3">x</tspan></text>
  <text x="503" y="130" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14"  class="svg-special-text-fill-312f2f">p</text>
  <rect x="301" y="157" width="236" height="54" rx="6"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <text x="316" y="180" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15"  class="svg-special-text-fill-312f2f">Aᵀ(x−A c)=0</text>
  <text x="316" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11.5"  class="svg-muted-fill">残差与 Col(A) 的每一列正交</text>
</svg>
