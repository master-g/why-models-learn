<svg data-svg-theme="paper-ink-v1" width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-fill { fill: #cc785c; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-fill { fill: #312f2f; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-muted-stroke { stroke: #6c6a64; }
  @media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-fill { fill: #e28466; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-fill { fill: #f0efe8; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-muted-stroke { stroke: #aaa9a1; }
  }
</style>
  <defs>
    <marker id="af-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-coral-stroke-fill"/>
    </marker>
    <marker id="af-arr-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
    <marker id="af-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-ink-fill"/>
    </marker>
  </defs>

  <!-- ============ 左:仿射子空间 M = p + U ============ -->
  <!-- 原点 (80,150),30px/单位 -->
  <line x1="80" y1="150" x2="185" y2="150"  stroke-width="1" marker-end="url(#af-arr-gray)" class="svg-axis-stroke"/>
  <line x1="80" y1="150" x2="80" y2="35"  stroke-width="1" marker-end="url(#af-arr-gray)" class="svg-axis-stroke"/>
  <text x="189" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">x</text>
  <text x="72" y="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">y</text>

  <!-- U:过原点虚线,方向 (1,2) -->
  <line x1="64" y1="183" x2="108" y2="94"  stroke-width="1" stroke-dasharray="4 4" class="svg-muted-stroke"/>
  <text x="96" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">U</text>

  <!-- M = p + U:珊瑚线,过 (1,0) 同方向 -->
  <line x1="94" y1="183" x2="140" y2="90"  stroke-width="1.8" class="svg-coral-stroke-stroke"/>
  <text x="146" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-coral-text-fill">M = p + U</text>

  <!-- 基点 p:原点 → (1,0) 珊瑚箭头 -->
  <line x1="80" y1="147" x2="104" y2="147"  stroke-width="1.2" marker-end="url(#af-arr-coral)" class="svg-coral-stroke-stroke"/>
  <text x="90" y="139" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-coral-text-fill">p</text>
  <circle cx="110" cy="150" r="2.4"  class="svg-ink-fill"/>
  <circle cx="140" cy="90" r="2.4"  class="svg-ink-fill"/>
  <text x="146" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11"  class="svg-ink-fill">(2, 2)</text>
  <circle cx="80" cy="150" r="2.4"  class="svg-ink-fill"/>

  <text x="118" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  text-anchor="middle" class="svg-muted-fill">仿射子空间 = 平移过的子空间</text>

  <!-- ============ 右:两层仿射塌缩 ============ -->
  <!-- 第一行:两层 -->
  <text x="262" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">x</text>
  <line x1="272" y1="60" x2="282" y2="60"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <rect x="284" y="46" width="72" height="28" rx="3" fill="none"  stroke-width="1.2" class="svg-ink-stroke"/>
  <text x="320" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  text-anchor="middle" class="svg-ink-fill">W<tspan dy="2" font-size="8">1</tspan><tspan dy="-2">x</tspan> + b<tspan dy="2" font-size="8">1</tspan></text>
  <line x1="356" y1="60" x2="366" y2="60"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <text x="373" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">h</text>
  <line x1="381" y1="60" x2="391" y2="60"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <rect x="393" y="46" width="72" height="28" rx="3" fill="none"  stroke-width="1.2" class="svg-ink-stroke"/>
  <text x="429" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  text-anchor="middle" class="svg-ink-fill">W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">h</tspan> + b<tspan dy="2" font-size="8">2</tspan></text>
  <line x1="465" y1="60" x2="475" y2="60"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <text x="482" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">y</text>

  <!-- 塌缩箭头与说明 -->
  <line x1="373" y1="80" x2="373" y2="110"  stroke-width="1.1" marker-end="url(#af-arr-gray)" class="svg-axis-stroke"/>
  <text x="385" y="99" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11"  class="svg-muted-fill">无激活,复合成一层</text>

  <!-- 第二行:一层 -->
  <text x="262" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">x</text>
  <line x1="272" y1="134" x2="282" y2="134"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <rect x="284" y="120" width="182" height="28" rx="3" fill="none"  stroke-width="1.5" class="svg-coral-stroke-stroke"/>
  <text x="375" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  text-anchor="middle" class="svg-coral-text-fill">(W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">W</tspan><tspan dy="2" font-size="8">1</tspan><tspan dy="-2">)x</tspan> + (W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">b</tspan><tspan dy="2" font-size="8">1</tspan><tspan dy="-2"> + b</tspan><tspan dy="2" font-size="8">2</tspan><tspan dy="-2">)</tspan></text>
  <line x1="466" y1="134" x2="476" y2="134"  stroke-width="1.1" marker-end="url(#af-arr-ink)" class="svg-ink-stroke"/>
  <text x="482" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-ink-fill">y</text>

  <text x="373" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  text-anchor="middle" class="svg-muted-fill">仿射映射复合仍是仿射</text>
</svg>
