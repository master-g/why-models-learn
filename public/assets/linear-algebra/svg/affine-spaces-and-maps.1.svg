<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="af-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
    <marker id="af-arr-gray" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b2a8"/>
    </marker>
    <marker id="af-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
  </defs>

  <!-- ============ 左:仿射子空间 M = p + U ============ -->
  <!-- 原点 (80,150),30px/单位 -->
  <line x1="80" y1="150" x2="185" y2="150" stroke="#b8b2a8" stroke-width="1" marker-end="url(#af-arr-gray)"/>
  <line x1="80" y1="150" x2="80" y2="35" stroke="#b8b2a8" stroke-width="1" marker-end="url(#af-arr-gray)"/>
  <text x="189" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="72" y="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>

  <!-- U:过原点虚线,方向 (1,2) -->
  <line x1="64" y1="183" x2="108" y2="94" stroke="#6c6a64" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="96" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">U</text>

  <!-- M = p + U:珊瑚线,过 (1,0) 同方向 -->
  <line x1="94" y1="183" x2="140" y2="90" stroke="#cc785c" stroke-width="1.8"/>
  <text x="146" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#a9583e">M = p + U</text>

  <!-- 基点 p:原点 → (1,0) 珊瑚箭头 -->
  <line x1="80" y1="147" x2="104" y2="147" stroke="#cc785c" stroke-width="1.2" marker-end="url(#af-arr-coral)"/>
  <text x="90" y="139" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#a9583e">p</text>
  <circle cx="110" cy="150" r="2.4" fill="#312f2f"/>
  <circle cx="140" cy="90" r="2.4" fill="#312f2f"/>
  <text x="146" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11" fill="#312f2f">(2, 2)</text>
  <circle cx="80" cy="150" r="2.4" fill="#312f2f"/>

  <text x="118" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64" text-anchor="middle">仿射子空间 = 平移过的子空间</text>

  <!-- ============ 右:两层仿射塌缩 ============ -->
  <!-- 第一行:两层 -->
  <text x="262" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">x</text>
  <line x1="272" y1="60" x2="282" y2="60" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <rect x="284" y="46" width="72" height="28" rx="3" fill="none" stroke="#312f2f" stroke-width="1.2"/>
  <text x="320" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#312f2f" text-anchor="middle">W<tspan dy="2" font-size="8">1</tspan><tspan dy="-2">x</tspan> + b<tspan dy="2" font-size="8">1</tspan></text>
  <line x1="356" y1="60" x2="366" y2="60" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <text x="373" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">h</text>
  <line x1="381" y1="60" x2="391" y2="60" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <rect x="393" y="46" width="72" height="28" rx="3" fill="none" stroke="#312f2f" stroke-width="1.2"/>
  <text x="429" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#312f2f" text-anchor="middle">W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">h</tspan> + b<tspan dy="2" font-size="8">2</tspan></text>
  <line x1="465" y1="60" x2="475" y2="60" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <text x="482" y="64" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">y</text>

  <!-- 塌缩箭头与说明 -->
  <line x1="373" y1="80" x2="373" y2="110" stroke="#b8b2a8" stroke-width="1.1" marker-end="url(#af-arr-gray)"/>
  <text x="385" y="99" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6a64">无激活,复合成一层</text>

  <!-- 第二行:一层 -->
  <text x="262" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">x</text>
  <line x1="272" y1="134" x2="282" y2="134" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <rect x="284" y="120" width="182" height="28" rx="3" fill="none" stroke="#cc785c" stroke-width="1.5"/>
  <text x="375" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#a9583e" text-anchor="middle">(W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">W</tspan><tspan dy="2" font-size="8">1</tspan><tspan dy="-2">)x</tspan> + (W<tspan dy="2" font-size="8">2</tspan><tspan dy="-2">b</tspan><tspan dy="2" font-size="8">1</tspan><tspan dy="-2"> + b</tspan><tspan dy="2" font-size="8">2</tspan><tspan dy="-2">)</tspan></text>
  <line x1="466" y1="134" x2="476" y2="134" stroke="#312f2f" stroke-width="1.1" marker-end="url(#af-arr-ink)"/>
  <text x="482" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#312f2f">y</text>

  <text x="373" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64" text-anchor="middle">仿射映射复合仍是仿射</text>
</svg>
