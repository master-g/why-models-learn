<svg data-svg-theme="paper-ink-v1" width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }



@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- 左 panel:先剪后拉(D 在左,S 先作用) -->
  <text x="40" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">先剪切 S，后拉伸 D：乘积 DS</text>
  <!-- 方格 -->
  <line x1="70" y1="55" x2="70" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="100" y1="55" x2="100" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="130" y1="55" x2="130" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="160" y1="55" x2="160" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="175" x2="200" y2="175"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="145" x2="200" y2="145"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="115" x2="200" y2="115"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="40" y1="85" x2="200" y2="85"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="205" x2="212" y2="205"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="40" y1="205" x2="40" y2="48"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="218" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <!-- 幽灵单位正方形(变换前) -->
  <rect x="40" y="175" width="30" height="30" fill="none"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 中间态:S 剪切后(虚线) -->
  <polygon points="40,205 70,205 100,175 70,175" fill="none"  stroke-width="1" stroke-dasharray="4 4" class="svg-axis-stroke"/>
  <!-- 最终态:再经 D 拉伸(角到 (4,1)) -->
  <polygon points="40,205 100,205 160,175 100,175"  opacity="0.08"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-ink-stroke"/>
  <circle cx="160" cy="175" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <text x="166" y="171" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5"  class="svg-special-text-fill-312f2f">(4, 1)</text>

  <!-- 右 panel:先拉后剪(S 在左,D 先作用) -->
  <text x="300" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">先拉伸 D，后剪切 S：乘积 SD</text>
  <!-- 方格 -->
  <line x1="330" y1="55" x2="330" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="360" y1="55" x2="360" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="390" y1="55" x2="390" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="420" y1="55" x2="420" y2="205"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="175" x2="460" y2="175"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="145" x2="460" y2="145"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="115" x2="460" y2="115"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="300" y1="85" x2="460" y2="85"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 坐标轴 -->
  <line x1="300" y1="205" x2="472" y2="205"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="300" y1="205" x2="300" y2="48"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="478" y="209" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">x</text>
  <text x="292" y="40" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13"  class="svg-muted-fill">y</text>
  <!-- 幽灵单位正方形(变换前) -->
  <rect x="300" y="175" width="30" height="30" fill="none"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <!-- 中间态:D 拉伸后(虚线矩形) -->
  <rect x="300" y="175" width="60" height="30" fill="none"  stroke-width="1" stroke-dasharray="4 4" class="svg-axis-stroke"/>
  <!-- 最终态:再经 S 剪切(角到 (3,1)) -->
  <polygon points="300,205 360,205 390,175 330,175"  opacity="0.08"  stroke-width="1.5" class="svg-special-fill-fill-cc785c svg-ink-stroke"/>
  <circle cx="390" cy="175" r="2.5"  class="svg-special-fill-fill-312f2f"/>
  <text x="396" y="171" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5"  class="svg-special-text-fill-312f2f">(3, 1)</text>

  <!-- 底部点题 -->
  <text x="280" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5"  text-anchor="middle" class="svg-special-text-fill-312f2f">同一组变换，顺序不同，结果不同：DS ≠ SD</text>
</svg>
