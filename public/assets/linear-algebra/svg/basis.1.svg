<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bs-arr-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#312f2f"/>
    </marker>
    <marker id="bs-arr-coral" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#cc785c"/>
    </marker>
    <marker id="bs-arr-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b2a8"/>
    </marker>
  </defs>

  <!-- ============ 左 panel:基 {u,v},b = 0.4u + 2.8v ============ -->
  <!-- 原点 (70,150),20px/单位,u=(3,1) → (60,-20),v=(1,2) → (20,-40) -->
  <line x1="70" y1="150" x2="244" y2="150" stroke="#b8b2a8" stroke-width="1" marker-end="url(#bs-arr-axis)"/>
  <line x1="70" y1="150" x2="70" y2="14" stroke="#b8b2a8" stroke-width="1" marker-end="url(#bs-arr-axis)"/>
  <text x="248" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="62" y="10" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>

  <!-- 基方向的延长参考线 -->
  <line x1="70" y1="150" x2="190" y2="110" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="70" y1="150" x2="130" y2="30" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 分解路径:先 2.8v 到 (126,38),再 0.4u 到 b(150,30) -->
  <line x1="70" y1="150" x2="126" y2="38" stroke="#6c6a64" stroke-width="1.1" stroke-dasharray="4 4"/>
  <line x1="126" y1="38" x2="150" y2="30" stroke="#6c6a64" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="82" y="96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">2.8v</text>
  <text x="128" y="50" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">0.4u</text>

  <!-- 基向量 u、v -->
  <line x1="70" y1="150" x2="130" y2="130" stroke="#312f2f" stroke-width="1.8" marker-end="url(#bs-arr-ink)"/>
  <text x="96" y="146" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">u</text>
  <line x1="70" y1="150" x2="90" y2="110" stroke="#312f2f" stroke-width="1.8" marker-end="url(#bs-arr-ink)"/>
  <text x="58" y="124" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">v</text>

  <circle cx="70" cy="150" r="2.4" fill="#312f2f"/>
  <circle cx="150" cy="30" r="2.6" fill="#cc785c"/>
  <text x="158" y="26" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#a9583e">b</text>

  <text x="52" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64">基 {u, v}:b = 0.4u + 2.8v</text>

  <!-- ============ 右 panel:标准基,b = 4e₁ + 6e₂ ============ -->
  <!-- 原点 (390,150),20px/单位,b=(4,6) → (470,30) -->
  <line x1="390" y1="150" x2="544" y2="150" stroke="#b8b2a8" stroke-width="1" marker-end="url(#bs-arr-axis)"/>
  <line x1="390" y1="150" x2="390" y2="14" stroke="#b8b2a8" stroke-width="1" marker-end="url(#bs-arr-axis)"/>
  <text x="548" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="382" y="10" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>

  <!-- 方格参考线 -->
  <line x1="430" y1="150" x2="430" y2="20" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="390" y1="110" x2="480" y2="110" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="390" y1="70" x2="480" y2="70" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- b 向两轴的垂线 -->
  <line x1="470" y1="30" x2="470" y2="150" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="390" y1="30" x2="470" y2="30" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="462" y="166" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">4</text>
  <text x="372" y="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">6</text>

  <!-- 标准基 e₁、e₂ -->
  <line x1="390" y1="150" x2="410" y2="150" stroke="#312f2f" stroke-width="1.8" marker-end="url(#bs-arr-ink)"/>
  <text x="398" y="166" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">e<tspan dy="3" font-size="10">1</tspan></text>
  <line x1="390" y1="150" x2="390" y2="130" stroke="#312f2f" stroke-width="1.8" marker-end="url(#bs-arr-ink)"/>
  <text x="370" y="134" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#312f2f">e<tspan dy="3" font-size="10">2</tspan></text>

  <circle cx="390" cy="150" r="2.4" fill="#312f2f"/>
  <circle cx="470" cy="30" r="2.6" fill="#cc785c"/>
  <text x="478" y="24" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#a9583e">b</text>

  <text x="392" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6c6a64">标准基:b = 4e₁ + 6e₂</text>
</svg>
