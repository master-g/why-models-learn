<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="eigdec-title eigdec-desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-6c6a64 { fill: #6c6a64; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
  .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }

  .svg-special-background-fill-fffdfb { fill: #fffdfb; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6c6a64 { fill: #6c6a64; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-6c6a64 { fill: #6c6a64; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-graphic-stroke-d8d0c8 { stroke: #95908a; }
    .svg-special-graphic-stroke-e2dbd3 { stroke: #95908b; }
    .svg-special-background-fill-fffdfb { fill: #363535; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6c6a64 { fill: #a6a4a1; }



  }
</style>
  <title id="eigdec-title">特征分解与特征坐标中的缩放</title>
  <desc id="eigdec-desc">左侧显示矩阵 A 换到特征基后成为对角矩阵 Lambda，右侧显示向量先换成特征坐标、逐坐标缩放，再换回原坐标。</desc>
  <defs>
    <marker id="eigdec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="eigdec-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="249" rx="8"   class="svg-special-fill-fill-fffdfb svg-special-graphic-stroke-d8d0c8 svg-special-background-fill-fffdfb"/>
  <line x1="280" y1="18" x2="280" y2="232"  class="svg-special-graphic-stroke-e2dbd3"/>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="20" y="25" font-size="13" font-weight="600">换基得到对角矩阵</text>
    <text x="300" y="25" font-size="13" font-weight="600">一次作用的坐标路径</text>
  </g>

  <!-- Left panel: A -> Lambda -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="51" y="56">A</text>
    <text x="221" y="56">Λ</text>
  </g>
  <g transform="translate(25 70)"  stroke-width="1" class="svg-axis-stroke">
    <rect x="0" y="0" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="52" y="0" width="52" height="52"  fill-opacity="0.16" class="svg-special-fill-fill-cc785c"/>
    <rect x="0" y="52" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="52" y="52" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
  </g>
  <g transform="translate(195 70)"  stroke-width="1" class="svg-axis-stroke">
    <rect x="0" y="0" width="52" height="52"  fill-opacity="0.16" class="svg-special-fill-fill-cc785c"/>
    <rect x="52" y="0" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="0" y="52" width="52" height="52"  class="svg-special-fill-fill-fffdfb svg-special-background-fill-fffdfb"/>
    <rect x="52" y="52" width="52" height="52"  fill-opacity="0.16" class="svg-special-fill-fill-cc785c"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="51" y="103">2</text>
    <text x="103" y="103">1</text>
    <text x="51" y="155">0</text>
    <text x="103" y="155">3</text>
    <text x="221" y="103">2</text>
    <text x="273" y="103">0</text>
    <text x="221" y="155">0</text>
    <text x="273" y="155">3</text>
  </g>
  <line x1="140" y1="122" x2="184" y2="122"  stroke-width="1.7" marker-end="url(#eigdec-arrow)" class="svg-ink-stroke"/>
  <text x="162" y="108" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" text-anchor="middle"  class="svg-muted-fill">P⁻¹(·)P</text>
  <text x="25" y="196" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15"  class="svg-coral-text-fill">A=PΛP⁻¹</text>
  <text x="25" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">混合变换 → 两条独立缩放</text>

  <!-- Right panel: x -> c -> Lambda c -> Ax -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="310" y="57">x=(3,1)</text>
    <text x="380" y="57">c=(2,1)</text>
    <text x="475" y="57">Λc=(4,3)</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle"  class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="310" y="100">3</text>
    <text x="310" y="137">1</text>
    <text x="380" y="100">2</text>
    <text x="380" y="137">1</text>
    <text x="475" y="100">4</text>
    <text x="475" y="137">3</text>
  </g>
  <g  stroke-width="1" class="svg-axis-stroke">
    <line x1="293" y1="78" x2="293" y2="151"/>
    <line x1="327" y1="78" x2="327" y2="151"/>
    <line x1="363" y1="78" x2="363" y2="151"/>
    <line x1="397" y1="78" x2="397" y2="151"/>
    <line x1="457" y1="78" x2="457" y2="151"/>
    <line x1="493" y1="78" x2="493" y2="151"/>
  </g>
  <line x1="335" y1="115" x2="354" y2="115"  stroke-width="1.5" marker-end="url(#eigdec-arrow)" class="svg-ink-stroke"/>
  <line x1="405" y1="115" x2="449" y2="115"  stroke-width="1.8" marker-end="url(#eigdec-arrow-coral)" class="svg-coral-stroke-stroke"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle"  class="svg-special-fill-fill-6c6a64 svg-special-text-fill-6c6a64">
    <text x="344" y="103">P⁻¹</text>
    <text x="427" y="103"  class="svg-coral-text-fill">Λ</text>
  </g>
  <line x1="475" y1="166" x2="475" y2="190"  stroke-width="1.5" marker-end="url(#eigdec-arrow)" class="svg-ink-stroke"/>
  <text x="475" y="211" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" text-anchor="middle"  class="svg-coral-text-fill">PΛP⁻¹x=Ax=(7,3)</text>
  <text x="300" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  class="svg-muted-fill">先读特征坐标，再逐坐标乘 λ</text>
</svg>
