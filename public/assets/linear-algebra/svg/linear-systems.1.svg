<svg width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b2a8"/>
    </marker>
  </defs>

  <!-- ========== panel 1:唯一解,相交。原点(30,190),20px/单位 ========== -->
  <text x="30" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6c6a64">唯一解：两线相交</text>
  <line x1="90" y1="60" x2="90" y2="190" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="130" x2="160" y2="130" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="190" x2="165" y2="190" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="30" y1="190" x2="30" y2="55" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="171" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="22" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>
  <!-- x+y=4 墨线 -->
  <line x1="22" y1="102" x2="118" y2="198" stroke="#312f2f" stroke-width="1.8"/>
  <!-- x-y=2 珊瑚线 -->
  <line x1="62" y1="198" x2="148" y2="112" stroke="#cc785c" stroke-width="1.8"/>
  <!-- 交点 (3,1) -->
  <circle cx="90" cy="170" r="4.5" fill="#312f2f"/>
  <text x="98" y="164" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#312f2f">(3, 1)</text>

  <!-- ========== panel 2:无解,平行。原点(215,190) ========== -->
  <text x="215" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6c6a64">无解：两线平行</text>
  <line x1="275" y1="60" x2="275" y2="190" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="215" y1="130" x2="345" y2="130" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="215" y1="190" x2="350" y2="190" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="215" y1="190" x2="215" y2="55" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="356" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="207" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>
  <!-- x+y=4 墨线 -->
  <line x1="207" y1="102" x2="303" y2="198" stroke="#312f2f" stroke-width="1.8"/>
  <!-- x+y=2 珊瑚线 -->
  <line x1="207" y1="142" x2="263" y2="198" stroke="#cc785c" stroke-width="1.8"/>

  <!-- ========== panel 3:无穷多解,重合。原点(400,190) ========== -->
  <text x="400" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6c6a64">无穷多解：两线重合</text>
  <line x1="460" y1="60" x2="460" y2="190" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="130" x2="530" y2="130" stroke="#c9c4bb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="190" x2="535" y2="190" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <line x1="400" y1="190" x2="400" y2="55" stroke="#b8b2a8" stroke-width="1" marker-end="url(#a-axis)"/>
  <text x="541" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">x</text>
  <text x="392" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#6c6a64">y</text>
  <!-- x+y=4 与 2x+2y=8 重合:墨线实体 + 珊瑚虚线微偏移 -->
  <line x1="392" y1="102" x2="488" y2="198" stroke="#312f2f" stroke-width="1.8"/>
  <line x1="395" y1="99" x2="491" y2="195" stroke="#cc785c" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- 底部点题 -->
  <text x="280" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#312f2f" text-anchor="middle">两个方程、两个未知数，命运只有三种</text>
</svg>
