<svg data-svg-theme="paper-ink-v1" width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }



@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }



  }
</style>
  <defs>
    <marker id="a-axis" markerWidth="7" markerHeight="7" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z"  class="svg-axis-fill"/>
    </marker>
  </defs>

  <!-- ========== panel 1:唯一解,相交。原点(30,190),20px/单位 ========== -->
  <text x="30" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">唯一解：两线相交</text>
  <line x1="90" y1="60" x2="90" y2="190"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="30" y1="130" x2="160" y2="130"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="30" y1="190" x2="165" y2="190"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="30" y1="190" x2="30" y2="55"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="171" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">x</text>
  <text x="22" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">y</text>
  <!-- x+y=4 墨线 -->
  <line x1="22" y1="102" x2="118" y2="198"  stroke-width="1.8" class="svg-ink-stroke"/>
  <!-- x-y=2 珊瑚线 -->
  <line x1="62" y1="198" x2="148" y2="112"  stroke-width="1.8" class="svg-coral-stroke-stroke"/>
  <!-- 交点 (3,1) -->
  <circle cx="90" cy="170" r="4.5"  class="svg-special-fill-fill-312f2f"/>
  <text x="98" y="164" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5"  class="svg-special-text-fill-312f2f">(3, 1)</text>

  <!-- ========== panel 2:无解,平行。原点(215,190) ========== -->
  <text x="215" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">无解：两线平行</text>
  <line x1="275" y1="60" x2="275" y2="190"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="215" y1="130" x2="345" y2="130"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="215" y1="190" x2="350" y2="190"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="215" y1="190" x2="215" y2="55"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="356" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">x</text>
  <text x="207" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">y</text>
  <!-- x+y=4 墨线 -->
  <line x1="207" y1="102" x2="303" y2="198"  stroke-width="1.8" class="svg-ink-stroke"/>
  <!-- x+y=2 珊瑚线 -->
  <line x1="207" y1="142" x2="263" y2="198"  stroke-width="1.8" class="svg-coral-stroke-stroke"/>

  <!-- ========== panel 3:无穷多解,重合。原点(400,190) ========== -->
  <text x="400" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13"  class="svg-muted-fill">无穷多解：两线重合</text>
  <line x1="460" y1="60" x2="460" y2="190"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="400" y1="130" x2="530" y2="130"  stroke-width="1" stroke-dasharray="4 4" class="svg-special-graphic-stroke-c9c4bb"/>
  <line x1="400" y1="190" x2="535" y2="190"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <line x1="400" y1="190" x2="400" y2="55"  stroke-width="1" marker-end="url(#a-axis)" class="svg-axis-stroke"/>
  <text x="541" y="194" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">x</text>
  <text x="392" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12"  class="svg-muted-fill">y</text>
  <!-- x+y=4 与 2x+2y=8 重合:墨线实体 + 珊瑚虚线微偏移 -->
  <line x1="392" y1="102" x2="488" y2="198"  stroke-width="1.8" class="svg-ink-stroke"/>
  <line x1="395" y1="99" x2="491" y2="195"  stroke-width="1.4" stroke-dasharray="5 4" class="svg-coral-stroke-stroke"/>

  <!-- 底部点题 -->
  <text x="280" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5"  text-anchor="middle" class="svg-special-text-fill-312f2f">两个方程、两个未知数，命运只有三种</text>
</svg>
