  <!-- 底部说明 -->
  <text x="280" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12"  text-anchor="middle" class="svg-muted-fill">同一轮消元:左手单位阵,右手逆矩阵</text>
