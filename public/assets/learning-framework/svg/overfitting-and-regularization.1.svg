<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-c66a4b { fill: #c66a4b; }
  .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-4f7775 { stroke: #4f7775; }
  .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
  .svg-special-graphic-stroke-c66a4b { stroke: #c66a4b; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-4f7775 { fill: #4f7775; }

  .svg-special-background-fill-ebe7e4 { fill: #ebe7e4; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-c66a4b { fill: #c66a4b; }
    .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-4f7775 { stroke: #4f7775; }
    .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
    .svg-special-graphic-stroke-c66a4b { stroke: #c66a4b; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-4f7775 { fill: #90aaa8; }
    .svg-special-background-fill-ebe7e4 { fill: #333232; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">训练误差下降而验证误差先降后升，正则化把选择点留在泛化较好的区域</title>
  <desc id="desc">左侧曲线展示模型复杂度增加时训练误差持续下降、验证误差先下降后上升；右侧说明正则化在训练误差和复杂度之间取平衡。</desc>
  <rect width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="24" y="27"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" class="svg-special-text-fill-312f2f">过拟合与正则化：别只看训练误差</text>
  <text x="24" y="47"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">复杂度增加时，训练风险和验证风险可能走向不同方向</text>

  <rect x="24" y="65" width="316" height="128" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <line x1="58" y1="79" x2="58" y2="169"  stroke-width="1.2" class="svg-special-graphic-stroke-6c6a64"/>
  <line x1="58" y1="169" x2="318" y2="169"  stroke-width="1.2" class="svg-special-graphic-stroke-6c6a64"/>
  <text x="37" y="91"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" transform="rotate(-90 37 91)" class="svg-muted-fill">风险</text>
  <text x="181" y="187"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">模型复杂度</text>
  <path d="M64 106 C111 122 151 145 195 157 S267 164 312 166" fill="none"  stroke-width="3" class="svg-special-graphic-stroke-4f7775"/>
  <path d="M64 120 C106 143 139 158 178 159 C218 160 231 137 250 116 C269 96 288 90 312 87" fill="none"  stroke-width="3" class="svg-special-graphic-stroke-c66a4b"/>
  <line x1="196" y1="78" x2="196" y2="169"  stroke-width="1.5" stroke-dasharray="4 4" class="svg-coral-stroke-stroke"/>
  <circle cx="196" cy="159" r="4"  class="svg-special-fill-fill-c66a4b"/>
  <text x="74" y="99"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-special-text-fill-4f7775">训练风险</text>
  <text x="252" y="104"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-coral-text-fill">验证风险</text>
  <text x="180" y="78"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-coral-text-fill">选择点</text>

  <path d="M350 128 H372"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>
  <path d="M365 121 L374 128 L365 135" fill="none"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>

  <rect x="382" y="65" width="154" height="128" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c66a4b svg-special-background-fill-fdfcfa"/>
  <text x="402" y="91"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">正则化的偏好</text>
  <text x="402" y="116"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">训练误差 + 复杂度</text>
  <line x1="402" y1="128" x2="516" y2="128"  class="svg-special-graphic-stroke-c9c4bb"/>
  <text x="402" y="149"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-special-text-fill-4f7775">小 λ：更灵活</text>
  <text x="402" y="168"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-coral-text-fill">大 λ：更受限</text>
  <text x="402" y="183"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">目标是泛化而非零训练误差</text>

  <rect x="142" y="213" width="276" height="25" rx="9"  class="svg-special-fill-fill-ebe7e4 svg-special-background-fill-ebe7e4"/>
  <text x="177" y="230"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-special-text-fill-312f2f">验证最低点不一定是训练最低点</text>
</svg>
