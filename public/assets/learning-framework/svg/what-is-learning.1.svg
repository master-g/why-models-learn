<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-ebe7e4 { fill: #ebe7e4; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-ebe7e4 { fill: #333232; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">机器学习从数据经过假设空间和损失函数得到规则</title>
  <desc id="desc">图中从样本数据出发，经过假设空间和损失反馈，由学习算法选择一个用于新输入的规则。</desc>
  <rect width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="24" y="27"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" class="svg-special-text-fill-312f2f">学习是从样本中选择规则</text>
  <text x="24" y="47"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">数据提供证据，假设空间规定可能性，损失定义好坏</text>

  <rect x="24" y="70" width="120" height="92" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <text x="44" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">样本 S</text>
  <text x="44" y="117"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">(x₁, y₁)</text>
  <text x="44" y="137"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">(x₂, y₂)</text>
  <text x="44" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">⋮  有限证据</text>

  <path d="M149 116 H177"  stroke-width="2" stroke-linecap="round" class="svg-coral-stroke-stroke"/>
  <path d="M172 111 L179 116 L172 121" fill="none"  stroke-width="2" class="svg-coral-stroke-stroke"/>

  <rect x="184" y="70" width="142" height="92" rx="12"   class="svg-special-fill-fill-ebe7e4 svg-special-graphic-stroke-c9c4bb svg-special-background-fill-ebe7e4"/>
  <text x="204" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">假设空间 ℋ</text>
  <text x="204" y="117"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">线性、树、神经网络</text>
  <text x="204" y="138"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">允许哪些规则</text>
  <text x="204" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">由结构和参数决定</text>

  <path d="M331 116 H359"  stroke-width="2" stroke-linecap="round" class="svg-coral-stroke-stroke"/>
  <path d="M354 111 L361 116 L354 121" fill="none"  stroke-width="2" class="svg-coral-stroke-stroke"/>

  <rect x="366" y="70" width="170" height="92" rx="12"   class="svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="386" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">损失 + 算法</text>
  <text x="386" y="117"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">比较预测与反馈</text>
  <text x="386" y="138"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">选择 ĥ = A(S)</text>
  <text x="386" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" font-weight="600" class="svg-coral-text-fill">得到可部署规则</text>

  <rect x="144" y="187" width="272" height="38" rx="10"  class="svg-special-fill-fill-ebe7e4 svg-special-background-fill-ebe7e4"/>
  <text x="168" y="211"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-special-text-fill-312f2f">新输入 → 预测 / 行动 → 在新分布上检验</text>
</svg>
