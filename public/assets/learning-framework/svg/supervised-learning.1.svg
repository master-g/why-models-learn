<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-ebe7e4 { fill: #ebe7e4; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-ebe7e4 { fill: #333232; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">监督学习从带标签样本到回归或分类预测</title>
  <desc id="desc">左侧是带有输入和标签的样本，中间是模型规则，右侧分别显示数值回归和类别概率输出。</desc>
  <rect width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="24" y="27"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" class="svg-special-text-fill-312f2f">监督学习：标签提供反馈</text>
  <text x="24" y="47"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">同一套输入可以对应数值、类别或结构化目标</text>

  <rect x="24" y="70" width="132" height="104" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <text x="44" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">带标签样本</text>
  <text x="44" y="118"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">(x₁, y₁)</text>
  <text x="44" y="138"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">(x₂, y₂)</text>
  <text x="44" y="158"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">(xᵢ, yᵢ) → 损失</text>

  <path d="M161 122 H185"  stroke-width="2" stroke-linecap="round" class="svg-coral-stroke-stroke"/>
  <path d="M180 117 L187 122 L180 127" fill="none"  stroke-width="2" class="svg-coral-stroke-stroke"/>

  <rect x="192" y="70" width="156" height="104" rx="12"   class="svg-special-fill-fill-ebe7e4 svg-coral-stroke-stroke svg-special-background-fill-ebe7e4"/>
  <text x="214" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">fθ(x)</text>
  <text x="214" y="119"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">回归：输出数值</text>
  <text x="214" y="139"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">分类：输出概率</text>
  <text x="214" y="159"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" font-weight="600" class="svg-coral-text-fill">比较 fθ(x) 与 y</text>

  <path d="M353 122 H377"  stroke-width="2" stroke-linecap="round" class="svg-coral-stroke-stroke"/>
  <path d="M372 117 L379 122 L372 127" fill="none"  stroke-width="2" class="svg-coral-stroke-stroke"/>

  <rect x="384" y="70" width="152" height="104" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <text x="404" y="94"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="700" class="svg-special-text-fill-312f2f">预测输出</text>
  <text x="404" y="118"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">回归：ŷ = 2.4</text>
  <text x="404" y="139"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">分类：p(y=1)=0.8</text>
  <text x="404" y="159"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">新输入上检验</text>

  <rect x="142" y="196" width="276" height="30" rx="9"  class="svg-special-fill-fill-ebe7e4 svg-special-background-fill-ebe7e4"/>
  <text x="172" y="216"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-special-text-fill-312f2f">损失函数决定「错误」的代价</text>
</svg>
