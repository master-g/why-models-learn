<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-4f7775 { fill: #4f7775; }
  .svg-special-fill-fill-a9583e { fill: #a9583e; }
  .svg-special-fill-fill-c66a4b { fill: #c66a4b; }
  .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c66a4b { stroke: #c66a4b; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-4f7775 { fill: #4f7775; }

  .svg-special-background-fill-ebe7e4 { fill: #ebe7e4; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-4f7775 { fill: #4f7775; }
    .svg-special-fill-fill-a9583e { fill: #a9583e; }
    .svg-special-fill-fill-c66a4b { fill: #c66a4b; }
    .svg-special-fill-fill-ebe7e4 { fill: #93908f; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c66a4b { stroke: #c66a4b; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-4f7775 { fill: #90aaa8; }
    .svg-special-background-fill-ebe7e4 { fill: #333232; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">低容量、合适容量和高容量模型的训练与验证风险诊断</title>
  <desc id="desc">三个并列面板分别展示欠拟合、当前协议下较好和过拟合：训练风险与验证风险的相对高低给出排查线索。</desc>
  <rect width="560" height="250"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="24" y="27"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="700" class="svg-special-text-fill-312f2f">过拟合与欠拟合：先看两条风险</text>
  <text x="24" y="47"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-muted-fill">训练风险和验证风险的组合，是诊断而不是结论</text>

  <rect x="24" y="68" width="158" height="119" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <text x="45" y="91"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">容量太小</text>
  <text x="45" y="108"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">欠拟合线索</text>
  <text x="45" y="131"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">训练风险</text>
  <rect x="111" y="123" width="50" height="12" rx="5"  class="svg-special-fill-fill-a9583e"/>
  <text x="45" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">验证风险</text>
  <rect x="111" y="149" width="50" height="12" rx="5"  class="svg-special-fill-fill-c66a4b"/>
  <text x="45" y="178"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-coral-text-fill">两者都高</text>

  <path d="M187 128 H198"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>
  <path d="M193 121 L201 128 L193 135" fill="none"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>

  <rect x="201" y="68" width="158" height="119" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c66a4b svg-special-background-fill-fdfcfa"/>
  <text x="222" y="91"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">容量合适</text>
  <text x="222" y="108"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">当前协议下较好</text>
  <text x="222" y="131"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">训练风险</text>
  <rect x="288" y="123" width="29" height="12" rx="5"  class="svg-special-fill-fill-4f7775"/>
  <text x="222" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">验证风险</text>
  <rect x="288" y="149" width="35" height="12" rx="5"  class="svg-special-fill-fill-4f7775"/>
  <text x="222" y="178"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-special-text-fill-4f7775">都较低且接近</text>

  <path d="M364 128 H375"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>
  <path d="M370 121 L378 128 L370 135" fill="none"  stroke-width="2" class="svg-special-graphic-stroke-c66a4b"/>

  <rect x="378" y="68" width="158" height="119" rx="12"   class="svg-special-fill-fill-fdfcfa svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fdfcfa"/>
  <text x="399" y="91"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-312f2f">容量太大</text>
  <text x="399" y="108"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">过拟合线索</text>
  <text x="399" y="131"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">训练风险</text>
  <rect x="465" y="123" width="20" height="12" rx="5"  class="svg-special-fill-fill-4f7775"/>
  <text x="399" y="157"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-muted-fill">验证风险</text>
  <rect x="465" y="149" width="51" height="12" rx="5"  class="svg-special-fill-fill-a9583e"/>
  <text x="399" y="178"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="10" class="svg-coral-text-fill">间隙变大</text>

  <rect x="142" y="213" width="276" height="25" rx="9"  class="svg-special-fill-fill-ebe7e4 svg-special-background-fill-ebe7e4"/>
  <text x="179" y="230"  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11" class="svg-special-text-fill-312f2f">先查数据与优化，再决定增减容量</text>
</svg>
