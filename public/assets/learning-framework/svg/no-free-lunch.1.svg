<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-fill { fill: #b8b2a8; }
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f6f1ef { fill: #93908f; }
  .svg-special-fill-fill-fffdfb { fill: #92908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f6f1ef { fill: #f6f1ef; }
  .svg-special-background-fill-fffdfb { fill: #fffdfb; }


@media (prefers-color-scheme: dark) {
    .svg-axis-fill { fill: #8b8a83; }
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f6f1ef { fill: #93908f; }
    .svg-special-fill-fill-fffdfb { fill: #92908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f6f1ef { fill: #353434; }
    .svg-special-background-fill-fffdfb { fill: #363535; }



  }
</style>
  <title id="title">不同任务分布需要不同归纳偏置</title>
  <desc id="desc">同一份训练样本在有结构的任务族中支持一种偏置,在所有目标函数等权时则没有普遍更好的算法</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;  }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="900" height="420"  class="svg-special-fill-fill-f6f1ef svg-special-background-fill-f6f1ef"/>
  <text x="36" y="40" class="title svg-special-text-fill-312f2f">同一份样本,任务假设决定哪种偏置有效</text>
  <text x="36" y="69" class="small svg-special-text-fill-312f2f">模型从已见标签出发,未见标签只有在任务分布提供结构时才可预测</text>

  <rect x="36" y="105" width="190" height="245" rx="14"   stroke-width="2" class="svg-special-fill-fill-fffdfb svg-axis-stroke svg-special-background-fill-fffdfb"/>
  <text x="58" y="139" class="label svg-special-text-fill-312f2f">已见样本</text>
  <line x1="62" y1="268" x2="202" y2="268"  stroke-width="2" class="svg-axis-stroke"/>
  <circle cx="84" cy="244" r="7"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="143" cy="244" r="7"  class="svg-special-fill-fill-cc785c"/>
  <circle cx="202" cy="244" r="7"   stroke-dasharray="4 4" class="svg-axis-fill svg-ink-stroke"/>
  <text x="72" y="293" class="small svg-special-text-fill-312f2f">x₀</text>
  <text x="131" y="293" class="small svg-special-text-fill-312f2f">x₁</text>
  <text x="188" y="293" class="small svg-special-text-fill-312f2f">未见</text>
  <text x="66" y="185" class="body svg-special-text-fill-312f2f">(x₀, 0)</text>
  <text x="64" y="322" class="small svg-special-text-fill-312f2f">训练信息相同</text>

  <line x1="226" y1="177" x2="282" y2="177"  stroke-width="3" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="226" y1="291" x2="282" y2="291"  stroke-width="3" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="292" y="105" width="260" height="112" rx="14"   stroke-width="2" class="svg-special-fill-fill-fffdfb svg-axis-stroke svg-special-background-fill-fffdfb"/>
  <text x="316" y="138" class="label svg-special-text-fill-312f2f">有结构的任务族</text>
  <text x="316" y="171" class="body svg-special-text-fill-312f2f">相近输入 → 相近标签</text>
  <text x="316" y="199" class="small svg-special-text-fill-312f2f">平滑偏置可能获益</text>

  <rect x="292" y="238" width="260" height="112" rx="14"   stroke-width="2" class="svg-special-fill-fill-fffdfb svg-axis-stroke svg-special-background-fill-fffdfb"/>
  <text x="316" y="271" class="label svg-special-text-fill-312f2f">所有目标函数等权</text>
  <text x="316" y="304" class="body svg-special-text-fill-312f2f">未见标签 0 / 1 都可能</text>
  <text x="316" y="332" class="small svg-special-text-fill-312f2f">平均错误无法降低</text>

  <line x1="552" y1="161" x2="608" y2="161"  stroke-width="3" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <line x1="552" y1="294" x2="608" y2="294"  stroke-width="3" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>

  <rect x="618" y="105" width="246" height="112" rx="14"   stroke-width="2" class="svg-special-fill-fill-fffdfb svg-coral-stroke-stroke svg-special-background-fill-fffdfb"/>
  <text x="642" y="138" class="label svg-special-text-fill-312f2f">算法 A</text>
  <text x="642" y="171" class="body svg-special-text-fill-312f2f">预测未见点为 0</text>
  <text x="642" y="199" class="small svg-special-text-fill-312f2f">在平滑族中表现好</text>

  <rect x="618" y="238" width="246" height="112" rx="14"   stroke-width="2" class="svg-special-fill-fill-fffdfb svg-coral-stroke-stroke svg-special-background-fill-fffdfb"/>
  <text x="642" y="271" class="label svg-special-text-fill-312f2f">算法 A 与 B</text>
  <text x="642" y="304" class="body svg-special-text-fill-312f2f">一个猜中,一个猜错</text>
  <text x="642" y="332" class="small svg-special-text-fill-312f2f">均匀平均都为 1/2</text>
</svg>
