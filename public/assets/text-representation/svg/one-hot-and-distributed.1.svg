<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-special-fill-fill-29251f { fill: #29251f; }
  .svg-special-fill-fill-75939d { fill: #75939d; }
  .svg-special-fill-fill-8d7ba5 { fill: #8d7ba5; }
  .svg-special-fill-fill-a8757c { fill: #a8757c; }
  .svg-special-fill-fill-e5e0eb { fill: #938f97; }
  .svg-special-fill-fill-e8e6d9 { fill: #929189; }
  .svg-special-fill-fill-efe1cd { fill: #988f83; }
  .svg-special-fill-fill-f0e7ca { fill: #96907e; }
  .svg-special-fill-fill-f6f0e5 { fill: #94908a; }
  .svg-special-graphic-stroke-89906c { stroke: #89906c; }
  .svg-special-graphic-stroke-8d7ba5 { stroke: #8d7ba5; }
  .svg-special-graphic-stroke-8f6840 { stroke: #8f6840; }
  .svg-special-graphic-stroke-b19350 { stroke: #aa8d4d; }
  .svg-special-graphic-stroke-b58b5b { stroke: #b3895a; }
  .svg-special-text-fill-6f665b { fill: #6f665b; }

  .svg-special-background-fill-e5e0eb { fill: #e5e0eb; }
  .svg-special-background-fill-e8e6d9 { fill: #e8e6d9; }
  .svg-special-background-fill-efe1cd { fill: #efe1cd; }
  .svg-special-background-fill-f0e7ca { fill: #f0e7ca; }
  .svg-special-background-fill-f6f0e5 { fill: #f6f0e5; }
  .svg-special-text-fill-29251f { fill: #29251f; }


@media (prefers-color-scheme: dark) {
    .svg-special-fill-fill-29251f { fill: #65625d; }
    .svg-special-fill-fill-75939d { fill: #75939d; }
    .svg-special-fill-fill-8d7ba5 { fill: #8d7ba5; }
    .svg-special-fill-fill-a8757c { fill: #a8757c; }
    .svg-special-fill-fill-e5e0eb { fill: #938f97; }
    .svg-special-fill-fill-e8e6d9 { fill: #929189; }
    .svg-special-fill-fill-efe1cd { fill: #988f83; }
    .svg-special-fill-fill-f0e7ca { fill: #96907e; }
    .svg-special-fill-fill-f6f0e5 { fill: #94908a; }
    .svg-special-graphic-stroke-89906c { stroke: #89906c; }
    .svg-special-graphic-stroke-8d7ba5 { stroke: #8d7ba5; }
    .svg-special-graphic-stroke-8f6840 { stroke: #8f6840; }
    .svg-special-graphic-stroke-b19350 { stroke: #aa8d4d; }
    .svg-special-graphic-stroke-b58b5b { stroke: #b3895a; }
    .svg-special-text-fill-6f665b { fill: #a9a49d; }
    .svg-special-background-fill-e5e0eb { fill: #323133; }
    .svg-special-background-fill-e8e6d9 { fill: #333230; }
    .svg-special-background-fill-efe1cd { fill: #34322f; }
    .svg-special-background-fill-f0e7ca { fill: #34322e; }
    .svg-special-background-fill-f6f0e5 { fill: #353432; }
    .svg-special-text-fill-29251f { fill: #a6a4a1; }



  }
</style>
  <title id="title">One-hot 到分布式表示</title>
  <desc id="desc">一个 token 的 one-hot 标准基经过 embedding 矩阵查表，变成低维分布式向量并在几何空间中形成可学习关系。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f6f0e5 svg-special-background-fill-f6f0e5"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"  class="svg-special-fill-fill-29251f svg-special-text-fill-29251f">
    <text x="32" y="34" font-size="22" font-weight="700">one-hot → embedding → 分布式几何</text>
    <text x="32" y="57" font-size="12"  class="svg-special-text-fill-6f665b">ID 只是索引；one-hot 选择一行，训练后的矩阵承载相似关系</text>

    <rect x="32" y="88" width="216" height="126" rx="12"   class="svg-special-fill-fill-efe1cd svg-special-graphic-stroke-b58b5b svg-special-background-fill-efe1cd"/>
    <text x="48" y="114" font-size="14" font-weight="700">token：dog，ID 1</text>
    <text x="48" y="145" font-size="16" font-weight="700">e₁ = [0, 1, 0, 0]</text>
    <text x="48" y="172" font-size="12">词表坐标</text>
    <text x="48" y="195" font-size="12"  class="svg-special-text-fill-6f665b">与 cat、fish 正交</text>

    <path d="M248 151 H286"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>
    <path d="M278 143 L288 151 L278 159"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>

    <rect x="288" y="88" width="226" height="126" rx="12"   class="svg-special-fill-fill-e8e6d9 svg-special-graphic-stroke-89906c svg-special-background-fill-e8e6d9"/>
    <text x="304" y="114" font-size="14" font-weight="700">embedding 矩阵 E</text>
    <text x="304" y="143" font-size="13">cat  [1.0, 0.0]</text>
    <text x="304" y="164" font-size="13">dog  [0.8, 0.6]</text>
    <text x="304" y="185" font-size="13">fish [-1.0, 0.0]</text>
    <text x="304" y="204" font-size="12"  class="svg-special-text-fill-6f665b">e₁ᵀE = E₁,:</text>

    <path d="M514 151 H552"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>
    <path d="M544 143 L554 151 L544 159"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>

    <rect x="554" y="88" width="214" height="126" rx="12"   class="svg-special-fill-fill-e5e0eb svg-special-graphic-stroke-8d7ba5 svg-special-background-fill-e5e0eb"/>
    <text x="570" y="114" font-size="14" font-weight="700">分布式空间</text>
    <circle cx="604" cy="177" r="5"  class="svg-special-fill-fill-8d7ba5"/>
    <circle cx="681" cy="133" r="5"  class="svg-special-fill-fill-a8757c"/>
    <circle cx="604" cy="133" r="5"  class="svg-special-fill-fill-75939d"/>
    <text x="616" y="181" font-size="12">cat</text>
    <text x="691" y="137" font-size="12">dog</text>
    <text x="616" y="137" font-size="12">fish</text>
    <path d="M609 174 L676 136"  stroke-width="1.5" fill="none" class="svg-special-graphic-stroke-b19350"/>
    <text x="570" y="204" font-size="12"  class="svg-special-text-fill-6f665b">cos(cat,dog)=0.8</text>

    <rect x="32" y="246" width="736" height="78" rx="12"   class="svg-special-fill-fill-f0e7ca svg-special-graphic-stroke-b19350 svg-special-background-fill-f0e7ca"/>
    <text x="48" y="271" font-size="14" font-weight="700">两种几何不要混淆</text>
    <text x="48" y="296" font-size="13">one-hot：不同 token 的距离都是 √2、余弦都是 0</text>
    <text x="404" y="296" font-size="13">embedding：距离与方向由训练得到的 E 决定</text>
  </g>
</svg>
