<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">One-hot 到分布式表示</title>
  <desc id="desc">一个 token 的 one-hot 标准基经过 embedding 矩阵查表，变成低维分布式向量并在几何空间中形成可学习关系。</desc>
  <rect width="800" height="373" fill="#f6f0e5"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#29251f">
    <text x="32" y="34" font-size="22" font-weight="700">one-hot → embedding → 分布式几何</text>
    <text x="32" y="57" font-size="12" fill="#6f665b">ID 只是索引；one-hot 选择一行，训练后的矩阵承载相似关系</text>

    <rect x="32" y="88" width="216" height="126" rx="12" fill="#efe1cd" stroke="#b58b5b"/>
    <text x="48" y="114" font-size="14" font-weight="700">token：dog，ID 1</text>
    <text x="48" y="145" font-size="16" font-weight="700">e₁ = [0, 1, 0, 0]</text>
    <text x="48" y="172" font-size="12">词表坐标</text>
    <text x="48" y="195" font-size="12" fill="#6f665b">与 cat、fish 正交</text>

    <path d="M248 151 H286" stroke="#8f6840" stroke-width="2" fill="none"/>
    <path d="M278 143 L288 151 L278 159" stroke="#8f6840" stroke-width="2" fill="none"/>

    <rect x="288" y="88" width="226" height="126" rx="12" fill="#e8e6d9" stroke="#89906c"/>
    <text x="304" y="114" font-size="14" font-weight="700">embedding 矩阵 E</text>
    <text x="304" y="143" font-size="13">cat  [1.0, 0.0]</text>
    <text x="304" y="164" font-size="13">dog  [0.8, 0.6]</text>
    <text x="304" y="185" font-size="13">fish [-1.0, 0.0]</text>
    <text x="304" y="204" font-size="12" fill="#6f665b">e₁ᵀE = E₁,:</text>

    <path d="M514 151 H552" stroke="#8f6840" stroke-width="2" fill="none"/>
    <path d="M544 143 L554 151 L544 159" stroke="#8f6840" stroke-width="2" fill="none"/>

    <rect x="554" y="88" width="214" height="126" rx="12" fill="#e5e0eb" stroke="#8d7ba5"/>
    <text x="570" y="114" font-size="14" font-weight="700">分布式空间</text>
    <circle cx="604" cy="177" r="5" fill="#8d7ba5"/>
    <circle cx="681" cy="133" r="5" fill="#a8757c"/>
    <circle cx="604" cy="133" r="5" fill="#75939d"/>
    <text x="616" y="181" font-size="12">cat</text>
    <text x="691" y="137" font-size="12">dog</text>
    <text x="616" y="137" font-size="12">fish</text>
    <path d="M609 174 L676 136" stroke="#b19350" stroke-width="1.5" fill="none"/>
    <text x="570" y="204" font-size="12" fill="#6f665b">cos(cat,dog)=0.8</text>

    <rect x="32" y="246" width="736" height="78" rx="12" fill="#f0e7ca" stroke="#b19350"/>
    <text x="48" y="271" font-size="14" font-weight="700">两种几何不要混淆</text>
    <text x="48" y="296" font-size="13">one-hot：不同 token 的距离都是 √2、余弦都是 0</text>
    <text x="404" y="296" font-size="13">embedding：距离与方向由训练得到的 E 决定</text>
  </g>
</svg>
