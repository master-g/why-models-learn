    <line x1="210" y1="245" x2="322" y2="189"  stroke-width="2" class="svg-special-graphic-stroke-8f6840"/>
    <line x1="210" y1="245" x2="300" y2="178"  stroke-width="2" class="svg-special-graphic-stroke-75939d"/>
    <line x1="210" y1="245" x2="188" y2="178"  stroke-width="2" class="svg-special-graphic-stroke-89906c"/>
