    <text x="330" y="185" font-size="13" font-weight="700">cat</text>
    <text x="307" y="174" font-size="13" font-weight="700">dog</text>
    <text x="163" y="174" font-size="13" font-weight="700">car</text>
    <text x="218" y="318" font-size="13" font-weight="700">fish</text>
    <text x="354" y="263" font-size="11"  class="svg-special-text-fill-6f665b">x₁</text>
    <text x="218" y="137" font-size="11"  class="svg-special-text-fill-6f665b">x₂</text>
    <text x="50" y="267" font-size="12"  class="svg-special-text-fill-6f665b">长度：离原点多远</text>

