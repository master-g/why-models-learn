<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-special-fill-fill-29251f { fill: #29251f; }
  .svg-special-fill-fill-e5edf0 { fill: #8d9193; }
  .svg-special-fill-fill-e8e6d9 { fill: #929189; }
  .svg-special-fill-fill-efe1cd { fill: #988f83; }
  .svg-special-fill-fill-f0e7ca { fill: #96907e; }
  .svg-special-fill-fill-f6f0e5 { fill: #94908a; }
  .svg-special-graphic-stroke-75939d { stroke: #75939d; }
  .svg-special-graphic-stroke-89906c { stroke: #89906c; }
  .svg-special-graphic-stroke-8f6840 { stroke: #8f6840; }
  .svg-special-graphic-stroke-b19350 { stroke: #aa8d4d; }
  .svg-special-graphic-stroke-b58b5b { stroke: #b3895a; }
  .svg-special-text-fill-6f665b { fill: #6f665b; }

  .svg-special-background-fill-e5edf0 { fill: #e5edf0; }
  .svg-special-background-fill-e8e6d9 { fill: #e8e6d9; }
  .svg-special-background-fill-efe1cd { fill: #efe1cd; }
  .svg-special-background-fill-f0e7ca { fill: #f0e7ca; }
  .svg-special-background-fill-f6f0e5 { fill: #f6f0e5; }
  .svg-special-text-fill-29251f { fill: #29251f; }


@media (prefers-color-scheme: dark) {
    .svg-special-fill-fill-29251f { fill: #65625d; }
    .svg-special-fill-fill-e5edf0 { fill: #8d9193; }
    .svg-special-fill-fill-e8e6d9 { fill: #929189; }
    .svg-special-fill-fill-efe1cd { fill: #988f83; }
    .svg-special-fill-fill-f0e7ca { fill: #96907e; }
    .svg-special-fill-fill-f6f0e5 { fill: #94908a; }
    .svg-special-graphic-stroke-75939d { stroke: #75939d; }
    .svg-special-graphic-stroke-89906c { stroke: #89906c; }
    .svg-special-graphic-stroke-8f6840 { stroke: #8f6840; }
    .svg-special-graphic-stroke-b19350 { stroke: #aa8d4d; }
    .svg-special-graphic-stroke-b58b5b { stroke: #b3895a; }
    .svg-special-text-fill-6f665b { fill: #a9a49d; }
    .svg-special-background-fill-e5edf0 { fill: #323334; }
    .svg-special-background-fill-e8e6d9 { fill: #333230; }
    .svg-special-background-fill-efe1cd { fill: #34322f; }
    .svg-special-background-fill-f0e7ca { fill: #34322e; }
    .svg-special-background-fill-f6f0e5 { fill: #353432; }
    .svg-special-text-fill-29251f { fill: #a6a4a1; }



  }
</style>
  <title id="title">Embedding 从查表到上下文表示</title>
  <desc id="desc">token ID 选择 embedding 矩阵的一行，训练目标更新该行，随后上下文层将静态向量变成依赖句子的 hidden state。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f6f0e5 svg-special-background-fill-f6f0e5"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"  class="svg-special-fill-fill-29251f svg-special-text-fill-29251f">
    <text x="32" y="34" font-size="22" font-weight="700">Embedding：查表、学习，再进入上下文层</text>
    <text x="32" y="57" font-size="12"  class="svg-special-text-fill-6f665b">token ID 只负责索引；训练目标决定向量空间的统计关系</text>

    <rect x="32" y="86" width="160" height="116" rx="12"   class="svg-special-fill-fill-efe1cd svg-special-graphic-stroke-b58b5b svg-special-background-fill-efe1cd"/>
    <text x="48" y="113" font-size="14" font-weight="700">token ID</text>
    <text x="48" y="143" font-size="18" font-weight="700">cat → 2</text>
    <text x="48" y="172" font-size="12">离散索引</text>
    <text x="48" y="191" font-size="12"  class="svg-special-text-fill-6f665b">没有连续距离</text>

    <path d="M192 144 H226"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>
    <path d="M218 136 L228 144 L218 152"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>

    <rect x="228" y="86" width="208" height="116" rx="12"   class="svg-special-fill-fill-e8e6d9 svg-special-graphic-stroke-89906c svg-special-background-fill-e8e6d9"/>
    <text x="244" y="113" font-size="14" font-weight="700">E_tok ∈ R^(V×d)</text>
    <text x="244" y="143" font-size="13">0: [0.2, −0.1]</text>
    <text x="244" y="164" font-size="13">1: [0.7, 0.4]</text>
    <text x="244" y="185" font-size="13">2: [1.0, 0.1] ← lookup</text>

    <path d="M436 144 H470"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>
    <path d="M462 136 L472 144 L462 152"  stroke-width="2" fill="none" class="svg-special-graphic-stroke-8f6840"/>

    <rect x="472" y="86" width="296" height="116" rx="12"   class="svg-special-fill-fill-e5edf0 svg-special-graphic-stroke-75939d svg-special-background-fill-e5edf0"/>
    <text x="488" y="113" font-size="14" font-weight="700">静态向量 + 上下文层</text>
    <text x="488" y="143" font-size="13">z = E_tok[cat]</text>
    <text x="488" y="164" font-size="13">h_l = F(z₁,…,z_L; position, mask)</text>
    <text x="488" y="185" font-size="12"  class="svg-special-text-fill-6f665b">同一 token 的 h_l 可随句子变化</text>

    <rect x="32" y="232" width="736" height="94" rx="12"   class="svg-special-fill-fill-f0e7ca svg-special-graphic-stroke-b19350 svg-special-background-fill-f0e7ca"/>
    <text x="48" y="258" font-size="14" font-weight="700">训练目标更新什么</text>
    <text x="48" y="283" font-size="13">Skip-gram：正上下文得分↑，负样本得分↓</text>
    <text x="48" y="305" font-size="13">梯度：一次 lookup 直接写入被选中的 embedding 行</text>
    <text x="468" y="283" font-size="13" font-weight="700">几何：由 E、目标和数据决定</text>
    <text x="468" y="305" font-size="13">坐标可旋转；比较需固定 token、距离与对齐</text>
  </g>
</svg>
