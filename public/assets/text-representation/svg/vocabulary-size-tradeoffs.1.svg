  <title id="title">词表大小与序列长度的权衡</title>
  <desc id="desc">同一文本在 word、subword 和 character 三种粒度下产生不同 token 数；词表增大通常缩短序列但增加词表参数和输出候选。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f6f0e5 svg-special-background-fill-f6f0e5"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"  class="svg-special-fill-fill-29251f svg-special-text-fill-29251f">
    <text x="32" y="34" font-size="22" font-weight="700">词表大小：覆盖率、序列长度与成本</text>
    <text x="32" y="57" font-size="12"  class="svg-special-text-fill-6f665b">更大 V 通常减少 L；词表矩阵和输出候选随 V 增长</text>

    <rect x="32" y="82" width="432" height="202" rx="12"   class="svg-special-fill-fill-f0e7ca svg-special-graphic-stroke-b19350 svg-special-background-fill-f0e7ca"/>
    <text x="50" y="109" font-size="14" font-weight="700">同一文本，不同 token 粒度</text>
    <text x="50" y="137" font-size="12"  class="svg-special-text-fill-6f665b">cats are unhappy</text>
    <rect x="50" y="151" width="350" height="31" rx="7"   class="svg-special-fill-fill-e5edf0 svg-special-graphic-stroke-75939d svg-special-background-fill-e5edf0"/>
    <text x="64" y="171" font-size="13" font-weight="700">word：cats / are / unhappy（L = 3）</text>
    <rect x="50" y="190" width="350" height="31" rx="7"   class="svg-special-fill-fill-e8e6d9 svg-special-graphic-stroke-89906c svg-special-background-fill-e8e6d9"/>
    <text x="64" y="210" font-size="13" font-weight="700">subword：cats / are / un / happy（L = 4）</text>
    <rect x="50" y="229" width="350" height="31" rx="7"   class="svg-special-fill-fill-efe1cd svg-special-graphic-stroke-b58b5b svg-special-background-fill-efe1cd"/>
    <text x="64" y="249" font-size="13" font-weight="700">character：16 个 token（L = 16）</text>
    <text x="50" y="275" font-size="11"  class="svg-special-text-fill-6f665b">L 变为 4 倍时，attention 位置 pair 变为 16 倍</text>

    <rect x="488" y="82" width="280" height="202" rx="12"   class="svg-special-fill-fill-e5edf0 svg-special-graphic-stroke-75939d svg-special-background-fill-e5edf0"/>
    <text x="506" y="109" font-size="14" font-weight="700">同一份成本账本</text>
    <text x="506" y="139" font-size="13">输入参数：V × d</text>
    <rect x="506" y="151" width="232" height="19" rx="5"  class="svg-special-fill-fill-8f6840"/>
    <text x="506" y="146" font-size="11"  class="svg-special-text-fill-6f665b">大词表</text>
    <text x="506" y="184" font-size="13">输出候选：B × L × V</text>
    <rect x="506" y="196" width="184" height="19" rx="5"  class="svg-special-fill-fill-75939d"/>
    <text x="506" y="229" font-size="13">attention：B × L² × d</text>
    <rect x="506" y="241" width="144" height="19" rx="5"  class="svg-special-fill-fill-89906c"/>
    <text x="506" y="275" font-size="11"  class="svg-special-text-fill-6f665b">最终取决于数据、模型与任务</text>

    <rect x="32" y="304" width="736" height="42" rx="10"   class="svg-special-fill-fill-e8e6d9 svg-special-graphic-stroke-89906c svg-special-background-fill-e8e6d9"/>
    <text x="50" y="330" font-size="13" font-weight="700">选择 V：同时报告覆盖、碎片化、embedding 参数、softmax 候选、attention 成本与任务收益。</text>
  </g>
</svg>
