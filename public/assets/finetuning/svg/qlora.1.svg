    <text x="701" y="141" text-anchor="middle" font-size="18" font-weight="600">输出 y</text>
    <text x="701" y="170" text-anchor="middle" font-size="18">base + Δ</text>
    <text x="701" y="194" text-anchor="middle" font-size="12"  class="svg-special-text-fill-6d6862">adapter-only update</text>

    <text x="400" y="350" text-anchor="middle" font-size="13"  class="svg-special-text-fill-6d6862">4-bit 只压缩冻结基础权重；activation、LoRA state 和 workspace 仍需单独测量</text>
