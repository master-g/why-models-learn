    <text x="36" y="38" font-size="21" font-weight="600">Prompt Tuning：虚拟 token 条件化冻结模型</text>
    <text x="36" y="64" font-size="13"  class="svg-special-text-fill-6d6862">P 只在输入 embedding 前拼接；基础 Transformer 参数保持冻结</text>

