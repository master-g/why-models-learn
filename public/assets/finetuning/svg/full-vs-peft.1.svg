  <title id="title">全量微调与参数高效微调</title>
  <desc id="desc">同一个预训练基础模型分为全量参数更新和冻结基础权重加小 adapter 两条路径，二者的 trainable 参数、optimizer state、通信和 checkpoint 不同</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;  }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px;  }
    .base {stroke-width: 1.6; rx: 11; }
    .full {stroke-width: 1.6; rx: 11; }
    .peft {stroke-width: 1.6; rx: 11; }
    .ledger {stroke-width: 1.4; rx: 11; }
    .quality {stroke-width: 1.4; rx: 11; }
    .arrow {stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .thin {stroke-width: 1; fill: none; }
    .dash {stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7"  class="svg-special-fill-fill-bd7556"/>
    </marker>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f7f2ed svg-special-background-fill-f7f2ed"/>
  <text x="40" y="38" class="title svg-special-text-fill-2f2a27">全量微调与 PEFT：同一基础模型的两种更新空间</text>
  <text x="40" y="61" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">全量更新 Δθ，PEFT 冻结基础权重并限制 adapter 参数；资源与回归合同分别记录</text>

  <rect x="40" y="94" width="190" height="86" class="base svg-special-fill-fill-e8e4dc svg-special-graphic-stroke-77746e svg-special-background-fill-e8e4dc"/>
  <text x="135" y="121" text-anchor="middle" class="label svg-special-text-fill-2f2a27">基础 checkpoint</text>
  <text x="135" y="147" text-anchor="middle" class="body svg-special-text-fill-2f2a27">θ₀，P 个参数</text>
  <text x="135" y="168" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">base hash / tokenizer / template</text>

  <rect x="315" y="78" width="190" height="101" class="full svg-special-fill-fill-f0dfd4 svg-special-graphic-stroke-bd7556 svg-special-background-fill-f0dfd4"/>
  <text x="410" y="105" text-anchor="middle" class="label svg-special-text-fill-2f2a27">全量微调</text>
  <text x="410" y="131" text-anchor="middle" class="body svg-special-text-fill-2f2a27">Δθ ∈ ℝᴾ</text>
  <text x="410" y="152" text-anchor="middle" class="body svg-special-text-fill-2f2a27">梯度 + optimizer state</text>
  <text x="410" y="172" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">完整权重 checkpoint</text>

  <rect x="585" y="78" width="175" height="101" class="peft svg-special-fill-fill-e2eadf svg-special-graphic-stroke-718b6c svg-special-background-fill-e2eadf"/>
  <text x="672.5" y="105" text-anchor="middle" class="label svg-special-text-fill-2f2a27">参数高效微调</text>
  <text x="672.5" y="131" text-anchor="middle" class="body svg-special-text-fill-2f2a27">θ(φ) = F(θ₀, φ)</text>
  <text x="672.5" y="152" text-anchor="middle" class="body svg-special-text-fill-2f2a27">P_peft ≪ P</text>
  <text x="672.5" y="172" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">base + adapter</text>

  <path d="M230 137 H315" class="arrow svg-special-graphic-stroke-bd7556"/>
  <path d="M230 137 C285 205, 535 205, 585 137" class="arrow svg-special-graphic-stroke-bd7556"/>
  <text x="275" y="124" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">全参数</text>
  <text x="465" y="210" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">冻结基础权重</text>

  <rect x="40" y="246" width="220" height="82" class="ledger svg-special-fill-fill-f5ead6 svg-special-graphic-stroke-b98a4c svg-special-background-fill-f5ead6"/>
  <text x="150" y="271" text-anchor="middle" class="label svg-special-text-fill-2f2a27">训练资源</text>
  <text x="150" y="293" text-anchor="middle" class="body svg-special-text-fill-2f2a27">weight / grad / state</text>
  <text x="150" y="313" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">激活和 workspace 另计</text>

  <rect x="290" y="246" width="220" height="82" class="quality svg-special-fill-fill-e8e1eb svg-special-graphic-stroke-8a7295 svg-special-background-fill-e8e1eb"/>
  <text x="400" y="271" text-anchor="middle" class="label svg-special-text-fill-2f2a27">更新容量</text>
  <text x="400" y="293" text-anchor="middle" class="body svg-special-text-fill-2f2a27">target module / rank</text>
  <text x="400" y="313" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">能力迁移与遗忘回归</text>

  <rect x="540" y="246" width="220" height="82" class="base svg-special-fill-fill-e8e4dc svg-special-graphic-stroke-77746e svg-special-background-fill-e8e4dc"/>
  <text x="650" y="271" text-anchor="middle" class="label svg-special-text-fill-2f2a27">部署合同</text>
  <text x="650" y="293" text-anchor="middle" class="body svg-special-text-fill-2f2a27">merged / unmerged</text>
  <text x="650" y="313" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">base hash、adapter、延迟</text>

  <path d="M260 287 H290" class="dash svg-special-graphic-stroke-bd7556"/>
  <path d="M510 287 H540" class="dash svg-special-graphic-stroke-bd7556"/>
  <path d="M40 347 H760" class="thin svg-special-graphic-stroke-aaa198"/>
  <text x="40" y="365" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">参数数量、训练状态、通信和质量变化必须分别测量，不能用单一任务分数替代</text>
</svg>
