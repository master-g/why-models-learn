<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">全量微调与参数高效微调</title>
  <desc id="desc">同一个预训练基础模型分为全量参数更新和冻结基础权重加小 adapter 两条路径，二者的 trainable 参数、optimizer state、通信和 checkpoint 不同</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #2f2a27; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; fill: #6d625b; }
    .base { fill: #e8e4dc; stroke: #77746e; stroke-width: 1.6; rx: 11; }
    .full { fill: #f0dfd4; stroke: #bd7556; stroke-width: 1.6; rx: 11; }
    .peft { fill: #e2eadf; stroke: #718b6c; stroke-width: 1.6; rx: 11; }
    .ledger { fill: #f5ead6; stroke: #b98a4c; stroke-width: 1.4; rx: 11; }
    .quality { fill: #e8e1eb; stroke: #8a7295; stroke-width: 1.4; rx: 11; }
    .arrow { stroke: #bd7556; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #aaa198; stroke-width: 1; fill: none; }
    .dash { stroke: #bd7556; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bd7556"/>
    </marker>
  </defs>
  <rect width="800" height="373" fill="#f7f2ed"/>
  <text x="40" y="38" class="title">全量微调与 PEFT：同一基础模型的两种更新空间</text>
  <text x="40" y="61" class="small">全量更新 Δθ，PEFT 冻结基础权重并限制 adapter 参数；资源与回归合同分别记录</text>

  <rect x="40" y="94" width="190" height="86" class="base"/>
  <text x="135" y="121" text-anchor="middle" class="label">基础 checkpoint</text>
  <text x="135" y="147" text-anchor="middle" class="body">θ₀，P 个参数</text>
  <text x="135" y="168" text-anchor="middle" class="small">base hash / tokenizer / template</text>

  <rect x="315" y="78" width="190" height="101" class="full"/>
  <text x="410" y="105" text-anchor="middle" class="label">全量微调</text>
  <text x="410" y="131" text-anchor="middle" class="body">Δθ ∈ ℝᴾ</text>
  <text x="410" y="152" text-anchor="middle" class="body">梯度 + optimizer state</text>
  <text x="410" y="172" text-anchor="middle" class="small">完整权重 checkpoint</text>

  <rect x="585" y="78" width="175" height="101" class="peft"/>
  <text x="672.5" y="105" text-anchor="middle" class="label">参数高效微调</text>
  <text x="672.5" y="131" text-anchor="middle" class="body">θ(φ) = F(θ₀, φ)</text>
  <text x="672.5" y="152" text-anchor="middle" class="body">P_peft ≪ P</text>
  <text x="672.5" y="172" text-anchor="middle" class="small">base + adapter</text>

  <path d="M230 137 H315" class="arrow"/>
  <path d="M230 137 C285 205, 535 205, 585 137" class="arrow"/>
  <text x="275" y="124" class="small">全参数</text>
  <text x="465" y="210" class="small">冻结基础权重</text>

  <rect x="40" y="246" width="220" height="82" class="ledger"/>
  <text x="150" y="271" text-anchor="middle" class="label">训练资源</text>
  <text x="150" y="293" text-anchor="middle" class="body">weight / grad / state</text>
  <text x="150" y="313" text-anchor="middle" class="small">激活和 workspace 另计</text>

  <rect x="290" y="246" width="220" height="82" class="quality"/>
  <text x="400" y="271" text-anchor="middle" class="label">更新容量</text>
  <text x="400" y="293" text-anchor="middle" class="body">target module / rank</text>
  <text x="400" y="313" text-anchor="middle" class="small">能力迁移与遗忘回归</text>

  <rect x="540" y="246" width="220" height="82" class="base"/>
  <text x="650" y="271" text-anchor="middle" class="label">部署合同</text>
  <text x="650" y="293" text-anchor="middle" class="body">merged / unmerged</text>
  <text x="650" y="313" text-anchor="middle" class="small">base hash、adapter、延迟</text>

  <path d="M260 287 H290" class="dash"/>
  <path d="M510 287 H540" class="dash"/>
  <path d="M40 347 H760" class="thin"/>
  <text x="40" y="365" class="small">参数数量、训练状态、通信和质量变化必须分别测量，不能用单一任务分数替代</text>
</svg>
