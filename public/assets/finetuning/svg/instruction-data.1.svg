  <title id="title">指令数据的结构、验证与切分</title>
  <desc id="desc">任务记录包含 instruction、input、constraint 和 output，经过模板化、质量验证、去重与覆盖统计后按来源和任务族切分，再进入监督微调和固定协议评测</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;  }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px;  }
    .record {stroke-width: 1.6; rx: 11; }
    .check {stroke-width: 1.6; rx: 11; }
    .split {stroke-width: 1.6; rx: 11; }
    .train {stroke-width: 1.4; rx: 11; }
    .eval {stroke-width: 1.4; rx: 11; }
    .arrow {stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .thin {stroke-width: 1; fill: none; }
    .dash {stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7"  class="svg-special-fill-fill-bd7556"/>
    </marker>
  </defs>
  <rect width="800" height="373"  class="svg-special-fill-fill-f7f2ed svg-special-background-fill-f7f2ed"/>
  <text x="40" y="38" class="title svg-special-text-fill-2f2a27">指令数据：从任务记录到可验证示范</text>
  <text x="40" y="61" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">结构、来源、质量、覆盖和切分共同决定 SFT 实际看到的 target 分布</text>

  <rect x="40" y="94" width="160" height="104" class="record svg-special-fill-fill-e2eadf svg-special-graphic-stroke-718b6c svg-special-background-fill-e2eadf"/>
  <text x="120" y="120" text-anchor="middle" class="label svg-special-text-fill-2f2a27">任务记录</text>
  <text x="120" y="145" text-anchor="middle" class="body svg-special-text-fill-2f2a27">instruction / input</text>
  <text x="120" y="164" text-anchor="middle" class="body svg-special-text-fill-2f2a27">constraint / output</text>
  <text x="120" y="184" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">source / split / version</text>

  <rect x="230" y="94" width="160" height="104" class="check svg-special-fill-fill-f5ead6 svg-special-graphic-stroke-b98a4c svg-special-background-fill-f5ead6"/>
  <text x="310" y="120" text-anchor="middle" class="label svg-special-text-fill-2f2a27">模板与验证</text>
  <text x="310" y="145" text-anchor="middle" class="body svg-special-text-fill-2f2a27">role / schema / EOS</text>
  <text x="310" y="164" text-anchor="middle" class="body svg-special-text-fill-2f2a27">事实 / 格式 / 安全</text>
  <text x="310" y="184" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">validator 版本化</text>

  <rect x="420" y="94" width="160" height="104" class="split svg-special-fill-fill-f0dfd4 svg-special-graphic-stroke-bd7556 svg-special-background-fill-f0dfd4"/>
  <text x="500" y="120" text-anchor="middle" class="label svg-special-text-fill-2f2a27">去重与覆盖</text>
  <text x="500" y="145" text-anchor="middle" class="body svg-special-text-fill-2f2a27">hash / n-gram</text>
  <text x="500" y="164" text-anchor="middle" class="body svg-special-text-fill-2f2a27">task × language × format</text>
  <text x="500" y="184" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">raw / kept / target share</text>

  <rect x="610" y="94" width="150" height="104" class="train svg-special-fill-fill-e8e1eb svg-special-graphic-stroke-8a7295 svg-special-background-fill-e8e1eb"/>
  <text x="685" y="120" text-anchor="middle" class="label svg-special-text-fill-2f2a27">分组切分</text>
  <text x="685" y="145" text-anchor="middle" class="body svg-special-text-fill-2f2a27">train / valid / test</text>
  <text x="685" y="164" text-anchor="middle" class="body svg-special-text-fill-2f2a27">task / document</text>
  <text x="685" y="184" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">进入 SFT</text>

  <path d="M200 146 H230" class="arrow svg-special-graphic-stroke-bd7556"/>
  <path d="M390 146 H420" class="arrow svg-special-graphic-stroke-bd7556"/>
  <path d="M580 146 H610" class="arrow svg-special-graphic-stroke-bd7556"/>
  <path d="M120 207 C230 232, 570 232, 685 207" class="dash svg-special-graphic-stroke-bd7556"/>
  <text x="402" y="232" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">每一步都保留可追溯元数据</text>

  <rect x="40" y="263" width="220" height="68" class="record svg-special-fill-fill-e2eadf svg-special-graphic-stroke-718b6c svg-special-background-fill-e2eadf"/>
  <text x="150" y="287" text-anchor="middle" class="label svg-special-text-fill-2f2a27">来源与质量</text>
  <text x="150" y="309" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">人工、转换、合成、验证、复核</text>

  <rect x="290" y="263" width="220" height="68" class="check svg-special-fill-fill-f5ead6 svg-special-graphic-stroke-b98a4c svg-special-background-fill-f5ead6"/>
  <text x="400" y="287" text-anchor="middle" class="label svg-special-text-fill-2f2a27">覆盖与权重</text>
  <text x="400" y="309" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">样本份额、token 份额、难度、长度</text>

  <rect x="540" y="263" width="220" height="68" class="eval svg-special-fill-fill-f0e2e0 svg-special-graphic-stroke-a76a65 svg-special-background-fill-f0e2e0"/>
  <text x="650" y="287" text-anchor="middle" class="label svg-special-text-fill-2f2a27">评测边界</text>
  <text x="650" y="309" text-anchor="middle" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">独立来源、未见模板、固定 scorer</text>

  <path d="M40 347 H760" class="thin svg-special-graphic-stroke-aaa198"/>
  <text x="40" y="365" class="small svg-special-text-fill-2f2a27 svg-special-text-fill-6d625b">指令数据的质量不仅在答案文本，还在任务结构、分布、来源和是否泄漏</text>
</svg>
