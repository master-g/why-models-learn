<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">指令数据的结构、验证与切分</title>
  <desc id="desc">任务记录包含 instruction、input、constraint 和 output，经过模板化、质量验证、去重与覆盖统计后按来源和任务族切分，再进入监督微调和固定协议评测</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #2f2a27; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; fill: #6d625b; }
    .record { fill: #e2eadf; stroke: #718b6c; stroke-width: 1.6; rx: 11; }
    .check { fill: #f5ead6; stroke: #b98a4c; stroke-width: 1.6; rx: 11; }
    .split { fill: #f0dfd4; stroke: #bd7556; stroke-width: 1.6; rx: 11; }
    .train { fill: #e8e1eb; stroke: #8a7295; stroke-width: 1.4; rx: 11; }
    .eval { fill: #f0e2e0; stroke: #a76a65; stroke-width: 1.4; rx: 11; }
    .arrow { stroke: #bd7556; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #aaa198; stroke-width: 1; fill: none; }
    .dash { stroke: #bd7556; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bd7556"/>
    </marker>
  </defs>
  <rect width="800" height="373" fill="#f7f2ed"/>
  <text x="40" y="38" class="title">指令数据：从任务记录到可验证示范</text>
  <text x="40" y="61" class="small">结构、来源、质量、覆盖和切分共同决定 SFT 实际看到的 target 分布</text>

  <rect x="40" y="94" width="160" height="104" class="record"/>
  <text x="120" y="120" text-anchor="middle" class="label">任务记录</text>
  <text x="120" y="145" text-anchor="middle" class="body">instruction / input</text>
  <text x="120" y="164" text-anchor="middle" class="body">constraint / output</text>
  <text x="120" y="184" text-anchor="middle" class="small">source / split / version</text>

  <rect x="230" y="94" width="160" height="104" class="check"/>
  <text x="310" y="120" text-anchor="middle" class="label">模板与验证</text>
  <text x="310" y="145" text-anchor="middle" class="body">role / schema / EOS</text>
  <text x="310" y="164" text-anchor="middle" class="body">事实 / 格式 / 安全</text>
  <text x="310" y="184" text-anchor="middle" class="small">validator 版本化</text>

  <rect x="420" y="94" width="160" height="104" class="split"/>
  <text x="500" y="120" text-anchor="middle" class="label">去重与覆盖</text>
  <text x="500" y="145" text-anchor="middle" class="body">hash / n-gram</text>
  <text x="500" y="164" text-anchor="middle" class="body">task × language × format</text>
  <text x="500" y="184" text-anchor="middle" class="small">raw / kept / target share</text>

  <rect x="610" y="94" width="150" height="104" class="train"/>
  <text x="685" y="120" text-anchor="middle" class="label">分组切分</text>
  <text x="685" y="145" text-anchor="middle" class="body">train / valid / test</text>
  <text x="685" y="164" text-anchor="middle" class="body">task / document</text>
  <text x="685" y="184" text-anchor="middle" class="small">进入 SFT</text>

  <path d="M200 146 H230" class="arrow"/>
  <path d="M390 146 H420" class="arrow"/>
  <path d="M580 146 H610" class="arrow"/>
  <path d="M120 207 C230 232, 570 232, 685 207" class="dash"/>
  <text x="402" y="232" text-anchor="middle" class="small">每一步都保留可追溯元数据</text>

  <rect x="40" y="263" width="220" height="68" class="record"/>
  <text x="150" y="287" text-anchor="middle" class="label">来源与质量</text>
  <text x="150" y="309" text-anchor="middle" class="small">人工、转换、合成、验证、复核</text>

  <rect x="290" y="263" width="220" height="68" class="check"/>
  <text x="400" y="287" text-anchor="middle" class="label">覆盖与权重</text>
  <text x="400" y="309" text-anchor="middle" class="small">样本份额、token 份额、难度、长度</text>

  <rect x="540" y="263" width="220" height="68" class="eval"/>
  <text x="650" y="287" text-anchor="middle" class="label">评测边界</text>
  <text x="650" y="309" text-anchor="middle" class="small">独立来源、未见模板、固定 scorer</text>

  <path d="M40 347 H760" class="thin"/>
  <text x="40" y="365" class="small">指令数据的质量不仅在答案文本，还在任务结构、分布、来源和是否泄漏</text>
</svg>
