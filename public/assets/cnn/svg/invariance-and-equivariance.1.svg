  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f8f3ed { fill: #f8f3ed; }
  .svg-special-background-fill-fffaf3 { fill: #fffaf3; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8b817b { fill: #8b817b; }
    .svg-special-fill-fill-dce9df { fill: #8a938c; }
    .svg-special-fill-fill-e8e1ef { fill: #948f98; }
    .svg-special-fill-fill-f2e8dc { fill: #969088; }
    .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f8f3ed { fill: #93908d; }
    .svg-special-fill-fill-fffaf3 { fill: #93908c; }
    .svg-special-graphic-stroke-75957e { stroke: #75957e; }
    .svg-special-graphic-stroke-8e7caa { stroke: #8e7caa; }
    .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
    .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
    .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706e6e { fill: #a5a4a4; }
    .svg-special-background-fill-dce9df { fill: #313331; }
    .svg-special-background-fill-e8e1ef { fill: #333234; }
    .svg-special-background-fill-f2e8dc { fill: #343331; }
    .svg-special-background-fill-f3d8ce { fill: #34302f; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f8f3ed { fill: #353433; }
    .svg-special-background-fill-fffaf3 { fill: #363534; }



  }
</style>
  <title id="title">不变性与等变性</title>
  <desc id="desc">同一个一维输入向右平移后，循环互相关的响应跟着平移，保持等变；全局最大值和平均值在平移前后保持相同，形成不变标量。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .input {stroke-width: 1.2; }
      .shift {stroke-width: 1.7; }
      .equiv {stroke-width: 1.5; }
      .invariant {stroke-width: 1.5; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">不变性与等变性：变换如何穿过网络</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">等变保留位置关系，不变把允许忽略的坐标自由度汇聚掉</text>

  <rect x="38" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="56" y="113" class="panel-title svg-special-text-fill-312f2f">输入：向右平移一格</text>
  <text x="56" y="133" class="panel-detail svg-special-text-fill-706e6e">x = [0, 1, 2, 0]</text>
  <g transform="translate(56 146)">
    <rect width="38" height="35" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="38" width="38" height="35" class="shift svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="76" width="38" height="35" class="shift svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="114" width="38" height="35" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <text x="19" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
    <text x="57" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
    <text x="95" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="133" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
  </g>
  <path d="M56 195 H208" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <text x="56" y="218" class="panel-detail svg-special-text-fill-706e6e">T₁x = [0, 0, 1, 2]</text>
  <text x="56" y="241" class="panel-detail svg-special-text-fill-706e6e">坐标重排，不是数值缩放</text>

  <rect x="287" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="305" y="113" class="panel-title svg-special-text-fill-312f2f">循环互相关：等变</text>
  <text x="305" y="133" class="panel-detail svg-special-text-fill-706e6e">w = [1, −1]</text>
  <rect x="305" y="148" width="190" height="34" rx="8" class="equiv svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
  <text x="400" y="170" text-anchor="middle" class="value svg-special-text-fill-312f2f">C(x) = [−1, −1, 2, 0]</text>
  <rect x="305" y="192" width="190" height="34" rx="8" class="equiv svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
  <text x="400" y="214" text-anchor="middle" class="value svg-special-text-fill-312f2f">C(T₁x) = [0, −1, −1, 2]</text>
  <text x="305" y="246" class="panel-detail svg-special-text-fill-706e6e">C(T₁x) = T₁C(x)：响应一起移动</text>

  <rect x="536" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="554" y="113" class="panel-title svg-special-text-fill-312f2f">全局汇聚：不变</text>
  <text x="554" y="133" class="panel-detail svg-special-text-fill-706e6e">把所有空间位置看作一个集合</text>
  <rect x="554" y="148" width="88" height="43" rx="8" class="invariant svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
  <text x="598" y="167" text-anchor="middle" class="label svg-special-text-fill-312f2f">average</text>
  <text x="598" y="184" text-anchor="middle" class="value svg-special-text-fill-312f2f">0.75 = 0.75</text>
  <rect x="655" y="148" width="88" height="43" rx="8" class="invariant svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
  <text x="699" y="167" text-anchor="middle" class="label svg-special-text-fill-312f2f">max</text>
  <text x="699" y="184" text-anchor="middle" class="value svg-special-text-fill-312f2f">2 = 2</text>
  <text x="554" y="215" class="panel-detail svg-special-text-fill-706e6e">A(T₁x) = A(x)</text>
  <text x="554" y="235" class="panel-detail svg-special-text-fill-706e6e">位置被汇聚，不再输出</text>

  <rect x="38" y="278" width="724" height="43" rx="9" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="54" y="298" class="label svg-special-text-fill-312f2f">等变</text>
  <text x="103" y="298" class="value svg-special-text-fill-312f2f">f(Tg x) = ρ(g)f(x)</text>
  <text x="285" y="298" class="detail svg-special-text-fill-706e6e">；</text>
  <text x="307" y="298" class="label svg-special-text-fill-312f2f">不变</text>
  <text x="356" y="298" class="value svg-special-text-fill-312f2f">f(Tg x) = f(x)</text>
  <text x="54" y="314" class="detail svg-special-text-fill-706e6e">先确认任务需要保留坐标，还是允许把变换轨道汇聚成同一个输出。</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：对齐空间输出后测等变误差，对标量输出测不变误差，并单独记录边界与 stride 相位</text>
</svg>
