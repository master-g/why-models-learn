  <title id="title">卷积神经网络的局部窗口与权值共享</title>
  <desc id="desc">一个三乘三卷积核在五乘五输入的不同局部窗口重复计算，形成特征图；下方概括局部连接、权值共享和平移等变三个结构假设。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .formula { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .grid {stroke-width: 1; }
      .kernel {stroke-width: 1.6; }
      .response {stroke-width: 1.2; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">卷积神经网络：局部结构的可复用检测器</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">同一个 K 在不同空间位置重复计算；位置改变时，响应图随之移动</text>

  <text x="108" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">输入窗口</text>
  <g transform="translate(48 98)">
    <rect width="150" height="150" rx="4"   stroke-width="1.4" class="svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <path d="M30 0V150 M60 0V150 M90 0V150 M120 0V150 M0 30H150 M0 60H150 M0 90H150 M0 120H150" fill="none"  class="svg-special-graphic-stroke-d7ccc4"/>
    <rect x="60" y="60" width="90" height="90" rx="2"  fill-opacity=".8"  stroke-width="2" class="svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <text x="75" y="78" text-anchor="middle" class="detail svg-special-text-fill-706e6e">窗口</text>
  </g>
  <text x="123" y="266" text-anchor="middle" class="detail svg-special-text-fill-706e6e">5×5 输入 X</text>

  <path d="M208 173 H236" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="222" y="157" text-anchor="middle" class="detail svg-special-text-fill-706e6e">局部取样</text>

  <text x="294" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">共享核</text>
  <g transform="translate(249 113)">
    <rect width="90" height="90" rx="4"   stroke-width="1.8" class="svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <path d="M30 0V90 M60 0V90 M0 30H90 M0 60H90" fill="none"  stroke-width="1" class="svg-coral-stroke-stroke"/>
    <text x="15" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₁</text>
    <text x="45" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₂</text>
    <text x="75" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₃</text>
    <text x="45" y="81" text-anchor="middle" class="formula svg-special-text-fill-312f2f">K</text>
  </g>
  <text x="294" y="221" text-anchor="middle" class="detail svg-special-text-fill-706e6e">3×3 参数，不随位置复制</text>

  <path d="M350 173 H385" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="368" y="157" text-anchor="middle" class="detail svg-special-text-fill-706e6e">逐元素乘加</text>

  <text x="445" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">特征图</text>
  <g transform="translate(400 113)">
    <rect width="90" height="90" rx="4"   stroke-width="1.4" class="svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <path d="M30 0V90 M60 0V90 M0 30H90 M0 60H90" fill="none"  stroke-width="1" class="svg-special-graphic-stroke-75957e"/>
    <rect x="2" y="2" width="26" height="26"  class="svg-special-fill-fill-a9c6ad svg-special-background-fill-a9c6ad"/>
    <rect x="32" y="2" width="26" height="26"  class="svg-special-fill-fill-88ad91 svg-special-background-fill-88ad91"/>
    <rect x="62" y="32" width="26" height="26"  class="svg-special-fill-fill-a9c6ad svg-special-background-fill-a9c6ad"/>
    <rect x="32" y="62" width="26" height="26"  class="svg-special-fill-fill-88ad91 svg-special-background-fill-88ad91"/>
    <text x="45" y="53" text-anchor="middle" class="formula svg-special-text-fill-312f2f">Y</text>
  </g>
  <text x="445" y="221" text-anchor="middle" class="detail svg-special-text-fill-706e6e">每个位置一个响应值</text>

  <rect x="526" y="98" width="234" height="150" rx="10" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="544" y="124" class="label svg-special-text-fill-312f2f">滑动的含义</text>
  <text x="544" y="150" class="formula svg-special-text-fill-312f2f">Yₕ,ᵥ = ⟨K, Xₕ,ᵥ⟩ + b</text>
  <text x="544" y="176" class="detail svg-special-text-fill-706e6e">窗口从左上移动到右下</text>
  <text x="544" y="195" class="detail svg-special-text-fill-706e6e">K 始终是同一组参数</text>
  <path d="M544 214 H734"  class="svg-special-graphic-stroke-d7ccc4"/>
  <text x="544" y="233" class="detail svg-special-text-fill-706e6e">局部连接 + 权值共享</text>

  <rect x="38" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="54" y="301" class="panel-title svg-special-text-fill-312f2f">局部连接</text>
  <text x="54" y="318" class="panel-detail svg-special-text-fill-706e6e">每个输出只读取一个小窗口</text>

  <rect x="287" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="303" y="301" class="panel-title svg-special-text-fill-312f2f">权值共享</text>
  <text x="303" y="318" class="panel-detail svg-special-text-fill-706e6e">同一核在所有位置重复使用</text>

  <rect x="536" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="552" y="301" class="panel-title svg-special-text-fill-312f2f">近似平移等变</text>
  <text x="552" y="318" class="panel-detail svg-special-text-fill-706e6e">输入平移，响应图大致随之平移</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：先核对轴顺序、窗口尺寸、输出尺寸和感受野，再解释通道语义</text>
</svg>
