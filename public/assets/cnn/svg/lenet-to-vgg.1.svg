  .svg-special-fill-fill-f8f3ed { fill: #93908d; }
  .svg-special-fill-fill-fffaf3 { fill: #93908c; }
  .svg-special-graphic-stroke-75957e { stroke: #75957e; }
  .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
  .svg-special-graphic-stroke-8e7caa { stroke: #8e7caa; }
  .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
  .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706e6e { fill: #706e6e; }

  .svg-special-background-fill-dce9df { fill: #dce9df; }
  .svg-special-background-fill-e8e1ef { fill: #e8e1ef; }
  .svg-special-background-fill-f2e8dc { fill: #f2e8dc; }
  .svg-special-background-fill-f3d8ce { fill: #f3d8ce; }
  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f8f3ed { fill: #f8f3ed; }
  .svg-special-background-fill-fffaf3 { fill: #fffaf3; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8b817b { fill: #8b817b; }
    .svg-special-fill-fill-dce9df { fill: #8a938c; }
    .svg-special-fill-fill-e8e1ef { fill: #948f98; }
    .svg-special-fill-fill-f2e8dc { fill: #969088; }
    .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f8f3ed { fill: #93908d; }
    .svg-special-fill-fill-fffaf3 { fill: #93908c; }
    .svg-special-graphic-stroke-75957e { stroke: #75957e; }
    .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
    .svg-special-graphic-stroke-8e7caa { stroke: #8e7caa; }
    .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
    .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706e6e { fill: #a5a4a4; }
    .svg-special-background-fill-dce9df { fill: #313331; }
    .svg-special-background-fill-e8e1ef { fill: #333234; }
    .svg-special-background-fill-f2e8dc { fill: #343331; }
    .svg-special-background-fill-f3d8ce { fill: #34302f; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f8f3ed { fill: #353433; }
    .svg-special-background-fill-fffaf3 { fill: #363534; }



  }
</style>
  <title id="title">从 LeNet 到 VGG 的卷积网络演进</title>
  <desc id="desc">LeNet 用局部核和可学习子采样，AlexNet 用 ReLU、GPU 与大规模训练，VGG 用重复的三乘三卷积堆叠深度。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .card {stroke-width: 1.2; }
      .panel {stroke-width: 1.2; }
      .blue {stroke-width: 1.3; }
      .orange {stroke-width: 1.4; }
      .purple {stroke-width: 1.3; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">从 LeNet 到 VGG：深度、宽度和小核堆叠</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">空间逐步变小，通道逐步变宽，局部组合逐步变深</text>

  <rect x="38" y="87" width="226" height="174" rx="12" class="panel svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="56" y="113" class="panel-title svg-special-text-fill-312f2f">LeNet-5：局部到全局</text>
  <text x="56" y="132" class="detail svg-special-text-fill-706e6e">32² → 28² → 14² → 10² → 5² → 1²</text>
  <g transform="translate(56 148)">
    <rect width="38" height="30" rx="6" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="50" width="38" height="30" rx="6" class="orange svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="100" width="38" height="30" rx="6" class="purple svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
    <rect x="150" width="38" height="30" rx="6" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <text x="19" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C1</text>
    <text x="69" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">S2</text>
    <text x="119" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C3</text>
    <text x="169" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">S4</text>
    <path d="M40 15 H47 M90 15 H97 M140 15 H147"  stroke-width="1.3" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  </g>
  <text x="56" y="204" class="detail svg-special-text-fill-706e6e">C：局部核与共享；S：可学习子采样</text>
  <text x="56" y="221" class="detail svg-special-text-fill-706e6e">通道：1 → 6 → 16 → 120</text>
  <text x="56" y="244" class="label svg-special-text-fill-312f2f">参数：60,850</text>

  <rect x="287" y="87" width="226" height="174" rx="12" class="panel svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="305" y="113" class="panel-title svg-special-text-fill-312f2f">AlexNet：规模化训练</text>
  <text x="305" y="132" class="detail svg-special-text-fill-706e6e">5 conv + 3 fc；约 61M 参数</text>
  <g transform="translate(305 148)">
    <rect width="32" height="30" rx="5" class="orange svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="40" width="32" height="30" rx="5" class="orange svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="80" width="32" height="30" rx="5" class="orange svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="120" width="32" height="30" rx="5" class="orange svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="160" width="32" height="30" rx="5" class="purple svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
    <text x="16" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C1</text>
    <text x="56" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C2</text>
    <text x="96" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C3</text>
    <text x="136" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C4</text>
    <text x="176" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">C5</text>
  </g>
  <text x="305" y="204" class="detail svg-special-text-fill-706e6e">ReLU + overlapping max pooling</text>
  <text x="305" y="221" class="detail svg-special-text-fill-706e6e">GPU、分组连接、dropout、增强</text>
  <text x="305" y="244" class="label svg-special-text-fill-312f2f">数据与算力一起放大</text>

  <rect x="536" y="87" width="226" height="174" rx="12" class="panel svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="554" y="113" class="panel-title svg-special-text-fill-312f2f">VGG-16：小核变深</text>
  <text x="554" y="132" class="detail svg-special-text-fill-706e6e">13 conv + 3 fc；3×3 重复堆叠</text>
  <g transform="translate(554 148)">
    <rect width="36" height="30" rx="5" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="42" width="36" height="30" rx="5" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="84" width="36" height="30" rx="5" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="126" width="36" height="30" rx="5" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="168" width="36" height="30" rx="5" class="blue svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <text x="18" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">64</text>
    <text x="60" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">128</text>
    <text x="102" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">256</text>
    <text x="144" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">512</text>
    <text x="186" y="20" text-anchor="middle" class="value svg-special-text-fill-312f2f">512</text>
    <path d="M38 15 H40 M80 15 H82 M122 15 H124 M164 15 H166"  stroke-width="1.3" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  </g>
  <text x="554" y="204" class="detail svg-special-text-fill-706e6e">每个 block 后 2×2 pooling</text>
  <text x="554" y="221" class="detail svg-special-text-fill-706e6e">2 个 3×3 ≈ 5×5，3 个 ≈ 7×7</text>
  <text x="554" y="244" class="label svg-special-text-fill-312f2f">参数：138,357,544</text>

  <rect x="38" y="278" width="724" height="43" rx="9" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="54" y="298" class="label svg-special-text-fill-312f2f">形状</text>
  <text x="96" y="298" class="value svg-special-text-fill-312f2f">r_l = r_(l−1) + (k−1)j</text>
  <text x="292" y="298" class="detail svg-special-text-fill-706e6e">；</text>
  <text x="310" y="298" class="label svg-special-text-fill-312f2f">下采样</text>
  <text x="372" y="298" class="value svg-special-text-fill-312f2f">j ← 2j</text>
  <text x="441" y="298" class="detail svg-special-text-fill-706e6e">；</text>
  <text x="459" y="298" class="label svg-special-text-fill-312f2f">深度</text>
  <text x="502" y="298" class="value svg-special-text-fill-312f2f">更多 ReLU 组合</text>
  <text x="54" y="314" class="detail svg-special-text-fill-706e6e">比较架构时同时核对空间尺寸、通道、参数、激活内存与训练合同。</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：层数、形状、感受野、参数账和非线性位置必须能从架构图独立复算</text>
</svg>
