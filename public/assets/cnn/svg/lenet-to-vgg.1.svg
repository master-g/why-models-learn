<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">从 LeNet 到 VGG 的卷积网络演进</title>
  <desc id="desc">LeNet 用局部核和可学习子采样，AlexNet 用 ReLU、GPU 与大规模训练，VGG 用重复的三乘三卷积堆叠深度。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #706e6e; }
      .panel-title { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #706e6e; }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .card { fill: #fffaf3; stroke: #d7ccc4; stroke-width: 1.2; }
      .panel { fill: #f2e8dc; stroke: #d7ccc4; stroke-width: 1.2; }
      .blue { fill: #dce9df; stroke: #75957e; stroke-width: 1.3; }
      .orange { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.4; }
      .purple { fill: #e8e1ef; stroke: #8e7caa; stroke-width: 1.3; }
      .accept { fill: #f3d8ce; stroke: #cc785c; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20" fill="#f8f3ed" stroke="#e4d9d1"/>
  <text x="38" y="43" class="title">从 LeNet 到 VGG：深度、宽度和小核堆叠</text>
  <text x="38" y="65" class="subtitle">空间逐步变小，通道逐步变宽，局部组合逐步变深</text>

  <rect x="38" y="87" width="226" height="174" rx="12" class="panel"/>
  <text x="56" y="113" class="panel-title">LeNet-5：局部到全局</text>
  <text x="56" y="132" class="detail">32² → 28² → 14² → 10² → 5² → 1²</text>
  <g transform="translate(56 148)">
    <rect width="38" height="30" rx="6" class="blue"/>
    <rect x="50" width="38" height="30" rx="6" class="orange"/>
    <rect x="100" width="38" height="30" rx="6" class="purple"/>
    <rect x="150" width="38" height="30" rx="6" class="blue"/>
    <text x="19" y="20" text-anchor="middle" class="value">C1</text>
    <text x="69" y="20" text-anchor="middle" class="value">S2</text>
    <text x="119" y="20" text-anchor="middle" class="value">C3</text>
    <text x="169" y="20" text-anchor="middle" class="value">S4</text>
    <path d="M40 15 H47 M90 15 H97 M140 15 H147" stroke="#8b817b" stroke-width="1.3" marker-end="url(#arrow)"/>
  </g>
  <text x="56" y="204" class="detail">C：局部核与共享；S：可学习子采样</text>
  <text x="56" y="221" class="detail">通道：1 → 6 → 16 → 120</text>
  <text x="56" y="244" class="label">参数：60,850</text>

  <rect x="287" y="87" width="226" height="174" rx="12" class="panel"/>
  <text x="305" y="113" class="panel-title">AlexNet：规模化训练</text>
  <text x="305" y="132" class="detail">5 conv + 3 fc；约 61M 参数</text>
  <g transform="translate(305 148)">
    <rect width="32" height="30" rx="5" class="orange"/>
    <rect x="40" width="32" height="30" rx="5" class="orange"/>
    <rect x="80" width="32" height="30" rx="5" class="orange"/>
    <rect x="120" width="32" height="30" rx="5" class="orange"/>
    <rect x="160" width="32" height="30" rx="5" class="purple"/>
    <text x="16" y="20" text-anchor="middle" class="value">C1</text>
    <text x="56" y="20" text-anchor="middle" class="value">C2</text>
    <text x="96" y="20" text-anchor="middle" class="value">C3</text>
    <text x="136" y="20" text-anchor="middle" class="value">C4</text>
    <text x="176" y="20" text-anchor="middle" class="value">C5</text>
  </g>
  <text x="305" y="204" class="detail">ReLU + overlapping max pooling</text>
  <text x="305" y="221" class="detail">GPU、分组连接、dropout、增强</text>
  <text x="305" y="244" class="label">数据与算力一起放大</text>

  <rect x="536" y="87" width="226" height="174" rx="12" class="panel"/>
  <text x="554" y="113" class="panel-title">VGG-16：小核变深</text>
  <text x="554" y="132" class="detail">13 conv + 3 fc；3×3 重复堆叠</text>
  <g transform="translate(554 148)">
    <rect width="36" height="30" rx="5" class="blue"/>
    <rect x="42" width="36" height="30" rx="5" class="blue"/>
    <rect x="84" width="36" height="30" rx="5" class="blue"/>
    <rect x="126" width="36" height="30" rx="5" class="blue"/>
    <rect x="168" width="36" height="30" rx="5" class="blue"/>
    <text x="18" y="20" text-anchor="middle" class="value">64</text>
    <text x="60" y="20" text-anchor="middle" class="value">128</text>
    <text x="102" y="20" text-anchor="middle" class="value">256</text>
    <text x="144" y="20" text-anchor="middle" class="value">512</text>
    <text x="186" y="20" text-anchor="middle" class="value">512</text>
    <path d="M38 15 H40 M80 15 H82 M122 15 H124 M164 15 H166" stroke="#8b817b" stroke-width="1.3" marker-end="url(#arrow)"/>
  </g>
  <text x="554" y="204" class="detail">每个 block 后 2×2 pooling</text>
  <text x="554" y="221" class="detail">2 个 3×3 ≈ 5×5，3 个 ≈ 7×7</text>
  <text x="554" y="244" class="label">参数：138,357,544</text>

  <rect x="38" y="278" width="724" height="43" rx="9" class="card"/>
  <text x="54" y="298" class="label">形状</text>
  <text x="96" y="298" class="value">r_l = r_(l−1) + (k−1)j</text>
  <text x="292" y="298" class="detail">；</text>
  <text x="310" y="298" class="label">下采样</text>
  <text x="372" y="298" class="value">j ← 2j</text>
  <text x="441" y="298" class="detail">；</text>
  <text x="459" y="298" class="label">深度</text>
  <text x="502" y="298" class="value">更多 ReLU 组合</text>
  <text x="54" y="314" class="detail">比较架构时同时核对空间尺寸、通道、参数、激活内存与训练合同。</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept"/>
  <text x="400" y="351" text-anchor="middle" class="detail">验收：层数、形状、感受野、参数账和非线性位置必须能从架构图独立复算</text>
</svg>
