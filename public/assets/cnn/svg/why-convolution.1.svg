  .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-f8f3ed { fill: #93908d; }
  .svg-special-fill-fill-fffaf3 { fill: #93908c; }
  .svg-special-graphic-stroke-75957e { stroke: #75957e; }
  .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
  .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
  .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
  .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706e6e { fill: #706e6e; }

  .svg-special-background-fill-88ad91 { fill: #88ad91; }
  .svg-special-background-fill-a9c6ad { fill: #a9c6ad; }
  .svg-special-background-fill-dce9df { fill: #dce9df; }
  .svg-special-background-fill-f2e8dc { fill: #f2e8dc; }
  .svg-special-background-fill-f3d8ce { fill: #f3d8ce; }
  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f8f3ed { fill: #f8f3ed; }
  .svg-special-background-fill-fffaf3 { fill: #fffaf3; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-88ad91 { fill: #789880; }
    .svg-special-fill-fill-8b817b { fill: #8b817b; }
    .svg-special-fill-fill-a9c6ad { fill: #809683; }
    .svg-special-fill-fill-dce9df { fill: #8a938c; }
    .svg-special-fill-fill-f2e8dc { fill: #969088; }
    .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f8f3ed { fill: #93908d; }
    .svg-special-fill-fill-fffaf3 { fill: #93908c; }
    .svg-special-graphic-stroke-75957e { stroke: #75957e; }
    .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
    .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
    .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
    .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706e6e { fill: #a5a4a4; }
    .svg-special-background-fill-88ad91 { fill: #252a26; }
    .svg-special-background-fill-a9c6ad { fill: #2a2e2a; }
    .svg-special-background-fill-dce9df { fill: #313331; }
    .svg-special-background-fill-f2e8dc { fill: #343331; }
    .svg-special-background-fill-f3d8ce { fill: #34302f; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f8f3ed { fill: #353433; }
    .svg-special-background-fill-fffaf3 { fill: #363534; }



  }
</style>
  <title id="title">为什么图像需要卷积</title>
  <desc id="desc">输入图像中的局部窗口在不同位置使用同一个卷积核，产生特征图并逐层扩大感受野；下方概括局部性、位置复用和层级组合三条归纳偏置。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .formula { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .grid {stroke-width: 1; }
      .window-a {fill-opacity: .78;  stroke-width: 2; }
      .window-b {fill-opacity: .6;  stroke-width: 2; stroke-dasharray: 4 3; }
      .kernel {stroke-width: 1.6; }
      .response {stroke-width: 1.3; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">为什么图像需要卷积</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">把局部关系与跨位置复用写进连接方式，而不是让数据从零学习它们</text>

  <text x="113" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">像素网格</text>
  <g transform="translate(38 98)">
    <rect width="150" height="150" rx="4"   stroke-width="1.4" class="svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <path d="M30 0V150 M60 0V150 M90 0V150 M120 0V150 M0 30H150 M0 60H150 M0 90H150 M0 120H150" fill="none"  class="svg-special-graphic-stroke-d7ccc4"/>
    <rect x="1" y="1" width="88" height="88" rx="2" class="window-a svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="61" y="61" width="88" height="88" rx="2" class="window-b svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <text x="18" y="20" class="detail svg-special-text-fill-706e6e">A</text>
    <text x="128" y="143" class="detail svg-special-text-fill-706e6e">B</text>
  </g>
  <text x="113" y="266" text-anchor="middle" class="detail svg-special-text-fill-706e6e">两个位置的同类窗口</text>

  <path d="M198 173 H238" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="218" y="157" text-anchor="middle" class="detail svg-special-text-fill-706e6e">取局部</text>

  <text x="294" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">共享检测器</text>
  <g transform="translate(249 105)">
    <rect width="90" height="90" rx="4" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <path d="M30 0V90 M60 0V90 M0 30H90 M0 60H90" fill="none"  stroke-width="1" class="svg-coral-stroke-stroke"/>
    <text x="15" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₁</text>
    <text x="45" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₂</text>
    <text x="75" y="20" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k₃</text>
    <text x="45" y="80" text-anchor="middle" class="formula svg-special-text-fill-312f2f">K</text>
  </g>
  <text x="294" y="219" text-anchor="middle" class="detail svg-special-text-fill-706e6e">A、B 都使用同一个 K</text>

  <path d="M350 150 H385" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="368" y="134" text-anchor="middle" class="detail svg-special-text-fill-706e6e">重复计算</text>

  <text x="452" y="88" text-anchor="middle" class="label svg-special-text-fill-312f2f">响应图</text>
  <g transform="translate(407 105)">
    <rect width="120" height="120" rx="4" class="response svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <path d="M40 0V120 M80 0V120 M0 40H120 M0 80H120" fill="none"  class="svg-special-graphic-stroke-75957e"/>
    <rect x="3" y="3" width="34" height="34"  class="svg-special-fill-fill-88ad91 svg-special-background-fill-88ad91"/>
    <rect x="83" y="43" width="34" height="34"  class="svg-special-fill-fill-a9c6ad svg-special-background-fill-a9c6ad"/>
    <rect x="43" y="83" width="34" height="34"  class="svg-special-fill-fill-88ad91 svg-special-background-fill-88ad91"/>
    <text x="60" y="70" text-anchor="middle" class="formula svg-special-text-fill-312f2f">Y</text>
  </g>
  <text x="467" y="242" text-anchor="middle" class="detail svg-special-text-fill-706e6e">模式在哪里出现，响应就在哪里出现</text>

  <rect x="558" y="98" width="202" height="150" rx="10" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="577" y="124" class="label svg-special-text-fill-312f2f">卷积写入的先验</text>
  <text x="577" y="151" class="formula svg-special-text-fill-312f2f">局部性</text>
  <text x="577" y="173" class="detail svg-special-text-fill-706e6e">相邻像素先组合</text>
  <text x="577" y="197" class="formula svg-special-text-fill-312f2f">位置复用</text>
  <text x="577" y="219" class="detail svg-special-text-fill-706e6e">同一模式可跨坐标迁移</text>
  <path d="M577 232 H741"  class="svg-special-graphic-stroke-d7ccc4"/>

  <rect x="38" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="54" y="301" class="panel-title svg-special-text-fill-312f2f">局部性</text>
  <text x="54" y="318" class="panel-detail svg-special-text-fill-706e6e">输出先读取小窗口，不连接整张图</text>

  <rect x="287" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="303" y="301" class="panel-title svg-special-text-fill-312f2f">位置复用</text>
  <text x="303" y="318" class="panel-detail svg-special-text-fill-706e6e">多个窗口共同估计同一个检测器</text>

  <rect x="536" y="280" width="226" height="50" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="552" y="301" class="panel-title svg-special-text-fill-312f2f">层级组合</text>
  <text x="552" y="318" class="panel-detail svg-special-text-fill-706e6e">局部响应逐层组成更大结构</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">参数减少是结构交换：统计效率提高，同时排除了位置特异和远距离的部分函数</text>
</svg>
