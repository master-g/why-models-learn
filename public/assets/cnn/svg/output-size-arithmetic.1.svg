  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-f8f3ed { fill: #93908d; }
  .svg-special-fill-fill-fffaf3 { fill: #93908c; }
  .svg-special-graphic-stroke-75957e { stroke: #75957e; }
  .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
  .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
  .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
  .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706e6e { fill: #706e6e; }

  .svg-special-background-fill-dce9df { fill: #dce9df; }
  .svg-special-background-fill-f2e8dc { fill: #f2e8dc; }
  .svg-special-background-fill-f3d8ce { fill: #f3d8ce; }
  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f8f3ed { fill: #f8f3ed; }
  .svg-special-background-fill-fffaf3 { fill: #fffaf3; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8b817b { fill: #8b817b; }
    .svg-special-fill-fill-dce9df { fill: #8a938c; }
    .svg-special-fill-fill-f2e8dc { fill: #969088; }
    .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f8f3ed { fill: #93908d; }
    .svg-special-fill-fill-fffaf3 { fill: #93908c; }
    .svg-special-graphic-stroke-75957e { stroke: #75957e; }
    .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
    .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
    .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
    .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706e6e { fill: #a5a4a4; }
    .svg-special-background-fill-dce9df { fill: #313331; }
    .svg-special-background-fill-f2e8dc { fill: #343331; }
    .svg-special-background-fill-f3d8ce { fill: #34302f; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f8f3ed { fill: #353433; }
    .svg-special-background-fill-fffaf3 { fill: #363534; }



  }
</style>
  <title id="title">输出尺寸：逐层从最后一个合法窗口算出</title>
  <desc id="desc">一个空间尺寸账本展示卷积、池化和膨胀卷积如何把三十二乘三十二逐层变成八乘八，右侧给出转置卷积的尺寸公式和 output padding 的作用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .input {stroke-width: 1.2; }
      .stage {stroke-width: 1.2; }
      .highlight {stroke-width: 1.8; }
      .tap {stroke-width: 1.5; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">输出尺寸：逐层从最后一个合法窗口算出</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">先展开有效核，再核对四侧 padding、stride 和最后一个窗口</text>

  <rect x="38" y="87" width="430" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="56" y="113" class="panel-title svg-special-text-fill-312f2f">shape ledger：每层都把输入接到下一层</text>
  <text x="56" y="133" class="panel-detail svg-special-text-fill-706e6e">空间尺寸，参数，最后一个完整窗口</text>

  <g transform="translate(55 151)">
    <rect width="76" height="48" rx="8" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <text x="38" y="21" text-anchor="middle" class="label svg-special-text-fill-312f2f">输入</text>
    <text x="38" y="39" text-anchor="middle" class="value svg-special-text-fill-312f2f">32 × 32</text>
  </g>
  <path d="M134 175 H150" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <g transform="translate(158 151)">
    <rect width="91" height="48" rx="8" class="stage svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
    <text x="45.5" y="20" text-anchor="middle" class="label svg-special-text-fill-312f2f">conv</text>
    <text x="45.5" y="38" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k3 p1 s1 → 32</text>
  </g>
  <path d="M252 175 H268" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <g transform="translate(276 151)">
    <rect width="91" height="48" rx="8" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <text x="45.5" y="20" text-anchor="middle" class="label svg-special-text-fill-312f2f">pool</text>
    <text x="45.5" y="38" text-anchor="middle" class="detail svg-special-text-fill-706e6e">k2 s2 → 16</text>
  </g>
  <path d="M370 175 H386" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <g transform="translate(394 151)">
    <rect width="57" height="48" rx="8" class="tap svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <text x="28.5" y="19" text-anchor="middle" class="label svg-special-text-fill-312f2f">dil.</text>
    <text x="28.5" y="37" text-anchor="middle" class="detail svg-special-text-fill-706e6e">→ 8</text>
  </g>

  <text x="56" y="222" class="panel-detail svg-special-text-fill-706e6e">32 → 32 → 16 → 8 → 8</text>
  <text x="56" y="242" class="panel-detail svg-special-text-fill-706e6e">最后一层：k3、d2、p2，Keff = 5，所以 8 + 4 − 5 + 1 = 8</text>

  <rect x="491" y="87" width="271" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="509" y="113" class="panel-title svg-special-text-fill-312f2f">转置卷积：反向的尺寸关系</text>
  <text x="509" y="137" class="value svg-special-text-fill-312f2f">O = (I − 1)S − Pl − Pr</text>
  <text x="509" y="157" class="value svg-special-text-fill-312f2f">    + D(K − 1) + Op + 1</text>
  <line x1="509" y1="170" x2="744" y2="170"  stroke-width="1" class="svg-special-graphic-stroke-d7ccc4"/>
  <text x="509" y="191" class="panel-detail svg-special-text-fill-706e6e">I = 3，k = 3，s = 2，p = 1</text>
  <text x="509" y="211" class="value svg-special-text-fill-312f2f">O = 5 + output padding</text>
  <text x="509" y="234" class="panel-detail svg-special-text-fill-706e6e">Op ∈ {0, 1} 只选择离散 shape</text>
  <text x="509" y="250" class="panel-detail svg-special-text-fill-706e6e">不是把真实零追加到输出末端</text>

  <rect x="38" y="278" width="724" height="43" rx="9" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="54" y="298" class="label svg-special-text-fill-312f2f">一轴公式</text>
  <text x="125" y="298" class="value svg-special-text-fill-312f2f">O = floor((I + Pl + Pr − Keff) / S) + 1</text>
  <text x="54" y="314" class="detail svg-special-text-fill-706e6e">二维沿高度和宽度分别计算；stride 不整除时，floor、ceil 或 same 决定尾窗口。</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：写出最后一个合法窗口，记录四侧 padding、输出相位和下一层输入 shape</text>
</svg>
