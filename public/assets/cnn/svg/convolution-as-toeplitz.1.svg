    <text x="42" y="24" text-anchor="middle" class="value svg-special-text-fill-312f2f">a b / c d</text>
    <text x="132" y="24" text-anchor="middle" class="value svg-special-text-fill-312f2f">0 a / 0 c</text>
    <text x="42" y="72" text-anchor="middle" class="value svg-special-text-fill-312f2f">0 0 / a b</text>
    <text x="132" y="72" text-anchor="middle" class="value svg-special-text-fill-312f2f">a b / 0 c</text>
  </g>
  <text x="305" y="248" class="panel-detail svg-special-text-fill-706e6e">块内沿宽度平移，块间沿高度平移</text>

  <rect x="536" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="554" y="113" class="panel-title svg-special-text-fill-312f2f">反向：矩阵转置</text>
  <rect x="554" y="132" width="80" height="36" rx="8" class="transpose svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
  <text x="594" y="155" text-anchor="middle" class="label svg-special-text-fill-312f2f">y = T_wx</text>
  <path d="M639 150 H658" fill="none"  stroke-width="1.4" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <rect x="667" y="132" width="77" height="36" rx="8" class="transpose svg-special-fill-fill-e8e1ef svg-special-graphic-stroke-8e7caa svg-special-background-fill-e8e1ef"/>
  <text x="705.5" y="155" text-anchor="middle" class="label svg-special-text-fill-312f2f">T_wᵀg</text>
  <text x="554" y="192" class="panel-detail svg-special-text-fill-706e6e">输入梯度：scatter-add</text>
  <text x="554" y="211" class="panel-detail svg-special-text-fill-706e6e">核梯度：重复对角线累加</text>
  <line x1="554" y1="222" x2="744" y2="222"  stroke-width="1" class="svg-special-graphic-stroke-d7ccc4"/>
  <text x="554" y="243" class="panel-detail svg-special-text-fill-706e6e">im2col → patch → GEMM</text>

  <rect x="38" y="278" width="724" height="43" rx="9" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="54" y="298" class="label svg-special-text-fill-312f2f">结构</text>
  <text x="96" y="298" class="value svg-special-text-fill-312f2f">y = T_wx</text>
  <text x="167" y="298" class="detail svg-special-text-fill-706e6e">；</text>
  <text x="188" y="298" class="label svg-special-text-fill-312f2f">反向</text>
  <text x="233" y="298" class="value svg-special-text-fill-312f2f">∂L/∂x = T_wᵀg</text>
  <text x="382" y="298" class="detail svg-special-text-fill-706e6e">；</text>
  <text x="403" y="298" class="label svg-special-text-fill-312f2f">stride</text>
  <text x="447" y="298" class="value svg-special-text-fill-312f2f">= 选择矩阵行</text>
  <text x="54" y="314" class="detail svg-special-text-fill-706e6e">padding 改边界行，dilation 留空洞，channel mixing 组成块矩阵。</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：核方向、矩阵布局、非零连接、共享对角线与转置累加必须和滑窗实现一致</text>
</svg>
