  </g>
  <text x="56" y="238" class="panel-detail svg-special-text-fill-706e6e">同一 w 在重复对角线上出现</text>
  <text x="56" y="254" class="panel-detail svg-special-text-fill-706e6e">稀疏带状矩阵，局部且共享</text>

  <rect x="287" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="305" y="113" class="panel-title svg-special-text-fill-312f2f">二维：BTTB</text>
  <text x="305" y="132" class="panel-detail svg-special-text-fill-706e6e">block Toeplitz with Toeplitz blocks</text>
  <g transform="translate(305 148)">
    <rect width="84" height="38" rx="7" class="block svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="90" width="84" height="38" rx="7" class="block svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
