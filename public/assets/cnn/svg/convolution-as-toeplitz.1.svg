    <text x="13.5" y="65" text-anchor="middle" class="detail svg-special-text-fill-706e6e">0</text>
    <text x="40.5" y="65" text-anchor="middle" class="detail svg-special-text-fill-706e6e">0</text>
    <text x="67.5" y="65" text-anchor="middle" class="value svg-special-text-fill-312f2f">w₀</text>
