  <title id="title">卷积作为 Toeplitz 结构</title>
  <desc id="desc">一维共享核形成带状 Toeplitz 矩阵，二维局部窗口形成 block Toeplitz with Toeplitz blocks，反向传播沿矩阵转置散射并在共享对角线上累加。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 15px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .input {stroke-width: 1.2; }
      .diag {stroke-width: 1.6; }
      .block {stroke-width: 1.4; }
      .transpose {stroke-width: 1.5; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">卷积作为 Toeplitz 结构：共享窗口变成重复对角线</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">零表示局部连接，重复表示权值共享，转置表示反向散射</text>

  <rect x="38" y="87" width="226" height="174" rx="12" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="56" y="113" class="panel-title svg-special-text-fill-312f2f">一维：y = T_wx</text>
  <text x="56" y="132" class="panel-detail svg-special-text-fill-706e6e">w = [w₀, w₁, w₂]</text>
  <g transform="translate(56 146)">
