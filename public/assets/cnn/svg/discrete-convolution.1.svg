  .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
  .svg-special-fill-fill-f8f3ed { fill: #93908d; }
  .svg-special-fill-fill-fffaf3 { fill: #93908c; }
  .svg-special-graphic-stroke-75957e { stroke: #75957e; }
  .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
  .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
  .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
  .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706e6e { fill: #706e6e; }

  .svg-special-background-fill-a9c6ad { fill: #a9c6ad; }
  .svg-special-background-fill-dce9df { fill: #dce9df; }
  .svg-special-background-fill-f2e8dc { fill: #f2e8dc; }
  .svg-special-background-fill-f3d8ce { fill: #f3d8ce; }
  .svg-special-background-fill-f4ddd4 { fill: #f4ddd4; }
  .svg-special-background-fill-f8f3ed { fill: #f8f3ed; }
  .svg-special-background-fill-fffaf3 { fill: #fffaf3; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8b817b { fill: #8b817b; }
    .svg-special-fill-fill-a9c6ad { fill: #809683; }
    .svg-special-fill-fill-dce9df { fill: #8a938c; }
    .svg-special-fill-fill-f2e8dc { fill: #969088; }
    .svg-special-fill-fill-f3d8ce { fill: #9f8d87; }
    .svg-special-fill-fill-f4ddd4 { fill: #9c8e88; }
    .svg-special-fill-fill-f8f3ed { fill: #93908d; }
    .svg-special-fill-fill-fffaf3 { fill: #93908c; }
    .svg-special-graphic-stroke-75957e { stroke: #75957e; }
    .svg-special-graphic-stroke-8b817b { stroke: #8b817b; }
    .svg-special-graphic-stroke-b9a997 { stroke: #9c8e7f; }
    .svg-special-graphic-stroke-d7ccc4 { stroke: #978f8a; }
    .svg-special-graphic-stroke-e4d9d1 { stroke: #978f8a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706e6e { fill: #a5a4a4; }
    .svg-special-background-fill-a9c6ad { fill: #2a2e2a; }
    .svg-special-background-fill-dce9df { fill: #313331; }
    .svg-special-background-fill-f2e8dc { fill: #343331; }
    .svg-special-background-fill-f3d8ce { fill: #34302f; }
    .svg-special-background-fill-f4ddd4 { fill: #343130; }
    .svg-special-background-fill-f8f3ed { fill: #353433; }
    .svg-special-background-fill-fffaf3 { fill: #363534; }



  }
</style>
  <title id="title">离散卷积的索引与滑动</title>
  <desc id="desc">长度为三的输入序列与长度为二的核先翻转核，再沿输入滑动并逐项求和，得到长度为四的 full convolution；下方对照线性、有效和循环边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .sequence {stroke-width: 1.3; }
      .kernel {stroke-width: 1.6; }
      .output {stroke-width: 1.3; }
      .highlight {fill-opacity: .75;  stroke-width: 2; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">离散卷积：索引先对齐，乘积再求和</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">x = [1, 2, 1]，h = [2, −1]；翻转 h 后滑动，full 输出长度为 3 + 2 − 1</text>

  <text x="116" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">输入 x[k]</text>
  <g transform="translate(50 111)">
    <rect width="42" height="42" class="sequence svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="42" width="42" height="42" class="sequence svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="84" width="42" height="42" class="sequence svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="0" width="84" height="42" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <text x="21" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
    <text x="63" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="105" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
  </g>
  <text x="113" y="174" text-anchor="middle" class="detail svg-special-text-fill-706e6e">当前重叠窗口</text>

  <path d="M188 132 H225" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="206" y="116" text-anchor="middle" class="detail svg-special-text-fill-706e6e">翻转</text>

  <text x="285" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">核 h[k] → h[−k]</text>
  <g transform="translate(245 111)">
    <rect width="40" height="42" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="40" width="40" height="42" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <text x="20" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">−1</text>
    <text x="60" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
  </g>
  <text x="285" y="174" text-anchor="middle" class="detail svg-special-text-fill-706e6e">逐项乘积：−1、4</text>

  <path d="M335 132 H378" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="356" y="116" text-anchor="middle" class="detail svg-special-text-fill-706e6e">滑动求和</text>

  <text x="454" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">输出 y[n]</text>
  <g transform="translate(390 111)">
    <rect width="40" height="42" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="40" width="40" height="42" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="80" width="40" height="42" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="120" width="40" height="42" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="40" width="40" height="42"  class="svg-special-fill-fill-a9c6ad svg-special-background-fill-a9c6ad"/>
    <text x="20" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="60" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">3</text>
    <text x="100" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
    <text x="140" y="27" text-anchor="middle" class="value svg-special-text-fill-312f2f">−1</text>
  </g>
  <text x="470" y="174" text-anchor="middle" class="detail svg-special-text-fill-706e6e">y = [2, 3, 0, −1]</text>

  <rect x="582" y="94" width="178" height="90" rx="10" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="600" y="119" class="label svg-special-text-fill-312f2f">定义</text>
  <text x="600" y="145" class="value svg-special-text-fill-312f2f">y[n] = Σₖ x[k]h[n−k]</text>
  <text x="600" y="169" class="detail svg-special-text-fill-706e6e">边界外序列取零</text>
  <text x="600" y="188" class="detail svg-special-text-fill-706e6e">非零支持决定输出长度</text>

  <rect x="38" y="220" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="54" y="243" class="panel-title svg-special-text-fill-312f2f">线性 full</text>
  <text x="54" y="261" class="panel-detail svg-special-text-fill-706e6e">从第一次接触到最后一次接触</text>
  <text x="54" y="277" class="panel-detail svg-special-text-fill-706e6e">长度：N + M − 1</text>

  <rect x="287" y="220" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="303" y="243" class="panel-title svg-special-text-fill-312f2f">valid</text>
  <text x="303" y="261" class="panel-detail svg-special-text-fill-706e6e">只保留核完全落入输入的窗口</text>
  <text x="303" y="277" class="panel-detail svg-special-text-fill-706e6e">长度：N − M + 1</text>

  <rect x="536" y="220" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="552" y="243" class="panel-title svg-special-text-fill-312f2f">循环边界</text>
  <text x="552" y="261" class="panel-detail svg-special-text-fill-706e6e">索引按周期回绕，不是零延拓</text>
  <text x="552" y="277" class="panel-detail svg-special-text-fill-706e6e">FFT 计算线性卷积需先补零</text>

  <rect x="38" y="300" width="724" height="24" rx="8" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="400" y="316" text-anchor="middle" class="detail svg-special-text-fill-706e6e">卷积 ≠ 逐元素乘法：每个 y[n] 聚合一段相对索引的重叠乘积</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：先确认 n − k、翻转方向和边界模式，再对照输出长度与第一项</text>
</svg>
