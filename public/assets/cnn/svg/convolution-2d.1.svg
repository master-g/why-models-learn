<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">二维卷积的窗口、通道与输出</title>
  <desc id="desc">单通道三乘三输入与二乘二核进行 valid 互相关，左上窗口输出五；右侧展示四个共享核产生的二乘二特征图，底部说明通道求和、步幅和膨胀。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #706e6e; }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #706e6e; }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .panel-title { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #312f2f; }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif; fill: #706e6e; }
      .input { fill: #fffaf3; stroke: #b9a997; stroke-width: 1.2; }
      .highlight { fill: #f4ddd4; stroke: #cc785c; stroke-width: 2; }
      .kernel { fill: #f4ddd4; stroke: #cc785c; stroke-width: 1.5; }
      .output { fill: #dce9df; stroke: #75957e; stroke-width: 1.2; }
      .card { fill: #fffaf3; stroke: #d7ccc4; stroke-width: 1.2; }
      .assumption { fill: #f2e8dc; stroke: #d7ccc4; stroke-width: 1.2; }
      .accept { fill: #f3d8ce; stroke: #cc785c; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20" fill="#f8f3ed" stroke="#e4d9d1"/>
  <text x="38" y="43" class="title">二维卷积：窗口、通道与输出位置</text>
  <text x="38" y="65" class="subtitle">X：1 × 3 × 3，K：1 × 2 × 2；同一组核滑过四个窗口</text>

  <text x="91" y="91" text-anchor="middle" class="label">输入 X</text>
  <g transform="translate(45 105)">
    <rect width="34" height="34" class="highlight"/>
    <rect x="34" width="34" height="34" class="highlight"/>
    <rect x="68" width="34" height="34" class="input"/>
    <rect y="34" width="34" height="34" class="highlight"/>
    <rect x="34" y="34" width="34" height="34" class="highlight"/>
    <rect x="68" y="34" width="34" height="34" class="input"/>
    <rect y="68" width="34" height="34" class="input"/>
    <rect x="34" y="68" width="34" height="34" class="input"/>
    <rect x="68" y="68" width="34" height="34" class="input"/>
    <text x="17" y="23" text-anchor="middle" class="value">1</text>
    <text x="51" y="23" text-anchor="middle" class="value">2</text>
    <text x="85" y="23" text-anchor="middle" class="value">0</text>
    <text x="17" y="57" text-anchor="middle" class="value">3</text>
    <text x="51" y="57" text-anchor="middle" class="value">4</text>
    <text x="85" y="57" text-anchor="middle" class="value">1</text>
    <text x="17" y="91" text-anchor="middle" class="value">2</text>
    <text x="51" y="91" text-anchor="middle" class="value">0</text>
    <text x="85" y="91" text-anchor="middle" class="value">5</text>
  </g>
  <text x="96" y="219" text-anchor="middle" class="detail">高亮：当前 2 × 2 窗口</text>

  <path d="M164 154 H211" fill="none" stroke="#8b817b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="187" y="137" text-anchor="middle" class="detail">逐项乘</text>

  <text x="258" y="91" text-anchor="middle" class="label">核 K</text>
  <g transform="translate(220 121)">
    <rect width="38" height="38" class="kernel"/>
    <rect x="38" width="38" height="38" class="kernel"/>
    <rect y="38" width="38" height="38" class="kernel"/>
    <rect x="38" y="38" width="38" height="38" class="kernel"/>
    <text x="19" y="25" text-anchor="middle" class="value">1</text>
    <text x="57" y="25" text-anchor="middle" class="value">−1</text>
    <text x="19" y="63" text-anchor="middle" class="value">2</text>
    <text x="57" y="63" text-anchor="middle" class="value">0</text>
  </g>
  <text x="258" y="219" text-anchor="middle" class="detail">共享到每个位置</text>

  <path d="M310 154 H358" fill="none" stroke="#8b817b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="334" y="137" text-anchor="middle" class="detail">求和</text>

  <text x="418" y="91" text-anchor="middle" class="label">输出 Z</text>
  <g transform="translate(372 121)">
    <rect width="38" height="38" class="output"/>
    <rect x="38" width="38" height="38" class="output"/>
    <rect y="38" width="38" height="38" class="output"/>
    <rect x="38" y="38" width="38" height="38" class="output"/>
    <rect width="38" height="38" fill="#a9c6ad"/>
    <text x="19" y="25" text-anchor="middle" class="value">5</text>
    <text x="57" y="25" text-anchor="middle" class="value">10</text>
    <text x="19" y="63" text-anchor="middle" class="value">3</text>
    <text x="57" y="63" text-anchor="middle" class="value">3</text>
  </g>
  <text x="419" y="219" text-anchor="middle" class="detail">Z = [[5, 10], [3, 3]]</text>

  <rect x="492" y="96" width="270" height="100" rx="10" class="card"/>
  <text x="510" y="120" class="label">一个输出数字</text>
  <text x="510" y="145" class="value">Z[0,0] = 1·1 + 2·(−1)</text>
  <text x="510" y="166" class="value">　　　　 + 3·2 + 4·0 = 5</text>
  <text x="510" y="187" class="detail">多通道时还要先对输入通道求和</text>

  <rect x="38" y="239" width="226" height="65" rx="9" class="assumption"/>
  <text x="54" y="262" class="panel-title">通道混合</text>
  <text x="54" y="280" class="panel-detail">K[o, i, a, b]：输出 o 汇总输入 i</text>
  <text x="54" y="296" class="panel-detail">参数量：Cout · Cin · kh · kw + Cout</text>

  <rect x="287" y="239" width="226" height="65" rx="9" class="assumption"/>
  <text x="303" y="262" class="panel-title">stride</text>
  <text x="303" y="280" class="panel-detail">相邻输出窗口起点的间隔</text>
  <text x="303" y="296" class="panel-detail">不等于先缩小输入再卷积</text>

  <rect x="536" y="239" width="226" height="65" rx="9" class="assumption"/>
  <text x="552" y="262" class="panel-title">dilation</text>
  <text x="552" y="280" class="panel-detail">核元素在输入上的间距</text>
  <text x="552" y="296" class="panel-detail">有效核尺寸：d(k − 1) + 1</text>

  <rect x="38" y="312" width="724" height="17" rx="7" class="card"/>
  <text x="400" y="325" text-anchor="middle" class="detail">输出形状同时由 padding、stride、dilation、核尺寸和两个空间轴决定</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept"/>
  <text x="400" y="351" text-anchor="middle" class="detail">验收：先标轴顺序，再复算一个窗口、一个通道和最后一个合法输出坐标</text>
</svg>
