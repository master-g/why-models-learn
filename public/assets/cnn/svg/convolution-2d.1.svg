  <title id="title">二维卷积的窗口、通道与输出</title>
  <desc id="desc">单通道三乘三输入与二乘二核进行 valid 互相关，左上窗口输出五；右侧展示四个共享核产生的二乘二特征图，底部说明通道求和、步幅和膨胀。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z"  class="svg-special-fill-fill-8b817b"/>
    </marker>
    <style>
      .title { font: 600 20px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .subtitle { font: 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .label { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .value { font: 600 14px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-title { font: 600 13px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .panel-detail { font: 11px Geist, "Noto Sans SC", "PingFang SC", sans-serif;  }
      .input {stroke-width: 1.2; }
      .highlight {stroke-width: 2; }
      .kernel {stroke-width: 1.5; }
      .output {stroke-width: 1.2; }
      .card {stroke-width: 1.2; }
      .assumption {stroke-width: 1.2; }
      .accept {stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="14" y="14" width="772" height="345" rx="20"   class="svg-special-fill-fill-f8f3ed svg-special-graphic-stroke-e4d9d1 svg-special-background-fill-f8f3ed"/>
  <text x="38" y="43" class="title svg-special-text-fill-312f2f">二维卷积：窗口、通道与输出位置</text>
  <text x="38" y="65" class="subtitle svg-special-text-fill-706e6e">X：1 × 3 × 3，K：1 × 2 × 2；同一组核滑过四个窗口</text>

  <text x="91" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">输入 X</text>
  <g transform="translate(45 105)">
    <rect width="34" height="34" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="34" width="34" height="34" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="68" width="34" height="34" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect y="34" width="34" height="34" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="34" y="34" width="34" height="34" class="highlight svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="68" y="34" width="34" height="34" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect y="68" width="34" height="34" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="34" y="68" width="34" height="34" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <rect x="68" y="68" width="34" height="34" class="input svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-b9a997 svg-special-background-fill-fffaf3"/>
    <text x="17" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
    <text x="51" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="85" y="23" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
    <text x="17" y="57" text-anchor="middle" class="value svg-special-text-fill-312f2f">3</text>
    <text x="51" y="57" text-anchor="middle" class="value svg-special-text-fill-312f2f">4</text>
    <text x="85" y="57" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
    <text x="17" y="91" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="51" y="91" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
    <text x="85" y="91" text-anchor="middle" class="value svg-special-text-fill-312f2f">5</text>
  </g>
  <text x="96" y="219" text-anchor="middle" class="detail svg-special-text-fill-706e6e">高亮：当前 2 × 2 窗口</text>

  <path d="M164 154 H211" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="187" y="137" text-anchor="middle" class="detail svg-special-text-fill-706e6e">逐项乘</text>

  <text x="258" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">核 K</text>
  <g transform="translate(220 121)">
    <rect width="38" height="38" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="38" width="38" height="38" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect y="38" width="38" height="38" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <rect x="38" y="38" width="38" height="38" class="kernel svg-special-fill-fill-f4ddd4 svg-coral-stroke-stroke svg-special-background-fill-f4ddd4"/>
    <text x="19" y="25" text-anchor="middle" class="value svg-special-text-fill-312f2f">1</text>
    <text x="57" y="25" text-anchor="middle" class="value svg-special-text-fill-312f2f">−1</text>
    <text x="19" y="63" text-anchor="middle" class="value svg-special-text-fill-312f2f">2</text>
    <text x="57" y="63" text-anchor="middle" class="value svg-special-text-fill-312f2f">0</text>
  </g>
  <text x="258" y="219" text-anchor="middle" class="detail svg-special-text-fill-706e6e">共享到每个位置</text>

  <path d="M310 154 H358" fill="none"  stroke-width="1.5" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8b817b"/>
  <text x="334" y="137" text-anchor="middle" class="detail svg-special-text-fill-706e6e">求和</text>

  <text x="418" y="91" text-anchor="middle" class="label svg-special-text-fill-312f2f">输出 Z</text>
  <g transform="translate(372 121)">
    <rect width="38" height="38" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="38" width="38" height="38" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect y="38" width="38" height="38" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect x="38" y="38" width="38" height="38" class="output svg-special-fill-fill-dce9df svg-special-graphic-stroke-75957e svg-special-background-fill-dce9df"/>
    <rect width="38" height="38"  class="svg-special-fill-fill-a9c6ad svg-special-background-fill-a9c6ad"/>
    <text x="19" y="25" text-anchor="middle" class="value svg-special-text-fill-312f2f">5</text>
    <text x="57" y="25" text-anchor="middle" class="value svg-special-text-fill-312f2f">10</text>
    <text x="19" y="63" text-anchor="middle" class="value svg-special-text-fill-312f2f">3</text>
    <text x="57" y="63" text-anchor="middle" class="value svg-special-text-fill-312f2f">3</text>
  </g>
  <text x="419" y="219" text-anchor="middle" class="detail svg-special-text-fill-706e6e">Z = [[5, 10], [3, 3]]</text>

  <rect x="492" y="96" width="270" height="100" rx="10" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="510" y="120" class="label svg-special-text-fill-312f2f">一个输出数字</text>
  <text x="510" y="145" class="value svg-special-text-fill-312f2f">Z[0,0] = 1·1 + 2·(−1)</text>
  <text x="510" y="166" class="value svg-special-text-fill-312f2f">　　　　 + 3·2 + 4·0 = 5</text>
  <text x="510" y="187" class="detail svg-special-text-fill-706e6e">多通道时还要先对输入通道求和</text>

  <rect x="38" y="239" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="54" y="262" class="panel-title svg-special-text-fill-312f2f">通道混合</text>
  <text x="54" y="280" class="panel-detail svg-special-text-fill-706e6e">K[o, i, a, b]：输出 o 汇总输入 i</text>
  <text x="54" y="296" class="panel-detail svg-special-text-fill-706e6e">参数量：Cout · Cin · kh · kw + Cout</text>

  <rect x="287" y="239" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="303" y="262" class="panel-title svg-special-text-fill-312f2f">stride</text>
  <text x="303" y="280" class="panel-detail svg-special-text-fill-706e6e">相邻输出窗口起点的间隔</text>
  <text x="303" y="296" class="panel-detail svg-special-text-fill-706e6e">不等于先缩小输入再卷积</text>

  <rect x="536" y="239" width="226" height="65" rx="9" class="assumption svg-special-fill-fill-f2e8dc svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-f2e8dc"/>
  <text x="552" y="262" class="panel-title svg-special-text-fill-312f2f">dilation</text>
  <text x="552" y="280" class="panel-detail svg-special-text-fill-706e6e">核元素在输入上的间距</text>
  <text x="552" y="296" class="panel-detail svg-special-text-fill-706e6e">有效核尺寸：d(k − 1) + 1</text>

  <rect x="38" y="312" width="724" height="17" rx="7" class="card svg-special-fill-fill-fffaf3 svg-special-graphic-stroke-d7ccc4 svg-special-background-fill-fffaf3"/>
  <text x="400" y="325" text-anchor="middle" class="detail svg-special-text-fill-706e6e">输出形状同时由 padding、stride、dilation、核尺寸和两个空间轴决定</text>

  <rect x="38" y="335" width="724" height="24" rx="8" class="accept svg-special-fill-fill-f3d8ce svg-coral-stroke-stroke svg-special-background-fill-f3d8ce"/>
  <text x="400" y="351" text-anchor="middle" class="detail svg-special-text-fill-706e6e">验收：先标轴顺序，再复算一个窗口、一个通道和最后一个合法输出坐标</text>
</svg>
