  <title id="title">池化的固定局部聚合</title>
  <desc id="desc">四乘四输入经过二乘二、stride 为二的窗口，分别产生最大池化和平均池化的二乘二输出；右侧对比固定池化与带可学习参数的步幅卷积。</desc>
