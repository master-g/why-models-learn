  <path d="M 492 203 L 492 235" class="arrow svg-coral-stroke-stroke"/>
  <circle cx="376" cy="244" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="405" cy="244" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="434" cy="244" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="463" cy="244" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="492" cy="244" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <text x="355" y="275" class="muted svg-muted-fill" font-size="12">保存预测，再算总体指标</text>
  <text x="355" y="297" class="muted svg-muted-fill" font-size="12">不能使用训练内预测</text>

  <path d="M 548 214 L 582 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="592" y="111" width="156" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="614" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">嵌套选择</text>
