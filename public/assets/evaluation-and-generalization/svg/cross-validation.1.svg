  <rect x="140" y="230" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="168" y="230" width="24" height="18" rx="4" class="valid svg-special-fill-fill-f2d6cd svg-coral-stroke-stroke svg-special-background-fill-f2d6cd"/>
  <rect x="196" y="230" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="224" y="230" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <text x="74" y="269" class="muted svg-muted-fill" font-size="11">每折</text>
  <rect x="112" y="257" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="140" y="257" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="168" y="257" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="196" y="257" width="24" height="18" rx="4" class="train svg-special-fill-fill-d9e7e4 svg-special-graphic-stroke-6e8f8a svg-special-background-fill-d9e7e4"/>
  <rect x="224" y="257" width="24" height="18" rx="4" class="valid svg-special-fill-fill-f2d6cd svg-coral-stroke-stroke svg-special-background-fill-f2d6cd"/>
  <text x="74" y="299" class="muted svg-muted-fill" font-size="11">● 训练　● 验证</text>

