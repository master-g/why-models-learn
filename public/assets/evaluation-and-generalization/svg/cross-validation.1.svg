  <text x="74" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">K 折角色轮换</text>
  <text x="74" y="163" class="muted svg-muted-fill" font-size="12">同一批样本，不同验证折</text>
