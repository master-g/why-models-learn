  <text x="357" y="228" class="muted svg-muted-fill" font-size="11">高分</text>
  <text x="485" y="228" class="muted svg-muted-fill" font-size="11">低分</text>
  <rect x="355" y="247" width="140" height="14" rx="7"  class="svg-special-fill-fill-e6ded7 svg-special-background-fill-e6ded7"/>
  <rect x="355" y="247" width="94" height="14" rx="7"  class="svg-special-fill-fill-cc785c"/>
  <text x="355" y="284" class="ink svg-special-text-fill-312f2f" font-size="13">t 改变 TP / FP / FN / TN</text>
  <text x="355" y="304" class="muted svg-muted-fill" font-size="12">选择验证集工作点</text>

  <path d="M 548 214 L 582 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="592" y="111" width="156" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="614" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">排序曲线</text>
  <line x1="615" y1="270" x2="728" y2="270" class="axis svg-special-graphic-stroke-8f8a81"/>
