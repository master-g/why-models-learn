  <title id="title">分类指标：从混淆矩阵到阈值曲线</title>
  <desc id="desc">左侧是包含真阳性、假阴性、假阳性和真阴性的混淆矩阵，中间展示改变阈值会改变混淆矩阵，右侧对比 ROC 与 PR 曲线保存的排序信息。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .accent {}
    .teal {}
    .curve-one { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .curve-two { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
