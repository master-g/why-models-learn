  <path d="M 615 270 C 625 250, 636 231, 651 220 C 669 207, 694 192, 728 180" class="curve-two svg-special-graphic-stroke-6e8f8a"/>
  <text x="660" y="288" class="muted svg-muted-fill" font-size="11">FPR / recall</text>
  <text x="599" y="174" class="muted svg-muted-fill" font-size="11">TPR / precision</text>
  <circle cx="638" cy="188" r="4" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="638" cy="227" r="4" class="teal svg-special-fill-fill-6e8f8a"/>
  <text x="650" y="191" class="muted svg-muted-fill" font-size="11">ROC</text>
  <text x="650" y="230" class="muted svg-muted-fill" font-size="11">PR</text>
</svg>
