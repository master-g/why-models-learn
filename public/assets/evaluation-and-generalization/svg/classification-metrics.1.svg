    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">分类指标：从混淆矩阵到阈值与排序</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">先保存四个计数，再扫描阈值；ROC 与 PR 读取同一组排序的不同切面</text>

  <rect x="52" y="111" width="220" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="74" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">混淆矩阵</text>
  <text x="148" y="163" class="muted svg-muted-fill" font-size="11">预测正</text>
  <text x="215" y="163" class="muted svg-muted-fill" font-size="11">预测负</text>
  <text x="69" y="192" class="muted svg-muted-fill" font-size="11">真实正</text>
  <text x="69" y="243" class="muted svg-muted-fill" font-size="11">真实负</text>
  <rect x="135" y="173" width="65" height="45" rx="6"  class="svg-special-fill-fill-e9c1b3 svg-special-background-fill-e9c1b3"/>
  <rect x="202" y="173" width="55" height="45" rx="6"  class="svg-special-fill-fill-f1e7e1 svg-special-background-fill-f1e7e1"/>
  <rect x="135" y="224" width="65" height="45" rx="6"  class="svg-special-fill-fill-f1e7e1 svg-special-background-fill-f1e7e1"/>
  <rect x="202" y="224" width="55" height="45" rx="6"  class="svg-special-fill-fill-c7d8d3 svg-special-background-fill-c7d8d3"/>
  <text x="151" y="192" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">TP 18</text>
  <text x="216" y="192" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">FN 2</text>
  <text x="151" y="243" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">FP 6</text>
  <text x="216" y="243" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">TN 74</text>
  <text x="74" y="294" class="muted svg-muted-fill" font-size="12">accuracy / precision / recall</text>

  <path d="M 288 214 L 322 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="332" y="111" width="200" height="205" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="355" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">阈值扫描</text>
  <text x="355" y="164" class="muted svg-muted-fill" font-size="12">sᵢ ≥ t → 硬预测</text>
