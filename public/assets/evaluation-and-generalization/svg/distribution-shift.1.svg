<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">分布偏移的三种形式</title>
  <desc id="desc">左侧是训练域和部署域，右侧分别展示输入比例变化、类别比例变化和标签规则变化。</desc>
  <style>
    .ink { fill: #312f2f; font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted { fill: #6c6a64; font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box { fill: #fdfcfa; stroke: #b8b2a8; stroke-width: 2; }
    .accent-box { fill: #fdfcfa; stroke: #cc785c; stroke-width: 2.5; }
    .grid { stroke: #d5d0c8; stroke-width: 1.2; }
    .guide { fill: none; stroke: #c9c4bb; stroke-width: 2; stroke-dasharray: 5 5; }
    .arrow { fill: none; stroke: #cc785c; stroke-width: 3; stroke-linecap: round; }
    .teal { fill: #6e8f8a; stroke: #312f2f; stroke-width: 1.5; }
    .coral { fill: #cc785c; stroke: #312f2f; stroke-width: 1.5; }
    .purple { fill: #8b789d; stroke: #312f2f; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18" fill="#f4efee"/>
  <text x="52" y="61" class="ink" font-size="22" font-weight="700">分布偏移：先问哪一部分变了</text>
  <text x="52" y="87" class="muted" font-size="14">同一个模型，换一个联合分布，部署风险就可能不同</text>

  <rect x="52" y="111" width="178" height="207" rx="14" class="box"/>
  <text x="76" y="140" class="ink" font-size="16" font-weight="700">训练域</text>
  <text x="76" y="161" class="muted" font-size="12">P<tspan baseline-shift="sub" font-size="9">tr</tspan>(x,y)</text>
  <line x1="76" y1="274" x2="204" y2="274" class="grid"/>
  <line x1="76" y1="184" x2="76" y2="274" class="grid"/>
  <path d="M 82 263 C 103 226, 122 224, 139 240 C 156 257, 174 234, 198 196" fill="none" stroke="#6e8f8a" stroke-width="3"/>
  <circle cx="98" cy="244" r="5" class="teal"/>
  <circle cx="120" cy="229" r="5" class="teal"/>
  <circle cx="159" cy="247" r="5" class="coral"/>
  <circle cx="181" cy="218" r="5" class="coral"/>
  <text x="76" y="300" class="muted" font-size="12">输入、类别、规则</text>

  <path d="M 240 214 L 267 214" class="arrow" marker-end="url(#arrow)"/>
  <text x="239" y="196" class="muted" font-size="12">部署域</text>

  <rect x="278" y="111" width="151" height="207" rx="14" class="box"/>
  <text x="296" y="140" class="ink" font-size="15" font-weight="700">协变量偏移</text>
  <text x="296" y="160" class="muted" font-size="11">P(x) 改变</text>
  <line x1="300" y1="275" x2="407" y2="275" class="grid"/>
  <line x1="300" y1="184" x2="300" y2="275" class="grid"/>
  <path d="M 305 264 C 320 220, 339 214, 354 237 C 370 261, 387 242, 403 207" fill="none" stroke="#6e8f8a" stroke-width="3"/>
  <path d="M 305 264 C 327 250, 343 245, 359 251 C 375 257, 390 246, 403 231" fill="none" stroke="#cc785c" stroke-width="3"/>
  <text x="296" y="300" class="muted" font-size="11">P(y|x) 近似不变</text>

  <rect x="445" y="111" width="151" height="207" rx="14" class="box"/>
  <text x="463" y="140" class="ink" font-size="15" font-weight="700">标签偏移</text>
  <text x="463" y="160" class="muted" font-size="11">P(y) 改变</text>
  <line x1="470" y1="275" x2="571" y2="275" class="grid"/>
  <line x1="470" y1="184" x2="470" y2="275" class="grid"/>
  <circle cx="487" cy="227" r="6" class="teal"/>
  <circle cx="505" cy="243" r="6" class="teal"/>
  <circle cx="523" cy="214" r="6" class="teal"/>
  <circle cx="541" cy="254" r="6" class="teal"/>
  <circle cx="559" cy="229" r="6" class="coral"/>
  <circle cx="487" cy="261" r="6" class="coral"/>
  <circle cx="505" cy="258" r="6" class="coral"/>
  <circle cx="523" cy="260" r="6" class="coral"/>
  <circle cx="541" cy="252" r="6" class="coral"/>
  <circle cx="559" cy="245" r="6" class="coral"/>
  <text x="463" y="300" class="muted" font-size="11">P(x|y) 近似不变</text>

  <rect x="612" y="111" width="151" height="207" rx="14" class="accent-box"/>
  <text x="630" y="140" class="ink" font-size="15" font-weight="700">概念偏移</text>
  <text x="630" y="160" class="muted" font-size="11">P(y|x) 改变</text>
  <line x1="636" y1="275" x2="738" y2="275" class="grid"/>
  <line x1="636" y1="184" x2="636" y2="275" class="grid"/>
  <circle cx="651" cy="252" r="5" class="teal"/>
  <circle cx="672" cy="244" r="5" class="teal"/>
  <circle cx="693" cy="236" r="5" class="coral"/>
  <circle cx="714" cy="226" r="5" class="coral"/>
  <path d="M 643 260 L 730 214" fill="none" stroke="#6e8f8a" stroke-width="3"/>
  <path d="M 643 238 L 730 250" fill="none" stroke="#cc785c" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="630" y="300" class="muted" font-size="11">旧规则不再可靠</text>
</svg>
