<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
  .svg-special-fill-fill-8b789d { fill: #8b789d; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-6e8f8a { stroke: #6e8f8a; }
  .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
  .svg-special-graphic-stroke-fdfcfa { stroke: #91908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
    .svg-special-fill-fill-8b789d { fill: #8b789d; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-6e8f8a { stroke: #6e8f8a; }
    .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
    .svg-special-graphic-stroke-fdfcfa { stroke: #91908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">泛化直觉：训练拟合与未见风险</title>
  <desc id="desc">左侧图中简单曲线和高复杂度曲线都穿过训练点，右侧列出未见样本、模型选择和分布偏移对风险的影响。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .grid {stroke-width: 1.2; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 5 5; }
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .simple { fill: none;  stroke-width: 3.5; }
    .complex { fill: none;  stroke-width: 2.5; }
    .point {stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">泛化：训练点之外，哪条规则仍然稳定</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">相同的训练误差，可以对应不同的未见风险</text>

  <rect x="52" y="111" width="348" height="207" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="76" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">训练样本上的两种拟合</text>
  <text x="76" y="162" class="muted svg-muted-fill" font-size="12">两条曲线都穿过已见点</text>
  <line x1="78" y1="281" x2="371" y2="281" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="78" y1="177" x2="78" y2="281" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <path d="M 88 266 C 136 253, 178 239, 218 222 C 260 205, 306 185, 362 168" class="simple svg-special-graphic-stroke-6e8f8a"/>
  <path d="M 88 266 C 116 248, 129 267, 151 244 C 174 219, 185 246, 207 225 C 229 205, 244 239, 267 212 C 291 185, 309 199, 329 180 C 344 166, 353 179, 362 168" class="complex svg-coral-stroke-stroke"/>
  <circle cx="109" cy="258" r="5" class="point svg-special-fill-fill-312f2f svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="151" cy="244" r="5" class="point svg-special-fill-fill-312f2f svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="207" cy="225" r="5" class="point svg-special-fill-fill-312f2f svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="267" cy="212" r="5" class="point svg-special-fill-fill-312f2f svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="329" cy="180" r="5" class="point svg-special-fill-fill-312f2f svg-special-graphic-stroke-fdfcfa"/>
  <line x1="244" y1="292" x2="270" y2="292" class="simple svg-special-graphic-stroke-6e8f8a"/>
  <text x="276" y="296" class="muted svg-muted-fill" font-size="11">结构较平滑</text>
  <line x1="244" y1="306" x2="270" y2="306" class="complex svg-coral-stroke-stroke"/>
  <text x="276" y="310" class="muted svg-muted-fill" font-size="11">更易适应偶然细节</text>

  <path d="M 414 214 L 439 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <text x="410" y="196" class="muted svg-muted-fill" font-size="12">评估</text>

  <rect x="454" y="111" width="294" height="207" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="478" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">未见风险的三个问题</text>
  <circle cx="484" cy="174" r="8"  class="svg-special-fill-fill-6e8f8a"/>
  <text x="503" y="179" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">同分布新样本</text>
  <text x="503" y="197" class="muted svg-muted-fill" font-size="11">经验风险能否估计总体风险</text>
  <circle cx="484" cy="224" r="8"  class="svg-special-fill-fill-cc785c"/>
  <text x="503" y="229" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">复杂度与选择</text>
  <text x="503" y="247" class="muted svg-muted-fill" font-size="11">模型是否利用了验证噪声</text>
  <circle cx="484" cy="274" r="8"  class="svg-special-fill-fill-8b789d"/>
  <text x="503" y="279" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">部署分布</text>
  <text x="503" y="297" class="muted svg-muted-fill" font-size="11">输入或标签规则是否已经改变</text>
</svg>
