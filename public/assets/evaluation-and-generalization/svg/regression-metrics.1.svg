<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">回归指标：从残差到尺度与诊断</title>
  <desc id="desc">左侧对比真实值和预测值并画出残差，中间展示绝对误差与平方误差对大错的不同惩罚，右侧展示残差随预测值变化时需要检查的结构。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .accent {}
    .teal {}
    .residual {stroke-width: 3; stroke-linecap: round; }
    .curve { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">回归指标：残差、尺度与诊断</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">先看每个误差，再选择绝对、平方、相对或区间指标</text>

  <rect x="52" y="111" width="220" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="74" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">真实值与预测值</text>
  <line x1="78" y1="274" x2="247" y2="274" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="78" y1="274" x2="78" y2="158" class="axis svg-special-graphic-stroke-8f8a81"/>
  <text x="232" y="294" class="muted svg-muted-fill" font-size="11">样本</text>
  <text x="60" y="164" class="muted svg-muted-fill" font-size="11">数值</text>
  <path d="M 94 250 L 130 235 L 166 205 L 202 166" class="curve svg-coral-stroke-stroke"/>
  <circle cx="94" cy="250" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="130" cy="235" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="166" cy="205" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="202" cy="166" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="94" cy="242" r="6" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="130" cy="250" r="6" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="166" cy="190" r="6" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="202" cy="182" r="6" class="accent svg-special-fill-fill-cc785c"/>
  <line x1="94" y1="242" x2="94" y2="250" class="residual svg-coral-stroke-stroke"/>
  <line x1="130" y1="250" x2="130" y2="235" class="residual svg-coral-stroke-stroke"/>
  <line x1="166" y1="190" x2="166" y2="205" class="residual svg-coral-stroke-stroke"/>
  <line x1="202" y1="182" x2="202" y2="166" class="residual svg-coral-stroke-stroke"/>
  <text x="74" y="307" class="muted svg-muted-fill" font-size="12">● 预测　● 真实　竖线 = 残差</text>

  <path d="M 288 214 L 322 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="332" y="111" width="200" height="205" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="355" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">误差尺度</text>
  <text x="355" y="166" class="muted svg-muted-fill" font-size="12">同一个大残差 e</text>
  <text x="355" y="203" class="ink svg-special-text-fill-312f2f" font-size="13">MAE：|e|</text>
  <rect x="425" y="191" width="52" height="17" rx="8"  class="svg-special-fill-fill-cc785c"/>
  <text x="355" y="239" class="ink svg-special-text-fill-312f2f" font-size="13">MSE：e²</text>
  <rect x="425" y="227" width="92" height="17" rx="8"  class="svg-special-fill-fill-6e8f8a"/>
  <text x="355" y="276" class="muted svg-muted-fill" font-size="12">平方项更重视大错</text>
  <text x="355" y="298" class="muted svg-muted-fill" font-size="12">RMSE 回到原单位</text>

  <path d="M 548 214 L 582 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="592" y="111" width="156" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="614" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">残差诊断</text>
  <line x1="615" y1="218" x2="728" y2="218" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="615" y1="175" x2="615" y2="279" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="615" y1="218" x2="728" y2="218" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="629" cy="207" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="647" cy="199" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="665" cy="189" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="683" cy="177" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="701" cy="164" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="719" cy="151" r="5" class="accent svg-special-fill-fill-cc785c"/>
  <text x="614" y="294" class="muted svg-muted-fill" font-size="12">模式 ≠ 随机噪声</text>
  <text x="614" y="309" class="muted svg-muted-fill" font-size="11">检查偏差与异方差</text>
</svg>
