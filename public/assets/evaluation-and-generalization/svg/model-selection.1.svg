<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-d9e7e4 { fill: #8a9291; }
  .svg-special-fill-fill-e8a55a { fill: #bc8649; }
  .svg-special-fill-fill-f2d6cd { fill: #9f8d87; }
  .svg-special-fill-fill-f3e3c5 { fill: #9a8f7d; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-d9e7e4 { fill: #d9e7e4; }
  .svg-special-background-fill-f2d6cd { fill: #f2d6cd; }
  .svg-special-background-fill-f3e3c5 { fill: #f3e3c5; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-d9e7e4 { fill: #8a9291; }
    .svg-special-fill-fill-e8a55a { fill: #bc8649; }
    .svg-special-fill-fill-f2d6cd { fill: #9f8d87; }
    .svg-special-fill-fill-f3e3c5 { fill: #9a8f7d; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-d9e7e4 { fill: #303232; }
    .svg-special-background-fill-f2d6cd { fill: #34302f; }
    .svg-special-background-fill-f3e3c5 { fill: #34322e; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">模型选择：候选、证据与冻结</title>
  <desc id="desc">左侧展示候选模型，中间展示统一的验证证据和复杂度约束，右侧展示选择后重训并由封存测试集进行一次最终评估。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .accent {}
    .teal {}
    .amber {}
    .soft {}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">模型选择：候选、证据与冻结</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">先定义风险和边界，再比较完整的学习方案</text>

  <rect x="52" y="112" width="205" height="204" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="75" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">候选方案</text>
  <text x="75" y="164" class="muted svg-muted-fill" font-size="12">结构、特征、预算、种子</text>
  <rect x="75" y="185" width="154" height="28" rx="8"  class="svg-special-fill-fill-d9e7e4 svg-special-background-fill-d9e7e4"/>
  <text x="152" y="204" class="ink svg-special-text-fill-312f2f" font-size="12" text-anchor="middle">A  线性</text>
  <rect x="75" y="222" width="154" height="28" rx="8"  class="svg-special-fill-fill-f3e3c5 svg-special-background-fill-f3e3c5"/>
  <text x="152" y="241" class="ink svg-special-text-fill-312f2f" font-size="12" text-anchor="middle">B  二次</text>
  <rect x="75" y="259" width="154" height="28" rx="8"  class="svg-special-fill-fill-f2d6cd svg-special-background-fill-f2d6cd"/>
  <text x="152" y="278" class="ink svg-special-text-fill-312f2f" font-size="12" text-anchor="middle">C  高阶 / 大模型</text>
  <text x="75" y="306" class="muted svg-muted-fill" font-size="11">每个候选都要完整记录</text>

  <path d="M 273 214 L 308 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="318" y="112" width="204" height="204" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="341" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">开发证据</text>
  <text x="341" y="164" class="muted svg-muted-fill" font-size="12">同一切分、同一指标</text>
  <line x1="345" y1="268" x2="493" y2="268" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <line x1="345" y1="190" x2="345" y2="268" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="373" cy="246" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="407" cy="231" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <circle cx="440" cy="246" r="6" class="amber svg-special-fill-fill-e8a55a"/>
  <circle cx="471" cy="211" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <text x="352" y="185" class="muted svg-muted-fill" font-size="11">验证风险</text>
  <text x="437" y="290" class="muted svg-muted-fill" font-size="11">复杂度 / 资源</text>
  <text x="341" y="306" class="muted svg-muted-fill" font-size="11">交叉验证或留出集</text>

  <path d="M 538 214 L 573 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="583" y="112" width="165" height="204" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="606" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">冻结之后</text>
  <rect x="605" y="164" width="121" height="36" rx="9" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="665" y="187" class="ink svg-special-text-fill-312f2f" font-size="12" text-anchor="middle">选中 B，重训</text>
  <path d="M 605 218 L 726 218" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="665" y="242" class="muted svg-muted-fill" font-size="12" text-anchor="middle">封存测试集</text>
  <text x="665" y="264" class="muted svg-muted-fill" font-size="12" text-anchor="middle">只读一次</text>
  <text x="606" y="294" class="muted svg-muted-fill" font-size="11">报告风险与约束</text>
</svg>
