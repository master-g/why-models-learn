<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
  .svg-special-fill-fill-8aa7a0 { fill: #7c9690; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e39a7d { fill: #c0826a; }
  .svg-special-fill-fill-ece7df { fill: #94908b; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-ece7df { fill: #ece7df; }
  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
    .svg-special-fill-fill-8aa7a0 { fill: #7c9690; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e39a7d { fill: #c0826a; }
    .svg-special-fill-fill-ece7df { fill: #94908b; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-ece7df { fill: #333231; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">数据增强：原始样本、随机变换与训练分布</title>
  <desc id="desc">左侧原始样本经过平移、裁剪和颜色变化等保持标签的随机变换，中间每次抽取一个视图，右侧把这些视图作为训练分布的一部分。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .grid {stroke-width: 1.2; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .sample {stroke-width: 2; }
    .sample-alt {stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <clipPath id="crop">
      <rect x="312" y="238" width="116" height="64" rx="8"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">数据增强：从一个样本到一族训练视图</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">随机变换扩大合理变化的覆盖，不会把视图变成独立新样本</text>

  <rect x="52" y="111" width="168" height="207" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="76" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">原始样本</text>
  <rect x="76" y="157" width="120" height="120" rx="10"   stroke-width="1.5" class="svg-special-fill-fill-ece7df svg-axis-stroke svg-special-background-fill-ece7df"/>
  <path d="M 92 252 L 112 210 L 130 228 L 151 188 L 181 252 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
  <circle cx="162" cy="181" r="12" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  <text x="76" y="299" class="muted svg-muted-fill" font-size="12">标签 y</text>
  <text x="128" y="299" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="700">保持定义</text>

  <path d="M 228 214 L 254 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <text x="226" y="196" class="muted svg-muted-fill" font-size="12">抽样 T</text>

  <rect x="262" y="111" width="190" height="207" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="286" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">随机变换</text>
  <rect x="286" y="154" width="142" height="45" rx="8"   class="svg-special-fill-fill-f4efee svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-f4efee"/>
  <path d="M 307 185 L 323 169 L 338 178 L 353 163 L 375 185 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
  <circle cx="363" cy="160" r="7" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  <text x="389" y="181" class="ink svg-special-text-fill-312f2f" font-size="12">平移</text>
  <rect x="286" y="207" width="142" height="45" rx="8"   class="svg-special-fill-fill-f4efee svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-f4efee"/>
  <g clip-path="url(#crop)">
    <path d="M 301 249 L 320 211 L 338 229 L 356 198 L 392 249 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
    <circle cx="374" cy="204" r="11" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  </g>
  <text x="389" y="234" class="ink svg-special-text-fill-312f2f" font-size="12">裁剪</text>
  <rect x="286" y="260" width="142" height="45" rx="8"   class="svg-special-fill-fill-f4efee svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-f4efee"/>
  <path d="M 307 294 L 323 278 L 338 287 L 353 272 L 375 294 Z"   stroke-width="2" class="svg-special-fill-fill-8aa7a0 svg-ink-stroke"/>
  <circle cx="363" cy="269" r="7"   stroke-width="2" class="svg-special-fill-fill-e39a7d svg-ink-stroke"/>
  <text x="389" y="287" class="ink svg-special-text-fill-312f2f" font-size="12">颜色</text>

  <path d="M 460 214 L 488 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <text x="458" y="196" class="muted svg-muted-fill" font-size="12">x'=T(x)</text>

  <rect x="500" y="111" width="248" height="207" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="524" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">训练分布</text>
  <text x="524" y="164" class="muted svg-muted-fill" font-size="12">每轮看到一个或多个视图</text>
  <line x1="625" y1="190" x2="625" y2="287" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <line x1="548" y1="238" x2="702" y2="238" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <g transform="translate(0,-4)">
    <path d="M 584 226 L 596 211 L 607 218 L 618 205 L 638 226 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
    <circle cx="630" cy="202" r="7" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  </g>
  <g transform="translate(44,34) rotate(12 625 238)">
    <path d="M 584 226 L 596 211 L 607 218 L 618 205 L 638 226 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
    <circle cx="630" cy="202" r="7" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  </g>
  <g transform="translate(-40,37) scale(.86)">
    <path d="M 584 226 L 596 211 L 607 218 L 618 205 L 638 226 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
    <circle cx="630" cy="202" r="7" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  </g>
  <g transform="translate(20,56) scale(.72)">
    <path d="M 584 226 L 596 211 L 607 218 L 618 205 L 638 226 Z" class="sample svg-special-fill-fill-6e8f8a svg-ink-stroke"/>
    <circle cx="630" cy="202" r="7" class="sample-alt svg-special-fill-fill-cc785c svg-ink-stroke"/>
  </g>
  <text x="524" y="302" class="muted svg-muted-fill" font-size="12">标签动作 τT 与输入变换一起记录</text>
</svg>
