<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-6e8f8a { stroke: #6e8f8a; }
  .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-6e8f8a { fill: #6e8f8a; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-6e8f8a { stroke: #6e8f8a; }
    .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">隐式正则化：优化路径偏爱某些解</title>
  <desc id="desc">左侧欠定线性回归有一条零损失解直线，零初始化的梯度路径落在最小范数解；右侧同一个两层线性函数有多组因子，梯度流从对称初始化偏向平衡因子。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .grid {stroke-width: 1.2; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 6 6; }
    .loss-line { fill: none;  stroke-width: 3; stroke-linecap: round; }
    .path { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .accent {}
    .teal {}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">隐式正则化：同一个目标，路径选出不同解</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">初始化、优化器和参数化会把偏好写进求解过程</text>

  <rect x="52" y="111" width="338" height="207" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="76" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">欠定线性回归</text>
  <text x="76" y="163" class="muted svg-muted-fill" font-size="12">零损失解：w₁+w₂=2</text>
  <line x1="100" y1="282" x2="346" y2="282" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="100" y1="282" x2="100" y2="177" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="100" y1="230" x2="346" y2="230" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="161" y1="177" x2="161" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="223" y1="177" x2="223" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="284" y1="177" x2="284" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="346" y1="177" x2="346" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="100" y1="282" x2="223" y2="177" class="loss-line svg-special-graphic-stroke-6e8f8a"/>
  <circle cx="100" cy="282" r="6" class="teal svg-special-fill-fill-6e8f8a"/>
  <path d="M 100 282 L 137 251 L 168 225 L 193 203 L 223 177" class="path svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <circle cx="223" cy="177" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="223" cy="177" r="17" fill="none"  stroke-width="1.5" class="svg-coral-stroke-stroke"/>
  <text x="232" y="173" class="ink svg-special-text-fill-312f2f" font-size="12">最小范数</text>
  <text x="107" y="299" class="muted svg-muted-fill" font-size="11">w₁</text>
  <text x="88" y="188" class="muted svg-muted-fill" font-size="11">w₂</text>
  <text x="76" y="304" class="muted svg-muted-fill" font-size="11">从零初始化，梯度留在行空间</text>

  <path d="M 402 214 L 430 214" class="path svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <text x="400" y="196" class="muted svg-muted-fill" font-size="12">参数化</text>

  <rect x="442" y="111" width="306" height="207" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="466" y="141" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">两层线性模型</text>
  <text x="466" y="163" class="muted svg-muted-fill" font-size="12">同一函数：ab=2</text>
  <line x1="495" y1="282" x2="716" y2="282" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="495" y1="282" x2="495" y2="178" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="550" y1="178" x2="550" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="606" y1="178" x2="606" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <line x1="661" y1="178" x2="661" y2="282" class="grid svg-special-graphic-stroke-d5d0c8"/>
  <path d="M 516 202 C 550 219 572 238 590 252 C 617 272 650 280 704 282" class="loss-line svg-special-graphic-stroke-6e8f8a"/>
  <path d="M 548 282 L 594 247 L 628 222 L 650 205" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="606" cy="247" r="7" class="teal svg-special-fill-fill-6e8f8a"/>
  <text x="615" y="244" class="muted svg-muted-fill" font-size="11">(1,2)</text>
  <circle cx="628" cy="222" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="628" cy="222" r="17" fill="none"  stroke-width="1.5" class="svg-coral-stroke-stroke"/>
  <text x="643" y="218" class="ink svg-special-text-fill-312f2f" font-size="12">平衡因子</text>
  <text x="643" y="233" class="muted svg-muted-fill" font-size="11">(√2,√2)</text>
  <text x="466" y="304" class="muted svg-muted-fill" font-size="11">函数相同，不同因子有不同参数复杂度</text>
</svg>
