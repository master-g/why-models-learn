  <title id="title">Dropout 的训练与评估尺度</title>
  <desc id="desc">训练时用 Bernoulli 掩码置零并除以保留概率，评估时不再抽样而直接使用完整激活。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z"  class="svg-special-fill-fill-a9583e"/>
    </marker>
  </defs>
  <rect width="800" height="373" rx="18"  class="svg-special-fill-fill-f7f2ed svg-special-background-fill-f7f2ed"/>
  <rect x="1" y="1" width="798" height="371" rx="17" fill="none"  stroke-width="2" class="svg-special-graphic-stroke-c9c4bb"/>

  <g  font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-fill-fill-312f2f svg-special-text-fill-312f2f">
    <text x="28" y="34" font-size="20" font-weight="700">Dropout：随机失活如何保持期望尺度</text>
    <text x="28" y="57" font-size="12"  class="svg-special-text-fill-6c6863">训练时改变路径，评估时恢复完整激活；缩放位置决定两种模式是否一致</text>
  </g>

  <g transform="translate(24 76)">
    <rect width="474" height="184" rx="14"   stroke-width="1.5" class="svg-special-fill-fill-fbf8f4 svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fbf8f4"/>
    <text x="18" y="27"  font-size="15" font-weight="700" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-312f2f">一次训练前向</text>
    <text x="18" y="46"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">同一输入在不同掩码下经过不同的子路径</text>

    <rect x="18" y="70" width="98" height="55" rx="10"   stroke-width="1.5" class="svg-special-fill-fill-f0d9cf svg-coral-stroke-stroke svg-special-background-fill-f0d9cf"/>
    <text x="67" y="91" text-anchor="middle"  font-size="14" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">x</text>
    <text x="67" y="110" text-anchor="middle"  font-size="11" font-family="Georgia,serif" class="svg-special-text-fill-6c6863">(2, −1, 4)</text>

    <path d="M116 97H143" fill="none"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
    <rect x="146" y="70" width="126" height="55" rx="10"   stroke-width="1.5" class="svg-special-fill-fill-eadfca svg-special-graphic-stroke-b8a789 svg-special-background-fill-eadfca"/>
    <text x="209" y="91" text-anchor="middle"  font-size="13" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">m ∼ Bernoulli(q)</text>
    <text x="209" y="110" text-anchor="middle"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">m = (1, 0, 1)</text>

    <path d="M272 97H299" fill="none"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
    <rect x="302" y="70" width="151" height="55" rx="10"   stroke-width="1.5" class="svg-special-fill-fill-d9e9e5 svg-special-graphic-stroke-7ea49e svg-special-background-fill-d9e9e5"/>
    <text x="377.5" y="91" text-anchor="middle"  font-size="14" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">m ⊙ x / q</text>
    <text x="377.5" y="110" text-anchor="middle"  font-size="11" font-family="Georgia,serif" class="svg-special-text-fill-6c6863">(4, 0, 8)</text>

    <rect x="18" y="143" width="206" height="25" rx="7"  class="svg-special-fill-fill-f3e7df svg-special-background-fill-f3e7df"/>
    <text x="121" y="160" text-anchor="middle"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">mᵢ = 0：该坐标输出 0</text>
    <rect x="242" y="143" width="211" height="25" rx="7"  class="svg-special-fill-fill-e5efec svg-special-background-fill-e5efec"/>
    <text x="347.5" y="160" text-anchor="middle"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">mᵢ = 1：该坐标除以 q</text>
  </g>

  <g transform="translate(522 76)">
    <rect width="254" height="184" rx="14"   stroke-width="1.5" class="svg-special-fill-fill-fbf8f4 svg-special-graphic-stroke-c9c4bb svg-special-background-fill-fbf8f4"/>
    <text x="18" y="27"  font-size="15" font-weight="700" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-312f2f">同一层的两种模式</text>
    <text x="18" y="47"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">inverted Dropout 把缩放放在训练态</text>

    <rect x="18" y="64" width="218" height="43" rx="9"   stroke-width="1.5" class="svg-special-fill-fill-f0d9cf svg-coral-stroke-stroke svg-special-background-fill-f0d9cf"/>
    <text x="30" y="82"  font-size="12" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">training</text>
    <text x="30" y="98"  font-size="12" font-family="Georgia,serif" class="svg-special-text-fill-6c6863">m ⊙ x / q</text>

    <rect x="18" y="122" width="218" height="43" rx="9"   stroke-width="1.5" class="svg-special-fill-fill-e7e1d5 svg-special-graphic-stroke-b8a789 svg-special-background-fill-e7e1d5"/>
    <text x="30" y="140"  font-size="12" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">evaluation</text>
    <text x="30" y="156"  font-size="12" font-family="Georgia,serif" class="svg-special-text-fill-6c6863">x（不再抽掩码）</text>
  </g>

  <rect x="24" y="282" width="752" height="64" rx="12"  class="svg-special-fill-fill-eee3db svg-special-background-fill-eee3db"/>
  <text x="42" y="309"  font-size="17" font-family="Georgia,serif" class="svg-special-text-fill-312f2f">E[mᵢ xᵢ / q] = xᵢ</text>
  <text x="42" y="329"  font-size="11" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">均值尺度保持，但方差增加：Var(mᵢ xᵢ / q) = (p / q)xᵢ²</text>
  <text x="514" y="319"  font-size="12" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" class="svg-special-text-fill-6c6863">训练随机、评估确定</text>
</svg>
