<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">Adam 的一阶与二阶状态更新图</title>
  <desc id="desc">梯度同时进入一阶矩和二阶矩两条指数平均路径，经过偏置修正后合成为参数更新。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a9583e"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
      .muted { fill: #6c6a64; font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
      .mono { fill: #312f2f; font-family: "SF Mono", "JetBrains Mono", "Sarasa Mono SC", monospace; }
      .box { fill: #fffaf7; stroke: #d8d0ca; stroke-width: 1.5; }
      .state { fill: #f8e7df; stroke: #cc785c; stroke-width: 1.5; }
      .line { fill: none; stroke: #a9583e; stroke-width: 2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #b8b2a8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="800" height="373" rx="12" fill="#f4efee"/>
  <text x="28" y="34" class="ink" font-size="20" font-weight="600">Adam：方向平均与尺度平均</text>
  <text x="28" y="57" class="muted" font-size="12">同一个梯度被保存成两种时间尺度，最后才合成为参数位移</text>

  <rect x="24" y="124" width="132" height="92" rx="10" class="box"/>
  <text x="90" y="151" text-anchor="middle" class="muted" font-size="12">当前梯度</text>
  <text x="90" y="181" text-anchor="middle" class="mono" font-size="20">g<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text x="90" y="201" text-anchor="middle" class="muted" font-size="11">有效 batch 归约后</text>

  <rect x="214" y="70" width="220" height="96" rx="10" class="state"/>
  <text x="234" y="96" class="muted" font-size="12">一阶矩：方向</text>
  <text x="234" y="126" class="mono" font-size="18">m<tspan baseline-shift="sub" font-size="12">t</tspan> = β₁m<tspan baseline-shift="sub" font-size="12">t−1</tspan> + (1−β₁)g<tspan baseline-shift="sub" font-size="12">t</tspan></text>
  <text x="234" y="149" class="muted" font-size="11">平滑相邻更新的方向</text>

  <rect x="214" y="207" width="220" height="96" rx="10" class="state"/>
  <text x="234" y="233" class="muted" font-size="12">二阶矩：尺度</text>
  <text x="234" y="263" class="mono" font-size="18">v<tspan baseline-shift="sub" font-size="12">t</tspan> = β₂v<tspan baseline-shift="sub" font-size="12">t−1</tspan> + (1−β₂)g<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">2</tspan></text>
  <text x="234" y="286" class="muted" font-size="11">记录逐坐标的梯度尺度</text>

  <path d="M156 155L214 117" class="line"/>
  <path d="M156 185L214 255" class="line"/>
  <text x="169" y="128" class="muted" font-size="11">方向</text>
  <text x="168" y="222" class="muted" font-size="11">平方</text>

  <rect x="482" y="70" width="126" height="96" rx="10" class="box"/>
  <text x="545" y="96" text-anchor="middle" class="muted" font-size="12">偏置修正</text>
  <text x="545" y="128" text-anchor="middle" class="mono" font-size="17">m̂<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="545" y="149" text-anchor="middle" class="muted" font-size="11">除以 1−β₁ᵗ</text>

  <rect x="482" y="207" width="126" height="96" rx="10" class="box"/>
  <text x="545" y="233" text-anchor="middle" class="muted" font-size="12">偏置修正</text>
  <text x="545" y="265" text-anchor="middle" class="mono" font-size="17">v̂<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="545" y="286" text-anchor="middle" class="muted" font-size="11">除以 1−β₂ᵗ</text>

  <path d="M434 118L482 118" class="line"/>
  <path d="M434 255L482 255" class="line"/>

  <path d="M608 118L647 162" class="line"/>
  <path d="M608 255L647 209" class="line"/>
  <path d="M647 186L666 186" class="thin"/>

  <rect x="666" y="124" width="110" height="124" rx="10" class="box"/>
  <text x="721" y="150" text-anchor="middle" class="muted" font-size="12">合成更新</text>
  <text x="721" y="181" text-anchor="middle" class="mono" font-size="17">u<tspan baseline-shift="sub" font-size="11">t</tspan> = −η</text>
  <text x="721" y="207" text-anchor="middle" class="mono" font-size="16">m̂ / (√v̂+ε)</text>
  <text x="721" y="232" text-anchor="middle" class="muted" font-size="11">θ<tspan baseline-shift="sub" font-size="8">t+1</tspan> = θ<tspan baseline-shift="sub" font-size="8">t</tspan> + u<tspan baseline-shift="sub" font-size="8">t</tspan></text>

  <path d="M90 232L90 335L666 335L666 248" class="thin"/>
  <text x="28" y="355" class="muted" font-size="12">状态必须随 optimizer step 一起保存；AdamW 的参数收缩不进入这两条矩路径。</text>
</svg>
