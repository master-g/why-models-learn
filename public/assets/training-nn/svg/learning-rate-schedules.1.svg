<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-a9583e { fill: #a9583e; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-f8e7df { fill: #998e8a; }
  .svg-special-fill-fill-fffaf7 { fill: #93908f; }
  .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-d8d0ca { stroke: #95908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-f8e7df { fill: #f8e7df; }
  .svg-special-background-fill-fffaf7 { fill: #fffaf7; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-a9583e { fill: #a9583e; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-f8e7df { fill: #998e8a; }
    .svg-special-fill-fill-fffaf7 { fill: #93908f; }
    .svg-special-graphic-stroke-6c6a64 { stroke: #6c6a64; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-d8d0ca { stroke: #95908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-f8e7df { fill: #353231; }
    .svg-special-background-fill-fffaf7 { fill: #363535; }



  }
</style>
  <title id="title">学习率调度曲线</title>
  <desc id="desc">学习率先线性 warmup 到峰值，再沿余弦曲线衰减；下方标出 optimizer step、batch 和 epoch 的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z"  class="svg-special-fill-fill-a9583e"/>
    </marker>
    <style>
      .ink {font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
      .muted {font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
      .mono {font-family: "SF Mono", "JetBrains Mono", "Sarasa Mono SC", monospace; }
      .line { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none;  stroke-width: 1.5; stroke-dasharray: 5 5; }
      .box {stroke-width: 1.5; }
      .accent {stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="800" height="373" rx="12"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="28" y="34" class="ink svg-special-text-fill-312f2f" font-size="20" font-weight="600">学习率调度：把步长放到时间轴上</text>
  <text x="28" y="57" class="muted svg-muted-fill" font-size="12">warmup 先控制最大更新，余弦段再把学习率平滑送到终点</text>

  <line x1="74" y1="86" x2="74" y2="266"  stroke-width="1.5" class="svg-special-graphic-stroke-6c6a64"/>
  <line x1="74" y1="266" x2="570" y2="266"  stroke-width="1.5" class="svg-special-graphic-stroke-6c6a64"/>
  <text x="45" y="94" class="muted svg-muted-fill" font-size="12">η</text>
  <text x="542" y="286" class="muted svg-muted-fill" font-size="12">optimizer step</text>
  <text x="45" y="116" class="muted svg-muted-fill" font-size="10">ηmax</text>
  <text x="43" y="251" class="muted svg-muted-fill" font-size="10">ηmin</text>
  <line x1="74" y1="112" x2="570" y2="112" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <line x1="74" y1="250" x2="570" y2="250" class="guide svg-special-graphic-stroke-c9c4bb"/>

  <path d="M92 250L220 112" class="line svg-coral-stroke-stroke"/>
  <path d="M220 112C282 112 326 137 373 174C423 214 481 244 560 250" class="line svg-coral-stroke-stroke"/>
  <line x1="220" y1="86" x2="220" y2="266" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="150" y="153" class="muted svg-muted-fill" font-size="11">线性 warmup</text>
  <text x="356" y="155" class="muted svg-muted-fill" font-size="11">cosine decay</text>
  <text x="196" y="282" class="muted svg-muted-fill" font-size="11">K</text>
  <text x="549" y="282" class="muted svg-muted-fill" font-size="11">T</text>
  <circle cx="220" cy="112" r="5"  class="svg-special-fill-fill-cc785c"/>
  <circle cx="560" cy="250" r="5"  class="svg-special-fill-fill-cc785c"/>

  <rect x="610" y="86" width="164" height="180" rx="10" class="box svg-special-fill-fill-fffaf7 svg-special-graphic-stroke-d8d0ca svg-special-background-fill-fffaf7"/>
  <text x="692" y="112" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="13" font-weight="600">同一条调度记录</text>
  <line x1="628" y1="126" x2="756" y2="126"  class="svg-special-graphic-stroke-d8d0ca"/>
  <text x="628" y="151" class="muted svg-muted-fill" font-size="11">step</text>
  <text x="749" y="151" text-anchor="end" class="mono svg-special-text-fill-312f2f" font-size="12">1, 2, …, T</text>
  <text x="628" y="178" class="muted svg-muted-fill" font-size="11">batch</text>
  <text x="749" y="178" text-anchor="end" class="mono svg-special-text-fill-312f2f" font-size="12">B × A × D</text>
  <text x="628" y="205" class="muted svg-muted-fill" font-size="11">epoch</text>
  <text x="749" y="205" text-anchor="end" class="mono svg-special-text-fill-312f2f" font-size="12">samples</text>
  <text x="628" y="232" class="muted svg-muted-fill" font-size="11">checkpoint</text>
  <text x="749" y="232" text-anchor="end" class="mono svg-special-text-fill-312f2f" font-size="12">state</text>

  <rect x="84" y="315" width="116" height="34" rx="8" class="accent svg-special-fill-fill-f8e7df svg-coral-stroke-stroke svg-special-background-fill-f8e7df"/>
  <text x="142" y="337" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">micro-batch</text>
  <path d="M200 332L260 332"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <rect x="260" y="315" width="128" height="34" rx="8" class="accent svg-special-fill-fill-f8e7df svg-coral-stroke-stroke svg-special-background-fill-f8e7df"/>
  <text x="324" y="337" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">optimizer step</text>
  <path d="M388 332L448 332"  stroke-width="2" marker-end="url(#arrow)" class="svg-coral-stroke-stroke"/>
  <rect x="448" y="315" width="96" height="34" rx="8" class="accent svg-special-fill-fill-f8e7df svg-coral-stroke-stroke svg-special-background-fill-f8e7df"/>
  <text x="496" y="337" text-anchor="middle" class="ink svg-special-text-fill-312f2f" font-size="12">epoch</text>
  <text x="575" y="337" class="muted svg-muted-fill" font-size="11">调度通常随参数更新推进</text>
</svg>
