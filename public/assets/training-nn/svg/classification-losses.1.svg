<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">分类损失与标签结构</title>
  <desc id="desc">左侧比较二元交叉熵和 focal loss 对真实类别概率的惩罚，右侧比较二分类、互斥多分类和多标签的输出契约。</desc>
  <rect width="800" height="373" fill="#f7f4ef"/>
  <text x="28" y="30" fill="#2c2a27" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700">分类损失如何看待一个错误</text>
  <text x="28" y="51" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">先确定标签关系，再决定概率如何归一化</text>

  <rect x="22" y="68" width="414" height="275" rx="12" fill="#fffefa" stroke="#d8d1c7"/>
  <text x="42" y="91" fill="#38342f" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700">正确类别概率越小，惩罚越大</text>
  <text x="42" y="110" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">以 pₜ 为横轴，γ=2 的 focal 会压低容易样本的权重</text>
  <line x1="68" y1="270" x2="408" y2="270" stroke="#777168" stroke-width="1.4"/>
  <line x1="68" y1="128" x2="68" y2="270" stroke="#777168" stroke-width="1.4"/>
  <line x1="68" y1="199" x2="408" y2="199" stroke="#ddd7cf"/>
  <line x1="68" y1="128" x2="408" y2="128" stroke="#ddd7cf"/>
  <text x="54" y="274" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">0</text>
  <text x="50" y="203" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">1</text>
  <text x="50" y="132" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">2</text>
  <text x="66" y="288" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">0.05</text>
  <text x="222" y="288" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">0.5</text>
  <text x="383" y="288" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">0.98</text>
  <text x="222" y="306" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">真实类别概率 pₜ</text>
  <path d="M68 104 L112 107 L158 138 L204 180 L250 207 L296 231 L340 254 L386 269" fill="none" stroke="#a9583e" stroke-width="3"/>
  <path d="M68 116 L112 137 L158 183 L204 247 L250 264 L296 269 L340 270 L386 270" fill="none" stroke="#54758a" stroke-width="3"/>
  <line x1="267" y1="326" x2="287" y2="326" stroke="#a9583e" stroke-width="3"/>
  <text x="293" y="330" fill="#514b44" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">BCE</text>
  <line x1="329" y1="326" x2="349" y2="326" stroke="#54758a" stroke-width="3"/>
  <text x="355" y="330" fill="#514b44" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">focal</text>
  <text x="42" y="326" fill="#a9583e" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">难样本保留更多训练预算</text>

  <rect x="452" y="68" width="326" height="275" rx="12" fill="#fffefa" stroke="#d8d1c7"/>
  <text x="472" y="91" fill="#38342f" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700">标签关系决定归一化方式</text>
  <rect x="472" y="108" width="286" height="62" rx="8" fill="#f0ebe4" stroke="#d8d1c7"/>
  <text x="487" y="128" fill="#38342f" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700">二分类</text>
  <text x="487" y="147" fill="#5f5951" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">1 个 logit → sigmoid → BCE</text>
  <text x="487" y="162" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">一个正类概率</text>
  <rect x="472" y="181" width="286" height="62" rx="8" fill="#e9f0f1" stroke="#c6d5d9"/>
  <text x="487" y="201" fill="#383f42" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700">互斥多分类</text>
  <text x="487" y="220" fill="#53636a" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">K 个 logits → softmax → CE</text>
  <text x="487" y="235" fill="#6b777a" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">概率和必须为 1</text>
  <rect x="472" y="254" width="286" height="62" rx="8" fill="#f1ebe0" stroke="#ddd0b9"/>
  <text x="487" y="274" fill="#49433b" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700">多标签</text>
  <text x="487" y="293" fill="#675f54" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11">K 个 logits → K 个 sigmoid</text>
  <text x="487" y="308" fill="#706a61" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10">逐标签 BCE，概率可共存</text>
</svg>
