  <title id="title">分类损失与标签结构</title>
  <desc id="desc">左侧比较二元交叉熵和 focal loss 对真实类别概率的惩罚，右侧比较二分类、互斥多分类和多标签的输出契约。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f7f4ef svg-special-background-fill-f7f4ef"/>
  <text x="28" y="30"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" class="svg-special-text-fill-2c2a27">分类损失如何看待一个错误</text>
  <text x="28" y="51"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-706a61">先确定标签关系，再决定概率如何归一化</text>

  <rect x="22" y="68" width="414" height="275" rx="12"   class="svg-special-fill-fill-fffefa svg-special-graphic-stroke-d8d1c7 svg-special-background-fill-fffefa"/>
  <text x="42" y="91"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-38342f">正确类别概率越小，惩罚越大</text>
  <text x="42" y="110"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-706a61">以 pₜ 为横轴，γ=2 的 focal 会压低容易样本的权重</text>
  <line x1="68" y1="270" x2="408" y2="270"  stroke-width="1.4" class="svg-special-graphic-stroke-777168"/>
  <line x1="68" y1="128" x2="68" y2="270"  stroke-width="1.4" class="svg-special-graphic-stroke-777168"/>
  <line x1="68" y1="199" x2="408" y2="199"  class="svg-special-graphic-stroke-ddd7cf"/>
  <line x1="68" y1="128" x2="408" y2="128"  class="svg-special-graphic-stroke-ddd7cf"/>
  <text x="54" y="274"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">0</text>
  <text x="50" y="203"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">1</text>
  <text x="50" y="132"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">2</text>
  <text x="66" y="288"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">0.05</text>
  <text x="222" y="288"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">0.5</text>
  <text x="383" y="288"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">0.98</text>
  <text x="222" y="306"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-706a61">真实类别概率 pₜ</text>
  <path d="M68 104 L112 107 L158 138 L204 180 L250 207 L296 231 L340 254 L386 269" fill="none"  stroke-width="3" class="svg-coral-stroke-stroke"/>
  <path d="M68 116 L112 137 L158 183 L204 247 L250 264 L296 269 L340 270 L386 270" fill="none"  stroke-width="3" class="svg-special-graphic-stroke-54758a"/>
  <line x1="267" y1="326" x2="287" y2="326"  stroke-width="3" class="svg-coral-stroke-stroke"/>
  <text x="293" y="330"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-514b44">BCE</text>
  <line x1="329" y1="326" x2="349" y2="326"  stroke-width="3" class="svg-special-graphic-stroke-54758a"/>
  <text x="355" y="330"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-514b44">focal</text>
  <text x="42" y="326"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-coral-text-fill">难样本保留更多训练预算</text>

  <rect x="452" y="68" width="326" height="275" rx="12"   class="svg-special-fill-fill-fffefa svg-special-graphic-stroke-d8d1c7 svg-special-background-fill-fffefa"/>
  <text x="472" y="91"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-38342f">标签关系决定归一化方式</text>
  <rect x="472" y="108" width="286" height="62" rx="8"   class="svg-special-fill-fill-f0ebe4 svg-special-graphic-stroke-d8d1c7 svg-special-background-fill-f0ebe4"/>
  <text x="487" y="128"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-38342f">二分类</text>
  <text x="487" y="147"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-5f5951">1 个 logit → sigmoid → BCE</text>
  <text x="487" y="162"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">一个正类概率</text>
  <rect x="472" y="181" width="286" height="62" rx="8"   class="svg-special-fill-fill-e9f0f1 svg-special-graphic-stroke-c6d5d9 svg-special-background-fill-e9f0f1"/>
  <text x="487" y="201"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-383f42">互斥多分类</text>
  <text x="487" y="220"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-53636a">K 个 logits → softmax → CE</text>
  <text x="487" y="235"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-6b777a">概率和必须为 1</text>
  <rect x="472" y="254" width="286" height="62" rx="8"   class="svg-special-fill-fill-f1ebe0 svg-special-graphic-stroke-ddd0b9 svg-special-background-fill-f1ebe0"/>
  <text x="487" y="274"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" class="svg-special-text-fill-49433b">多标签</text>
  <text x="487" y="293"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="11" class="svg-special-text-fill-675f54">K 个 logits → K 个 sigmoid</text>
  <text x="487" y="308"  font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="10" class="svg-special-text-fill-706a61">逐标签 BCE，概率可共存</text>
</svg>
