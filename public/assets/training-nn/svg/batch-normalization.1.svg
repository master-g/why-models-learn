<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">批量归一化的统计管线</title>
  <desc id="desc">左侧展示一批激活如何经过均值方差、标准化和 gamma beta 仿射恢复；右侧比较训练态使用批次统计与评估态使用运行统计。</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ee; stroke: #d8d0c8; stroke-width: 1.5; }
      .panel { fill: #fbf8f4; stroke: #d8d0c8; stroke-width: 1.2; }
      .ink { fill: #312f2f; font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
      .muted { fill: #6c6a64; font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
      .mono { fill: #312f2f; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow { fill: #f1e0d8; stroke: #cc785c; stroke-width: 1.2; }
      .safe { fill: #e1ece8; stroke: #6b8f8b; stroke-width: 1.2; }
      .eval { fill: #eee8df; stroke: #b9a58d; stroke-width: 1.2; }
      .arrow { stroke: #a9583e; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d8d0c8; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a9583e"/>
    </marker>
  </defs>

  <rect x="24" y="20" width="752" height="329" rx="18" class="paper"/>
  <text x="48" y="53" class="ink" font-size="20" font-weight="600">批量归一化：统计轴决定训练语义</text>
  <text x="48" y="75" class="muted" font-size="12">训练态看当前 batch，评估态看运行统计；两者都经过同一个可学习仿射恢复</text>

  <rect x="48" y="96" width="326" height="166" rx="12" class="panel"/>
  <text x="68" y="121" class="ink" font-size="14" font-weight="600">一批激活的一次前向</text>
  <rect x="68" y="143" width="58" height="36" rx="8" class="flow"/>
  <text x="97" y="166" text-anchor="middle" class="mono" font-size="14">x</text>
  <path d="M126 161H143" class="arrow"/>
  <rect x="143" y="143" width="92" height="36" rx="8" class="flow"/>
  <text x="189" y="159" text-anchor="middle" class="mono" font-size="11">μᵦ, σᵦ²</text>
  <text x="189" y="172" text-anchor="middle" class="muted" font-size="9">batch stats</text>
  <path d="M235 161H252" class="arrow"/>
  <rect x="252" y="143" width="72" height="36" rx="8" class="safe"/>
  <text x="288" y="166" text-anchor="middle" class="mono" font-size="12">x̂</text>
  <path d="M288 179V197H166" class="arrow"/>
  <rect x="112" y="197" width="86" height="36" rx="8" class="flow"/>
  <text x="155" y="220" text-anchor="middle" class="mono" font-size="12">γ, β</text>
  <path d="M198 215H222" class="arrow"/>
  <rect x="222" y="197" width="72" height="36" rx="8" class="safe"/>
  <text x="258" y="220" text-anchor="middle" class="mono" font-size="13">y</text>
  <text x="68" y="253" class="muted" font-size="10">先按统计轴归约，再按通道或特征共享参数</text>

  <rect x="398" y="96" width="332" height="166" rx="12" class="panel"/>
  <text x="418" y="121" class="ink" font-size="14" font-weight="600">同一层的两种模式</text>
  <line x1="564" y1="135" x2="564" y2="248" class="divider"/>
  <text x="482" y="139" text-anchor="middle" class="muted" font-size="10">训练态</text>
  <text x="646" y="139" text-anchor="middle" class="muted" font-size="10">评估态</text>
  <rect x="418" y="145" width="126" height="49" rx="8" class="flow"/>
  <text x="481" y="165" text-anchor="middle" class="mono" font-size="11">μᵦ, σᵦ²</text>
  <text x="481" y="181" text-anchor="middle" class="muted" font-size="10">当前 batch</text>
  <rect x="584" y="145" width="126" height="49" rx="8" class="eval"/>
  <text x="647" y="165" text-anchor="middle" class="mono" font-size="11">μrun, σrun²</text>
  <text x="647" y="181" text-anchor="middle" class="muted" font-size="10">运行 buffer</text>
  <path d="M481 194V211H536" class="arrow"/>
  <path d="M647 194V211H592" class="arrow"/>
  <rect x="504" y="211" width="120" height="36" rx="8" class="safe"/>
  <text x="564" y="234" text-anchor="middle" class="mono" font-size="12">γ x̂ + β</text>
  <text x="418" y="253" class="muted" font-size="10">模式错位会让 train/eval 输出产生系统差异</text>

  <rect x="48" y="286" width="682" height="45" rx="10" fill="#eee5de"/>
  <text x="68" y="313" class="mono" font-size="13">x̂ = (x − μ) / √(σ² + ε)</text>
  <text x="355" y="313" class="ink" font-size="12">归一化改变统计尺度，γ、β 保留表达能力</text>
</svg>
