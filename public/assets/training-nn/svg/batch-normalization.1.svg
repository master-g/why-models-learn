    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-a9583e { fill: #a9583e; }
    .svg-special-fill-fill-e1ece8 { fill: #8c9290; }
    .svg-special-fill-fill-eee5de { fill: #95908b; }
    .svg-special-fill-fill-eee8df { fill: #94908b; }
    .svg-special-fill-fill-f1e0d8 { fill: #998e89; }
    .svg-special-fill-fill-f7f3ee { fill: #93908e; }
    .svg-special-fill-fill-fbf8f4 { fill: #92908e; }
    .svg-special-graphic-stroke-6b8f8b { stroke: #6b8f8b; }
    .svg-special-graphic-stroke-b9a58d { stroke: #9f8e7a; }
