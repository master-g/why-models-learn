  <title id="title">回归损失的残差地形与分位数斜率</title>
  <desc id="desc">左图比较半平方、绝对值、Huber 和 log-cosh 损失，右图展示零点九、零点五和零点一分位数损失对残差两侧的不同斜率。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f8f7f4 svg-special-background-fill-f8f7f4"/>
  <text x="40" y="32"  font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" class="svg-special-text-fill-312f2f">回归损失把残差翻译成统计假设</text>
  <text x="40" y="56"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-6d6862">同一组预测，可以选择均值、中位数、稳健点或指定分位数</text>

