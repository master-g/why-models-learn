  <path d="M526 195 L632 250 L738 195" fill="none"  stroke-width="3" stroke-linejoin="round" class="svg-special-graphic-stroke-8b7a4f"/>
  <path d="M526 151 L632 250 L738 239" fill="none"  stroke-width="3" stroke-linejoin="round" class="svg-special-graphic-stroke-5f7896"/>
  <line x1="542" y1="286" x2="562" y2="286"  stroke-width="3" class="svg-coral-stroke-stroke"/>
  <text x="568" y="290"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">τ=0.1</text>
  <line x1="618" y1="286" x2="638" y2="286"  stroke-width="3" class="svg-special-graphic-stroke-8b7a4f"/>
  <text x="644" y="290"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">τ=0.5</text>
  <line x1="694" y1="286" x2="714" y2="286"  stroke-width="3" class="svg-special-graphic-stroke-5f7896"/>
  <text x="720" y="290"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">τ=0.9</text>

  <text x="40" y="331"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6d6862">稳健损失让远处梯度饱和；分位数损失把“哪一侧更贵”写进斜率。</text>
  <text x="40" y="351"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-a45e48">残差符号、目标变换和归约分母，都是损失定义的一部分。</text>
</svg>
