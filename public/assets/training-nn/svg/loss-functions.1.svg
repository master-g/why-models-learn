  <line x1="526" y1="250" x2="738" y2="250"  stroke-width="1.5" class="svg-special-graphic-stroke-8f8a82"/>
  <line x1="526" y1="112" x2="526" y2="250"  stroke-width="1.5" class="svg-special-graphic-stroke-8f8a82"/>
