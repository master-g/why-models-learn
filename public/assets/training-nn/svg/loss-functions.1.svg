  <text x="516" y="187" text-anchor="end"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">0.5</text>
  <text x="516" y="153" text-anchor="end"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">1</text>
  <path d="M526 150 C548 164, 568 181, 590 196 C612 211, 634 224, 653 232 C675 241, 700 246, 738 248" fill="none"  stroke-width="3" class="svg-special-graphic-stroke-5f7896"/>
  <path d="M526 116 L611 183 L611 250 L738 250" fill="none"  stroke-width="3" stroke-linejoin="round" class="svg-coral-stroke-stroke"/>
  <line x1="542" y1="286" x2="562" y2="286"  stroke-width="3" class="svg-special-graphic-stroke-5f7896"/>
  <text x="568" y="290"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">logistic</text>
  <line x1="644" y1="286" x2="664" y2="286"  stroke-width="3" class="svg-coral-stroke-stroke"/>
  <text x="670" y="290"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">hinge</text>

  <text x="40" y="331"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-6d6862">平方损失放大远处错误；Huber 截平斜率；logistic 在间隔超过一后仍奖励更高置信度。</text>
  <text x="40" y="351"  font-family="system-ui, -apple-system, sans-serif" font-size="12" class="svg-special-text-fill-a45e48">训练目标的选择，实际上是在选择模型会把哪些错误当得更严重。</text>
</svg>
