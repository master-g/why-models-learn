<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">不同损失函数的优化地形</title>
  <desc id="desc">左图比较残差上的 MAE、半平方损失和 Huber 损失，右图比较分类间隔上的 logistic 与 hinge 损失。</desc>
  <rect width="800" height="373" fill="#f8f7f4"/>
  <text x="40" y="32" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">损失函数改变参数空间中的地形</text>
  <text x="40" y="56" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="13">同样的错误，可能带来不同的斜率、曲率和置信度奖励</text>

  <rect x="40" y="78" width="430" height="218" rx="12" fill="#fff" stroke="#d8d3ca"/>
  <text x="62" y="101" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">回归：残差 r = 预测 − 真实</text>
  <line x1="82" y1="250" x2="442" y2="250" stroke="#8f8a82" stroke-width="1.5"/>
  <line x1="82" y1="112" x2="82" y2="250" stroke="#8f8a82" stroke-width="1.5"/>
  <line x1="82" y1="217" x2="442" y2="217" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="82" y1="183" x2="442" y2="183" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="82" y1="150" x2="442" y2="150" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="82" y1="117" x2="442" y2="117" stroke="#e4e0d8" stroke-width="1"/>
  <text x="82" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">−3</text>
  <text x="262" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">0</text>
  <text x="442" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">3</text>
  <text x="68" y="254" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">0</text>
  <text x="68" y="220" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">1</text>
  <text x="68" y="186" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">2</text>
  <text x="68" y="153" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">3</text>
  <text x="68" y="120" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">4</text>
  <path d="M82 150 L142 183 L202 217 L262 250 L322 217 L382 183 L442 150" fill="none" stroke="#cc785c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M82 100 L142 183 L202 233 L262 250 L322 233 L382 183 L442 100" fill="none" stroke="#5f7896" stroke-width="3" stroke-linejoin="round"/>
  <path d="M82 167 L142 200 L202 233 L262 250 L322 233 L382 200 L442 167" fill="none" stroke="#8b7a4f" stroke-width="3" stroke-linejoin="round"/>
  <line x1="92" y1="286" x2="112" y2="286" stroke="#cc785c" stroke-width="3"/>
  <text x="118" y="290" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">MAE</text>
  <line x1="170" y1="286" x2="190" y2="286" stroke="#5f7896" stroke-width="3"/>
  <text x="196" y="290" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">半平方</text>
  <line x1="260" y1="286" x2="280" y2="286" stroke="#8b7a4f" stroke-width="3"/>
  <text x="286" y="290" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">Huber，δ=1</text>

  <rect x="490" y="78" width="270" height="218" rx="12" fill="#fff" stroke="#d8d3ca"/>
  <text x="512" y="101" fill="#312f2f" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">分类：间隔 m = ys</text>
  <line x1="526" y1="250" x2="738" y2="250" stroke="#8f8a82" stroke-width="1.5"/>
  <line x1="526" y1="112" x2="526" y2="250" stroke="#8f8a82" stroke-width="1.5"/>
  <line x1="526" y1="183" x2="738" y2="183" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="526" y1="150" x2="738" y2="150" stroke="#e4e0d8" stroke-width="1"/>
  <text x="526" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">0</text>
  <text x="611" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">1</text>
  <text x="696" y="268" text-anchor="middle" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">2</text>
  <text x="516" y="254" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">0</text>
  <text x="516" y="187" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">0.5</text>
  <text x="516" y="153" text-anchor="end" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">1</text>
  <path d="M526 150 C548 164, 568 181, 590 196 C612 211, 634 224, 653 232 C675 241, 700 246, 738 248" fill="none" stroke="#5f7896" stroke-width="3"/>
  <path d="M526 116 L611 183 L611 250 L738 250" fill="none" stroke="#cc785c" stroke-width="3" stroke-linejoin="round"/>
  <line x1="542" y1="286" x2="562" y2="286" stroke="#5f7896" stroke-width="3"/>
  <text x="568" y="290" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">logistic</text>
  <line x1="644" y1="286" x2="664" y2="286" stroke="#cc785c" stroke-width="3"/>
  <text x="670" y="290" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="11">hinge</text>

  <text x="40" y="331" fill="#6d6862" font-family="system-ui, -apple-system, sans-serif" font-size="12">平方损失放大远处错误；Huber 截平斜率；logistic 在间隔超过一后仍奖励更高置信度。</text>
  <text x="40" y="351" fill="#a45e48" font-family="system-ui, -apple-system, sans-serif" font-size="12">训练目标的选择，实际上是在选择模型会把哪些错误当得更严重。</text>
</svg>
