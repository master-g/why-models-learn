  <line x1="82" y1="117" x2="442" y2="117"  stroke-width="1" class="svg-special-graphic-stroke-e4e0d8"/>
  <text x="82" y="268" text-anchor="middle"  font-family="system-ui, -apple-system, sans-serif" font-size="11" class="svg-special-text-fill-6d6862">−3</text>
