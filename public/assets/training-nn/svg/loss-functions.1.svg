  <title id="title">不同损失函数的优化地形</title>
  <desc id="desc">左图比较残差上的 MAE、半平方损失和 Huber 损失，右图比较分类间隔上的 logistic 与 hinge 损失。</desc>
  <rect width="800" height="373"  class="svg-special-fill-fill-f8f7f4 svg-special-background-fill-f8f7f4"/>
  <text x="40" y="32"  font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" class="svg-special-text-fill-312f2f">损失函数改变参数空间中的地形</text>
  <text x="40" y="56"  font-family="system-ui, -apple-system, sans-serif" font-size="13" class="svg-special-text-fill-6d6862">同样的错误，可能带来不同的斜率、曲率和置信度奖励</text>

  <rect x="40" y="78" width="430" height="218" rx="12"   class="svg-special-fill-fill-ffffff svg-special-graphic-stroke-d8d3ca svg-special-background-fill-ffffff"/>
  <text x="62" y="101"  font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" class="svg-special-text-fill-312f2f">回归：残差 r = 预测 − 真实</text>
