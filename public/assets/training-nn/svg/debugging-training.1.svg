  <title id="title">训练调试的分层证据路径</title>
  <desc id="desc">从数据合同经过前向和损失、反向梯度、参数更新到评估，每个边界都有形状、范围、有限性和状态检查。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-8f897f"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;  }
      .muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;  }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .strong { font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="373" rx="18"  class="svg-special-fill-fill-f7f3ec svg-special-background-fill-f7f3ec"/>
  <rect x="22" y="18" width="756" height="45" rx="12"  class="svg-special-fill-fill-efe7d8 svg-special-background-fill-efe7d8"/>
  <text x="44" y="47" class="label strong svg-special-text-fill-312f2f" font-size="22">训练调试</text>
  <text x="190" y="46" class="muted body svg-special-text-fill-716b63">找到第一个不符合预期的边界</text>

  <text x="38" y="87" class="muted small svg-special-text-fill-716b63">执行路径</text>
  <rect x="38" y="99" width="135" height="57" rx="11"   stroke-width="1.5" class="svg-special-fill-fill-f1d2c4 svg-coral-stroke-stroke svg-special-background-fill-f1d2c4"/>
  <text x="105.5" y="123" text-anchor="middle" class="label body strong svg-special-text-fill-312f2f">数据合同</text>
  <text x="105.5" y="145" text-anchor="middle" class="muted small svg-special-text-fill-716b63">shape / label / split</text>

  <path d="M 173 127.5 H 206"  stroke-width="2" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8f897f"/>
  <rect x="208" y="99" width="135" height="57" rx="11"   stroke-width="1.5" class="svg-special-fill-fill-f1d2c4 svg-coral-stroke-stroke svg-special-background-fill-f1d2c4"/>
  <text x="275.5" y="123" text-anchor="middle" class="label body strong svg-special-text-fill-312f2f">前向 / 损失</text>
  <text x="275.5" y="145" text-anchor="middle" class="muted small svg-special-text-fill-716b63">range / finite / reduce</text>

  <path d="M 343 127.5 H 376"  stroke-width="2" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8f897f"/>
  <rect x="378" y="99" width="135" height="57" rx="11"   stroke-width="1.5" class="svg-special-fill-fill-efe7d8 svg-axis-stroke svg-special-background-fill-efe7d8"/>
  <text x="445.5" y="123" text-anchor="middle" class="label body strong svg-special-text-fill-312f2f">反向梯度</text>
  <text x="445.5" y="145" text-anchor="middle" class="muted small svg-special-text-fill-716b63">norm / finite / sign</text>

  <path d="M 513 127.5 H 546"  stroke-width="2" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8f897f"/>
  <rect x="548" y="99" width="105" height="57" rx="11"   stroke-width="1.5" class="svg-special-fill-fill-d9e6df svg-special-graphic-stroke-6f9b88 svg-special-background-fill-d9e6df"/>
  <text x="600.5" y="123" text-anchor="middle" class="label body strong svg-special-text-fill-312f2f">更新</text>
  <text x="600.5" y="145" text-anchor="middle" class="muted small svg-special-text-fill-716b63">ratio / step</text>

  <path d="M 653 127.5 H 686"  stroke-width="2" fill="none" marker-end="url(#arrow)" class="svg-special-graphic-stroke-8f897f"/>
  <rect x="688" y="99" width="74" height="57" rx="11"   stroke-width="1.5" class="svg-special-fill-fill-d9e6df svg-special-graphic-stroke-6f9b88 svg-special-background-fill-d9e6df"/>
  <text x="725" y="123" text-anchor="middle" class="label body strong svg-special-text-fill-312f2f">评估</text>
  <text x="725" y="145" text-anchor="middle" class="muted small svg-special-text-fill-716b63">mode / metric</text>

  <text x="38" y="188" class="muted small svg-special-text-fill-716b63">每个边界都记录</text>
  <rect x="38" y="201" width="215" height="61" rx="11"   class="svg-special-fill-fill-fffaf2 svg-special-graphic-stroke-d8cdbd svg-special-background-fill-fffaf2"/>
  <text x="58" y="226" class="label body strong svg-special-text-fill-312f2f">数据证据</text>
  <text x="58" y="248" class="muted small svg-special-text-fill-716b63">shape · dtype · 范围 · 对齐 · split</text>

  <rect x="270" y="201" width="215" height="61" rx="11"   class="svg-special-fill-fill-fffaf2 svg-special-graphic-stroke-d8cdbd svg-special-background-fill-fffaf2"/>
  <text x="290" y="226" class="label body strong svg-special-text-fill-312f2f">数值证据</text>
  <text x="290" y="248" class="muted small svg-special-text-fill-716b63">finite · 分位数 · gradient norm</text>

  <rect x="502" y="201" width="260" height="61" rx="11"   class="svg-special-fill-fill-fffaf2 svg-special-graphic-stroke-d8cdbd svg-special-background-fill-fffaf2"/>
  <text x="522" y="226" class="label body strong svg-special-text-fill-312f2f">协议证据</text>
  <text x="522" y="248" class="muted small svg-special-text-fill-716b63">seed · optimizer · scaler · checkpoint</text>

  <path d="M 105.5 156 C 105.5 176 145 178 145 201"  stroke-width="1.5" fill="none" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M 445.5 156 C 445.5 176 378 178 378 201"  stroke-width="1.5" fill="none" marker-end="url(#arrow)" class="svg-axis-stroke"/>
  <path d="M 725 156 C 725 176 650 178 650 201"  stroke-width="1.5" fill="none" marker-end="url(#arrow)" class="svg-axis-stroke"/>

  <rect x="38" y="290" width="724" height="58" rx="12"   stroke-width="1.5" class="svg-special-fill-fill-f4ddd2 svg-coral-stroke-stroke svg-special-background-fill-f4ddd2"/>
  <circle cx="72" cy="319" r="17"  class="svg-special-fill-fill-cc785c"/>
  <text x="72" y="324" text-anchor="middle"  font-size="16" font-weight="700" class="svg-special-text-fill-fffaf2">!</text>
  <text x="105" y="315" class="label body strong svg-special-text-fill-312f2f">停止在第一个分叉</text>
  <text x="105" y="337" class="muted small svg-special-text-fill-716b63">先修数据 / 公式 / 梯度 / 更新，再增加模型和训练复杂度</text>
</svg>
