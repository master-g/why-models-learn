<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">梯度裁剪的训练管线与向量几何</title>
  <desc id="desc">左侧展示反向传播、反缩放、全局归约、梯度裁剪和优化器的顺序；右侧比较原始梯度、全局范数裁剪和逐元素裁剪。</desc>
  <defs>
    <style>
      .paper { fill: #f7f3ee; stroke: #d8d0c8; stroke-width: 1.5; }
      .panel { fill: #fbf8f4; stroke: #d8d0c8; stroke-width: 1.2; }
      .ink { fill: #312f2f; font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
      .muted { fill: #6c6a64; font-family: system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
      .mono { fill: #312f2f; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .axis { stroke: #9e9890; stroke-width: 1.2; fill: none; }
      .guide { stroke: #c9c4bb; stroke-width: 1; stroke-dasharray: 4 5; fill: none; }
      .flow { fill: #f1e0d8; stroke: #cc785c; stroke-width: 1.2; }
      .safe { fill: #e1ece8; stroke: #6b8f8b; stroke-width: 1.2; }
      .raw { stroke: #c48a3a; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .norm { stroke: #a9583e; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      .value { stroke: #6b8f8b; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .arrow { stroke: #a9583e; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a9583e"/>
    </marker>
  </defs>

  <rect x="24" y="20" width="752" height="329" rx="18" class="paper"/>
  <text x="48" y="53" class="ink" font-size="20" font-weight="600">梯度裁剪：限制异常更新，不抹掉方向</text>
  <text x="48" y="75" class="muted" font-size="12">先把梯度恢复到真实尺度并完成全局归约，再用一个系数限制整体范数</text>

  <rect x="48" y="96" width="292" height="166" rx="12" class="panel"/>
  <text x="68" y="121" class="ink" font-size="14" font-weight="600">训练循环中的位置</text>
  <rect x="68" y="139" width="106" height="36" rx="8" class="flow"/>
  <text x="121" y="162" text-anchor="middle" class="mono" font-size="12">backward</text>
  <path d="M174 157H199" class="arrow"/>
  <rect x="199" y="139" width="106" height="36" rx="8" class="flow"/>
  <text x="252" y="162" text-anchor="middle" class="mono" font-size="12">unscale</text>
  <path d="M252 175V192H121V201" class="arrow"/>
  <rect x="68" y="201" width="106" height="36" rx="8" class="flow"/>
  <text x="121" y="224" text-anchor="middle" class="mono" font-size="12">all-reduce</text>
  <path d="M174 219H199" class="arrow"/>
  <rect x="199" y="201" width="106" height="36" rx="8" class="safe"/>
  <text x="252" y="224" text-anchor="middle" class="mono" font-size="12">clip → step</text>
  <text x="68" y="253" class="muted" font-size="10">反缩放与归约顺序错了，阈值就失去可比性</text>

  <rect x="366" y="96" width="364" height="166" rx="12" class="panel"/>
  <text x="386" y="121" class="ink" font-size="14" font-weight="600">二维梯度的几何</text>
  <path d="M410 225V132M410 225H574" class="axis"/>
  <circle cx="480" cy="225" r="36" class="guide"/>
  <text x="480" y="182" text-anchor="middle" class="muted" font-size="10">G = τ</text>
  <text x="570" y="239" text-anchor="end" class="muted" font-size="10">g₁</text>
  <text x="396" y="139" class="muted" font-size="10">g₂</text>
  <path d="M480 225L534 153" class="raw"/>
  <circle cx="534" cy="153" r="4" fill="#c48a3a"/>
  <path d="M480 225L502 196" class="norm"/>
  <circle cx="502" cy="196" r="4" fill="#a9583e"/>
  <path d="M480 225L516 189" class="value"/>
  <circle cx="516" cy="189" r="4" fill="#6b8f8b"/>

  <line x1="608" y1="145" x2="626" y2="145" class="raw"/>
  <text x="634" y="149" class="muted" font-size="10">原始 (3, 4)</text>
  <line x1="608" y1="172" x2="626" y2="172" class="norm"/>
  <text x="634" y="176" class="muted" font-size="10">范数 (1.2, 1.6)</text>
  <line x1="608" y1="199" x2="626" y2="199" class="value"/>
  <text x="634" y="203" class="muted" font-size="10">逐元素 (2, 2)</text>
  <text x="608" y="231" class="muted" font-size="10">同一方向：仅范数裁剪</text>

  <rect x="48" y="286" width="682" height="45" rx="10" fill="#eee5de"/>
  <text x="68" y="313" class="mono" font-size="13">g′ = min(1, τ / G) g</text>
  <text x="300" y="313" class="ink" font-size="12">先归约，再裁剪；裁剪后再写入优化器状态</text>
</svg>
