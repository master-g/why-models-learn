<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
  .svg-special-fill-fill-f3f0eb { fill: #92908d; }
  .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
  .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
  .svg-special-graphic-stroke-809783 { stroke: #809683; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6c6863 { fill: #6c6863; }

  .svg-special-background-fill-e6eee8 { fill: #e6eee8; }
  .svg-special-background-fill-f3f0eb { fill: #f3f0eb; }
  .svg-special-background-fill-f6e4dc { fill: #f6e4dc; }
  .svg-special-background-fill-fbf9f6 { fill: #fbf9f6; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
    .svg-special-fill-fill-f3f0eb { fill: #92908d; }
    .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
    .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
    .svg-special-graphic-stroke-809783 { stroke: #809683; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6c6863 { fill: #a6a4a0; }
    .svg-special-background-fill-e6eee8 { fill: #323333; }
    .svg-special-background-fill-f3f0eb { fill: #343433; }
    .svg-special-background-fill-f6e4dc { fill: #353231; }
    .svg-special-background-fill-fbf9f6 { fill: #353535; }



  }
</style>
  <title id="title">强化学习中的状态、动作、奖励和价值更新</title>
  <desc id="desc">智能体观察状态后由策略选择动作，环境返回奖励并转移到下一状态，轨迹被价值估计和策略更新使用。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {}
      .muted {}
      .box {stroke-width: 2; }
      .warm {stroke-width: 2; }
      .cool {stroke-width: 2; }
      .label { font: 600 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-ink); }
      .coral-line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-coral); }
      .dash { fill: none;  stroke-width: 1.7; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-fbf9f6 svg-special-background-fill-fbf9f6"/>
  <text x="38" y="38" class="ink label svg-special-text-fill-312f2f">强化学习：一条轨迹连接动作与长期回报</text>
  <text x="38" y="62" class="muted small svg-special-text-fill-6c6863">策略选择动作，环境返回结果，价值估计把后续奖励传回当前状态</text>

  <rect x="38" y="105" width="145" height="82" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="110" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">状态 Sₜ</text>
  <text x="110" y="157" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">观测和历史摘要</text>
  <text x="110" y="175" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">s ∈ 𝒮</text>

  <rect x="221" y="105" width="145" height="82" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="294" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">策略 π</text>
  <text x="294" y="157" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">选择动作 Aₜ</text>
  <text x="294" y="175" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">π(a | s)</text>

  <rect x="404" y="105" width="145" height="82" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="477" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">环境</text>
  <text x="477" y="157" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">转移和奖励</text>
  <text x="477" y="175" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">P(s′,r | s,a)</text>

  <rect x="587" y="105" width="175" height="82" rx="12" class="cool svg-special-fill-fill-e6eee8 svg-special-graphic-stroke-809783 svg-special-background-fill-e6eee8"/>
  <text x="674" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">下一状态</text>
  <text x="674" y="157" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">Sₜ₊₁、Rₜ₊₁</text>
  <text x="674" y="175" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">轨迹继续</text>

  <path d="M183 146 H221" class="line svg-ink-stroke"/>
  <path d="M366 146 H404" class="line svg-ink-stroke"/>
  <path d="M549 146 H587" class="line svg-ink-stroke"/>
  <path d="M674 187 C674 236 110 236 110 187" class="coral-line svg-coral-stroke-stroke"/>
  <text x="387" y="227" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">Sₜ₊₁ 进入下一次决策</text>

  <rect x="153" y="278" width="180" height="57" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="243" y="303" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">回报 Gₜ</text>
  <text x="243" y="322" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">Rₜ₊₁ + γGₜ₊₁</text>

  <rect x="420" y="278" width="180" height="57" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="510" y="303" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">价值更新</text>
  <text x="510" y="322" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">δₜ = r + γV(s′) − V(s)</text>

  <path d="M477 187 V250 H333 V278" class="line svg-ink-stroke"/>
  <path d="M333 306 H420" class="coral-line svg-coral-stroke-stroke"/>
  <path d="M510 278 V250 H294 V187" class="coral-line svg-coral-stroke-stroke"/>

  <path d="M38 356 H762" class="dash svg-axis-stroke"/>
  <text x="38" y="368" class="muted tiny svg-special-text-fill-6c6863">审计重点：奖励合同、终止语义、探索分布、价值估计和部署约束必须同时记录</text>
</svg>
