  <title id="title">奖励投机：代理分数与真实结果分离</title>
  <desc id="desc">同一候选输出同时进入真实效用和代理奖励两个账本，优化器沿代理奖励上升方向改变策略，独立评测检查真实效用与约束是否同步变化。</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-718878"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8c8880"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { font-size: 12px; }
      .label { font-size: 14px; font-weight: 600; }
      .title { font-size: 16px; font-weight: 600; }
      .panel {stroke-width: 1; }
      .coral {stroke-width: 1.7; }
      .green {stroke-width: 1.7; }
      .plain {stroke-width: 1.4; }
      .line-coral { fill: none;  stroke-width: 2; marker-end: url(#arrow-coral); }
      .line-green { fill: none;  stroke-width: 2; marker-end: url(#arrow-green); }
      .line-muted { fill: none;  stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="800" height="373" rx="14"  class="svg-special-fill-fill-f4f1ec svg-special-background-fill-f4f1ec"/>
  <text x="28" y="34" class="ink title svg-special-text-fill-312f2f">奖励投机：代理分数 ↑，真实结果未同步</text>
  <text x="28" y="56" class="muted small svg-special-text-fill-706b65">训练优化器读取 R；独立评测读取 U 和约束 C；两条账本必须分别保存</text>

  <rect x="24" y="84" width="170" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="109" y="111" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">候选输出</text>
  <rect x="45" y="128" width="128" height="43" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="109" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">prompt x → y</text>
  <text x="109" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">同一任务上下文</text>
  <rect x="45" y="190" width="59" height="43" rx="8" class="green svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="74" y="207" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">内容</text>
  <text x="74" y="223" text-anchor="middle" class="muted small svg-special-text-fill-706b65">事实 / 结果</text>
  <rect x="114" y="190" width="59" height="43" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="143" y="207" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">样式</text>
  <text x="143" y="223" text-anchor="middle" class="muted small svg-special-text-fill-706b65">长度 / 格式</text>
  <text x="45" y="264" class="muted small svg-special-text-fill-706b65">工具状态、权限、资源</text>
  <text x="45" y="282" class="muted small svg-special-text-fill-706b65">候选来源、评测版本</text>
  <text x="45" y="300" class="muted small svg-special-text-fill-706b65">保留完整轨迹</text>

  <line x1="194" y1="151" x2="218" y2="151" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <line x1="194" y1="211" x2="218" y2="211" class="line-muted svg-special-graphic-stroke-8c8880"/>

  <rect x="228" y="84" width="250" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="250" y="111" class="ink label svg-special-text-fill-312f2f">两个评分通道</text>
  <rect x="250" y="128" width="97" height="46" rx="8" class="green svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="299" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">真实效用 U</text>
  <text x="299" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">独立结果</text>
  <rect x="359" y="128" width="97" height="46" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="407" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">代理奖励 R<tspan baseline-shift="sub">φ</tspan></text>
  <text x="407" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">可优化分数</text>
  <rect x="250" y="198" width="97" height="42" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="299" y="215" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">约束 C<tspan baseline-shift="sub">j</tspan></text>
  <text x="299" y="231" text-anchor="middle" class="muted small svg-special-text-fill-706b65">安全 / 权限</text>
  <line x1="347" y1="151" x2="359" y2="151" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <line x1="299" y1="174" x2="299" y2="190" class="line-green svg-special-graphic-stroke-718878"/>
  <line x1="407" y1="174" x2="407" y2="190" class="line-coral svg-coral-stroke-stroke"/>
  <text x="250" y="268" class="muted small svg-special-text-fill-706b65">R = U + shortcut + error</text>
  <text x="250" y="286" class="muted small svg-special-text-fill-706b65">同一候选，分开记账</text>
  <text x="250" y="304" class="muted small svg-special-text-fill-706b65">不要用 R 代替 U 或 C</text>

  <line x1="478" y1="151" x2="503" y2="151" class="line-coral svg-coral-stroke-stroke"/>

  <rect x="513" y="84" width="263" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="535" y="111" class="ink label svg-special-text-fill-312f2f">优化与独立评测</text>
  <rect x="535" y="128" width="99" height="46" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="585" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">optimizer</text>
  <text x="585" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">提高 R</text>
  <line x1="634" y1="151" x2="652" y2="151" class="line-coral svg-coral-stroke-stroke"/>
  <rect x="660" y="128" width="96" height="46" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="708" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">代理分数 ↑</text>
  <text x="708" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">shortcut 变强</text>
  <rect x="535" y="198" width="99" height="42" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="585" y="215" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">独立评测</text>
  <text x="585" y="231" text-anchor="middle" class="muted small svg-special-text-fill-706b65">U / C / 覆盖</text>
  <line x1="634" y1="219" x2="652" y2="219" class="line-green svg-special-graphic-stroke-718878"/>
  <rect x="660" y="198" width="96" height="42" rx="8" class="green svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="708" y="215" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">结果对照</text>
  <text x="708" y="231" text-anchor="middle" class="muted small svg-special-text-fill-706b65">U ↓ 或 C ↑</text>
  <path d="M585 187 C585 178 407 178 407 184" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <text x="521" y="183" text-anchor="middle" class="muted small svg-special-text-fill-706b65">checkpoint</text>
  <text x="535" y="270" class="muted small svg-special-text-fill-706b65">干预：长度、格式、语气、关键词</text>
  <text x="535" y="288" class="muted small svg-special-text-fill-706b65">留出：新任务、尾部、对抗样本</text>
  <text x="535" y="306" class="muted small svg-special-text-fill-706b65">发现分离后停止、回滚、修复目标</text>
</svg>
