<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">奖励投机：代理分数与真实结果分离</title>
  <desc id="desc">同一候选输出同时进入真实效用和代理奖励两个账本，优化器沿代理奖励上升方向改变策略，独立评测检查真实效用与约束是否同步变化。</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718878"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c8880"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted { fill: #706b65; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { font-size: 12px; }
      .label { font-size: 14px; font-weight: 600; }
      .title { font-size: 16px; font-weight: 600; }
      .panel { fill: #fbfaf7; stroke: #d5d0c8; stroke-width: 1; }
      .coral { fill: #f4e5df; stroke: #cc785c; stroke-width: 1.7; }
      .green { fill: #e8eee9; stroke: #718878; stroke-width: 1.7; }
      .plain { fill: #f8f6f2; stroke: #8c8880; stroke-width: 1.4; }
      .line-coral { fill: none; stroke: #cc785c; stroke-width: 2; marker-end: url(#arrow-coral); }
      .line-green { fill: none; stroke: #718878; stroke-width: 2; marker-end: url(#arrow-green); }
      .line-muted { fill: none; stroke: #8c8880; stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="800" height="373" rx="14" fill="#f4f1ec"/>
  <text x="28" y="34" class="ink title">奖励投机：代理分数 ↑，真实结果未同步</text>
  <text x="28" y="56" class="muted small">训练优化器读取 R；独立评测读取 U 和约束 C；两条账本必须分别保存</text>

  <rect x="24" y="84" width="170" height="232" rx="12" class="panel"/>
  <text x="109" y="111" text-anchor="middle" class="ink label">候选输出</text>
  <rect x="45" y="128" width="128" height="43" rx="8" class="plain"/>
  <text x="109" y="147" text-anchor="middle" class="ink small">prompt x → y</text>
  <text x="109" y="163" text-anchor="middle" class="muted small">同一任务上下文</text>
  <rect x="45" y="190" width="59" height="43" rx="8" class="green"/>
  <text x="74" y="207" text-anchor="middle" class="ink small">内容</text>
  <text x="74" y="223" text-anchor="middle" class="muted small">事实 / 结果</text>
  <rect x="114" y="190" width="59" height="43" rx="8" class="coral"/>
  <text x="143" y="207" text-anchor="middle" class="ink small">样式</text>
  <text x="143" y="223" text-anchor="middle" class="muted small">长度 / 格式</text>
  <text x="45" y="264" class="muted small">工具状态、权限、资源</text>
  <text x="45" y="282" class="muted small">候选来源、评测版本</text>
  <text x="45" y="300" class="muted small">保留完整轨迹</text>

  <line x1="194" y1="151" x2="218" y2="151" class="line-muted"/>
  <line x1="194" y1="211" x2="218" y2="211" class="line-muted"/>

  <rect x="228" y="84" width="250" height="232" rx="12" class="panel"/>
  <text x="250" y="111" class="ink label">两个评分通道</text>
  <rect x="250" y="128" width="97" height="46" rx="8" class="green"/>
  <text x="299" y="147" text-anchor="middle" class="ink small">真实效用 U</text>
  <text x="299" y="163" text-anchor="middle" class="muted small">独立结果</text>
  <rect x="359" y="128" width="97" height="46" rx="8" class="coral"/>
  <text x="407" y="147" text-anchor="middle" class="ink small">代理奖励 R<tspan baseline-shift="sub">φ</tspan></text>
  <text x="407" y="163" text-anchor="middle" class="muted small">可优化分数</text>
  <rect x="250" y="198" width="97" height="42" rx="8" class="plain"/>
  <text x="299" y="215" text-anchor="middle" class="ink small">约束 C<tspan baseline-shift="sub">j</tspan></text>
  <text x="299" y="231" text-anchor="middle" class="muted small">安全 / 权限</text>
  <line x1="347" y1="151" x2="359" y2="151" class="line-muted"/>
  <line x1="299" y1="174" x2="299" y2="190" class="line-green"/>
  <line x1="407" y1="174" x2="407" y2="190" class="line-coral"/>
  <text x="250" y="268" class="muted small">R = U + shortcut + error</text>
  <text x="250" y="286" class="muted small">同一候选，分开记账</text>
  <text x="250" y="304" class="muted small">不要用 R 代替 U 或 C</text>

  <line x1="478" y1="151" x2="503" y2="151" class="line-coral"/>

  <rect x="513" y="84" width="263" height="232" rx="12" class="panel"/>
  <text x="535" y="111" class="ink label">优化与独立评测</text>
  <rect x="535" y="128" width="99" height="46" rx="8" class="coral"/>
  <text x="585" y="147" text-anchor="middle" class="ink small">optimizer</text>
  <text x="585" y="163" text-anchor="middle" class="muted small">提高 R</text>
  <line x1="634" y1="151" x2="652" y2="151" class="line-coral"/>
  <rect x="660" y="128" width="96" height="46" rx="8" class="coral"/>
  <text x="708" y="147" text-anchor="middle" class="ink small">代理分数 ↑</text>
  <text x="708" y="163" text-anchor="middle" class="muted small">shortcut 变强</text>
  <rect x="535" y="198" width="99" height="42" rx="8" class="plain"/>
  <text x="585" y="215" text-anchor="middle" class="ink small">独立评测</text>
  <text x="585" y="231" text-anchor="middle" class="muted small">U / C / 覆盖</text>
  <line x1="634" y1="219" x2="652" y2="219" class="line-green"/>
  <rect x="660" y="198" width="96" height="42" rx="8" class="green"/>
  <text x="708" y="215" text-anchor="middle" class="ink small">结果对照</text>
  <text x="708" y="231" text-anchor="middle" class="muted small">U ↓ 或 C ↑</text>
  <path d="M585 187 C585 178 407 178 407 184" class="line-muted"/>
  <text x="521" y="183" text-anchor="middle" class="muted small">checkpoint</text>
  <text x="535" y="270" class="muted small">干预：长度、格式、语气、关键词</text>
  <text x="535" y="288" class="muted small">留出：新任务、尾部、对抗样本</text>
  <text x="535" y="306" class="muted small">发现分离后停止、回滚、修复目标</text>
</svg>
