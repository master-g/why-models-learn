<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
  .svg-special-fill-fill-f3f0eb { fill: #92908d; }
  .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
  .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
  .svg-special-graphic-stroke-809783 { stroke: #809683; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6c6863 { fill: #6c6863; }

  .svg-special-background-fill-e6eee8 { fill: #e6eee8; }
  .svg-special-background-fill-f3f0eb { fill: #f3f0eb; }
  .svg-special-background-fill-f6e4dc { fill: #f6e4dc; }
  .svg-special-background-fill-fbf9f6 { fill: #fbf9f6; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
    .svg-special-fill-fill-f3f0eb { fill: #92908d; }
    .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
    .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
    .svg-special-graphic-stroke-809783 { stroke: #809683; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6c6863 { fill: #a6a4a0; }
    .svg-special-background-fill-e6eee8 { fill: #323333; }
    .svg-special-background-fill-f3f0eb { fill: #343433; }
    .svg-special-background-fill-f6e4dc { fill: #353231; }
    .svg-special-background-fill-fbf9f6 { fill: #353535; }



  }
</style>
  <title id="title">奖励模型把偏好反馈转成代理分数</title>
  <desc id="desc">候选回答和偏好标签训练奖励模型，奖励模型给策略优化提供代理分数，独立评测检查分数提升是否对应真实结果。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {}
      .muted {}
      .box {stroke-width: 2; }
      .warm {stroke-width: 2; }
      .cool {stroke-width: 2; }
      .label { font: 600 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-ink); }
      .coral-line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-coral); }
      .dash { fill: none;  stroke-width: 1.7; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-fbf9f6 svg-special-background-fill-fbf9f6"/>
  <text x="38" y="38" class="ink label svg-special-text-fill-312f2f">奖励模型：偏好分数是代理目标</text>
  <text x="38" y="62" class="muted small svg-special-text-fill-6c6863">pairwise label → reward score → policy optimization → independent result</text>

  <rect x="38" y="105" width="150" height="82" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="113" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">候选回答</text>
  <text x="113" y="156" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">y⁺ / y⁻</text>
  <text x="113" y="174" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">同一 prompt x</text>

  <rect x="225" y="105" width="150" height="82" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="300" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">偏好标签</text>
  <text x="300" y="156" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">chosen / rejected</text>
  <text x="300" y="174" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">指南和标注版本</text>

  <rect x="412" y="105" width="150" height="82" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="487" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Reward model</text>
  <text x="487" y="156" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">rφ(x,y)</text>
  <text x="487" y="174" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">分数差 → 概率</text>

  <rect x="599" y="105" width="163" height="82" rx="12" class="cool svg-special-fill-fill-e6eee8 svg-special-graphic-stroke-809783 svg-special-background-fill-e6eee8"/>
  <text x="680" y="132" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">策略优化</text>
  <text x="680" y="156" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">πθ 追逐高分</text>
  <text x="680" y="174" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">可能进入 OOD</text>

  <path d="M188 146 H225" class="line svg-ink-stroke"/>
  <path d="M375 146 H412" class="line svg-ink-stroke"/>
  <path d="M562 146 H599" class="line svg-ink-stroke"/>

  <rect x="223" y="267" width="164" height="64" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="305" y="293" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">独立评测</text>
  <text x="305" y="315" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">事实 · 安全 · 后果</text>

  <rect x="478" y="267" width="164" height="64" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="560" y="293" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">回流反馈</text>
  <text x="560" y="315" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">新候选和新切分</text>

  <path d="M680 187 C680 230 642 230 642 267" class="line svg-ink-stroke"/>
  <path d="M478 299 H387" class="line svg-ink-stroke"/>
  <path d="M478 299 C426 238 356 218 300 187" class="coral-line svg-coral-stroke-stroke"/>
  <path d="M642 299 C690 348 250 351 223 320" class="coral-line svg-coral-stroke-stroke"/>

  <path d="M38 350 H762" class="dash svg-axis-stroke"/>
  <text x="38" y="367" class="muted tiny svg-special-text-fill-6c6863">审计重点：reward 上升时，独立质量、约束违反率、长度和策略 KL 是否同步改善？</text>
</svg>
