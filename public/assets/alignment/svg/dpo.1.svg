<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">DPO：偏好对、策略 log-ratio 与直接更新</title>
  <desc id="desc">chosen 和 rejected 回答同时经过当前策略与冻结参考策略，response mask 聚合 token log probability，两个相对 log-ratio 的差形成 margin，再由 beta 和 sigmoid loss 更新当前策略。</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc785c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718878"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c8880"/>
    </marker>
    <style>
      .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted { fill: #706b65; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { font-size: 12px; }
      .label { font-size: 14px; font-weight: 600; }
      .title { font-size: 16px; font-weight: 600; }
      .panel { fill: #fbfaf7; stroke: #d5d0c8; stroke-width: 1; }
      .coral { fill: #f4e5df; stroke: #cc785c; stroke-width: 1.7; }
      .green { fill: #e8eee9; stroke: #718878; stroke-width: 1.7; }
      .plain { fill: #f8f6f2; stroke: #8c8880; stroke-width: 1.4; }
      .line-coral { fill: none; stroke: #cc785c; stroke-width: 2; marker-end: url(#arrow-coral); }
      .line-green { fill: none; stroke: #718878; stroke-width: 2; marker-end: url(#arrow-green); }
      .line-muted { fill: none; stroke: #8c8880; stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="800" height="373" rx="14" fill="#f4f1ec"/>
  <text x="28" y="34" class="ink title">DPO：偏好对 → log-ratio margin → 直接更新</text>
  <text x="28" y="56" class="muted small">当前策略可训练；reference 固定；response mask 和 reduction 决定序列 log probability 的统计口径</text>

  <rect x="24" y="84" width="166" height="232" rx="12" class="panel"/>
  <text x="107" y="111" text-anchor="middle" class="ink label">偏好对</text>
  <rect x="43" y="128" width="128" height="45" rx="8" class="coral"/>
  <text x="107" y="146" text-anchor="middle" class="ink small">prompt x</text>
  <text x="107" y="162" text-anchor="middle" class="muted small">同一上下文</text>
  <rect x="43" y="190" width="59" height="43" rx="8" class="green"/>
  <text x="72" y="207" text-anchor="middle" class="ink small">chosen</text>
  <text x="72" y="223" text-anchor="middle" class="muted small">y<tspan baseline-shift="sub">w</tspan></text>
  <rect x="112" y="190" width="59" height="43" rx="8" class="plain"/>
  <text x="141" y="207" text-anchor="middle" class="ink small">rejected</text>
  <text x="141" y="223" text-anchor="middle" class="muted small">y<tspan baseline-shift="sub">l</tspan></text>
  <text x="43" y="264" class="muted small">tokenizer / template</text>
  <text x="43" y="282" class="muted small">response mask / label</text>
  <text x="43" y="300" class="muted small">候选来源 / 标注版本</text>

  <line x1="190" y1="150" x2="213" y2="150" class="line-coral"/>
  <line x1="190" y1="211" x2="213" y2="211" class="line-coral"/>

  <rect x="223" y="84" width="254" height="232" rx="12" class="panel"/>
  <text x="245" y="111" class="ink label">两套 log probability</text>
  <rect x="245" y="128" width="91" height="46" rx="8" class="coral"/>
  <text x="290" y="147" text-anchor="middle" class="ink small">π<tspan baseline-shift="sub">θ</tspan></text>
  <text x="290" y="163" text-anchor="middle" class="muted small">当前策略</text>
  <rect x="363" y="128" width="91" height="46" rx="8" class="plain"/>
  <text x="408" y="147" text-anchor="middle" class="ink small">π<tspan baseline-shift="sub">ref</tspan></text>
  <text x="408" y="163" text-anchor="middle" class="muted small">冻结 reference</text>
  <line x1="336" y1="151" x2="354" y2="151" class="line-muted"/>
  <rect x="245" y="194" width="91" height="42" rx="8" class="coral"/>
  <text x="290" y="211" text-anchor="middle" class="ink small">Σ log p</text>
  <text x="290" y="227" text-anchor="middle" class="muted small">chosen / rejected</text>
  <rect x="363" y="194" width="91" height="42" rx="8" class="plain"/>
  <text x="408" y="211" text-anchor="middle" class="ink small">mask + reduce</text>
  <text x="408" y="227" text-anchor="middle" class="muted small">sum / mean</text>
  <line x1="336" y1="215" x2="354" y2="215" class="line-muted"/>
  <path d="M290 180 C290 179 408 179 408 188" class="line-muted"/>
  <text x="349" y="187" text-anchor="middle" class="muted small">同一 token 对齐</text>
  <text x="245" y="270" class="muted small">Δ(y) = log π<tspan baseline-shift="sub">θ</tspan>(y|x)</text>
  <text x="245" y="288" class="muted small">− log π<tspan baseline-shift="sub">ref</tspan>(y|x)</text>
  <text x="245" y="306" class="muted small">m = Δ(y<tspan baseline-shift="sub">w</tspan>) − Δ(y<tspan baseline-shift="sub">l</tspan>)</text>

  <line x1="477" y1="202" x2="500" y2="202" class="line-coral"/>

  <rect x="510" y="84" width="266" height="232" rx="12" class="panel"/>
  <text x="532" y="111" class="ink label">DPO loss 与审计</text>
  <rect x="532" y="128" width="101" height="46" rx="8" class="coral"/>
  <text x="582" y="147" text-anchor="middle" class="ink small">β · m</text>
  <text x="582" y="163" text-anchor="middle" class="muted small">logit</text>
  <line x1="633" y1="151" x2="651" y2="151" class="line-coral"/>
  <rect x="659" y="128" width="96" height="46" rx="8" class="green"/>
  <text x="707" y="147" text-anchor="middle" class="ink small">−log σ(βm)</text>
  <text x="707" y="163" text-anchor="middle" class="muted small">更新 π<tspan baseline-shift="sub">θ</tspan></text>
  <rect x="532" y="194" width="101" height="42" rx="8" class="plain"/>
  <text x="582" y="211" text-anchor="middle" class="ink small">KL / margin</text>
  <text x="582" y="227" text-anchor="middle" class="muted small">分组监测</text>
  <line x1="633" y1="215" x2="651" y2="215" class="line-muted"/>
  <rect x="659" y="194" width="96" height="42" rx="8" class="plain"/>
  <text x="707" y="211" text-anchor="middle" class="ink small">独立评测</text>
  <text x="707" y="227" text-anchor="middle" class="muted small">质量 / 安全 / 覆盖</text>
  <text x="532" y="270" class="muted small">label smoothing、swap test</text>
  <text x="532" y="288" class="muted small">reference-free 需固定基线</text>
  <text x="532" y="306" class="muted small">loss 下降不等于任务结果改善</text>
</svg>
