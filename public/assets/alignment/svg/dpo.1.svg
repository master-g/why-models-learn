  <title id="title">DPO：偏好对、策略 log-ratio 与直接更新</title>
  <desc id="desc">chosen 和 rejected 回答同时经过当前策略与冻结参考策略，response mask 聚合 token log probability，两个相对 log-ratio 的差形成 margin，再由 beta 和 sigmoid loss 更新当前策略。</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-718878"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8c8880"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { font-size: 12px; }
      .label { font-size: 14px; font-weight: 600; }
      .title { font-size: 16px; font-weight: 600; }
      .panel {stroke-width: 1; }
      .coral {stroke-width: 1.7; }
      .green {stroke-width: 1.7; }
      .plain {stroke-width: 1.4; }
      .line-coral { fill: none;  stroke-width: 2; marker-end: url(#arrow-coral); }
      .line-green { fill: none;  stroke-width: 2; marker-end: url(#arrow-green); }
      .line-muted { fill: none;  stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="800" height="373" rx="14"  class="svg-special-fill-fill-f4f1ec svg-special-background-fill-f4f1ec"/>
  <text x="28" y="34" class="ink title svg-special-text-fill-312f2f">DPO：偏好对 → log-ratio margin → 直接更新</text>
  <text x="28" y="56" class="muted small svg-special-text-fill-706b65">当前策略可训练；reference 固定；response mask 和 reduction 决定序列 log probability 的统计口径</text>

  <rect x="24" y="84" width="166" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="107" y="111" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">偏好对</text>
  <rect x="43" y="128" width="128" height="45" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="107" y="146" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">prompt x</text>
  <text x="107" y="162" text-anchor="middle" class="muted small svg-special-text-fill-706b65">同一上下文</text>
  <rect x="43" y="190" width="59" height="43" rx="8" class="green svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="72" y="207" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">chosen</text>
  <text x="72" y="223" text-anchor="middle" class="muted small svg-special-text-fill-706b65">y<tspan baseline-shift="sub">w</tspan></text>
  <rect x="112" y="190" width="59" height="43" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="141" y="207" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">rejected</text>
  <text x="141" y="223" text-anchor="middle" class="muted small svg-special-text-fill-706b65">y<tspan baseline-shift="sub">l</tspan></text>
  <text x="43" y="264" class="muted small svg-special-text-fill-706b65">tokenizer / template</text>
  <text x="43" y="282" class="muted small svg-special-text-fill-706b65">response mask / label</text>
  <text x="43" y="300" class="muted small svg-special-text-fill-706b65">候选来源 / 标注版本</text>

  <line x1="190" y1="150" x2="213" y2="150" class="line-coral svg-coral-stroke-stroke"/>
  <line x1="190" y1="211" x2="213" y2="211" class="line-coral svg-coral-stroke-stroke"/>

  <rect x="223" y="84" width="254" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="245" y="111" class="ink label svg-special-text-fill-312f2f">两套 log probability</text>
  <rect x="245" y="128" width="91" height="46" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="290" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">π<tspan baseline-shift="sub">θ</tspan></text>
  <text x="290" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">当前策略</text>
  <rect x="363" y="128" width="91" height="46" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="408" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">π<tspan baseline-shift="sub">ref</tspan></text>
  <text x="408" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">冻结 reference</text>
  <line x1="336" y1="151" x2="354" y2="151" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <rect x="245" y="194" width="91" height="42" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="290" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">Σ log p</text>
  <text x="290" y="227" text-anchor="middle" class="muted small svg-special-text-fill-706b65">chosen / rejected</text>
  <rect x="363" y="194" width="91" height="42" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="408" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">mask + reduce</text>
  <text x="408" y="227" text-anchor="middle" class="muted small svg-special-text-fill-706b65">sum / mean</text>
  <line x1="336" y1="215" x2="354" y2="215" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <path d="M290 180 C290 179 408 179 408 188" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <text x="349" y="187" text-anchor="middle" class="muted small svg-special-text-fill-706b65">同一 token 对齐</text>
  <text x="245" y="270" class="muted small svg-special-text-fill-706b65">Δ(y) = log π<tspan baseline-shift="sub">θ</tspan>(y|x)</text>
  <text x="245" y="288" class="muted small svg-special-text-fill-706b65">− log π<tspan baseline-shift="sub">ref</tspan>(y|x)</text>
  <text x="245" y="306" class="muted small svg-special-text-fill-706b65">m = Δ(y<tspan baseline-shift="sub">w</tspan>) − Δ(y<tspan baseline-shift="sub">l</tspan>)</text>

  <line x1="477" y1="202" x2="500" y2="202" class="line-coral svg-coral-stroke-stroke"/>

  <rect x="510" y="84" width="266" height="232" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="532" y="111" class="ink label svg-special-text-fill-312f2f">DPO loss 与审计</text>
  <rect x="532" y="128" width="101" height="46" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="582" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">β · m</text>
  <text x="582" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">logit</text>
  <line x1="633" y1="151" x2="651" y2="151" class="line-coral svg-coral-stroke-stroke"/>
  <rect x="659" y="128" width="96" height="46" rx="8" class="green svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="707" y="147" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">−log σ(βm)</text>
  <text x="707" y="163" text-anchor="middle" class="muted small svg-special-text-fill-706b65">更新 π<tspan baseline-shift="sub">θ</tspan></text>
  <rect x="532" y="194" width="101" height="42" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="582" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">KL / margin</text>
  <text x="582" y="227" text-anchor="middle" class="muted small svg-special-text-fill-706b65">分组监测</text>
  <line x1="633" y1="215" x2="651" y2="215" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <rect x="659" y="194" width="96" height="42" rx="8" class="plain svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880 svg-special-background-fill-f8f6f2"/>
  <text x="707" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">独立评测</text>
  <text x="707" y="227" text-anchor="middle" class="muted small svg-special-text-fill-706b65">质量 / 安全 / 覆盖</text>
  <text x="532" y="270" class="muted small svg-special-text-fill-706b65">label smoothing、swap test</text>
  <text x="532" y="288" class="muted small svg-special-text-fill-706b65">reference-free 需固定基线</text>
  <text x="532" y="306" class="muted small svg-special-text-fill-706b65">loss 下降不等于任务结果改善</text>
</svg>
