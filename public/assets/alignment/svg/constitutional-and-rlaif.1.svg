  <rect x="361" y="198" width="98" height="43" rx="8" class="coral svg-special-fill-fill-f4e5df svg-coral-stroke-stroke svg-special-background-fill-f4e5df"/>
  <text x="410" y="215" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">偏好对</text>
  <text x="410" y="231" text-anchor="middle" class="muted small svg-special-text-fill-706b65">y<tspan baseline-shift="sub">w</tspan> / y<tspan baseline-shift="sub">l</tspan></text>
  <path d="M371 184 C371 177 288 177 288 191" class="line-muted svg-special-graphic-stroke-8c8880"/>
  <text x="239" y="270" class="muted small svg-special-text-fill-706b65">保存原文、批评、修订和版本</text>
  <text x="239" y="288" class="muted small svg-special-text-fill-706b65">self-critique 不是外部事实核验</text>
  <text x="239" y="306" class="muted small svg-special-text-fill-706b65">候选分布随 checkpoint 改变</text>

