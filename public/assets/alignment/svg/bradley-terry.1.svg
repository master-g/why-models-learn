<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-special-fill-fill-8c8880 { fill: #8c8880; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e8eee9 { fill: #8e918e; }
  .svg-special-fill-fill-f4e5df { fill: #988f8b; }
  .svg-special-fill-fill-f4f1ec { fill: #92908e; }
  .svg-special-fill-fill-f8f6f2 { fill: #92908e; }
  .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
  .svg-special-graphic-stroke-718878 { stroke: #718878; }
  .svg-special-graphic-stroke-8c8880 { stroke: #8c8880; }
  .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-706b65 { fill: #706b65; }

  .svg-special-background-fill-e8eee9 { fill: #e8eee9; }
  .svg-special-background-fill-f4f1ec { fill: #f4f1ec; }
  .svg-special-background-fill-fbfaf7 { fill: #fbfaf7; }


@media (prefers-color-scheme: dark) {
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-special-fill-fill-8c8880 { fill: #8c8880; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e8eee9 { fill: #8e918e; }
    .svg-special-fill-fill-f4e5df { fill: #988f8b; }
    .svg-special-fill-fill-f4f1ec { fill: #92908e; }
    .svg-special-fill-fill-f8f6f2 { fill: #92908e; }
    .svg-special-fill-fill-fbfaf7 { fill: #91908f; }
    .svg-special-graphic-stroke-718878 { stroke: #718878; }
    .svg-special-graphic-stroke-8c8880 { stroke: #8c8880; }
    .svg-special-graphic-stroke-d5d0c8 { stroke: #94908b; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-706b65 { fill: #a7a4a0; }
    .svg-special-background-fill-e8eee9 { fill: #333333; }
    .svg-special-background-fill-f4f1ec { fill: #343433; }
    .svg-special-background-fill-fbfaf7 { fill: #353535; }



  }
</style>
  <title id="title">Bradley–Terry 模型：比较图到排序分数</title>
  <desc id="desc">四个候选通过成对比较产生有向边，模型估计分数差和选择概率，再固定一个基准输出全局排序。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z"  class="svg-special-fill-fill-8c8880"/>
    </marker>
    <style>
      .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: 600; }
      .node {stroke-width: 1.5; }
      .node-hot {stroke-width: 1.8; }
      .node-base {stroke-width: 1.6; }
      .panel {stroke-width: 1; }
      .edge { fill: none;  stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-muted { fill: none;  stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
      .rule {stroke-width: 1; }
    </style>
  </defs>

  <rect width="800" height="373" rx="14"  class="svg-special-fill-fill-f4f1ec svg-special-background-fill-f4f1ec"/>
  <text x="32" y="35" class="ink label svg-special-text-fill-312f2f">Bradley–Terry：成对标签 → 概率 → 全局排序</text>
  <text x="32" y="58" class="muted small svg-special-text-fill-706b65">比较图提供分差约束；平移基准只选择坐标，不改变任何成对概率</text>

  <rect x="24" y="82" width="358" height="255" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="48" y="110" class="ink label svg-special-text-fill-312f2f">比较图</text>
  <text x="48" y="132" class="muted small svg-special-text-fill-706b65">边上的数字是 i 胜过 j 的次数</text>

  <path d="M126 176 C176 146 219 146 267 176" class="edge svg-coral-stroke-stroke"/>
  <text x="185" y="150" class="muted small svg-special-text-fill-706b65">A&gt;B 7:3</text>
  <path d="M111 206 C143 242 165 252 197 263" class="edge svg-coral-stroke-stroke"/>
  <text x="126" y="259" class="muted small svg-special-text-fill-706b65">A&gt;C 8:2</text>
  <path d="M112 190 C173 196 226 196 286 190" class="edge-muted svg-special-graphic-stroke-8c8880"/>
  <text x="184" y="216" class="muted small svg-special-text-fill-706b65">A&gt;D 6:4</text>
  <path d="M282 214 C251 250 236 260 214 269" class="edge svg-coral-stroke-stroke"/>
  <text x="254" y="252" class="muted small svg-special-text-fill-706b65">B&gt;C 6:4</text>
  <path d="M304 196 C329 219 335 238 329 258" class="edge-muted svg-special-graphic-stroke-8c8880"/>
  <text x="340" y="229" class="muted small svg-special-text-fill-706b65">B&gt;D 5:5</text>
  <path d="M286 289 C247 300 216 300 183 287" class="edge-muted svg-special-graphic-stroke-8c8880"/>
  <text x="219" y="321" class="muted small svg-special-text-fill-706b65">C&gt;D 4:6</text>

  <circle cx="93" cy="186" r="31" class="node-hot svg-special-fill-fill-f4e5df svg-coral-stroke-stroke"/>
  <text x="93" y="191" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">A</text>
  <circle cx="302" cy="186" r="31" class="node svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880"/>
  <text x="302" y="191" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">B</text>
  <circle cx="207" cy="278" r="31" class="node svg-special-fill-fill-f8f6f2 svg-special-graphic-stroke-8c8880"/>
  <text x="207" y="283" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">C</text>
  <circle cx="337" cy="278" r="31" class="node-base svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878"/>
  <text x="337" y="283" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">D</text>

  <path d="M404 204 L452 204" class="edge svg-coral-stroke-stroke"/>
  <text x="405" y="185" class="muted small svg-special-text-fill-706b65">分差</text>

  <rect x="466" y="91" width="138" height="223" rx="12" class="panel svg-special-fill-fill-fbfaf7 svg-special-graphic-stroke-d5d0c8 svg-special-background-fill-fbfaf7"/>
  <text x="535" y="121" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">成对概率</text>
  <text x="535" y="154" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">pᵢⱼ = σ(sᵢ − sⱼ)</text>
  <line x1="490" y1="173" x2="580" y2="173" class="rule svg-special-graphic-stroke-d5d0c8"/>
  <text x="535" y="204" text-anchor="middle" class="muted small svg-special-text-fill-706b65">A&gt;D</text>
  <text x="535" y="228" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">0.656</text>
  <text x="535" y="258" text-anchor="middle" class="muted small svg-special-text-fill-706b65">平移 +3 后</text>
  <text x="535" y="282" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">仍为 0.656</text>

  <path d="M626 204 L674 204" class="edge svg-coral-stroke-stroke"/>
  <text x="626" y="185" class="muted small svg-special-text-fill-706b65">最大似然</text>

  <rect x="684" y="91" width="92" height="223" rx="12" class="node-base svg-special-fill-fill-e8eee9 svg-special-graphic-stroke-718878 svg-special-background-fill-e8eee9"/>
  <text x="730" y="121" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">排序</text>
  <text x="730" y="155" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">A</text>
  <text x="730" y="180" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">D</text>
  <text x="730" y="205" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">B</text>
  <text x="730" y="230" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">C</text>
  <line x1="706" y1="247" x2="754" y2="247" class="rule svg-special-graphic-stroke-d5d0c8"/>
  <text x="730" y="274" text-anchor="middle" class="muted small svg-special-text-fill-706b65">s_D = 0</text>
  <text x="730" y="294" text-anchor="middle" class="muted small svg-special-text-fill-706b65">仅为基准</text>
</svg>
