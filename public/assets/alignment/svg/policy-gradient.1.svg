<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
  <title id="title">策略梯度中的 actor、环境回报与 critic</title>
  <desc id="desc">策略从状态产生动作概率，环境返回轨迹和回报，critic 估计价值并生成 advantage，log probability 与 advantage 形成 actor 更新。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#312f2f"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc785c"/>
    </marker>
    <style>
      .ink { fill: #312f2f; }
      .muted { fill: #6c6863; }
      .box { fill: #f3f0eb; stroke: #b8b2a8; stroke-width: 2; }
      .warm { fill: #f6e4dc; stroke: #cc785c; stroke-width: 2; }
      .cool { fill: #e6eee8; stroke: #809783; stroke-width: 2; }
      .label { font: 600 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #312f2f; stroke-width: 2.4; marker-end: url(#arrow-ink); }
      .coral-line { fill: none; stroke: #cc785c; stroke-width: 2.4; marker-end: url(#arrow-coral); }
      .dash { fill: none; stroke: #b8b2a8; stroke-width: 1.7; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="800" height="373" fill="#fbf9f6"/>
  <text x="38" y="38" class="ink label">策略梯度：用 log probability 和回报更新 actor</text>
  <text x="38" y="62" class="muted small">critic 估计 baseline 或 advantage，熵项和概率比改变更新的方差与范围</text>

  <rect x="38" y="104" width="145" height="78" rx="12" class="box"/>
  <text x="110" y="131" text-anchor="middle" class="ink label">状态 Sₜ</text>
  <text x="110" y="155" text-anchor="middle" class="muted small">观测和历史</text>
  <text x="110" y="172" text-anchor="middle" class="muted tiny">输入 actor/critic</text>

  <rect x="221" y="104" width="145" height="78" rx="12" class="warm"/>
  <text x="294" y="131" text-anchor="middle" class="ink label">Actor πθ</text>
  <text x="294" y="155" text-anchor="middle" class="muted small">log πθ(a | s)</text>
  <text x="294" y="172" text-anchor="middle" class="muted tiny">采样动作</text>

  <rect x="404" y="104" width="145" height="78" rx="12" class="box"/>
  <text x="477" y="131" text-anchor="middle" class="ink label">环境</text>
  <text x="477" y="155" text-anchor="middle" class="muted small">奖励和下一状态</text>
  <text x="477" y="172" text-anchor="middle" class="muted tiny">轨迹 τ</text>

  <rect x="587" y="104" width="175" height="78" rx="12" class="cool"/>
  <text x="674" y="131" text-anchor="middle" class="ink label">Critic Vφ</text>
  <text x="674" y="155" text-anchor="middle" class="muted small">baseline / advantage</text>
  <text x="674" y="172" text-anchor="middle" class="muted tiny">δ = r + γV(s′) − V(s)</text>

  <path d="M183 143 H221" class="line"/>
  <path d="M366 143 H404" class="line"/>
  <path d="M549 143 H587" class="line"/>
  <path d="M674 182 C674 222 110 222 110 182" class="coral-line"/>
  <text x="390" y="214" text-anchor="middle" class="muted tiny">轨迹回报反馈到下一轮动作概率</text>

  <rect x="189" y="270" width="178" height="62" rx="12" class="warm"/>
  <text x="278" y="296" text-anchor="middle" class="ink label">Actor loss</text>
  <text x="278" y="317" text-anchor="middle" class="muted tiny">− log πθ · stopgrad(A)</text>

  <rect x="433" y="270" width="178" height="62" rx="12" class="box"/>
  <text x="522" y="296" text-anchor="middle" class="ink label">更新</text>
  <text x="522" y="317" text-anchor="middle" class="muted tiny">θ ← θ + η ∇J</text>

  <path d="M674 182 V242 H367 V270" class="line"/>
  <path d="M367 301 H433" class="coral-line"/>
  <path d="M522 270 V242 H294 V182" class="coral-line"/>
  <path d="M38 350 H762" class="dash"/>
  <text x="38" y="365" class="muted tiny">审计重点：动作时间轴、return、advantage、old/new log probability、entropy 和 mask</text>
</svg>
