<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
  .svg-special-fill-fill-f3f0eb { fill: #92908d; }
  .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
  .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
  .svg-special-graphic-stroke-809783 { stroke: #809683; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }
  .svg-special-text-fill-6c6863 { fill: #6c6863; }

  .svg-special-background-fill-e6eee8 { fill: #e6eee8; }
  .svg-special-background-fill-f3f0eb { fill: #f3f0eb; }
  .svg-special-background-fill-f6e4dc { fill: #f6e4dc; }
  .svg-special-background-fill-fbf9f6 { fill: #fbf9f6; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e6eee8 { fill: #8d928f; }
    .svg-special-fill-fill-f3f0eb { fill: #92908d; }
    .svg-special-fill-fill-f6e4dc { fill: #9a8e89; }
    .svg-special-fill-fill-fbf9f6 { fill: #92908f; }
    .svg-special-graphic-stroke-809783 { stroke: #809683; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-text-fill-6c6863 { fill: #a6a4a0; }
    .svg-special-background-fill-e6eee8 { fill: #323333; }
    .svg-special-background-fill-f3f0eb { fill: #343433; }
    .svg-special-background-fill-f6e4dc { fill: #353231; }
    .svg-special-background-fill-fbf9f6 { fill: #353535; }



  }
</style>
  <title id="title">策略梯度中的 actor、环境回报与 critic</title>
  <desc id="desc">策略从状态产生动作概率，环境返回轨迹和回报，critic 估计价值并生成 advantage，log probability 与 advantage 形成 actor 更新。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
    <style>
      .ink {}
      .muted {}
      .box {stroke-width: 2; }
      .warm {stroke-width: 2; }
      .cool {stroke-width: 2; }
      .label { font: 600 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-ink); }
      .coral-line { fill: none;  stroke-width: 2.4; marker-end: url(#arrow-coral); }
      .dash { fill: none;  stroke-width: 1.7; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="800" height="373"  class="svg-special-fill-fill-fbf9f6 svg-special-background-fill-fbf9f6"/>
  <text x="38" y="38" class="ink label svg-special-text-fill-312f2f">策略梯度：用 log probability 和回报更新 actor</text>
  <text x="38" y="62" class="muted small svg-special-text-fill-6c6863">critic 估计 baseline 或 advantage，熵项和概率比改变更新的方差与范围</text>

  <rect x="38" y="104" width="145" height="78" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="110" y="131" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">状态 Sₜ</text>
  <text x="110" y="155" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">观测和历史</text>
  <text x="110" y="172" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">输入 actor/critic</text>

  <rect x="221" y="104" width="145" height="78" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="294" y="131" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Actor πθ</text>
  <text x="294" y="155" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">log πθ(a | s)</text>
  <text x="294" y="172" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">采样动作</text>

  <rect x="404" y="104" width="145" height="78" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="477" y="131" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">环境</text>
  <text x="477" y="155" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">奖励和下一状态</text>
  <text x="477" y="172" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">轨迹 τ</text>

  <rect x="587" y="104" width="175" height="78" rx="12" class="cool svg-special-fill-fill-e6eee8 svg-special-graphic-stroke-809783 svg-special-background-fill-e6eee8"/>
  <text x="674" y="131" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Critic Vφ</text>
  <text x="674" y="155" text-anchor="middle" class="muted small svg-special-text-fill-6c6863">baseline / advantage</text>
  <text x="674" y="172" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">δ = r + γV(s′) − V(s)</text>

  <path d="M183 143 H221" class="line svg-ink-stroke"/>
  <path d="M366 143 H404" class="line svg-ink-stroke"/>
  <path d="M549 143 H587" class="line svg-ink-stroke"/>
  <path d="M674 182 C674 222 110 222 110 182" class="coral-line svg-coral-stroke-stroke"/>
  <text x="390" y="214" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">轨迹回报反馈到下一轮动作概率</text>

  <rect x="189" y="270" width="178" height="62" rx="12" class="warm svg-special-fill-fill-f6e4dc svg-coral-stroke-stroke svg-special-background-fill-f6e4dc"/>
  <text x="278" y="296" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">Actor loss</text>
  <text x="278" y="317" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">− log πθ · stopgrad(A)</text>

  <rect x="433" y="270" width="178" height="62" rx="12" class="box svg-special-fill-fill-f3f0eb svg-axis-stroke svg-special-background-fill-f3f0eb"/>
  <text x="522" y="296" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">更新</text>
  <text x="522" y="317" text-anchor="middle" class="muted tiny svg-special-text-fill-6c6863">θ ← θ + η ∇J</text>

  <path d="M674 182 V242 H367 V270" class="line svg-ink-stroke"/>
  <path d="M367 301 H433" class="coral-line svg-coral-stroke-stroke"/>
  <path d="M522 270 V242 H294 V182" class="coral-line svg-coral-stroke-stroke"/>
  <path d="M38 350 H762" class="dash svg-axis-stroke"/>
  <text x="38" y="365" class="muted tiny svg-special-text-fill-6c6863">审计重点：动作时间轴、return、advantage、old/new log probability、entropy 和 mask</text>
</svg>
