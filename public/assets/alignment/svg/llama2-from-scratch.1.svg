<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">LLaMA 2 风格 decoder-only Transformer 的前向合同</title>
  <desc id="desc">配置和 tokenizer 产生 token embedding，经过带 RMSNorm、GQA、RoPE 和 SwiGLU 的 pre-norm decoder block，历史 key value 写入 cache，最后经过 final RMSNorm 和输出头得到 logits。</desc>
  <rect width="1200" height="560" fill="#f6f0e5"/>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #29251f; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .small { font-size: 16px; }
    .tiny { font-size: 14px; fill: #6f665b; }
    .box { stroke-width: 2; rx: 14; }
    .input { fill: #efe1cd; stroke: #b58b5b; }
    .norm { fill: #e8e6d9; stroke: #89906c; }
    .attn { fill: #e4edf0; stroke: #75939d; }
    .ffn { fill: #f1e2db; stroke: #cc785c; }
    .cache { fill: #eee5d2; stroke: #aa8651; }
    .out { fill: #e9ded4; stroke: #a96b4b; }
    .arrow { stroke: #5f554a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dashed { stroke: #a96b4b; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow-coral); }
    .guide { stroke: #b9ad9d; stroke-width: 2; stroke-dasharray: 5 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5f554a"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#a96b4b"/>
    </marker>
  </defs>

  <text x="600" y="38" text-anchor="middle" class="title">LLaMA 2 风格前向：配置 → decoder block → logits</text>
  <text x="600" y="64" text-anchor="middle" class="tiny">同一份合同同时规定 shape、位置、权重形状、KV cache 和输出头</text>

  <rect x="28" y="113" width="150" height="82" class="box input"/>
  <text x="103" y="141" text-anchor="middle" class="label">tokenizer</text>
  <text x="103" y="169" text-anchor="middle" class="small">token id (B,T)</text>
  <path d="M178 154 H208" class="arrow"/>

  <rect x="208" y="113" width="178" height="82" class="box input"/>
  <text x="297" y="141" text-anchor="middle" class="label">embedding</text>
  <text x="297" y="169" text-anchor="middle" class="small">H₀ : (B,T,D)</text>
  <path d="M386 154 H421" class="arrow"/>

  <rect x="421" y="91" width="370" height="250" class="box norm"/>
  <text x="606" y="119" text-anchor="middle" class="label">pre-norm decoder block × L</text>
  <text x="606" y="142" text-anchor="middle" class="tiny">residual stream 的宽度始终为 D</text>

  <rect x="449" y="163" width="112" height="54" class="box norm"/>
  <text x="505" y="187" text-anchor="middle" class="small">RMSNorm</text>
  <text x="505" y="207" text-anchor="middle" class="tiny">X : (B,T,D)</text>
  <path d="M561 190 H583" class="arrow"/>

  <rect x="583" y="151" width="174" height="78" class="box attn"/>
  <text x="670" y="178" text-anchor="middle" class="label">GQA + RoPE</text>
  <text x="670" y="201" text-anchor="middle" class="small">Q: hq，K/V: hkv</text>
  <text x="670" y="220" text-anchor="middle" class="tiny">causal attention</text>

  <path d="M670 229 V253" class="arrow"/>
  <rect x="449" y="253" width="308" height="58" class="box ffn"/>
  <text x="603" y="278" text-anchor="middle" class="label">残差写回 + RMSNorm + SwiGLU</text>
  <text x="603" y="299" text-anchor="middle" class="tiny">gate / up → SiLU ⊙ → down</text>

  <path d="M791 190 H826" class="dashed"/>
  <rect x="826" y="150" width="160" height="80" class="box cache"/>
  <text x="906" y="178" text-anchor="middle" class="label">KV cache</text>
  <text x="906" y="201" text-anchor="middle" class="small">(B,hkv,S,dh)</text>
  <text x="906" y="220" text-anchor="middle" class="tiny">rotated K + raw V</text>

  <path d="M791 302 H1010" class="arrow"/>
  <rect x="1010" y="256" width="154" height="84" class="box out"/>
  <text x="1087" y="284" text-anchor="middle" class="label">final RMSNorm</text>
  <text x="1087" y="307" text-anchor="middle" class="small">→ LM head</text>
  <text x="1087" y="327" text-anchor="middle" class="tiny">logits (B,T,V)</text>

  <path d="M103 226 V401 H1092 V343" class="guide" fill="none"/>
  <text x="103" y="425" text-anchor="middle" class="tiny">配置：D、L、hq、hkv、dh、m、ε、rope_theta</text>
  <text x="600" y="425" text-anchor="middle" class="tiny">prefill：整段并行；decode：新 token + 读取历史 cache</text>
  <text x="1092" y="425" text-anchor="middle" class="tiny">权重绑定或独立 output</text>

  <rect x="80" y="457" width="1035" height="58" rx="12" fill="#fffaf0" stroke="#c5b59c"/>
  <text x="600" y="482" text-anchor="middle" class="small">核验顺序：tokenizer / position → shape → norm / residual → QKV / RoPE / mask → cache → logits</text>
  <text x="600" y="504" text-anchor="middle" class="tiny">前向数值一致不等于 tokenizer、checkpoint、采样配置和生成结果都已一致</text>
</svg>
