<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-668692 { fill: #668692; }
  .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
  .svg-special-fill-fill-eee8d9 { fill: #949087; }
  .svg-special-fill-fill-f2e4da { fill: #988f89; }
  .svg-special-fill-fill-f8f5ee { fill: #92908c; }
  .svg-special-fill-fill-fffdf8 { fill: #92908e; }
  .svg-special-graphic-stroke-668692 { stroke: #668692; }
  .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e7edf0 { fill: #e7edf0; }
  .svg-special-background-fill-eee8d9 { fill: #eee8d9; }
  .svg-special-background-fill-f2e4da { fill: #f2e4da; }
  .svg-special-background-fill-f8f5ee { fill: #f8f5ee; }
  .svg-special-background-fill-fffdf8 { fill: #fffdf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-668692 { fill: #668692; }
    .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
    .svg-special-fill-fill-eee8d9 { fill: #949087; }
    .svg-special-fill-fill-f2e4da { fill: #988f89; }
    .svg-special-fill-fill-f8f5ee { fill: #92908c; }
    .svg-special-fill-fill-fffdf8 { fill: #92908e; }
    .svg-special-graphic-stroke-668692 { stroke: #668692; }
    .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e7edf0 { fill: #323334; }
    .svg-special-background-fill-eee8d9 { fill: #333330; }
    .svg-special-background-fill-f2e4da { fill: #343231; }
    .svg-special-background-fill-f8f5ee { fill: #353433; }
    .svg-special-background-fill-fffdf8 { fill: #363535; }



  }
</style>
  <title id="title">Encoder-only Transformer 的双向上下文编码</title>
  <desc id="desc">token 加入位置条件后进入双向 encoder stack，输出 contextual hidden，再分流到 token、CLS 和 span 任务头</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;  }
    .small { font-size: 18px; }
    .label { font-size: 22px; font-weight: 600; }
    .title { font-size: 28px; font-weight: 700; }
    .box {stroke-width: 2; rx: 14; }
    .input {}
    .stack {}
    .head {}
    .arrow {stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .branch {stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    .guide {stroke-width: 2; stroke-dasharray: 5 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-312f2f"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-668692"/></marker>
  </defs>
  <rect width="1200" height="560"  class="svg-special-fill-fill-f8f5ee svg-special-background-fill-f8f5ee"/>
  <text x="600" y="45" text-anchor="middle" class="title svg-special-text-fill-312f2f">Encoder-Only：完整输入、双向读取、多个任务头</text>

  <rect x="35" y="105" width="155" height="58" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="112" y="140" text-anchor="middle" class="label svg-special-text-fill-312f2f">token id</text>
  <text x="112" y="158" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T)</text>
  <path d="M190 134 H245" class="arrow svg-ink-stroke"/>
  <rect x="245" y="105" width="190" height="58" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="340" y="140" text-anchor="middle" class="label svg-special-text-fill-312f2f">embedding + 位置</text>
  <text x="340" y="158" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T,D)</text>
  <path d="M435 134 H490" class="arrow svg-ink-stroke"/>

  <rect x="490" y="75" width="330" height="120" class="box stack svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="655" y="112" text-anchor="middle" class="label svg-special-text-fill-312f2f">Bidirectional Encoder Stack</text>
  <text x="655" y="145" text-anchor="middle" class="small svg-special-text-fill-312f2f">self-attention：全部有效 token</text>
  <text x="655" y="171" text-anchor="middle" class="small svg-special-text-fill-312f2f">residual + norm + FFN × L</text>

  <path d="M820 134 H875" class="arrow svg-ink-stroke"/>
  <rect x="875" y="105" width="190" height="58" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="970" y="140" text-anchor="middle" class="label svg-special-text-fill-312f2f">contextual hidden</text>
  <text x="970" y="158" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T,D)</text>

  <path d="M970 163 V245 H190" class="guide svg-axis-stroke"/>
  <text x="600" y="235" text-anchor="middle" class="small svg-special-text-fill-312f2f">每个位置都可以读取其他有效位置，padding 列仍由 mask 排除</text>

  <path d="M970 163 V300 H850" class="branch svg-special-graphic-stroke-668692"/>
  <path d="M970 163 V380 H850" class="branch svg-special-graphic-stroke-668692"/>
  <path d="M970 163 V460 H850" class="branch svg-special-graphic-stroke-668692"/>

  <rect x="630" y="275" width="220" height="58" class="box head svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="740" y="310" text-anchor="middle" class="label svg-special-text-fill-312f2f">token head</text>
  <text x="740" y="328" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T,C)</text>
  <rect x="630" y="355" width="220" height="58" class="box head svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="740" y="390" text-anchor="middle" class="label svg-special-text-fill-312f2f">CLS / mean pool</text>
  <text x="740" y="408" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,D) → (B,C)</text>
  <rect x="630" y="435" width="220" height="58" class="box head svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="740" y="470" text-anchor="middle" class="label svg-special-text-fill-312f2f">span head</text>
  <text x="740" y="488" text-anchor="middle" class="small svg-special-text-fill-312f2f">start / end (B,T)</text>

  <path d="M850 304 H1085" class="branch svg-special-graphic-stroke-668692"/>
  <path d="M850 384 H1085" class="branch svg-special-graphic-stroke-668692"/>
  <path d="M850 464 H1085" class="branch svg-special-graphic-stroke-668692"/>
  <text x="1120" y="309" text-anchor="middle" class="small svg-special-text-fill-312f2f">序列标注</text>
  <text x="1120" y="389" text-anchor="middle" class="small svg-special-text-fill-312f2f">分类 / 检索</text>
  <text x="1120" y="469" text-anchor="middle" class="small svg-special-text-fill-312f2f">区间抽取</text>

  <text x="600" y="535" text-anchor="middle" class="small svg-special-text-fill-312f2f">架构：双向 encoder　目标：由任务头决定　MLM：另一个训练目标</text>
</svg>
