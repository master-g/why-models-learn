<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-coral-text-fill { fill: #a9583e; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
  .svg-special-fill-fill-eee8d9 { fill: #949087; }
  .svg-special-fill-fill-f2e4da { fill: #988f89; }
  .svg-special-fill-fill-f8f5ee { fill: #92908c; }
  .svg-special-fill-fill-fffdf8 { fill: #92908e; }
  .svg-special-graphic-stroke-668692 { stroke: #668692; }
  .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e7edf0 { fill: #e7edf0; }
  .svg-special-background-fill-eee8d9 { fill: #eee8d9; }
  .svg-special-background-fill-f2e4da { fill: #f2e4da; }
  .svg-special-background-fill-f8f5ee { fill: #f8f5ee; }
  .svg-special-background-fill-fffdf8 { fill: #fffdf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-coral-text-fill { fill: #dc896d; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
    .svg-special-fill-fill-eee8d9 { fill: #949087; }
    .svg-special-fill-fill-f2e4da { fill: #988f89; }
    .svg-special-fill-fill-f8f5ee { fill: #92908c; }
    .svg-special-fill-fill-fffdf8 { fill: #92908e; }
    .svg-special-graphic-stroke-668692 { stroke: #668692; }
    .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e7edf0 { fill: #323334; }
    .svg-special-background-fill-eee8d9 { fill: #333330; }
    .svg-special-background-fill-f2e4da { fill: #343231; }
    .svg-special-background-fill-f8f5ee { fill: #353433; }
    .svg-special-background-fill-fffdf8 { fill: #363535; }



  }
</style>
  <title id="title">Causal Language Modeling 的数据流</title>
  <desc id="desc">右移的真实前缀进入因果 decoder，每个位置只读取历史，输出 next-token logits 与标签计算损失，推理时逐 token decode</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;  }
    .small { font-size: 18px; }
    .label { font-size: 22px; font-weight: 600; }
    .title { font-size: 28px; font-weight: 700; }
    .box {stroke-width: 2; rx: 14; }
    .input {}
    .dec {}
    .out {}
    .arrow {stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .future {stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow-coral); }
    .guide {stroke-width: 2; stroke-dasharray: 5 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-312f2f"/></marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-cc785c"/></marker>
  </defs>
  <rect width="1200" height="560"  class="svg-special-fill-fill-f8f5ee svg-special-background-fill-f8f5ee"/>
  <text x="600" y="45" text-anchor="middle" class="title svg-special-text-fill-312f2f">Causal Language Modeling：真实前缀、因果读取、下一个 token</text>

  <text x="100" y="92" text-anchor="middle" class="label svg-special-text-fill-312f2f">右移输入</text>
  <rect x="25" y="112" width="160" height="48" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="105" y="143" text-anchor="middle" class="small svg-special-text-fill-312f2f">BOS, x₁, …, xₜ₋₁</text>
  <path d="M185 136 H235" class="arrow svg-ink-stroke"/>

  <rect x="235" y="75" width="330" height="125" class="box dec svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="400" y="111" text-anchor="middle" class="label svg-special-text-fill-312f2f">Causal Decoder</text>
  <text x="400" y="143" text-anchor="middle" class="small svg-special-text-fill-312f2f">masked self-attention + FFN</text>
  <text x="400" y="175" text-anchor="middle" class="small svg-special-text-fill-312f2f">row i reads key 0 … i</text>

  <path d="M565 136 H615" class="arrow svg-ink-stroke"/>
  <rect x="615" y="95" width="190" height="82" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="710" y="128" text-anchor="middle" class="label svg-special-text-fill-312f2f">LM head</text>
  <text x="710" y="158" text-anchor="middle" class="small svg-special-text-fill-312f2f">logits (B,T,V)</text>

  <path d="M805 136 H855" class="arrow svg-ink-stroke"/>
  <rect x="855" y="95" width="150" height="82" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="930" y="128" text-anchor="middle" class="label svg-special-text-fill-312f2f">NLL</text>
  <text x="930" y="158" text-anchor="middle" class="small svg-special-text-fill-312f2f">label xᵢ₊₁</text>

  <path d="M400 200 V290" class="future svg-coral-stroke-stroke"/>
  <text x="420" y="250" class="small svg-special-text-fill-312f2f svg-coral-text-fill" >future key blocked</text>
  <rect x="235" y="290" width="330" height="92" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="400" y="325" text-anchor="middle" class="label svg-special-text-fill-312f2f">训练：并行 T 行</text>
  <text x="400" y="356" text-anchor="middle" class="small svg-special-text-fill-312f2f">teacher forcing · causal mask</text>

  <path d="M565 336 H650" class="arrow svg-ink-stroke"/>
  <rect x="650" y="290" width="220" height="92" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="760" y="325" text-anchor="middle" class="label svg-special-text-fill-312f2f">推理：decode</text>
  <text x="760" y="356" text-anchor="middle" class="small svg-special-text-fill-312f2f">追加一个 token + KV cache</text>

  <path d="M105 210 V450 H1005 V177" class="guide svg-axis-stroke"/>
  <text x="600" y="445" text-anchor="middle" class="small svg-special-text-fill-312f2f">训练输入来自真实前缀　推理输入来自模型前一步输出</text>
  <text x="600" y="485" text-anchor="middle" class="small svg-special-text-fill-312f2f">score shape (B,h,T,T)　单步 decode 读取历史长度 t+1</text>
</svg>
