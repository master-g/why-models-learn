<svg xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
  <rect width="800" height="373" fill="#f7f3ee"/>
  <style>
    .ink { fill: #312f2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box { stroke: #b8b2a8; stroke-width: 1.5; rx: 12; }
    .grid { stroke: #b8b2a8; stroke-width: 1; }
    .arrow { stroke: #312f2f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #c9c4bb; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#312f2f"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="ink title">ViT：image → patch tokens → encoder → readout</text>
  <text x="400" y="51" text-anchor="middle" class="ink small">patch size 决定 token 数，位置嵌入恢复网格坐标</text>

  <rect x="26" y="91" width="118" height="124" class="box" fill="#f0e2dc"/>
  <text x="85" y="113" text-anchor="middle" class="ink label">image</text>
  <rect x="42" y="126" width="86" height="72" fill="#f8efe4" stroke="#b8b2a8"/>
  <path d="M42 150 H128 M42 174 H128 M70 126 V198 M99 126 V198" class="grid"/>
  <text x="85" y="211" text-anchor="middle" class="ink small">C × H × W</text>

  <rect x="174" y="91" width="118" height="124" class="box" fill="#f2ead9"/>
  <text x="233" y="114" text-anchor="middle" class="ink label">patchify</text>
  <text x="233" y="139" text-anchor="middle" class="ink small">P × P window</text>
  <text x="233" y="160" text-anchor="middle" class="ink small">N = HW / P²</text>
  <text x="233" y="181" text-anchor="middle" class="ink small">flatten → CP²</text>
  <text x="233" y="201" text-anchor="middle" class="ink small">linear → D</text>

  <path d="M144 153 L174 153" class="arrow"/>

  <rect x="322" y="91" width="132" height="124" class="box" fill="#e3edf0"/>
  <text x="388" y="114" text-anchor="middle" class="ink label">token sequence</text>
  <text x="388" y="139" text-anchor="middle" class="ink small">[CLS, patch₁ … patchN]</text>
  <text x="388" y="160" text-anchor="middle" class="ink small">+ Epos</text>
  <text x="388" y="181" text-anchor="middle" class="ink small">T = N + 1</text>
  <text x="388" y="201" text-anchor="middle" class="ink small">T × D</text>

  <path d="M292 153 L322 153" class="arrow"/>

  <rect x="484" y="91" width="148" height="124" class="box" fill="#e3edf0"/>
  <text x="558" y="114" text-anchor="middle" class="ink label">encoder stack</text>
  <text x="558" y="139" text-anchor="middle" class="ink small">global self-attention</text>
  <text x="558" y="160" text-anchor="middle" class="ink small">A ∈ R^(B×h×T×T)</text>
  <text x="558" y="181" text-anchor="middle" class="ink small">L blocks</text>
  <text x="558" y="201" text-anchor="middle" class="ink small">contextual patch hidden</text>

  <path d="M454 153 L484 153" class="arrow"/>

  <rect x="662" y="91" width="112" height="124" class="box" fill="#f0e2dc"/>
  <text x="718" y="114" text-anchor="middle" class="ink label">readout</text>
  <text x="718" y="139" text-anchor="middle" class="ink small">CLS / mean</text>
  <text x="718" y="160" text-anchor="middle" class="ink small">→ class logits</text>
  <text x="718" y="181" text-anchor="middle" class="ink small">or patch grid</text>
  <text x="718" y="201" text-anchor="middle" class="ink small">→ dense head</text>

  <path d="M632 153 L662 153" class="arrow"/>

  <path d="M85 242 L85 286 L718 286 L718 222" class="dash"/>
  <text x="400" y="310" text-anchor="middle" class="ink label">审计轴</text>
  <text x="400" y="332" text-anchor="middle" class="ink small">patch 网格 · flatten 顺序 · position interpolation · T² attention · pooling 对齐</text>
</svg>
