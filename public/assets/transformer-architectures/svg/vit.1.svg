<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-e3edf0 { fill: #8b9293; }
  .svg-special-fill-fill-f0e2dc { fill: #988f8c; }
  .svg-special-fill-fill-f2ead9 { fill: #959086; }
  .svg-special-fill-fill-f7f3ee { fill: #93908e; }
  .svg-special-fill-fill-f8efe4 { fill: #959089; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e3edf0 { fill: #e3edf0; }
  .svg-special-background-fill-f0e2dc { fill: #f0e2dc; }
  .svg-special-background-fill-f2ead9 { fill: #f2ead9; }
  .svg-special-background-fill-f7f3ee { fill: #f7f3ee; }
  .svg-special-background-fill-f8efe4 { fill: #f8efe4; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-e3edf0 { fill: #8b9293; }
    .svg-special-fill-fill-f0e2dc { fill: #988f8c; }
    .svg-special-fill-fill-f2ead9 { fill: #959086; }
    .svg-special-fill-fill-f7f3ee { fill: #93908e; }
    .svg-special-fill-fill-f8efe4 { fill: #959089; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e3edf0 { fill: #323334; }
    .svg-special-background-fill-f0e2dc { fill: #343231; }
    .svg-special-background-fill-f2ead9 { fill: #343330; }
    .svg-special-background-fill-f7f3ee { fill: #353433; }
    .svg-special-background-fill-f8efe4 { fill: #353432; }



  }
</style>
  <rect width="800" height="373"  class="svg-special-fill-fill-f7f3ee svg-special-background-fill-f7f3ee"/>
  <style>
    .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .box {stroke-width: 1.5; rx: 12; }
    .grid {stroke-width: 1; }
    .arrow {stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash {stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z"  class="svg-special-fill-fill-312f2f"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" class="ink title svg-special-text-fill-312f2f">ViT：image → patch tokens → encoder → readout</text>
  <text x="400" y="51" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">patch size 决定 token 数，位置嵌入恢复网格坐标</text>

  <rect x="26" y="91" width="118" height="124" class="box svg-axis-stroke svg-special-fill-fill-f0e2dc svg-special-background-fill-f0e2dc" />
  <text x="85" y="113" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">image</text>
  <rect x="42" y="126" width="86" height="72"   class="svg-special-fill-fill-f8efe4 svg-axis-stroke svg-special-background-fill-f8efe4"/>
  <path d="M42 150 H128 M42 174 H128 M70 126 V198 M99 126 V198" class="grid svg-axis-stroke"/>
  <text x="85" y="211" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">C × H × W</text>

  <rect x="174" y="91" width="118" height="124" class="box svg-axis-stroke svg-special-fill-fill-f2ead9 svg-special-background-fill-f2ead9" />
  <text x="233" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">patchify</text>
  <text x="233" y="139" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">P × P window</text>
  <text x="233" y="160" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">N = HW / P²</text>
  <text x="233" y="181" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">flatten → CP²</text>
  <text x="233" y="201" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">linear → D</text>

  <path d="M144 153 L174 153" class="arrow svg-ink-stroke"/>

  <rect x="322" y="91" width="132" height="124" class="box svg-axis-stroke svg-special-fill-fill-e3edf0 svg-special-background-fill-e3edf0" />
  <text x="388" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">token sequence</text>
  <text x="388" y="139" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">[CLS, patch₁ … patchN]</text>
  <text x="388" y="160" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">+ Epos</text>
  <text x="388" y="181" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">T = N + 1</text>
  <text x="388" y="201" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">T × D</text>

  <path d="M292 153 L322 153" class="arrow svg-ink-stroke"/>

  <rect x="484" y="91" width="148" height="124" class="box svg-axis-stroke svg-special-fill-fill-e3edf0 svg-special-background-fill-e3edf0" />
  <text x="558" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">encoder stack</text>
  <text x="558" y="139" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">global self-attention</text>
  <text x="558" y="160" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">A ∈ R^(B×h×T×T)</text>
  <text x="558" y="181" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">L blocks</text>
  <text x="558" y="201" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">contextual patch hidden</text>

  <path d="M454 153 L484 153" class="arrow svg-ink-stroke"/>

  <rect x="662" y="91" width="112" height="124" class="box svg-axis-stroke svg-special-fill-fill-f0e2dc svg-special-background-fill-f0e2dc" />
  <text x="718" y="114" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">readout</text>
  <text x="718" y="139" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">CLS / mean</text>
  <text x="718" y="160" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">→ class logits</text>
  <text x="718" y="181" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">or patch grid</text>
  <text x="718" y="201" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">→ dense head</text>

  <path d="M632 153 L662 153" class="arrow svg-ink-stroke"/>

  <path d="M85 242 L85 286 L718 286 L718 222" class="dash svg-special-graphic-stroke-c9c4bb"/>
  <text x="400" y="310" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">审计轴</text>
  <text x="400" y="332" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">patch 网格 · flatten 顺序 · position interpolation · T² attention · pooling 对齐</text>
</svg>
