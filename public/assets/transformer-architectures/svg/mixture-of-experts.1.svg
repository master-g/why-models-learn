  <text x="400" y="31" text-anchor="middle" class="ink title svg-special-text-fill-312f2f">MoE：token 选择少量 expert，再合并回 residual stream</text>
  <text x="400" y="53" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">总参数随 expert 数增加，单 token 计算由 top-k 决定</text>

  <rect x="28" y="112" width="112" height="80" class="box svg-axis-stroke svg-special-fill-fill-f0e2dc svg-special-background-fill-f0e2dc" />
  <text x="84" y="137" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">token batch</text>
  <text x="84" y="158" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">X ∈ ℝ^(N×D)</text>
  <text x="84" y="178" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">有效 token</text>

  <rect x="174" y="101" width="126" height="102" class="box svg-axis-stroke svg-special-fill-fill-f2ead9 svg-special-background-fill-f2ead9" />
  <text x="237" y="128" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">router</text>
  <text x="237" y="150" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">z = xWᵣ + bᵣ</text>
  <text x="237" y="169" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">softmax → p</text>
  <text x="237" y="188" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">Top-k → gate</text>

  <rect x="337" y="101" width="126" height="102" class="box svg-axis-stroke svg-special-fill-fill-e3edf0 svg-special-background-fill-e3edf0" />
  <text x="400" y="128" text-anchor="middle" class="ink label svg-special-text-fill-312f2f">dispatch</text>
  <text x="400" y="150" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">token / expert</text>
  <text x="400" y="169" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">capacity slots</text>
  <text x="400" y="188" text-anchor="middle" class="ink small svg-special-text-fill-312f2f">all-to-all</text>

