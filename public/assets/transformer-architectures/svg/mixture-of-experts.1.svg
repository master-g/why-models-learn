  <rect width="800" height="373"  class="svg-special-fill-fill-f7f3ee svg-special-background-fill-f7f3ee"/>
  <style>
    .ink {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
