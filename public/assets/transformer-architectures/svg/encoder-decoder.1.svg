  <title id="title">Encoder-Decoder 的条件序列计算链</title>
  <desc id="desc">源序列经过 encoder 形成 memory，目标前缀经过 masked decoder，通过 cross-attention 读取源 memory 后输出目标 logits</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;  }
    .small { font-size: 18px; }
    .label { font-size: 22px; font-weight: 600; }
    .title { font-size: 28px; font-weight: 700; }
    .box {stroke-width: 2; rx: 14; }
    .enc {}
    .dec {}
    .out {}
    .arrow {stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .cross {stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow-coral); }
    .guide {stroke-width: 2; stroke-dasharray: 5 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-312f2f"/></marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-cc785c"/></marker>
  </defs>
  <rect width="1200" height="560"  class="svg-special-fill-fill-f8f5ee svg-special-background-fill-f8f5ee"/>
  <text x="600" y="45" text-anchor="middle" class="title svg-special-text-fill-312f2f">Encoder-Decoder：两条序列、三种 attention、一个条件输出</text>

  <text x="95" y="92" text-anchor="middle" class="label svg-special-text-fill-312f2f">源序列</text>
  <rect x="25" y="112" width="140" height="48" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="95" y="143" text-anchor="middle" class="small svg-special-text-fill-312f2f">token id (B,S)</text>
  <path d="M165 136 H205" class="arrow svg-ink-stroke"/>
  <rect x="205" y="112" width="150" height="48" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="280" y="143" text-anchor="middle" class="small svg-special-text-fill-312f2f">embedding + 位置</text>
  <path d="M355 136 H395" class="arrow svg-ink-stroke"/>
  <rect x="395" y="82" width="300" height="108" class="box enc svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="545" y="117" text-anchor="middle" class="label svg-special-text-fill-312f2f">Encoder</text>
  <text x="545" y="151" text-anchor="middle" class="small svg-special-text-fill-312f2f">双向 self-attention + FFN</text>
  <text x="545" y="177" text-anchor="middle" class="small svg-special-text-fill-312f2f">memory (B,S,D)</text>

  <text x="95" y="278" text-anchor="middle" class="label svg-special-text-fill-312f2f">目标前缀</text>
  <rect x="25" y="298" width="140" height="48" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="95" y="329" text-anchor="middle" class="small svg-special-text-fill-312f2f">右移 token (B,U)</text>
  <path d="M165 322 H205" class="arrow svg-ink-stroke"/>
  <rect x="205" y="298" width="150" height="48" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="280" y="329" text-anchor="middle" class="small svg-special-text-fill-312f2f">embedding + 位置</text>
  <path d="M355 322 H395" class="arrow svg-ink-stroke"/>
  <rect x="395" y="245" width="300" height="154" class="box dec svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="545" y="280" text-anchor="middle" class="label svg-special-text-fill-312f2f">Decoder</text>
  <text x="545" y="314" text-anchor="middle" class="small svg-special-text-fill-312f2f">causal self-attention</text>
  <text x="545" y="340" text-anchor="middle" class="small svg-special-text-fill-312f2f">cross-attention → source memory</text>
  <text x="545" y="366" text-anchor="middle" class="small svg-special-text-fill-312f2f">FFN · hidden (B,U,D)</text>

  <path d="M545 190 V245" class="cross svg-coral-stroke-stroke"/>
  <text x="718" y="222" class="small svg-special-text-fill-312f2f svg-coral-text-fill" >K/V source memory</text>
  <path d="M695 322 H775" class="arrow svg-ink-stroke"/>
  <rect x="775" y="298" width="170" height="48" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="860" y="329" text-anchor="middle" class="small svg-special-text-fill-312f2f">LM head (B,U,Vt)</text>
  <path d="M945 322 H1010" class="arrow svg-ink-stroke"/>
  <rect x="1010" y="298" width="155" height="48" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="1087" y="329" text-anchor="middle" class="small svg-special-text-fill-312f2f">softmax / token</text>

  <path d="M395 210 H1135" class="guide svg-axis-stroke"/>
  <text x="600" y="455" text-anchor="middle" class="small svg-special-text-fill-312f2f">encoder self (B,h,S,S)　decoder self (B,h,U,U)　cross (B,h,U,S)</text>
  <text x="600" y="493" text-anchor="middle" class="small svg-special-text-fill-312f2f">训练：右移目标 + causal mask　推理：固定 source cache，逐 token decode</text>
</svg>
