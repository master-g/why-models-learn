<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-ink-stroke { stroke: #312f2f; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
  .svg-special-fill-fill-eee8d9 { fill: #949087; }
  .svg-special-fill-fill-f2e4da { fill: #988f89; }
  .svg-special-fill-fill-f8f5ee { fill: #92908c; }
  .svg-special-fill-fill-fffdf8 { fill: #92908e; }
  .svg-special-graphic-stroke-668692 { stroke: #668692; }
  .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-e7edf0 { fill: #e7edf0; }
  .svg-special-background-fill-eee8d9 { fill: #eee8d9; }
  .svg-special-background-fill-f2e4da { fill: #f2e4da; }
  .svg-special-background-fill-f8f5ee { fill: #f8f5ee; }
  .svg-special-background-fill-fffdf8 { fill: #fffdf8; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-ink-stroke { stroke: #f0efe8; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-e7edf0 { fill: #8e9193; }
    .svg-special-fill-fill-eee8d9 { fill: #949087; }
    .svg-special-fill-fill-f2e4da { fill: #988f89; }
    .svg-special-fill-fill-f8f5ee { fill: #92908c; }
    .svg-special-fill-fill-fffdf8 { fill: #92908e; }
    .svg-special-graphic-stroke-668692 { stroke: #668692; }
    .svg-special-graphic-stroke-9b865c { stroke: #9b865c; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-e7edf0 { fill: #323334; }
    .svg-special-background-fill-eee8d9 { fill: #333330; }
    .svg-special-background-fill-f2e4da { fill: #343231; }
    .svg-special-background-fill-f8f5ee { fill: #353433; }
    .svg-special-background-fill-fffdf8 { fill: #363535; }



  }
</style>
  <title id="title">Decoder-only Transformer 的因果生成路径</title>
  <desc id="desc">右移前缀经过 embedding 和 causal decoder stack，历史 key/value 写入 cache，最后一个 hidden 经过 LM head 产生 next-token logits</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;  }
    .small { font-size: 18px; }
    .label { font-size: 22px; font-weight: 600; }
    .title { font-size: 28px; font-weight: 700; }
    .box {stroke-width: 2; rx: 14; }
    .input {}
    .stack {}
    .cache {}
    .out {}
    .arrow {stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .coral {stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow-coral); }
    .guide {stroke-width: 2; stroke-dasharray: 5 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-312f2f"/></marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z"  class="svg-special-fill-fill-cc785c"/></marker>
  </defs>
  <rect width="1200" height="560"  class="svg-special-fill-fill-f8f5ee svg-special-background-fill-f8f5ee"/>
  <text x="600" y="45" text-anchor="middle" class="title svg-special-text-fill-312f2f">Decoder-Only：因果前缀、KV cache、下一个 token</text>

  <rect x="30" y="112" width="150" height="58" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="105" y="147" text-anchor="middle" class="label svg-special-text-fill-312f2f">右移前缀</text>
  <text x="105" y="165" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T)</text>
  <path d="M180 141 H230" class="arrow svg-ink-stroke"/>
  <rect x="230" y="112" width="190" height="58" class="box input svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-eee8d9 svg-special-graphic-stroke-9b865c svg-special-background-fill-fffdf8 svg-special-background-fill-eee8d9"/>
  <text x="325" y="147" text-anchor="middle" class="label svg-special-text-fill-312f2f">embedding + 位置</text>
  <text x="325" y="165" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T,D)</text>
  <path d="M420 141 H475" class="arrow svg-ink-stroke"/>

  <rect x="475" y="78" width="345" height="126" class="box stack svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-e7edf0 svg-special-graphic-stroke-668692 svg-special-background-fill-fffdf8 svg-special-background-fill-e7edf0"/>
  <text x="647" y="114" text-anchor="middle" class="label svg-special-text-fill-312f2f">Causal Decoder Stack</text>
  <text x="647" y="146" text-anchor="middle" class="small svg-special-text-fill-312f2f">masked self-attention</text>
  <text x="647" y="172" text-anchor="middle" class="small svg-special-text-fill-312f2f">residual + norm + FFN × L</text>
  <text x="647" y="193" text-anchor="middle" class="small svg-special-text-fill-312f2f">only current / past positions</text>

  <path d="M820 141 H875" class="arrow svg-ink-stroke"/>
  <rect x="875" y="112" width="180" height="58" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="965" y="147" text-anchor="middle" class="label svg-special-text-fill-312f2f">LM head</text>
  <text x="965" y="165" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,T,V)</text>
  <path d="M1055 141 H1100" class="arrow svg-ink-stroke"/>
  <rect x="1100" y="112" width="75" height="58" class="box out svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="1137" y="139" text-anchor="middle" class="small svg-special-text-fill-312f2f">next</text>
  <text x="1137" y="160" text-anchor="middle" class="small svg-special-text-fill-312f2f">token</text>

  <path d="M647 204 V310 H430" class="coral svg-coral-stroke-stroke"/>
  <rect x="180" y="285" width="250" height="62" class="box cache svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-fill-fill-f2e4da svg-coral-stroke-stroke svg-special-background-fill-fffdf8 svg-special-background-fill-f2e4da"/>
  <text x="305" y="317" text-anchor="middle" class="label svg-special-text-fill-312f2f">KV cache per layer</text>
  <text x="305" y="338" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,hₖᵥ,t,dₕ) × K/V</text>
  <path d="M430 316 H520 V204" class="coral svg-coral-stroke-stroke"/>

  <rect x="560" y="285" width="300" height="62" class="box svg-special-fill-fill-fffdf8 svg-ink-stroke svg-special-background-fill-fffdf8"/>
  <text x="710" y="317" text-anchor="middle" class="label svg-special-text-fill-312f2f">causal score</text>
  <text x="710" y="338" text-anchor="middle" class="small svg-special-text-fill-312f2f">(B,h_q,1,t+1)，只读历史</text>
  <path d="M820 204 V316 H860" class="guide svg-axis-stroke"/>

  <path d="M90 430 H1110" class="guide svg-axis-stroke"/>
  <text x="600" y="415" text-anchor="middle" class="small svg-special-text-fill-312f2f">prefill：一次处理 prompt　decode：每次追加一个 token　position offset 随 cache 长度增长</text>
  <text x="600" y="470" text-anchor="middle" class="small svg-special-text-fill-312f2f">MHA / GQA / MQA 改变 K/V head 与 cache，causal mask 仍然限制 query-key 位置</text>
  <text x="600" y="510" text-anchor="middle" class="small svg-special-text-fill-312f2f">训练可并行计算整段下三角矩阵，推理读取最后位置的 logits</text>
</svg>
