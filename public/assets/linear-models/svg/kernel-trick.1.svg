<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">核技巧：从非线性输入关系到特征空间中的线性分界</title>
  <desc id="desc">左侧是原空间中交错的正负样本，中间是乘积特征映射，右侧是在隐式特征坐标中用零作为线性边界。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 7 7; }
    .accent {}
    .dark {}
    .arrow { fill: none;  stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">核技巧：把非线性关系变成隐式内积</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">原空间的边界交错；特征空间中只需一个线性阈值</text>

  <rect x="52" y="111" width="205" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="72" y="140" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">原空间</text>
  <line x1="90" y1="276" x2="230" y2="276" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="90" y1="276" x2="90" y2="151" class="axis svg-special-graphic-stroke-8f8a81"/>
  <text x="218" y="296" class="muted svg-muted-fill" font-size="12">x₁</text>
  <text x="70" y="159" class="muted svg-muted-fill" font-size="12">x₂</text>
  <circle cx="121" cy="181" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="199" cy="259" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="121" cy="259" r="8" class="dark svg-special-fill-fill-312f2f"/>
  <circle cx="199" cy="181" r="8" class="dark svg-special-fill-fill-312f2f"/>
  <text x="136" y="184" class="ink svg-special-text-fill-312f2f" font-size="13">+1</text>
  <text x="208" y="264" class="ink svg-special-text-fill-312f2f" font-size="13">+1</text>
  <text x="136" y="264" class="ink svg-special-text-fill-312f2f" font-size="13">−1</text>
  <text x="208" y="184" class="ink svg-special-text-fill-312f2f" font-size="13">−1</text>
  <text x="72" y="306" class="muted svg-muted-fill" font-size="12">y = sign(x₁x₂)</text>

  <path d="M 274 214 L 322 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="332" y="111" width="155" height="205" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="357" y="143" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">特征映射</text>
  <text x="357" y="180" class="ink svg-special-text-fill-312f2f" font-size="15">φ(x)</text>
  <text x="357" y="208" class="muted svg-muted-fill" font-size="13">z₃ = √2 x₁x₂</text>
  <line x1="357" y1="234" x2="462" y2="234" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="357" y="260" class="muted svg-muted-fill" font-size="13">不显式存储</text>
  <text x="357" y="284" class="muted svg-muted-fill" font-size="13">只计算 K(x,z)</text>

  <path d="M 505 214 L 553 214" class="arrow svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="563" y="111" width="185" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="586" y="143" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">隐式特征空间</text>
  <line x1="602" y1="244" x2="715" y2="244" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="658" y1="164" x2="658" y2="286" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="584" y1="214" x2="732" y2="214" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="713" y="263" class="muted svg-muted-fill" font-size="12">z₃</text>
  <text x="670" y="209" class="muted svg-muted-fill" font-size="12">0</text>
  <circle cx="620" cy="184" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="696" cy="184" r="8" class="accent svg-special-fill-fill-cc785c"/>
  <circle cx="620" cy="274" r="8" class="dark svg-special-fill-fill-312f2f"/>
  <circle cx="696" cy="274" r="8" class="dark svg-special-fill-fill-312f2f"/>
  <text x="586" y="305" class="muted svg-muted-fill" font-size="12">线性边界：z₃ = 0</text>
</svg>
