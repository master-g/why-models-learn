<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">最小二乘把目标向量投影到列空间</title>
  <desc id="desc">左侧显示目标向量到一条子空间直线的正交投影,右侧显示设计矩阵经过正规方程得到投影与残差</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc785c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #312f2f; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .label { font-size: 20px; font-weight: 700; }
      .title { font-size: 24px; font-weight: 700; }
    </style>
  </defs>
  <rect width="900" height="420" fill="#f6f1ef"/>
  <text x="36" y="40" class="title">最小二乘:把目标投影到可表达的列空间</text>
  <text x="36" y="68" class="small">拟合向量在子空间里,残差与子空间正交</text>

  <rect x="36" y="96" width="405" height="270" rx="14" fill="#fffdfb" stroke="#b8b2a8" stroke-width="2"/>
  <text x="62" y="130" class="label">最近点与正交残差</text>
  <line x1="82" y1="325" x2="406" y2="325" stroke="#b8b2a8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="82" y1="325" x2="82" y2="145" stroke="#b8b2a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="352" class="small">x</text>
  <text x="60" y="151" class="small">y</text>
  <line x1="104" y1="296" x2="376" y2="184" stroke="#cc785c" stroke-width="4"/>
  <circle cx="318" cy="208" r="7" fill="#312f2f"/>
  <circle cx="318" cy="208" r="5" fill="#cc785c"/>
  <line x1="318" y1="208" x2="286" y2="221" stroke="#312f2f" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="286" cy="221" r="7" fill="#312f2f"/>
  <text x="326" y="199" class="small">b</text>
  <text x="269" y="245" class="small">p=Pᵥb</text>
  <text x="326" y="224" class="small">r</text>
  <text x="337" y="300" class="small">V=col(A)</text>

  <line x1="441" y1="226" x2="486" y2="226" stroke="#cc785c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="500" y="104" width="160" height="102" rx="14" fill="#fffdfb" stroke="#b8b2a8" stroke-width="2"/>
  <text x="529" y="138" class="label">列空间</text>
  <text x="532" y="171" class="body">V=col(A)</text>
  <text x="520" y="193" class="small">全部 Ax</text>

  <line x1="660" y1="155" x2="698" y2="155" stroke="#cc785c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="710" y="104" width="160" height="102" rx="14" fill="#fffdfb" stroke="#cc785c" stroke-width="2"/>
  <text x="738" y="138" class="label">正规方程</text>
  <text x="718" y="172" class="body">Aᵀr=0</text>
  <text x="728" y="193" class="small">残差正交</text>

  <line x1="790" y1="206" x2="790" y2="248" stroke="#cc785c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="650" y="260" width="220" height="78" rx="14" fill="#fffdfb" stroke="#b8b2a8" stroke-width="2"/>
  <text x="680" y="292" class="label">拟合与误差</text>
  <text x="675" y="320" class="body">p=A x̂, r=b−p</text>
</svg>
