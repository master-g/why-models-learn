<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
  .svg-special-graphic-stroke-9a958c { stroke: #959088; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-graphic-stroke-fdfcfa { stroke: #91908f; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
    .svg-special-graphic-stroke-9a958c { stroke: #959088; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-graphic-stroke-fdfcfa { stroke: #91908f; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">主成分分析：从中心化点云到一维主成分</title>
  <desc id="desc">左侧是沿对角线分布的中心化点云，中间标出最大方差方向和正交的次要方向，右侧展示投影到一维轴后的主成分分数。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 7 7; }
    .line { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .secondary { fill: none;  stroke-width: 2.5; stroke-linecap: round; }
    .point {stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">主成分分析：沿最大方差方向压缩坐标</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">先中心化，再选择正交方向；特征值记录每条轴上的变化量</text>

  <rect x="52" y="111" width="220" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="74" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">中心化点云</text>
  <line x1="83" y1="274" x2="244" y2="274" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="83" y1="274" x2="83" y2="151" class="axis svg-special-graphic-stroke-8f8a81"/>
  <text x="232" y="295" class="muted svg-muted-fill" font-size="12">x₁</text>
  <text x="66" y="158" class="muted svg-muted-fill" font-size="12">x₂</text>
  <path d="M 101 258 L 230 158" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="116" cy="250" r="8" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="145" cy="226" r="8" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="188" cy="192" r="8" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="217" cy="168" r="8" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <text x="74" y="306" class="muted svg-muted-fill" font-size="12">均值已移到原点</text>

  <path d="M 289 214 L 329 214" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="340" y="111" width="190" height="205" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="363" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">主方向</text>
  <line x1="373" y1="276" x2="497" y2="151" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <line x1="373" y1="151" x2="497" y2="276" class="secondary svg-special-graphic-stroke-9a958c"/>
  <circle cx="435" cy="214" r="5"  class="svg-special-fill-fill-312f2f"/>
  <text x="363" y="303" class="ink svg-special-text-fill-312f2f" font-size="14">u₁：λ₁ 最大</text>
  <text x="363" y="323" class="muted svg-muted-fill" font-size="12">u₂ 与 u₁ 正交</text>

  <path d="M 547 214 L 587 214" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="598" y="111" width="150" height="205" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <text x="620" y="142" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">一维得分</text>
  <line x1="620" y1="218" x2="728" y2="218" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="674" y1="181" x2="674" y2="254" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <circle cx="632" cy="218" r="7" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="653" cy="218" r="7" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="695" cy="218" r="7" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <circle cx="716" cy="218" r="7" class="point svg-special-fill-fill-cc785c svg-special-graphic-stroke-fdfcfa"/>
  <text x="620" y="172" class="muted svg-muted-fill" font-size="13">tᵢ = u₁ᵀxᵢ</text>
  <text x="620" y="278" class="muted svg-muted-fill" font-size="13">保留大方差</text>
  <text x="620" y="299" class="muted svg-muted-fill" font-size="13">舍弃小方向</text>
</svg>
