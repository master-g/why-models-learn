<svg data-svg-theme="paper-ink-v1" xmlns="http://www.w3.org/2000/svg" width="800" height="373" viewBox="0 0 800 373" role="img" aria-labelledby="title desc">
<style>
  .svg-axis-stroke { stroke: #b8b2a8; }
  .svg-coral-stroke-stroke { stroke: #cc785c; }
  .svg-muted-fill { fill: #6c6a64; }
  .svg-special-fill-fill-312f2f { fill: #312f2f; }
  .svg-special-fill-fill-cc785c { fill: #cc785c; }
  .svg-special-fill-fill-f4efee { fill: #939090; }
  .svg-special-fill-fill-fdfcfa { fill: #91908f; }
  .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
  .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
  .svg-special-text-fill-312f2f { fill: #312f2f; }

  .svg-special-background-fill-f4efee { fill: #f4efee; }
  .svg-special-background-fill-fdfcfa { fill: #fdfcfa; }


@media (prefers-color-scheme: dark) {
    .svg-axis-stroke { stroke: #8b8a83; }
    .svg-coral-stroke-stroke { stroke: #e28466; }
    .svg-muted-fill { fill: #aaa9a1; }
    .svg-special-fill-fill-312f2f { fill: #636262; }
    .svg-special-fill-fill-cc785c { fill: #cc785c; }
    .svg-special-fill-fill-f4efee { fill: #939090; }
    .svg-special-fill-fill-fdfcfa { fill: #91908f; }
    .svg-special-graphic-stroke-8f8a81 { stroke: #8f8a81; }
    .svg-special-graphic-stroke-c9c4bb { stroke: #94908a; }
    .svg-special-text-fill-312f2f { fill: #a5a4a4; }
    .svg-special-background-fill-f4efee { fill: #343433; }
    .svg-special-background-fill-fdfcfa { fill: #353535; }



  }
</style>
  <title id="title">经典感知机：错误驱动地移动线性边界</title>
  <desc id="desc">二维输入空间中的两类点、线性分界和一次错误更新的方向示意。</desc>
  <style>
    .ink {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .muted {font-family: "Noto Sans CJK SC", "PingFang SC", "Sarasa Gothic SC", system-ui, sans-serif; }
    .box {stroke-width: 2; }
    .accent-box {stroke-width: 2.5; }
    .line { fill: none;  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .axis { fill: none;  stroke-width: 2; stroke-linecap: round; }
    .guide { fill: none;  stroke-width: 2; stroke-dasharray: 7 7; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"  class="svg-special-fill-fill-cc785c"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="752" height="325" rx="18"  class="svg-special-fill-fill-f4efee svg-special-background-fill-f4efee"/>
  <text x="52" y="61" class="ink svg-special-text-fill-312f2f" font-size="22" font-weight="700">经典感知机：错误驱动地移动边界</text>
  <text x="52" y="87" class="muted svg-muted-fill" font-size="14">分数 sign 决定硬标签；错误样本沿 yx 的方向更新参数</text>

  <rect x="52" y="112" width="358" height="203" rx="14" class="box svg-special-fill-fill-fdfcfa svg-axis-stroke svg-special-background-fill-fdfcfa"/>
  <line x1="98" y1="274" x2="369" y2="274" class="axis svg-special-graphic-stroke-8f8a81"/>
  <line x1="98" y1="274" x2="98" y2="134" class="axis svg-special-graphic-stroke-8f8a81"/>
  <path d="M 102 148 L 350 267" class="line svg-coral-stroke-stroke"/>
  <path d="M 127 172 L 101 159" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="116" y="135" class="ink svg-special-text-fill-312f2f" font-size="16" font-weight="700">y = +1</text>
  <text x="304" y="302" class="muted svg-muted-fill" font-size="12">x₁</text>
  <text x="82" y="143" class="muted svg-muted-fill" font-size="12">x₂</text>
  <text x="286" y="172" class="muted svg-muted-fill" font-size="13">s = 0</text>

  <circle cx="178" cy="177" r="7"  class="svg-special-fill-fill-cc785c"/>
  <circle cx="235" cy="211" r="7"  class="svg-special-fill-fill-cc785c"/>
  <circle cx="291" cy="237" r="7"  class="svg-special-fill-fill-cc785c"/>
  <text x="164" y="169" class="ink svg-special-text-fill-312f2f" font-size="13">A</text>
  <text x="221" y="203" class="ink svg-special-text-fill-312f2f" font-size="13">C</text>
  <text x="278" y="229" class="ink svg-special-text-fill-312f2f" font-size="13">?</text>

  <circle cx="174" cy="250" r="7"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="232" cy="226" r="7"  class="svg-special-fill-fill-312f2f"/>
  <circle cx="289" cy="197" r="7"  class="svg-special-fill-fill-312f2f"/>
  <text x="160" y="267" class="ink svg-special-text-fill-312f2f" font-size="13">B</text>
  <text x="218" y="243" class="ink svg-special-text-fill-312f2f" font-size="13">D</text>
  <text x="276" y="190" class="ink svg-special-text-fill-312f2f" font-size="13">E</text>
  <path d="M 291 237 L 338 214" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>
  <text x="300" y="256" class="muted svg-muted-fill" font-size="12">错误点推动边界</text>

  <path d="M 437 214 L 484 214" class="line svg-coral-stroke-stroke" marker-end="url(#arrow)"/>

  <rect x="502" y="112" width="246" height="203" rx="14" class="accent-box svg-special-fill-fill-fdfcfa svg-coral-stroke-stroke svg-special-background-fill-fdfcfa"/>
  <text x="526" y="145" class="ink svg-special-text-fill-312f2f" font-size="18" font-weight="700">更新规则</text>
  <text x="526" y="181" class="ink svg-special-text-fill-312f2f" font-size="19">θ ← θ + η y x̃</text>
  <text x="526" y="214" class="ink svg-special-text-fill-312f2f" font-size="16">margin = y θᵀx̃ ≤ 0</text>
  <line x1="526" y1="237" x2="724" y2="237" class="guide svg-special-graphic-stroke-c9c4bb"/>
  <text x="526" y="263" class="muted svg-muted-fill" font-size="14">可分：错误有限</text>
  <text x="526" y="287" class="muted svg-muted-fill" font-size="14">不可分：可能循环</text>
</svg>
