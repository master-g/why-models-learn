      组装完整 Transformer;编码器/解码器/编码器-解码器三种架构与各自的训练目标;MoE 与 ViT。

  # ===== Part 5 现代 LLM =====
  - dir: pretraining
    part: modern-llm
    name_en: "Pretraining"
    name_zh: 预训练
    order: 18
    entries:
      - pretraining
      - next-token-as-mle
      - training-data
      - scaling-laws
      - compute-optimal
      - lr-schedules-at-scale
      - distributed-training
      - training-stability
      - evaluation-perplexity
      - emergent-abilities
    description_zh: |
      下一词预测=MLE、数据配比、缩放定律与计算最优、分布式训练概念、训练稳定性与涌现。

  - dir: inference
    part: modern-llm
    name_en: "Inference & Decoding"
    name_zh: 推理与解码
    order: 19
    entries:
