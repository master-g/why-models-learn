# 空词条即 TODO:写过的词条从 known_absent 移除。
# 结构:parts(部分)> sections(章)> entries(词条)。词条顺序 = 数学依赖顺序。
parts:
  - id: math-foundations
    name_zh: 数学地基
    name_en: "Math Foundations"
    order: 0
    description_zh: |
      一切的地基:线性代数、微积分、概率论、信息论与优化理论。每个概念从零推起,后续章节直接引用,不重复讲。
  - id: ml-foundations
    name_zh: 机器学习基础
    name_en: "ML Foundations"
    order: 1
    description_zh: |
      学习问题的形式化:经验风险、泛化、偏差-方差,以及为理解神经网络所必需的经典线性模型。
  - id: neural-networks
    name_zh: 神经网络
    name_en: "Neural Networks"
    order: 2
    description_zh: |
      从神经元到完整训练流程:激活、反向传播、损失、优化与初始化,以 MNIST 实战收尾。
  - id: classic-architectures
    name_zh: 经典架构
    name_en: "Classic Architectures"
    order: 3
    description_zh: |
      CNN 与 RNN/LSTM 支线:概念与数学推导为主,终点是「为什么需要注意力」。
  - id: transformer
    name_zh: Transformer
    name_en: "Transformer"
    order: 4
    description_zh: |
      从分词到完整 Transformer:表示、注意力、组件与架构变体。
  - id: modern-llm
    name_zh: GPT 与现代 LLM
    name_en: "GPT and Modern LLMs"
    order: 5
    description_zh: |
      Decoder-only、预训练、推理、微调与对齐,以复现 LLaMA2 压轴。
  - id: advanced-theory
    name_zh: 进阶理论(参考轨)
    name_en: "Advanced Theory"
    order: 6
    description_zh: |
      逼近论、训练理论、泛化理论与生成模型。数学最硬的一部分,长期 TODO 合法,按兴趣回填。

